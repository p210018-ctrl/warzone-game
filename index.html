<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0e">
  <meta name="description" content="CODWZM 戰術行動 — Three.js 瀏覽器 FPS 示範。">
  <title>CODWZM 戰區手遊 - 戰術行動</title>
  <style>
    :root{color-scheme:dark;--gold:#d4af37;--panel:rgba(12,15,19,.82);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0b0e;color:#eee}body{touch-action:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:none}
    #game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;visibility:hidden;opacity:0;transition:opacity .25s}body[data-state=combat] #game-canvas{visibility:visible;opacity:1}
    #lobby-screen,#hud-screen{position:fixed;inset:0}#lobby-screen{z-index:3;display:flex;flex-direction:column;padding:calc(20px + var(--safe-t)) clamp(18px,5vw,56px) calc(20px + var(--safe-b));background:linear-gradient(115deg,rgba(8,10,13,.98),rgba(8,10,13,.72) 58%,rgba(8,10,13,.35))}body[data-state=combat] #lobby-screen{display:none}.lobby-header{display:flex;justify-content:space-between;align-items:center;gap:12px}.profile{display:flex;gap:12px;align-items:center}.avatar{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;font-weight:900;color:var(--gold)}.muted{color:#9ba0a7;font-size:.82rem}.currency{color:var(--gold);font:700 .9rem monospace}.lobby-main{display:flex;align-items:center;justify-content:space-between;gap:24px;flex:1;padding:2vw 4vw}.title{font-size:clamp(3rem,10vw,7.5rem);font-weight:950;letter-spacing:.1em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.35);line-height:.95}.tagline{margin-top:16px;color:var(--gold);letter-spacing:.16em}.menu{display:grid;gap:12px;width:min(340px,42vw)}.menu button{padding:16px 20px;text-align:left;border:1px solid #596069;background:rgba(255,255,255,.07);font-weight:750}.menu button:hover,.menu button:focus-visible{border-color:var(--gold);outline:2px solid var(--gold)}.menu .deploy{border:2px solid var(--gold);color:var(--gold);font-size:1.15rem;background:rgba(212,175,55,.14)}
    #hud-screen{z-index:2;display:none;pointer-events:none}body[data-state=combat] #hud-screen{display:block}.hud-top{position:absolute;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:center;padding:8px 22px;background:var(--panel);border-top:2px solid var(--gold);font:800 1.15rem monospace;white-space:nowrap}.blue{color:#55aaff}.red{color:#ff6158}.crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}.crosshair:before{width:2px;height:20px;left:12px;top:3px}.crosshair:after{height:2px;width:20px;top:12px;left:3px}.bottom-left,.bottom-right{position:absolute;bottom:calc(20px + var(--safe-b));background:var(--panel);padding:10px 14px;min-width:170px}.bottom-left{left:18px}.bottom-right{right:18px;text-align:right}.bar{height:12px;margin-top:5px;background:#28302d;width:180px}.bar>i{display:block;height:100%;background:#32c979;width:100%;transition:width .15s}.ammo{font:900 2.5rem monospace}.controls{position:absolute;right:18px;bottom:calc(125px + var(--safe-b));display:grid;grid-template-columns:repeat(2,62px);gap:10px;pointer-events:auto}.ctrl{width:62px;height:62px;border:1px solid #ffffff80;border-radius:50%;background:#20252bbd;font-size:.72rem;font-weight:800}.ctrl.fire{grid-column:span 2;justify-self:center;width:76px;height:76px;border-color:#e74c3c;background:#7c2d2dbd}.joystick{position:absolute;left:24px;bottom:calc(26px + var(--safe-b));width:124px;height:124px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:37px;top:37px;border:1px solid #fff9;border-radius:50%;background:#ffffff55}.status{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(90vw,540px);padding:16px 20px;background:#16191fee;border:1px solid var(--gold);text-align:center;display:none;white-space:pre-wrap}.status.show{display:block}
    @media(max-width:700px){.lobby-main{flex-direction:column;align-items:flex-start;justify-content:center;padding:8vh 2vw}.menu{width:min(100%,360px)}.title{font-size:clamp(3rem,17vw,6rem)}.bottom-left{left:12px;min-width:130px}.bottom-right{right:12px;min-width:100px}.controls{right:12px;bottom:calc(132px + var(--safe-b));grid-template-columns:repeat(2,54px)}.ctrl{width:54px;height:54px}.ctrl.fire{width:68px;height:68px}.joystick{width:112px;height:112px;left:18px}.knob{left:31px;top:31px}}
  </style>
</head>
<body data-state="lobby">
  <canvas id="game-canvas" aria-label="3D 戰鬥遊戲畫面"></canvas>
  <main id="lobby-screen" aria-label="遊戲大廳">
    <header class="lobby-header"><div class="profile"><div class="avatar" aria-hidden="true">G</div><div><strong>GHOST_Operator</strong><div class="muted">LVL. 55 · 上尉</div></div></div><div class="currency">◈ 12,450　◆ 850</div></header>
    <section class="lobby-main"><div><div class="title">GHOST</div><div class="tagline">// SIMON “GHOST” RILEY</div></div><nav class="menu" aria-label="主選單"><button class="deploy" id="btn-deploy">進入戰區 / DEPLOY</button><button id="btn-loadout">武器配置 / LOADOUT</button><button id="btn-settings">系統設置 / SETTINGS</button></nav></section>
  </main>
  <section id="hud-screen" aria-label="戰鬥資訊"><div class="hud-top"><span class="blue" id="score-blue">0</span><span id="match-time">10:00</span><span class="red" id="score-red">0</span></div><div class="crosshair"></div><div class="bottom-left"><span>ARMOR <b id="armor-value">150</b>　HP <b id="health-value">150</b></span><div class="bar"><i id="health-fill"></i></div></div><div class="bottom-right"><div>M4A1</div><div class="ammo"><span id="ammo-mag">30</span><small> / <span id="ammo-reserve">120</span></small></div></div><div class="joystick" id="joystick-area"><div class="knob" id="joystick-knob"></div></div><div class="controls"><button class="ctrl" id="btn-jump">JUMP</button><button class="ctrl" id="btn-crouch">CROUCH</button><button class="ctrl" id="btn-reload">RELOAD</button><button class="ctrl fire" id="btn-fire">FIRE</button></div></section>
  <div class="status" id="status" role="alert" aria-live="assertive"></div>
  <script>
  (() => {
    'use strict';
    window.global = window;
    const status = document.getElementById('status');
    const threeUrls = ['https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];
    const modules = ['01_event_bus_state.js','02_renderer_core.js','03_multitouch_controller.js','04_camera_rig_shake.js','05_physics_collision.js','06_player_health_armor.js','07_pbr_texture_factory.js','08_lighting_atmosphere.js','09_map_terrain_ground.js','10_map_buildings.js','11_map_props_covers.js','12_decals_bullet_holes.js','13_fp_hands_anatomy.js','14_weapon_m4_urgi.js','15_weapon_smg_mp5.js','16_weapon_sniper_ax50.js','17_weapon_pistol_x16.js','18_weapon_optics_laser.js','19_fp_locomotion_anim.js','20_fp_reload_inspect.js','21_ballistics_recoil.js','22_vfx_particle_engine.js','23_audio_procedural.js','24_audio_foley_env.js','25_player_movement.js','26_enemy_soldier_mesh.js','27_enemy_upper_lower_ik.js','28_enemy_warzone_locomotion.js','29_ragdoll_physics.js','30_enemy_tactical_ai.js','31_ui_lobby_3d.js','32_ui_hud_customizer.js','33_ui_settings_modal.js','34_ui_combat_hud.js','35_ui_killfeed_score.js','36_gamemode_manager.js','37_main_bootstrap.js'];
    function showError(message){status.textContent=message;status.classList.add('show')}
    function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=resolve;s.onerror=()=>reject(new Error('無法載入：'+src));document.head.appendChild(s)})}
    async function loadThree(){if(window.THREE)return;let last='Three.js 載入失敗';for(const url of threeUrls){try{await loadScript(url);if(window.THREE)return}catch(e){last=e.message||last}}throw new Error(last)}
    async function loadModules(){await loadThree();for(const file of modules)await loadScript('./js/'+file)}
    loadModules().catch(error=>{console.error('[WZ] 模組載入失敗',error);showError('遊戲模組載入失敗，請檢查網路連線並重新整理。\n'+error.message)});
  })();
  </script>
</body>
</html>
