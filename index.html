<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#0a0a0c">
    <title>CODWZM 戰區手遊 - 戰術行動</title>

    <!-- 1. 核心 Three.js 載入 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
        }
    </script>

    <!-- 2. 全局防護與預設 Logger -->
    <script>
        window.global = window;
        window.WZ = window.WZ || {};
        window.WZ.Utils = window.WZ.Utils || {
            Logger: {
                system: function() { console.log.apply(console, ["[SYSTEM]"].concat([].slice.call(arguments))); },
                info:   function() { console.log.apply(console, ["[INFO]"].concat([].slice.call(arguments))); },
                warn:   function() { console.warn.apply(console, ["[WARN]"].concat([].slice.call(arguments))); },
                error:  function() { console.error.apply(console, ["[ERROR]"].concat([].slice.call(arguments))); }
            }
        };
    </script>

    <!-- 3. 超暴力 CSS 清場規則 -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; }
        
        /* Canvas 永遠墊在最底層 */
        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; visibility: hidden; }
        
        /* 整個介面框架 */
        #wz-master-ui { position: absolute; inset: 0; z-index: 100; pointer-events: none; }

        /* ==========================================
           大廳介面
           ========================================== */
        #wz-lobby {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            background: linear-gradient(180deg, rgba(10,10,12,0.8) 0%, rgba(10,10,12,0.95) 100%);
            pointer-events: auto;
        }
        .lobby-top { display: flex; justify-content: space-between; padding: 20px 40px; }
        .lobby-center { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 10%; }
        .lobby-menu { display: flex; flex-direction: column; gap: 20px; width: 320px; }
        
        .btn { padding: 15px 20px; font-size: 16px; font-weight: bold; border: none; outline: none; cursor: pointer; transition: 0.2s; text-align: left; }
        .btn-primary { background: rgba(212,175,55,0.2); border: 2px solid #d4af37; color: #d4af37; font-size: 20px; }
        .btn-secondary { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }

        /* ==========================================
           戰鬥 HUD 介面 (預設隱藏)
           ========================================== */
        #wz-hud {
            position: absolute; inset: 0; display: none; pointer-events: none;
        }
        
        /* 準心 */
        .crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%);
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: #fff;
        }
        .crosshair::before { top: 9px; left: 0; width: 100%; height: 2px; }
        .crosshair::after { top: 0; left: 9px; width: 2px; height: 100%; }

        /* 左下角血量 */
        .hud-health { position: absolute; left: 30px; bottom: 30px; width: 200px; }
        .hud-armor { display: flex; gap: 5px; height: 15px; margin-bottom: 5px; }
        .armor-piece { flex: 1; background: rgba(52,152,219,0.8); }
        .health-bar { height: 20px; background: rgba(46,204,113,0.8); }

        /* 右下角彈藥 */
        .hud-ammo { position: absolute; right: 30px; bottom: 30px; color: #fff; font-size: 40px; font-weight: bold; text-shadow: 0 0 5px #000; }

        /* 射擊按鈕 */
        .btn-fire {
            position: absolute; right: 40px; bottom: 100px; width: 80px; height: 80px;
            border-radius: 50%; background: rgba(255,50,50,0.4); border: 2px solid rgba(255,50,50,0.8);
            color: #fff; font-size: 14px; font-weight: bold; pointer-events: auto;
        }
    </style>
</head>
<body class="state-lobby">

    <!-- 唯一的 Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- 由 index.html 建立並掌控的最高層 UI -->
    <div id="wz-master-ui">
        <!-- 大廳 -->
        <div id="wz-lobby">
            <div class="lobby-top">
                <div style="color:#fff; font-size:20px; font-weight:bold;">GHOST_Operator</div>
                <div style="color:#d4af37;">Lv.55 | 12,450 💰</div>
            </div>
            <div class="lobby-center">
                <div style="font-size:80px; font-weight:900; color:transparent; -webkit-text-stroke:2px rgba(255,255,255,0.2);">GHOST</div>
                <div class="lobby-menu">
                    <button class="btn btn-primary" id="btn-deploy">進入戰區 / DEPLOY</button>
                    <button class="btn btn-secondary" id="btn-loadout">武器配置 / LOADOUT</button>
                    <button class="btn btn-secondary" id="btn-settings">系統設置 / SETTINGS</button>
                </div>
            </div>
        </div>

        <!-- 戰鬥 HUD -->
        <div id="wz-hud">
            <div class="crosshair"></div>
            <div class="hud-health">
                <div class="hud-armor"><div class="armor-piece"></div><div class="armor-piece"></div><div class="armor-piece"></div></div>
                <div class="health-bar"></div>
            </div>
            <div class="hud-ammo">30 / 120</div>
            <button class="btn-fire" id="btn-fire">FIRE</button>
        </div>
    </div>

    <!-- 終極啟動腳本 -->
    <script>
        (function() {
            'use strict';
            
            // 1. 載入 37 個模組
            const files = [
                '01_event_bus_state.js', '02_renderer_core.js', '03_multitouch_controller.js',
                '04_camera_rig_shake.js', '05_physics_collision.js', '06_player_health_armor.js',
                '07_pbr_texture_factory.js', '08_lighting_atmosphere.js', '09_map_terrain_ground.js',
                '10_map_buildings.js', '11_map_props_covers.js', '12_decals_bullet_holes.js',
                '13_fp_hands_anatomy.js', '14_weapon_m4_urgi.js', '15_weapon_smg_mp5.js',
                '16_weapon_sniper_ax50.js', '17_weapon_pistol_x16.js', '18_weapon_optics_laser.js',
                '19_fp_locomotion_anim.js', '20_fp_reload_inspect.js', '21_ballistics_recoil.js',
                '22_vfx_particle_engine.js', '23_audio_procedural.js', '24_audio_foley_env.js',
                '25_player_movement.js', '26_enemy_soldier_mesh.js', '27_enemy_upper_lower_ik.js',
                '28_enemy_warzone_locomotion.js', '29_ragdoll_physics.js', '30_enemy_tactical_ai.js',
                '31_ui_lobby_3d.js', '32_ui_hud_customizer.js', '33_ui_settings_modal.js',
                '34_ui_combat_hud.js', '35_ui_killfeed_score.js', '36_gamemode_manager.js',
                '37_main_bootstrap.js'
            ];

            let count = 0;
            function load() {
                if (count >= files.length) {
                    // 全部加載完畢
                    cleanUpDOM();
                    return;
                }
                const script = document.createElement('script');
                script.src = `js/${files[count]}`;
                script.onload = () => { count++; load(); };
                script.onerror = () => { count++; load(); };
                document.body.appendChild(script);
            }

            // ==========================================
            // 🔪 超暴力清場：刪除所有不屬於 master-ui 的元素
            // ==========================================
            function cleanUpDOM() {
                console.log('[系統] 開始清理模組亂生成的 UI...');
                
                // 隱藏進度條
                const loader = document.getElementById('loading-layer');
                if (loader) loader.style.display = 'none';

                // 遍歷 body 的子節點，保留 Canvas 和 master-ui，其他的全刪！
                const bodyChildren = Array.from(document.body.children);
                bodyChildren.forEach(child => {
                    if (child.tagName !== 'CANVAS' && 
                        child.id !== 'wz-master-ui' && 
                        child.tagName !== 'SCRIPT' && 
                        child.id !== 'wz-diagnostic-bar' && 
                        child.id !== 'global-error-panel' &&
                        child.id !== 'loading-layer') {
                        // 如果是 WZ 模組生成的按鈕或 UI，直接刪除
                        child.remove();
                    }
                });

                // 處理可能被塞在 body 裡的 HUD 元件（根據 class 或 ID 特徵）
                document.querySelectorAll('.hud-bottom-left, .hud-bottom-right, #stick, #btns, #cross').forEach(el => el.remove());

                // 確保大廳預設顯示
                showLobby();
            }

            function showLobby() {
                document.body.className = 'state-lobby';
                const lobby = document.getElementById('wz-lobby');
                const hud = document.getElementById('wz-hud');
                const canvas = document.getElementById('game-canvas');
                
                if (lobby) lobby.style.display = 'flex';
                if (hud) hud.style.display = 'none';
                if (canvas) canvas.style.visibility = 'hidden';

                // 重設遊戲狀態
                if (window.WZ && window.WZ.State && window.WZ.State.transitionTo) {
                    try { window.WZ.State.transitionTo('LOBBY'); } catch(e){}
                }
            }

            function startGame() {
                console.log('[系統] 強制進入戰區！');
                document.body.className = 'state-playing';
                
                const lobby = document.getElementById('wz-lobby');
                const hud = document.getElementById('wz-hud');
                const canvas = document.getElementById('game-canvas');
                
                if (lobby) lobby.style.display = 'none';
                if (hud) hud.style.display = 'block';
                if (canvas) {
                    canvas.style.visibility = 'visible';
                    canvas.style.opacity = '1';
                }

                // 啟動渲染或兜底
                if (window.WZ && window.WZ.Bootstrap && window.WZ.Bootstrap.startFallbackEngine) {
                    window.WZ.Bootstrap.startFallbackEngine();
                }
                if (window.WZ && window.WZ.Renderer && window.WZ.Renderer.start) {
                    try { window.WZ.Renderer.start(); } catch(ex){}
                }

                // 觸發全局事件
                if (window.WZ && window.WZ.bus) {
                    window.WZ.bus.emit('GAME_START');
                }
                if (window.WZ && window.WZ.State && window.WZ.State.transitionTo) {
                    try { window.WZ.State.transitionTo('PLAYING'); } catch(e){}
                }
            }

            // ==========================================
            // 綁定按鈕 (確保最高優先級)
            // ==========================================
            document.getElementById('btn-deploy').onclick = startGame;

            // 啟動加載
            load();

        })();
    </script>
</body>
</html>
