<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- ============================================================
         基礎 Meta 設定
         ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#0a0a0c">

    <title>CODWZM 戰區手遊 - 戰術行動</title>

    <!-- ============================================================
         🚨 依賴庫載入 (Three.js 多 CDN 備援)
         ============================================================ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');
        }
        if (typeof THREE === 'undefined') {
            document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
        }
    </script>

    <!-- ============================================================
         全局防護與預設 Logger
         ============================================================ -->
    <script>
        window.global = window;
        window.WZ = window.WZ || {};
        window.WZ.Utils = window.WZ.Utils || {
            Logger: {
                system: function() { console.log.apply(console, ["[SYSTEM]"].concat([].slice.call(arguments))); },
                info:   function() { console.log.apply(console, ["[INFO]"].concat([].slice.call(arguments))); },
                warn:   function() { console.warn.apply(console, ["[WARN]"].concat([].slice.call(arguments))); },
                error:  function() { console.error.apply(console, ["[ERROR]"].concat([].slice.call(arguments))); },
                debug:  function() { console.log.apply(console, ["[DEBUG]"].concat([].slice.call(arguments))); }
            }
        };
    </script>

    <!-- ============================================================
         核心樣式：現代戰爭戰術風格 UI + 絕對隔離
         ============================================================ -->
    <style>
        /* ============================================================
           1. CSS 變數與全局重置
           ============================================================ */
        :root {
            --bg-dark: #0a0b0e;
            --bg-panel: rgba(18, 20, 24, 0.85);
            --bg-glass: rgba(35, 38, 45, 0.6);
            --primary-gold: #d4af37;
            --primary-glow: rgba(212, 175, 55, 0.4);
            --text-main: #e0e0e0;
            --text-muted: #8a8d91;
            --danger-red: #e74c3c;
            --success-green: #2ecc71;
            --cyan-blue: #00f3ff;
            --border-glass: 1px solid rgba(255, 255, 255, 0.1);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, monospace;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background: var(--bg-dark);
            color: var(--text-main); font-family: var(--font-main);
            touch-action: none; overscroll-behavior: none;
            position: fixed; top: 0; left: 0;
        }

        /* ============================================================
           2. 3D 畫布
           ============================================================ */
        #game-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; visibility: hidden; opacity: 0;
            transition: opacity 0.5s ease;
            outline: none;
        }

        /* ============================================================
           3. 超暴力 UI 隔離防護罩
           ============================================================ */
        /* 在大廳狀態下，強制隱藏所有可能亂入的戰鬥 UI */
        body[data-state="lobby"] #master-combat-ui,
        body[data-state="lobby"] [class*="hud-"],
        body[data-state="lobby"] [id*="HUD"],
        body[data-state="lobby"] [id^="btn-"]:not(#btn-deploy):not(#btn-loadout):not(#btn-settings):not(#btn-customize-ui) {
            display: none !important;
            pointer-events: none !important;
        }

        /* 在戰鬥狀態下，強制隱藏所有可能亂入的大廳 UI */
        body[data-state="combat"] #master-lobby-ui,
        body[data-state="combat"] .modal-overlay {
            display: none !important;
            pointer-events: none !important;
        }

        /* ============================================================
           4. 大廳畫面 (Lobby Screen)
           ============================================================ */
        #master-lobby-ui {
            position: absolute; inset: 0; z-index: 100;
            background: linear-gradient(135deg, rgba(10, 11, 14, 0.95) 0%, rgba(10, 11, 14, 0.6) 100%);
            display: flex; flex-direction: column;
            padding: calc(20px + var(--safe-top)) 40px calc(20px + var(--safe-bottom)) 40px;
            pointer-events: auto;
        }

        .lobby-header { display: flex; justify-content: space-between; align-items: center; height: 70px; }
        .player-profile { display: flex; align-items: center; gap: 15px; background: var(--bg-glass); border: var(--border-glass); border-radius: 50px; padding: 5px 25px 5px 5px; }
        .player-avatar { width: 56px; height: 56px; border-radius: 50%; background: #222; border: 2px solid var(--primary-gold); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: var(--primary-gold); box-shadow: 0 0 15px var(--primary-glow); }
        .player-info { display: flex; flex-direction: column; }
        .player-name { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 1px; }
        .player-level { font-size: 12px; color: var(--primary-gold); font-family: var(--font-mono); }

        .lobby-content { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; }
        .operator-title { font-size: 90px; font-weight: 900; color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, 0.15); letter-spacing: 15px; }
        .lobby-menu { display: flex; flex-direction: column; gap: 15px; width: 340px; }
        
        .btn-menu { background: var(--bg-glass); border: 1px solid rgba(255, 255, 255, 0.2); color: #ddd; padding: 16px 24px; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer; clip-path: polygon(0 0, 100% 0, 96% 100%, 0% 100%); transition: 0.2s; }
        .btn-menu:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--primary-gold); }
        .btn-deploy-main { background: linear-gradient(90deg, rgba(212, 175, 55, 0.25) 0%, rgba(212, 175, 55, 0.05) 100%); border: 2px solid var(--primary-gold); color: var(--primary-gold); font-size: 22px; font-weight: 900; padding: 20px 30px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%); }

        /* ============================================================
           5. 戰鬥 HUD 畫面 (絕對由這裡控制)
           ============================================================ */
        #master-combat-ui {
            position: absolute; inset: 0; z-index: 100;
            pointer-events: none; display: none;
        }
        body[data-state="combat"] #master-combat-ui { display: block; }

        .hud-top { display: flex; justify-content: center; padding: calc(20px + var(--safe-top)) 30px 0 30px; }
        .hud-score { display: flex; gap: 20px; align-items: center; background: var(--bg-panel); border-top: 2px solid var(--primary-gold); padding: 10px 30px; border-radius: 4px; }

        .hud-crosshair { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; transform: translate(-50%, -50%); }
        .hud-crosshair .line { position: absolute; background: #eee; box-shadow: 0 0 3px #000; }
        .hud-crosshair .l-top { width: 2px; height: 8px; left: 14px; top: 0; }
        .hud-crosshair .l-bottom { width: 2px; height: 8px; left: 14px; bottom: 0; }
        .hud-crosshair .l-left { width: 8px; height: 2px; top: 14px; left: 0; }
        .hud-crosshair .l-right { width: 8px; height: 2px; top: 14px; right: 0; }
        .hud-crosshair .dot { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--primary-gold); left: 13px; top: 13px; }

        .hud-bottom-left { position: absolute; left: 30px; bottom: calc(30px + var(--safe-bottom)); display: flex; flex-direction: column; gap: 8px; width: 280px; }
        .armor-bar { display: flex; gap: 4px; height: 24px; }
        .armor-plate { flex: 1; border: 1px solid rgba(52, 152, 219, 0.6); background: rgba(52, 152, 219, 0.4); }
        .health-bar { height: 18px; background: rgba(46, 204, 113, 0.8); border: 1px solid #2ecc71; display: flex; justify-content: flex-end; align-items: center; padding-right: 8px; }
        .health-text { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: #fff; }

        .hud-bottom-right { position: absolute; right: 30px; bottom: calc(30px + var(--safe-bottom)); display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
        .weapon-info { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.6); padding: 8px 20px; border: 1px solid var(--primary-gold); border-radius: 4px; }
        .weapon-name { font-size: 18px; font-weight: 800; color: #fff; }
        .ammo-counter { display: flex; align-items: baseline; gap: 5px; font-family: var(--font-mono); }
        .ammo-mag { font-size: 48px; font-weight: 900; color: #fff; line-height: 1; }
        .ammo-reserve { font-size: 20px; font-weight: 700; color: #888; }

        .hud-controls { position: absolute; right: 30px; bottom: calc(150px + var(--safe-bottom)); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; pointer-events: auto; }
        .ctrl-btn { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: 0.1s; pointer-events: auto; }
        .ctrl-btn:active { background: rgba(255,255,255,0.3); transform: scale(0.95); }
        .ctrl-btn.fire { width: 90px; height: 90px; font-size: 16px; background: rgba(231, 76, 60, 0.3); border-color: rgba(231, 76, 60, 0.8); grid-column: span 2; justify-self: center; margin-top: 10px; pointer-events: auto; }
        .ctrl-btn.fire:active { background: rgba(231, 76, 60, 0.6); }

        .hud-joystick { position: absolute; left: 50px; bottom: calc(50px + var(--safe-bottom)); width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); pointer-events: auto; display: flex; align-items: center; justify-content: center; }
        .joystick-knob { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.6); }

        /* ============================================================
           6. 彈出式選單 (Modals)
           ============================================================ */
        .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 500; display: none; justify-content: center; align-items: center; pointer-events: auto; }
        .modal-overlay.active { display: flex; }
        .modal-panel { width: 600px; background: var(--bg-panel); border: 1px solid var(--primary-gold); border-radius: 8px; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal-title { font-size: 20px; font-weight: 800; color: var(--primary-gold); }
        .modal-close { background: transparent; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .modal-body { padding: 30px; display: flex; flex-direction: column; gap: 20px; }
    </style>
</head>
<body data-state="lobby">

    <!-- ============================================================
         3D 畫布
         ============================================================ -->
    <canvas id="game-canvas"></canvas>

    <!-- ============================================================
         大廳畫面 (由 index.html 完全掌控)
         ============================================================ -->
    <div id="master-lobby-ui">
        <div class="lobby-header">
            <div class="player-profile">
                <div class="player-avatar">G</div>
                <div class="player-info">
                    <div class="player-name">GHOST_Operator</div>
                    <div class="player-level">LVL. 55 • 上尉</div>
                </div>
            </div>
            <div style="color:var(--primary-gold); font-weight:bold;">💰 12,450 | 💎 850</div>
        </div>

        <div class="lobby-content">
            <div>
                <div class="operator-title">GHOST</div>
                <div style="font-size:14px; color:var(--primary-gold); margin-top:20px;">// SIMON "GHOST" RILEY</div>
            </div>
            <div class="lobby-menu">
                <button class="btn-menu btn-deploy-main" id="btn-deploy">進入戰區 / DEPLOY</button>

    <!-- ============================================================
         戰鬥 HUD (由 index.html 完全掌控)

    <div id="master-combat-ui">
        <div class="hud-top">
            <div class="hud-score">
                <div style="color:#3498db; font-size:28px; font-weight:900; font-family:monospace;">75</div>
                <div style="color:#fff; font-size:20px; font-family:monospace;">10:00</div>
                <div style="color:#e74c3c; font-size:28px; font-weight:900; font-family:monospace;">68</div>
            </div>
        </div>

        <div class="hud-crosshair">
            <div class="line l-top"></div>

                <div class="armor-plate"></div><div class="armor-plate"></div><div class="armor-plate"></div>

        </div>

        <div class="hud-bottom-right">
            <div class="weapon-info"><div class="weapon-name">M4A1</div></div>
            <div class="ammo-counter">
                <div class="ammo-mag" id="hud-ammo-mag">30</div>
                <div class="ammo-reserve">/ <span id="hud-ammo-reserve">120</span></div>
            </div>
        </div>

        <div class="hud-joystick" id="joystick-area">
            <div class="joystick-knob" id="joystick-knob"></div>
        </div>

        <div class="hud-controls">
            <button class="ctrl-btn" id="btn-jump">JUMP</button>
            <button class="ctrl-btn" id="btn-crouch">SLIDE</button>

            <button class="ctrl-btn fire" id="btn-fire">FIRE</button>
        </div>
    </div>

    <!-- ============================================================
         彈出視窗
         ============================================================ -->
    <div id="modal-loadout" class="modal-overlay">
        <div class="modal-panel">
            <div class="modal-header"><div class="modal-title">武器配置</div><button class="modal-close" data-close="modal-loadout">✕</button></div>
            <div class="modal-body"><p>武器配置選單建設中...</p></div>
        </div>
    </div>
    <div id="modal-settings" class="modal-overlay">
        <div class="modal-panel">
            <div class="modal-header"><div class="modal-title">系統設置</div><button class="modal-close" data-close="modal-settings">✕</button></div>
            <div class="modal-body"><p>系統設置選單建設中...</p></div>
        </div>
    </div>
    <div id="modal-customizer" class="modal-overlay">
        <div class="modal-panel">
            <div class="modal-header"><div class="modal-title">按鍵自定義</div><button class="modal-close" data-close="modal-customizer">✕</button></div>
            <div class="modal-body"><p>按鍵自定義選單建設中...</p></div>
        </div>
    </div>

    <!-- ============================================================
         終極啟動與核心控制邏輯
         ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 狀態切換與暴力清場
            // ============================================================
            function switchToCombat() {
                console.log('[系統] 切換至戰鬥狀態，執行暴力清場...');
                
                // 切換 body 狀態，觸發 CSS 隔離
                document.body.setAttribute('data-state', 'combat');
                
                // 顯示畫布
                const canvas = document.getElementById('game-canvas');
                if (canvas) {
                    canvas.style.visibility = 'visible';
                    canvas.style.opacity = '1';
                }

                // 🚨 暴力清場：把除了畫布和我們的主 UI 以外的所有 DOM 元素全部幹掉
                const bodyChildren = Array.from(document.body.children);
                bodyChildren.forEach(child => {
                    if (child.tagName === 'CANVAS' || 
                        child.id === 'master-lobby-ui' || 
                        child.id === 'master-combat-ui' || 
                        child.classList.contains('modal-overlay') ||
                        child.tagName === 'SCRIPT') {
                        return; // 保留這些元素
                    }
                    // 其他所有由未知模組生成的 UI，直接移除
                    console.warn(`[暴力清場] 移除殘留元素: <${child.tagName} id="${child.id}">`);
                    child.remove();
                });

                // 啟動渲染器或兜底引擎
                if (window.WZ && window.WZ.Bootstrap && window.WZ.Bootstrap.startFallbackEngine) {
                    window.WZ.Bootstrap.startFallbackEngine();
                }
                if (window.WZ && window.WZ.Renderer && window.WZ.Renderer.start) {
                    try { window.WZ.Renderer.start(); } catch(e){}
                }

                // 觸發全局事件
                if (window.WZ && window.WZ.bus) {
                    window.WZ.bus.emit('GAME_START');
                }
            }

            function switchToLobby() {
                console.log('[系統] 切換至大廳狀態');
                document.body.setAttribute('data-state', 'lobby');
                
                const canvas = document.getElementById('game-canvas');
                if (canvas) {
                    canvas.style.visibility = 'hidden';
                    canvas.style.opacity = '0';
                }
            }

            // ============================================================
            // 2. UI 按鈕綁定
            // ============================================================
            function bindEvents() {
                // 進入戰區
                document.getElementById('btn-deploy').addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    switchToCombat();
                });

                // 打開彈窗
                document.getElementById('btn-loadout').addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    document.getElementById('modal-loadout').classList.add('active');
                });
                document.getElementById('btn-settings').addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    document.getElementById('modal-settings').classList.add('active');
                });
                document.getElementById('btn-customize-ui').addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    document.getElementById('modal-customizer').classList.add('active');
                });

                // 關閉彈窗
                document.querySelectorAll('.modal-close').forEach(btn => {
                    btn.addEventListener('pointerdown', (e) => {
                        const targetId = btn.getAttribute('data-close');
                        if (targetId) {
                            document.getElementById(targetId).classList.remove('active');
                        }
                    });
                });

                // 模擬開火
                document.getElementById('btn-fire').addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    const magEl = document.getElementById('hud-ammo-mag');
                    if (magEl) {
                        let mag = parseInt(magEl.innerText);
                        if (mag > 0) {
                            mag--;
                            magEl.innerText = mag;
                            if (window.WZ && window.WZ.bus) {
                                window.WZ.bus.emit('WEAPON_FIRED', {});
                            }
                        }
                    }
                });
            }

            // ============================================================
            // 3. 模擬虛擬搖桿拖拽
            // ============================================================
            function initJoystick() {
                const area = document.getElementById('joystick-area');
                const knob = document.getElementById('joystick-knob');
                let isDragging = false;
                let startX, startY;

                area.addEventListener('pointerdown', (e) => {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    knob.style.transition = 'none';
                    e.preventDefault();
                });

                window.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    let dx = e.clientX - startX;
                    let dy = e.clientY - startY;
                    const maxDist = 40;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    knob.style.transform = `translate(${dx}px, ${dy}px)`;
                });

                window.addEventListener('pointerup', () => {
                    isDragging = false;
                    knob.style.transition = 'transform 0.2s ease-out';
                    knob.style.transform = 'translate(0px, 0px)';
                });
            }

            // ============================================================
            // 4. 加載 37 個底層模組
            // ============================================================
            const scriptFiles = [
                '01_event_bus_state.js', '02_renderer_core.js', '03_multitouch_controller.js',
                '04_camera_rig_shake.js', '05_physics_collision.js', '06_player_health_armor.js',
                '07_pbr_texture_factory.js', '08_lighting_atmosphere.js', '09_map_terrain_ground.js',
                '10_map_buildings.js', '11_map_props_covers.js', '12_decals_bullet_holes.js',
                '13_fp_hands_anatomy.js', '14_weapon_m4_urgi.js', '15_weapon_smg_mp5.js',
                '16_weapon_sniper_ax50.js', '17_weapon_pistol_x16.js', '18_weapon_optics_laser.js',
                '19_fp_locomotion_anim.js', '20_fp_reload_inspect.js', '21_ballistics_recoil.js',
                '22_vfx_particle_engine.js', '23_audio_procedural.js', '24_audio_foley_env.js',
                '25_player_movement.js', '26_enemy_soldier_mesh.js', '27_enemy_upper_lower_ik.js',
                '28_enemy_warzone_locomotion.js', '29_ragdoll_physics.js', '30_enemy_tactical_ai.js',
                '31_ui_lobby_3d.js', '32_ui_hud_customizer.js', '33_ui_settings_modal.js',
                '34_ui_combat_hud.js', '35_ui_killfeed_score.js', '36_gamemode_manager.js',
                '37_main_bootstrap.js'
            ];

            let loadedCount = 0;
            const total = scriptFiles.length;

            function loadNext(index) {
                if (index >= total) {
                    onAllLoaded();
                    return;
                }
                const script = document.createElement('script');
                script.src = `js/${scriptFiles[index]}`;
                script.async = false;
                script.onload = () => {
                    loadedCount++;
                    loadNext(index + 1);
                };
                script.onerror = () => {
                    console.error(`[加載失敗] ${scriptFiles[index]}`);
                    loadedCount++;
                    loadNext(index + 1);
                };
                document.body.appendChild(script);
            }

            function onAllLoaded() {
                console.log('[系統] 所有模組加載完畢，準備清理殘留 UI...');
                
                // 確保大廳狀態
                switchToLobby();

                // 再次清理可能在大廳狀態下亂跑的 UI
                const bodyChildren = Array.from(document.body.children);
                bodyChildren.forEach(child => {
                    if (child.tagName === 'CANVAS' || 
                        child.id === 'master-lobby-ui' || 
                        child.id === 'master-combat-ui' || 
                        child.classList.contains('modal-overlay') || 
                        child.tagName === 'SCRIPT') {
                        return;
                    }
                    child.remove();
                });

                // 啟動 Bootstrap (如果有)
                if (window.WZ && window.WZ.Bootstrap && window.WZ.Bootstrap.boot) {
                    try { window.WZ.Bootstrap.boot(); } catch(e){}
                }
            }

            // ============================================================
            // 5. 初始化
            // ============================================================
            function init() {
                console.log('[系統] 初始化大廳與 HUD...');
                bindEvents();
                initJoystick();
                loadNext(0);
            }

            // 頁面加載完成後執行
            if (document.readyState === 'complete' || document.readyState === 'interactive') {
                setTimeout(init, 50);
            } else {
                document.addEventListener('DOMContentLoaded', () => setTimeout(init, 50));
            }

        })();
    </script>
</body>
</html>
