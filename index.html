<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>網頁遊戲</title>

  <!-- 1. 引入 Tailwind CSS（多數 React 遊戲的版面樣式都會用到） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. 設定套件對應表（讓瀏覽器看懂 import 'react' 與 'lucide-react'） -->
  <!-- 注意：這段 importmap 必須放在所有 module 腳本之前 -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "lucide-react": "https://esm.sh/lucide-react?deps=react@18"
    }
  }
  </script>

  <!-- 3. 引入 Babel（在瀏覽器中即時編譯 React 的 JSX 語法） -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 4. 基本全螢幕與黑底樣式 -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #root {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <!-- 5. 遊戲畫面的掛載點（編譯完成前會先顯示載入提示） -->
  <div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;">
    遊戲編譯與載入中，請稍候幾秒...
  </div>

  <!-- 6. 預先掛載全域 React（避免遊戲代碼中漏寫 import React 時報錯） -->
  <script type="module">
    import React from 'react';
    window.React = React;
  </script>

  <!-- 7. 遊戲主程式區塊（必須保留 data-type="module" 與 data-presets="react"） -->
  <script type="text/babel" data-type="module" data-presets="react">
    import { createRoot as __createRoot } from 'react-dom/client';

    // =========================================================================
    // 【請從這行下面開始，貼上你原本那九千多行的完整遊戲代碼】
    // （從原本第 38 行的 import ... from 'react' 開始貼，到遊戲代碼最後一行）
    // =========================================================================




    // =========================================================================
    // 【遊戲代碼貼上結束】以下為啟動畫面的程式碼，請確認元件名稱
    // =========================================================================
    const __rootElement = document.getElementById('root');
    const __root = __createRoot(__rootElement);

    // ⚠️ 如果你遊戲最底下的主元件不是叫 App（例如叫 Game），
    // 請把下面這行的 <App /> 改成對應的名稱，例如 <Game />
    __root.render(<App />);
  </script>
</body>
</html>
