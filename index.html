                moveSpeed: 3.6,
                sprintSpeed: 5.2,
                weaponProfile: 'sniper',
                damage: 38,
                armorPen: 0.90,
                fireRate: 1.85,
                burstMin: 1,
                burstMax: 1,
                burstCooldown: 2.1,
                accuracy: 0.018,
                sightRange: 85,
                preferFlank: 0.25,
                preferSuppress: 0.20,
                scoreValue: 180,
                bodyColor: 0x353b30,
                armorColor: 0x20241d,
                visorColor: 0xff2244,
                scale: 0.98
            }
        };

        const STATE = {
            PATROL: 'PATROL',
            ENGAGE: 'ENGAGE',
            SEEK_COVER: 'SEEK_COVER',
            IN_COVER: 'IN_COVER',
            FLANK: 'FLANK',
            SUPPRESS: 'SUPPRESS',
            RELOAD: 'RELOAD',
            DEAD: 'DEAD'
        };

        const ctx = {
            scene: null,
            player: null,
            camera: null,
            getWorldMeshes: () => [],
            getCoverPoints: () => [],
            getSpawnPoints: () => [],
            onPlayerDamaged: null,
            onEnemyKilled: null,
            onDropSupply: null,
            enemies: [],
            nextId: 1,
            wave: 1,
            waveRemainingToSpawn: 0,
            spawnTimer: 0,
            maxAlive: 8,
            raycaster: new THREE.Raycaster()
        };

        // 複用臨時數學物件以維持穩定幀率
        const _vToPlayer = new THREE.Vector3();
        const _vDir = new THREE.Vector3();
        const _vEye = new THREE.Vector3();
        const _vTarget = new THREE.Vector3();
        const _vRight = new THREE.Vector3();
        const _vMove = new THREE.Vector3();
        const _vMuzzle = new THREE.Vector3();
        const _vUp = new THREE.Vector3(0, 1, 0);

        // 共用敵軍幾何體（避免重複建構緩衝區）
        const sharedGeo = {
            head: new THREE.BoxGeometry(0.32, 0.34, 0.32),
            helmet: new THREE.BoxGeometry(0.36, 0.20, 0.36),
            visor: new THREE.BoxGeometry(0.28, 0.09, 0.06),
            torso: new THREE.BoxGeometry(0.52, 0.68, 0.30),
            vest: new THREE.BoxGeometry(0.58, 0.50, 0.36),
            arm: new THREE.BoxGeometry(0.16, 0.58, 0.16),
            leg: new THREE.BoxGeometry(0.20, 0.78, 0.22),
            gunBody: new THREE.BoxGeometry(0.08, 0.12, 0.68),
            gunBarrel: new THREE.CylinderGeometry(0.02, 0.02, 0.35, 6)
        };
        sharedGeo.gunBarrel.rotateX(Math.PI / 2);

        function init(config = {}) {
            ctx.scene = config.scene || window.scene;
            ctx.player = config.player || window.player;
            ctx.camera = config.camera || window.camera;
            if (config.getWorldMeshes) ctx.getWorldMeshes = config.getWorldMeshes;
            if (config.getCoverPoints) ctx.getCoverPoints = config.getCoverPoints;
            if (config.getSpawnPoints) ctx.getSpawnPoints = config.getSpawnPoints;
            if (config.onPlayerDamaged) ctx.onPlayerDamaged = config.onPlayerDamaged;
            if (config.onEnemyKilled) ctx.onEnemyKilled = config.onEnemyKilled;
            if (config.onDropSupply) ctx.onDropSupply = config.onDropSupply;
        }

        // 建立關節分明且帶獨立部位受擊盒（頭 / 胸甲 / 四肢）的 3D 敵軍模型
        function buildEnemyMesh(enemy, arch) {
            const root = new THREE.Group();
            root.scale.setScalar(arch.scale);

            const bodyMat = new THREE.MeshStandardMaterial({
                color: arch.bodyColor, roughness: 0.78, metalness: 0.15
            });
            const armorMat = new THREE.MeshStandardMaterial({
                color: arch.armorColor, roughness: 0.45, metalness: 0.55
            });
            const visorMat = new THREE.MeshBasicMaterial({ color: arch.visorColor });
            const gunMat = new THREE.MeshStandardMaterial({
                color: 0x1a1c1e, roughness: 0.38, metalness: 0.82
            });

            const hitboxes = [];

            const tagHitbox = (mesh, zone) => {
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = {
                    isEnemy: true,
                    enemyRef: enemy,
                    hitboxZone: zone
                };
                hitboxes.push(mesh);
            };

            // 下半身左右腿樞軸
            const leftLegPivot = new THREE.Group();
            leftLegPivot.position.set(-0.15, 0.78, 0);
            const leftLeg = new THREE.Mesh(sharedGeo.leg, bodyMat);
            leftLeg.position.y = -0.39;
            tagHitbox(leftLeg, 'limb');
            leftLegPivot.add(leftLeg);
            root.add(leftLegPivot);

            const rightLegPivot = new THREE.Group();
            rightLegPivot.position.set(0.15, 0.78, 0);
            const rightLeg = new THREE.Mesh(sharedGeo.leg, bodyMat);
            rightLeg.position.y = -0.39;
            tagHitbox(rightLeg, 'limb');
            rightLegPivot.add(rightLeg);
            root.add(rightLegPivot);

            // 上半身軀幹樞軸（用於蹲姿、受擊後仰、探頭射擊動畫）
            const upperBody = new THREE.Group();
            upperBody.position.set(0, 0.78, 0);
            root.add(upperBody);

            const torso = new THREE.Mesh(sharedGeo.torso, bodyMat);
            torso.position.y = 0.36;
            tagHitbox(torso, 'chest');
            upperBody.add(torso);

            // 戰術防彈背心（破甲後視覺脫落隱藏）
            const vest = new THREE.Mesh(sharedGeo.vest, armorMat);
            vest.position.y = 0.38;
            tagHitbox(vest, 'chest');
            upperBody.add(vest);

            // 頭部 + 戰術頭盔 + 發光護目鏡
            const headGroup = new THREE.Group();
            headGroup.position.set(0, 0.88, 0);
            const head = new THREE.Mesh(sharedGeo.head, bodyMat);
            tagHitbox(head, 'head');
            headGroup.add(head);

            const helmet = new THREE.Mesh(sharedGeo.helmet, armorMat);
            helmet.position.y = 0.11;
            tagHitbox(helmet, 'head');
            headGroup.add(helmet);

            const visor = new THREE.Mesh(sharedGeo.visor, visorMat);
            visor.position.set(0, 0.02, 0.16);
            headGroup.add(visor);
            upperBody.add(headGroup);

            // 左右手臂與持槍組件
            const leftArmPivot = new THREE.Group();
            leftArmPivot.position.set(-0.34, 0.60, 0);
            const leftArm = new THREE.Mesh(sharedGeo.arm, bodyMat);
            leftArm.position.set(0, -0.24, 0.12);
            leftArm.rotation.x = -0.65;
            tagHitbox(leftArm, 'limb');
            leftArmPivot.add(leftArm);
            upperBody.add(leftArmPivot);

            const rightArmPivot = new THREE.Group();
            rightArmPivot.position.set(0.34, 0.60, 0);
            const rightArm = new THREE.Mesh(sharedGeo.arm, bodyMat);
            rightArm.position.set(0, -0.24, 0.14);
            rightArm.rotation.x = -0.85;
            tagHitbox(rightArm, 'limb');
            rightArmPivot.add(rightArm);

            // 敵軍步槍與槍口掛點
            const gunGroup = new THREE.Group();
            gunGroup.position.set(-0.08, -0.24, 0.42);
            const gunBody = new THREE.Mesh(sharedGeo.gunBody, gunMat);
            const gunBarrel = new THREE.Mesh(sharedGeo.gunBarrel, gunMat);
            gunBarrel.position.z = 0.44;
            gunGroup.add(gunBody, gunBarrel);

            const muzzleAnchor = new THREE.Object3D();
            muzzleAnchor.position.set(0, 0.02, 0.64);
            gunGroup.add(muzzleAnchor);
            rightArmPivot.add(gunGroup);
            upperBody.add(rightArmPivot);

            // 頭頂世界空間迷你血甲條（開戰或受擊時顯示）
            const barGroup = buildOverheadBar();
            barGroup.position.set(0, 1.38, 0);
            upperBody.add(barGroup);

            return {
                root,
                upperBody,
                headGroup,
                vest,
                helmet,
                visorMat,
                leftLegPivot,
                rightLegPivot,
                leftArmPivot,
                rightArmPivot,
                muzzleAnchor,
                barGroup,
                hitboxes
            };
        }

        function buildOverheadBar() {
            const g = new THREE.Group();
            const bgMat = new THREE.MeshBasicMaterial({ color: 0x0b0e12, transparent: true, opacity: 0.72, side: THREE.DoubleSide });
            const hpMat = new THREE.MeshBasicMaterial({ color: 0xff3b3b, side: THREE.DoubleSide });
            const apMat = new THREE.MeshBasicMaterial({ color: 0x35d0ff, side: THREE.DoubleSide });

            const bg = new THREE.Mesh(new THREE.PlaneGeometry(0.84, 0.14), bgMat);
            const hpFill = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.05), hpMat);
            hpFill.position.set(0, -0.025, 0.004);
            const apFill = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.04), apMat);
            apFill.position.set(0, 0.032, 0.004);

            g.add(bg, hpFill, apFill);
            g.userData = { hpFill, apFill };
            g.visible = false;
            return g;
        }

        function spawnEnemy(archetypeId = 'assault', position = new THREE.Vector3()) {
            const arch = ARCHETYPES[archetypeId] || ARCHETYPES.assault;
            const enemy = {
                id: ctx.nextId++,
                arch,
                hp: arch.hp,
                maxHp: arch.hp,
                armor: arch.armor,
                maxArmor: arch.armor,
                helmetIntact: arch.armor >= 45,

                state: STATE.PATROL,
                stateTimer: 0,
                decisionTimer: 0.35 + Math.random() * 0.45,
                suppression: 0,
                flinchTimer: 0,
                alerted: false,
                lastKnownPlayerPos: new THREE.Vector3(),
                lastSeenTimer: 99,
                lastFiredTime: -99,

                // 移動與路徑目標
                position: position.clone(),
                velocity: new THREE.Vector3(),
                yaw: Math.random() * Math.PI * 2,
                targetYaw: 0,
                moveTarget: null,
                coverNode: null,
                patrolOrigin: position.clone(),
                patrolTarget: position.clone(),
                flankSide: Math.random() < 0.5 ? 1 : -1,
                isCrouching: false,

                // 射擊連發控制
                ammoInMag: arch.weaponProfile === 'sniper' ? 5 : 24,
                fireTimer: 0.4 + Math.random() * 0.5,
                burstLeft: 0,
                reloadTimer: 0,
                footstepAccum: 0,
                walkPhase: Math.random() * Math.PI * 2,

                // 死亡倒地動畫
                deadTimer: 0,
                deathFallDir: Math.random() < 0.5 ? 1 : -1,
                meshRig: null
            };

            enemy.meshRig = buildEnemyMesh(enemy, arch);
            enemy.meshRig.root.position.copy(enemy.position);
            enemy.meshRig.root.rotation.y = enemy.yaw;
            if (ctx.scene) ctx.scene.add(enemy.meshRig.root);

            pickNextPatrolTarget(enemy);
            ctx.enemies.push(enemy);
            return enemy;
        }

        // 波次生成總控
        function startWave(waveNum = 1) {
            ctx.wave = waveNum;
            ctx.waveRemainingToSpawn = 4 + waveNum * 2;
            ctx.maxAlive = Math.min(11, 5 + waveNum);
            ctx.spawnTimer = 0.6;
        }

        function updateWaveSpawner(dt) {
            if (ctx.waveRemainingToSpawn <= 0) return;
            const aliveCount = ctx.enemies.filter(e => e.state !== STATE.DEAD).length;
            if (aliveCount >= ctx.maxAlive) return;

            ctx.spawnTimer -= dt;
            if (ctx.spawnTimer > 0) return;

            const points = ctx.getSpawnPoints();
            let chosenPos = new THREE.Vector3((Math.random() - 0.5) * 44, 0, (Math.random() - 0.5) * 44);
            if (points.length > 0) {
                // 優先挑選距離玩家 22 公尺以上的安全出生點，避免貼臉刷怪
                const playerPos = ctx.player ? ctx.player.position : new THREE.Vector3();
                const candidates = points.filter(pt => pt.distanceTo(playerPos) > 18);
                const pool = candidates.length > 0 ? candidates : points;
                chosenPos = pool[Math.floor(Math.random() * pool.length)].clone();
                chosenPos.x += (Math.random() - 0.5) * 2.5;
                chosenPos.z += (Math.random() - 0.5) * 2.5;
            }

            // 隨波次提高精銳兵種權重
            const r = Math.random();
            let archId = 'assault';
            if (ctx.wave >= 2 && r > 0.78) archId = 'heavy';
            else if (ctx.wave >= 2 && r > 0.55) archId = 'sniper';
            else if (r > 0.38) archId = 'flanker';

            spawnEnemy(archId, chosenPos);
            ctx.waveRemainingToSpawn--;
            ctx.spawnTimer = Math.max(1.2, 3.0 - ctx.wave * 0.25);
        }

        // 視線檢測 (Line of Sight)：判斷敵人眼睛能否直視玩家
        function hasLineOfSight(enemy, targetPos) {
            _vEye.copy(enemy.position).add(new THREE.Vector3(0, enemy.isCrouching ? 1.05 : 1.58, 0));
            _vTarget.copy(targetPos).add(new THREE.Vector3(0, 1.45, 0));
            _vDir.copy(_vTarget).sub(_vEye);
            const dist = _vDir.length();
            if (dist > enemy.arch.sightRange) return { visible: false, dist };

            _vDir.normalize();
            ctx.raycaster.set(_vEye, _vDir);
            ctx.raycaster.near = 0.25;
            ctx.raycaster.far = dist - 0.3;

            const worldMeshes = ctx.getWorldMeshes();
            if (worldMeshes.length === 0) return { visible: true, dist };
            const hits = ctx.raycaster.intersectObjects(worldMeshes, true);
            return { visible: hits.length === 0, dist };
        }

        // 檢查某個掩體點相對於玩家位置是否具備遮蔽保護
        function isPointShieldedFrom(point, threatPos) {
            _vEye.copy(point).add(new THREE.Vector3(0, 0.95, 0));
            _vTarget.copy(threatPos).add(new THREE.Vector3(0, 1.45, 0));
            _vDir.copy(_vTarget).sub(_vEye);
            const dist = _vDir.length();
            if (dist < 2.0) return false;

            ctx.raycaster.set(_vEye, _vDir.normalize());
            ctx.raycaster.near = 0.2;
            ctx.raycaster.far = dist - 0.4;
            const hits = ctx.raycaster.intersectObjects(ctx.getWorldMeshes(), true);
            return hits.length > 0;
        }

        // 搜尋最佳戰術掩體（優先選距離適中且確實被牆體遮擋的掩體點）
        function findBestCover(enemy, threatPos) {
            const coverPoints = ctx.getCoverPoints();
            let bestPoint = null;
            let bestScore = -Infinity;

            for (let i = 0; i < coverPoints.length; i++) {
                const cp = coverPoints[i];
                const distToEnemy = cp.distanceTo(enemy.position);
                const distToPlayer = cp.distanceTo(threatPos);
                if (distToEnemy > 26 || distToPlayer < 6) continue;

                // 避免多名敵軍擠在同一個掩體點
                let occupied = false;
                for (let j = 0; j < ctx.enemies.length; j++) {
                    const other = ctx.enemies[j];
                    if (other !== enemy && other.state !== STATE.DEAD && other.coverNode && other.coverNode.distanceToSquared(cp) < 2.5) {
                        occupied = true;
                        break;
                    }
                }
                if (occupied) continue;

                const shielded = isPointShieldedFrom(cp, threatPos);
                const score = (shielded ? 40 : -15) - distToEnemy * 1.1 + Math.min(distToPlayer, 28) * 0.45;
                if (score > bestScore) {
                    bestScore = score;
                    bestPoint = cp;
                }
            }
            return bestPoint;
        }

        // 計算側翼包抄座標（沿敵我連線的垂直側向切入）
        function computeFlankTarget(enemy, playerPos) {
            _vToPlayer.copy(playerPos).sub(enemy.position);
            _vToPlayer.y = 0;
            const dist = _vToPlayer.length();
            if (dist < 1) return enemy.position.clone();
            _vToPlayer.normalize();

            _vRight.crossVectors(_vToPlayer, _vUp).normalize();
            const lateralDist = Math.min(14, Math.max(7, dist * 0.55)) * enemy.flankSide;
            const forwardDist = Math.min(10, dist * 0.4);

            const dest = enemy.position.clone()
                .addScaledVector(_vRight, lateralDist)
                .addScaledVector(_vToPlayer, forwardDist);
            dest.x = THREE.MathUtils.clamp(dest.x, -44, 44);
            dest.z = THREE.MathUtils.clamp(dest.z, -44, 44);
            dest.y = 0;
            return dest;
        }

        function pickNextPatrolTarget(enemy) {
            const ang = Math.random() * Math.PI * 2;
            const rad = 5 + Math.random() * 11;
            enemy.patrolTarget.set(
                THREE.MathUtils.clamp(enemy.patrolOrigin.x + Math.cos(ang) * rad, -42, 42),
                0,
                THREE.MathUtils.clamp(enemy.patrolOrigin.z + Math.sin(ang) * rad, -42, 42)
            );
        }

        // 小隊無線電警戒連動：通報 22 公尺內友軍共同接戰
        function alertNearbySquad(sourceEnemy, playerPos) {
            for (let i = 0; i < ctx.enemies.length; i++) {
                const ally = ctx.enemies[i];
                if (ally === sourceEnemy || ally.state === STATE.DEAD || ally.alerted) continue;
                if (ally.position.distanceTo(sourceEnemy.position) <= 22) {
                    ally.alerted = true;
                    ally.lastKnownPlayerPos.copy(playerPos);
                    ally.lastSeenTimer = 0;
                    ally.state = STATE.ENGAGE;
                    ally.decisionTimer = 0.25;
                }
            }
        }

        // 行為樹高階戰術決策器
        function evaluateBehaviorTree(enemy, playerPos, los, nowSec) {
            // 1. 彈匣見底 -> 立即尋掩體並換彈
            if (enemy.ammoInMag <= 0) {
                enemy.state = STATE.RELOAD;
                enemy.reloadTimer = 2.15;
                enemy.isCrouching = true;
                return;
            }

            // 2. 尚未接敵時進行巡邏與警戒視野掃描
            if (!enemy.alerted) {
                if (los.visible) {
                    // 檢查是否在敵人前方 150 度扇形視角內，或玩家過近直接發覺
                    _vDir.copy(playerPos).sub(enemy.position).setY(0).normalize();
                    const facing = new THREE.Vector3(Math.sin(enemy.yaw), 0, Math.cos(enemy.yaw));
                    if (facing.dot(_vDir) > 0.22 || los.dist < 11) {
                        enemy.alerted = true;
                        enemy.lastKnownPlayerPos.copy(playerPos);
                        enemy.lastSeenTimer = 0;
                        enemy.state = STATE.ENGAGE;
                        alertNearbySquad(enemy, playerPos);
                    }
                }
                return;
            }

            // 3. 遭重創、破甲或高壓制值 -> 優先撤入掩體躲避
            const hpRatio = enemy.hp / enemy.maxHp;
            const needCover = (enemy.suppression > 0.65 || hpRatio < 0.45) && enemy.state !== STATE.IN_COVER;
            if (needCover) {
                const cover = findBestCover(enemy, playerPos);
                if (cover) {
                    enemy.coverNode = cover;
                    enemy.moveTarget = cover.clone();
                    enemy.state = STATE.SEEK_COVER;
                    enemy.stateTimer = 0;
                    return;
                }
            }

            // 4. 在掩體內喘息回穩後，決定探頭壓制或發起側翼包抄
            if (enemy.state === STATE.IN_COVER) {
                if (enemy.stateTimer > 1.8 && enemy.suppression < 0.35) {
                    const roll = Math.random();
                    if (roll < enemy.arch.preferFlank) {
                        enemy.flankSide = Math.random() < 0.5 ? 1 : -1;
                        enemy.moveTarget = computeFlankTarget(enemy, playerPos);
                        enemy.state = STATE.FLANK;
                    } else if (roll < enemy.arch.preferFlank + enemy.arch.preferSuppress) {
                        enemy.state = STATE.SUPPRESS;
                    } else {
                        enemy.state = STATE.ENGAGE;
                    }
                    enemy.stateTimer = 0;
                    enemy.isCrouching = false;
                }
                return;
            }

            // 5. 視線丟失時：對最後已知點執行火力壓制或側翼推進包夾
            if (!los.visible) {
                if (enemy.lastSeenTimer < 3.2 && Math.random() < enemy.arch.preferSuppress) {
                    enemy.state = STATE.SUPPRESS;
                } else {
                    enemy.moveTarget = computeFlankTarget(enemy, enemy.lastKnownPlayerPos);
                    enemy.state = STATE.FLANK;
                }
                enemy.stateTimer = 0;
                return;
            }

            // 6. 視線清晰時：依兵種偏好在正面交火 / 側翼機動 / 壓制之間切換
            if (enemy.state === STATE.ENGAGE && enemy.stateTimer > 2.6) {
                const roll = Math.random();
                if (roll < enemy.arch.preferFlank) {
                    enemy.moveTarget = computeFlankTarget(enemy, playerPos);
                    enemy.state = STATE.FLANK;
                    enemy.stateTimer = 0;
                } else if (roll < enemy.arch.preferFlank + 0.28) {
                    const cover = findBestCover(enemy, playerPos);
                    if (cover) {
                        enemy.coverNode = cover;
                        enemy.moveTarget = cover.clone();
                        enemy.state = STATE.SEEK_COVER;
                        enemy.stateTimer = 0;
                    }
                }
            }
        }

        // 敵軍開火邏輯（點放射擊、散佈、槍口火光、曳光彈、3D 槍聲、判定玩家受擊）
        function executeEnemyFire(enemy, aimPos, nowSec, suppressMode = false) {
            if (enemy.ammoInMag <= 0) return;

            enemy.ammoInMag--;
            enemy.lastFiredTime = nowSec;
            enemy.meshRig.muzzleAnchor.getWorldPosition(_vMuzzle);

            const targetPoint = aimPos.clone().add(new THREE.Vector3(0, 1.38, 0));
            const dir = targetPoint.sub(_vMuzzle).normalize();

            // 依兵種精準度 + 移動懲罰 + 壓制模式增加散佈
            const spread = enemy.arch.accuracy * (suppressMode ? 2.4 : 1.0) * (1 + enemy.suppression * 0.9);
            dir.x += (Math.random() - 0.5) * spread;
            dir.y += (Math.random() - 0.5) * spread * 0.7;
            dir.z += (Math.random() - 0.5) * spread;
            dir.normalize();

            // 視覺與 3D 音效
            if (typeof VFX !== 'undefined') {
                VFX.spawnMuzzleFlash(_vMuzzle, dir, false);
            }
            if (typeof AudioEngine !== 'undefined') {
                AudioEngine.playGunshot(enemy.arch.weaponProfile, _vMuzzle, false, false);
            }

            // 彈道射線檢測是否被掩體擋住，或命中玩家
            const maxDist = enemy.arch.sightRange + 15;
            ctx.raycaster.set(_vMuzzle, dir);
            ctx.raycaster.near = 0.2;
            ctx.raycaster.far = maxDist;

            const worldHits = ctx.raycaster.intersectObjects(ctx.getWorldMeshes(), true);
            const wallDist = worldHits.length > 0 ? worldHits[0].distance : maxDist;

            // 檢測射線與玩家圓柱體是否相交
            const playerPos = ctx.player.position;
            const playerCenter = new THREE.Vector3(playerPos.x, playerPos.y + 1.05, playerPos.z);
            const toPlayer = playerCenter.clone().sub(_vMuzzle);
            const projLen = toPlayer.dot(dir);

            let endPoint = _vMuzzle.clone().addScaledVector(dir, Math.min(wallDist, 65));
            let hitPlayer = false;

            if (projLen > 0 && projLen < wallDist) {
                const closestPt = _vMuzzle.clone().addScaledVector(dir, projLen);
                const horizDist = Math.hypot(closestPt.x - playerCenter.x, closestPt.z - playerCenter.z);
                const vertDist = Math.abs(closestPt.y - playerCenter.y);
                if (horizDist <= 0.48 && vertDist <= 0.95) {
                    hitPlayer = true;
                    endPoint = closestPt;
                }
            }

            if (typeof VFX !== 'undefined') {
                VFX.spawnTracer(_vMuzzle, endPoint, false);
                if (!hitPlayer && worldHits.length > 0) {
                    const wh = worldHits[0];
                    const n = wh.face
                        ? wh.face.normal.clone().transformDirection(wh.object.matrixWorld).normalize()
                        : new THREE.Vector3(0, 1, 0);
                    VFX.spawnImpact(wh.point, n, wh.object.userData?.surfaceType || 'concrete');
                }
            }

            if (hitPlayer && ctx.onPlayerDamaged) {
                ctx.onPlayerDamaged({
                    damage: enemy.arch.damage,
                    armorPen: enemy.arch.armorPen,
                    attackerPos: enemy.position.clone(),
                    attackerLabel: enemy.arch.label
                });
            }
        }

        // 敵軍移動與基礎障礙物滑移避障
        function moveEnemyToward(enemy, targetPos, speed, dt) {
            _vMove.copy(targetPos).sub(enemy.position);
            _vMove.y = 0;
            const dist = _vMove.length();
            if (dist < 0.45) {
                enemy.velocity.set(0, 0, 0);
                return true; // 已抵達目標
            }
            _vMove.normalize();

            // 前方障礙物簡易探測與側滑修正
            _vEye.copy(enemy.position).add(new THREE.Vector3(0, 0.9, 0));
            ctx.raycaster.set(_vEye, _vMove);
            ctx.raycaster.near = 0.1;
            ctx.raycaster.far = 1.35;
            const obs = ctx.raycaster.intersectObjects(ctx.getWorldMeshes(), true);
            if (obs.length > 0) {
                // 沿切線繞開障礙物
                _vRight.crossVectors(_vMove, _vUp).multiplyScalar(enemy.flankSide);
                _vMove.addScaledVector(_vRight, 1.4).normalize();
            }

            // 敵軍之間互相排斥避免重疊穿模
            for (let i = 0; i < ctx.enemies.length; i++) {
                const other = ctx.enemies[i];
                if (other === enemy || other.state === STATE.DEAD) continue;
                const dx = enemy.position.x - other.position.x;
                const dz = enemy.position.z - other.position.z;
                const d2 = dx * dx + dz * dz;
                if (d2 > 0.0001 && d2 < 1.8) {
                    const inv = 1.0 / Math.sqrt(d2);
                    _vMove.x += dx * inv * 0.65;
                    _vMove.z += dz * inv * 0.65;
                }
            }
            _vMove.normalize();

            enemy.velocity.copy(_vMove).multiplyScalar(speed);
            enemy.position.addScaledVector(enemy.velocity, dt);
            enemy.position.x = THREE.MathUtils.clamp(enemy.position.x, -46, 46);
            enemy.position.z = THREE.MathUtils.clamp(enemy.position.z, -46, 46);

            // 3D 敵軍腳步聲
            enemy.footstepAccum += speed * dt;
            if (enemy.footstepAccum >= 2.2) {
                enemy.footstepAccum = 0;
                if (typeof AudioEngine !== 'undefined') {
                    AudioEngine.playFootstep('concrete', speed > 5.0, enemy.position, false);
                }
            }
            return false;
        }

        // 部位受擊、破甲判定、頭盔擊飛與壓制反饋（由 WeaponCombat.onHitEnemy 呼叫）
        function receiveHit(enemy, hitInfo) {
            if (!enemy || enemy.state === STATE.DEAD) {
                return { killed: false, armorBroken: false, armored: false };
            }

            const { damage = 25, armorPen = 0.65, zone = 'chest', isHeadshot = false } = hitInfo;
            let armored = false;
            let armorBroken = false;
            let hpDamage = damage;

            // 受到攻擊立刻警覺並鎖定玩家方向，同時提高壓制值
            enemy.alerted = true;
            if (ctx.player) {
                enemy.lastKnownPlayerPos.copy(ctx.player.position);
                enemy.lastSeenTimer = 0;
                alertNearbySquad(enemy, ctx.player.position);
            }
            enemy.suppression = Math.min(1.0, enemy.suppression + 0.28);
            enemy.flinchTimer = 0.16;

            if (isHeadshot) {
                // 若戴著頭盔，先削弱部分爆頭傷害並直接擊碎頭盔
                if (enemy.helmetIntact && armorPen < 0.88) {
                    armored = true;
                    enemy.helmetIntact = false;
                    armorBroken = true;
                    enemy.meshRig.helmet.visible = false;
                    hpDamage = Math.round(damage * 0.72);
                }
            } else if (zone === 'chest' && enemy.armor > 0) {
                armored = true;
                const absorbRatio = THREE.MathUtils.clamp(1.0 - armorPen * 0.65, 0.30, 0.75);
                const absorbed = Math.min(enemy.armor, damage * absorbRatio);
                enemy.armor = Math.max(0, enemy.armor - absorbed);
                hpDamage = Math.max(3, Math.round(damage - absorbed * 0.85));

                if (enemy.armor <= 0) {
                    armorBroken = true;
                    enemy.meshRig.vest.visible = false; // 陶瓷甲碎裂脫落
                    enemy.suppression = Math.min(1.0, enemy.suppression + 0.55);
                }
            }

            enemy.hp = Math.max(0, enemy.hp - hpDamage);
            updateEnemyOverheadBar(enemy);

            let killed = false;
            if (enemy.hp <= 0) {
                killed = true;
                killEnemy(enemy, isHeadshot, hitInfo.weaponName);
            }

            return { killed, armorBroken, armored };
        }

        // 油桶爆炸範圍傷害（依距離線性衰減並必定震碎殘餘護甲）
        function applyExplosionDamage(origin, radius = 9.0, maxDamage = 220) {
            for (let i = 0; i < ctx.enemies.length; i++) {
                const e = ctx.enemies[i];
                if (e.state === STATE.DEAD) continue;
                const dist = e.position.distanceTo(origin);
                if (dist > radius) continue;

                const falloff = 1.0 - (dist / radius);
                const dmg = Math.round(maxDamage * (0.25 + 0.75 * falloff));
                receiveHit(e, {
                    damage: dmg,
                    armorPen: 0.92,
                    zone: 'chest',
                    isHeadshot: false,
                    weaponName: '油桶爆破'
                });
            }
        }

        function killEnemy(enemy, isHeadshot = false, weaponName = '') {
            enemy.state = STATE.DEAD;
            enemy.deadTimer = 0;
            enemy.meshRig.barGroup.visible = false;
            enemy.meshRig.visorMat.color.setHex(0x222222);

            // 移除受擊標籤避免屍體擋住後續子彈
            for (let i = 0; i < enemy.meshRig.hitboxes.length; i++) {
                enemy.meshRig.hitboxes[i].userData.isEnemy = false;
            }

            // 45% 機率掉落彈藥與護甲插板補給箱
            if (ctx.onDropSupply && Math.random() < 0.48) {
                ctx.onDropSupply(enemy.position.clone());
            }

            if (ctx.onEnemyKilled) {
                ctx.onEnemyKilled({
                    enemy,
                    label: enemy.arch.label,
                    isHeadshot,
                    weaponName,
                    score: enemy.arch.scoreValue + (isHeadshot ? 50 : 0)
                });
            }
        }

        function updateEnemyOverheadBar(enemy) {
            const bg = enemy.meshRig.barGroup;
            if (enemy.state === STATE.DEAD) {
                bg.visible = false;
                return;
            }
            bg.visible = enemy.hp < enemy.maxHp || enemy.armor < enemy.maxArmor;
            const hpRatio = Math.max(0.001, enemy.hp / enemy.maxHp);
            const apRatio = enemy.maxArmor > 0 ? Math.max(0.001, enemy.armor / enemy.maxArmor) : 0;

            const { hpFill, apFill } = bg.userData;
            hpFill.scale.x = hpRatio;
            hpFill.position.x = -(1 - hpRatio) * 0.39;
            apFill.visible = enemy.armor > 0;
            apFill.scale.x = apRatio;
            apFill.position.x = -(1 - apRatio) * 0.39;
        }

        // 更新敵軍身體動畫（步態擺動、蹲姿掩蔽、受擊後仰、死亡倒地、血條朝向攝影機）
        function updateEnemyAnimation(enemy, dt) {
            const rig = enemy.meshRig;

            if (enemy.state === STATE.DEAD) {
                enemy.deadTimer += dt;
                const fallT = Math.min(1, enemy.deadTimer / 0.42);
                const ease = 1 - Math.pow(1 - fallT, 3);
                rig.root.rotation.x = -ease * (Math.PI / 2) * enemy.deathFallDir;
                rig.root.position.y = THREE.MathUtils.lerp(0, 0.22, ease);
                return;
            }

            // 水平轉向插值
            let diff = enemy.targetYaw - enemy.yaw;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            enemy.yaw += diff * Math.min(1, dt * 10);

            rig.root.position.copy(enemy.position);
            rig.root.rotation.y = enemy.yaw;

            // 蹲伏高度平滑過渡
            const targetUpperY = enemy.isCrouching ? 0.48 : 0.78;
            rig.upperBody.position.y += (targetUpperY - rig.upperBody.position.y) * Math.min(1, dt * 11);

            // 步態擺腿與擺臂
            const speed = Math.hypot(enemy.velocity.x, enemy.velocity.z);
            if (speed > 0.3) {
                enemy.walkPhase += speed * dt * 2.1;
                const swing = Math.sin(enemy.walkPhase) * 0.58;
                rig.leftLegPivot.rotation.x = swing;
                rig.rightLegPivot.rotation.x = -swing;
            } else {
                rig.leftLegPivot.rotation.x *= Math.exp(-10 * dt);
                rig.rightLegPivot.rotation.x *= Math.exp(-10 * dt);
            }

            // 受擊抽搐後仰
            if (enemy.flinchTimer > 0) {
                enemy.flinchTimer -= dt;
                rig.upperBody.rotation.x = -0.24 * (enemy.flinchTimer / 0.16);
            } else {
                rig.upperBody.rotation.x *= Math.exp(-12 * dt);
            }

            // 頭頂狀態條面向玩家攝影機
            if (rig.barGroup.visible && ctx.camera) {
                rig.barGroup.lookAt(ctx.camera.position);
            }
        }

        function update(dt, nowSec) {
            updateWaveSpawner(dt);
            const playerPos = ctx.player ? ctx.player.position : new THREE.Vector3();

            for (let i = ctx.enemies.length - 1; i >= 0; i--) {
                const e = ctx.enemies[i];

                if (e.state === STATE.DEAD) {
                    updateEnemyAnimation(e, dt);
                    if (e.deadTimer > 7.5) {
                        if (ctx.scene) ctx.scene.remove(e.meshRig.root);
                        ctx.enemies.splice(i, 1);
                    }
                    continue;
                }

                e.stateTimer += dt;
                e.suppression = Math.max(0, e.suppression - dt * 0.22);

                const los = hasLineOfSight(e, playerPos);
                if (los.visible) {
                    e.lastKnownPlayerPos.copy(playerPos);
                    e.lastSeenTimer = 0;
                } else {
                    e.lastSeenTimer += dt;
                }

                // 定期執行行為樹重評估
                e.decisionTimer -= dt;
                if (e.decisionTimer <= 0) {
                    evaluateBehaviorTree(e, playerPos, los, nowSec);
                    e.decisionTimer = 0.45 + Math.random() * 0.35;
                }

                // 執行當前狀態行為
                switch (e.state) {
                    case STATE.PATROL: {
                        e.isCrouching = false;
                        const arrived = moveEnemyToward(e, e.patrolTarget, e.arch.moveSpeed * 0.55, dt);
                        if (arrived) pickNextPatrolTarget(e);
                        if (e.velocity.lengthSq() > 0.05) {
                            e.targetYaw = Math.atan2(e.velocity.x, e.velocity.z);
                        }
                        break;
                    }

                    case STATE.SEEK_COVER: {
                        e.isCrouching = false;
                        if (!e.moveTarget) {
                            e.state = STATE.ENGAGE;
                            break;
                        }
                        const arrived = moveEnemyToward(e, e.moveTarget, e.arch.sprintSpeed, dt);
                        e.targetYaw = Math.atan2(e.velocity.x, e.velocity.z);
                        if (arrived || e.stateTimer > 5.0) {
                            e.state = STATE.IN_COVER;
                            e.stateTimer = 0;
                            e.isCrouching = true;
                            e.velocity.set(0, 0, 0);
                        }
                        break;
                    }

                    case STATE.IN_COVER: {
                        e.isCrouching = true;
                        e.velocity.set(0, 0, 0);
                        e.targetYaw = Math.atan2(
                            e.lastKnownPlayerPos.x - e.position.x,
                            e.lastKnownPlayerPos.z - e.position.z
                        );
                        break;
                    }

                    case STATE.FLANK: {
                        e.isCrouching = false;
                        if (!e.moveTarget) {
                            e.state = STATE.ENGAGE;
                            break;
                        }
                        const arrived = moveEnemyToward(e, e.moveTarget, e.arch.sprintSpeed * 0.92, dt);
                        e.targetYaw = los.visible
                            ? Math.atan2(playerPos.x - e.position.x, playerPos.z - e.position.z)
                            : Math.atan2(e.velocity.x, e.velocity.z);

                        // 側翼包抄途中若抓到角度立刻邊走邊開火
                        if (los.visible) handleBurstShooting(e, playerPos, dt, nowSec, false);
                        if (arrived || e.stateTimer > 4.5) {
                            e.state = STATE.ENGAGE;
                            e.stateTimer = 0;
                        }
                        break;
                    }

                    case STATE.SUPPRESS: {
                        e.isCrouching = true;
                        e.velocity.set(0, 0, 0);
                        e.targetYaw = Math.atan2(
                            e.lastKnownPlayerPos.x - e.position.x,
                            e.lastKnownPlayerPos.z - e.position.z
                        );
                        handleBurstShooting(e, e.lastKnownPlayerPos, dt, nowSec, true);
                        if (e.stateTimer > 3.2) {
                            e.state = STATE.ENGAGE;
                            e.stateTimer = 0;
                        }
                        break;
                    }

                    case STATE.RELOAD: {
                        e.isCrouching = true;
                        e.velocity.set(0, 0, 0);
                        e.reloadTimer -= dt;
                        if (e.reloadTimer <= 0) {
                            e.ammoInMag = e.arch.weaponProfile === 'sniper' ? 5 : 24;
                            e.state = STATE.ENGAGE;
                            e.isCrouching = false;
                        }
                        break;
                    }

                    case STATE.ENGAGE:
                    default: {
                        e.isCrouching = los.dist > 26 && e.arch.id === 'sniper';
                        e.targetYaw = Math.atan2(
                            e.lastKnownPlayerPos.x - e.position.x,
                            e.lastKnownPlayerPos.z - e.position.z
                        );

                        // 維持最佳作戰距離（太遠推進、太近後撤、適中橫向走位）
                        const idealMin = e.arch.id === 'sniper' ? 24 : (e.arch.id === 'heavy' ? 8 : 13);
                        const idealMax = e.arch.id === 'sniper' ? 42 : (e.arch.id === 'heavy' ? 18 : 26);

                        if (los.dist > idealMax) {
                            moveEnemyToward(e, e.lastKnownPlayerPos, e.arch.moveSpeed, dt);
                        } else if (los.dist < idealMin) {
                            const retreatPos = e.position.clone()
                                .sub(e.lastKnownPlayerPos)
                                .setY(0)
                                .normalize()
                                .multiplyScalar(5)
                                .add(e.position);
                            moveEnemyToward(e, retreatPos, e.arch.moveSpeed * 0.78, dt);
                        } else {
                            // 戰術橫移閃避玩家準星
                            _vToPlayer.copy(playerPos).sub(e.position).setY(0).normalize();
                            _vRight.crossVectors(_vToPlayer, _vUp).multiplyScalar(e.flankSide * 3.5);
                            moveEnemyToward(e, e.position.clone().add(_vRight), e.arch.moveSpeed * 0.65, dt);
                        }

                        if (los.visible) {
                            handleBurstShooting(e, playerPos, dt, nowSec, false);
                        }
                        break;
                    }
                }

                updateEnemyAnimation(e, dt);
            }
        }

        function handleBurstShooting(enemy, aimPos, dt, nowSec, suppressMode) {
            enemy.fireTimer -= dt;
            if (enemy.fireTimer > 0) return;

            if (enemy.burstLeft <= 0) {
                const minB = enemy.arch.burstMin;
                const maxB = enemy.arch.burstMax;
                enemy.burstLeft = minB + Math.floor(Math.random() * (maxB - minB + 1));
            }

            executeEnemyFire(enemy, aimPos, nowSec, suppressMode);
            enemy.burstLeft--;

            if (enemy.burstLeft <= 0) {
                enemy.fireTimer = enemy.arch.burstCooldown * (0.8 + Math.random() * 0.45);
            } else {
                enemy.fireTimer = enemy.arch.fireRate;
            }
        }

        function getHitboxes() {
            const list = [];
            for (let i = 0; i < ctx.enemies.length; i++) {
                const e = ctx.enemies[i];
                if (e.state === STATE.DEAD) continue;
                for (let j = 0; j < e.meshRig.hitboxes.length; j++) {
                    list.push(e.meshRig.hitboxes[j]);
                }
            }
            return list;
        }

        function getAliveCount() {
            let n = 0;
            for (let i = 0; i < ctx.enemies.length; i++) {
                if (ctx.enemies[i].state !== STATE.DEAD) n++;
            }
            return n;
        }

        function clearAll() {
            for (let i = 0; i < ctx.enemies.length; i++) {
                if (ctx.scene) ctx.scene.remove(ctx.enemies[i].meshRig.root);
            }
            ctx.enemies.length = 0;
            ctx.waveRemainingToSpawn = 0;
        }

        return {
            init,
            update,
            spawnEnemy,
            startWave,
            receiveHit,
            applyExplosionDamage,
            getHitboxes,
            getAliveCount,
            getEnemies: () => ctx.enemies,
            getWaveInfo: () => ({
                wave: ctx.wave,
                alive: getAliveCount(),
                remainingToSpawn: ctx.waveRemainingToSpawn
            }),
            clearAll
        };
    })();


    // ========================================================================

        function setOverlay(visible, title, desc, btnText) {
            if (!el.overlay) return;
            el.overlay.classList.toggle('hidden', !visible);
            if (title) el.overlayTitle.textContent = title;
            if (desc) el.overlayDesc.innerHTML = desc;
            if (btnText) el.overlayBtn.textContent = btnText;

        function updateCombatState(data) {
            if (!el.weaponName) return;
            el.weaponName.textContent = data.weaponName;
            el.ammoMag.textContent = data.ammoInMag;
            el.ammoRes.textContent = data.ammoReserve;
            el.ammoMag.style.color = data.ammoInMag <= Math.ceil(data.magSize * 0.25) ? '#ff5252' : '#f4f8fc';

            el.slotChips.forEach(chip => {
                chip.classList.toggle('active', chip.dataset.slot === data.weaponId);
            });

            // 3 片獨立陶瓷護甲條更新 (每片 50 AP)
            el.apText.textContent = data.armor;
            el.platesSpare.textContent = data.platesSpare;
            for (let i = 0; i < 3; i++) {
                const segVal = THREE.MathUtils.clamp(data.armor - i * 50, 0, 50);
                el.plates[i].style.width = `${(segVal / 50) * 100}%`;
            }

            // 換彈或插板中央進度條
            if (data.reloading) {
                el.actionWrap.style.opacity = '1';
                el.actionLabel.textContent = '更換彈匣中...';
                el.actionFill.style.background = '#ffba42';
                el.actionFill.style.width = `${Math.round(data.reloadProgress * 100)}%`;
            } else if (data.insertingPlate) {
                el.actionWrap.style.opacity = '1';
                el.actionLabel.textContent = '插入陶瓷護甲板...';
                el.actionFill.style.background = '#47d9ff';
                el.actionFill.style.width = `${Math.round(data.plateProgress * 100)}%`;
            } else {
                el.actionWrap.style.opacity = '0';
            }

            // 依武器散佈值更新目標準星擴張像素
            fx.currentSpreadPx = THREE.MathUtils.clamp(6 + data.spread * 620, 6, 62);
        }

        function updatePlayerVitals(hp, maxHp, isADS) {
            if (!el.hpFill) return;
            const pct = THREE.MathUtils.clamp((hp / Math.max(1, maxHp)) * 100, 0, 100);
            el.hpFill.style.width = `${pct}%`;
            el.hpText.textContent = Math.ceil(hp);

        function showHitmarker(type = 'body') {
            if (!el.hitmarker) return;
            fx.hitmarkerType = type;
            fx.hitmarkerTimer = type.includes('kill') || type === 'armor_break' ? 0.24 : 0.14;

            let color = '#ffffff';
            if (type === 'headshot' || type === 'headshot_kill') color = '#ffcc29';
            else if (type === 'kill') color = '#ff3b3b';
            else if (type === 'armor' || type === 'armor_break') color = '#38d9ff';

            const bars = el.hitmarker.querySelectorAll('span');
            bars.forEach(b => { b.style.background = color; });
            el.hitmarker.style.opacity = '1';
            el.hitmarker.style.transform = `translate(-50%, -50%) scale(${type === 'headshot_kill' ? 1.35 : 1.05})`;
        }

        function showDamageDirection(attackerWorldPos, intensity = 0.6) {
            if (!el.dmgRing) return;
            fx.vignetteAlpha = Math.min(0.95, fx.vignetteAlpha + intensity);

            const arc = document.createElement('div');
            arc.className = 'hud-dmg-arc';
            el.dmgRing.appendChild(arc);

            fx.damageIndicators.push({
                worldPos: attackerWorldPos.clone(),
                timer: 0,
                maxTimer: 1.15,
                domEl: arc
            });
        }

        function pushKillfeed(weaponName, targetLabel, isHeadshot = false, bonusScore = 100) {
            if (!el.killfeed) return;
            const item = document.createElement('div');
            item.className = `hud-kf-item${isHeadshot ? ' headshot' : ''}`;
            const tag = isHeadshot ? '<span style="color:#ffd24c;font-weight:700">[爆頭]</span> ' : '';
            item.innerHTML = `<span style="color:#8cd8ff">${weaponName || '武器'}</span> ${tag}擊殺 <strong>${targetLabel}</strong> <span style="color:#78f0a0">+${bonusScore}</span>`;
            el.killfeed.prepend(item);

            while (el.killfeed.children.length > 5) {
                el.killfeed.lastChild.remove();
            }
            setTimeout(() => {
                if (item.parentNode) item.remove();
            }, 4200);
        }

        function showBanner(text, duration = 2.6) {
            if (!el.banner) return;
            el.banner.textContent = text;
            el.banner.style.opacity = '1';
            fx.bannerTimer = duration;
        }

        // 即時繪製旋轉式戰術小地圖雷達（玩家扇形視野 / 建築掩體 / 油桶 / 敵軍紅點）
        function renderRadar(playerPos, playerYaw, obstacles, barrels, enemies, nowSec) {
            if (!radarCtx) return;
            const w = radarCanvas.width;
            const h = radarCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const range = 45;
            const scale = (w * 0.46) / range;

            radarCtx.clearRect(0, 0, w, h);

            // 背景同心測距圓與十字線
            radarCtx.strokeStyle = 'rgba(100, 195, 240, 0.16)';
            radarCtx.lineWidth = 1;
            [0.33, 0.66, 0.96].forEach(r => {
                radarCtx.beginPath();
                radarCtx.arc(cx, cy, cx * r, 0, Math.PI * 2);
                radarCtx.stroke();
            });
            radarCtx.beginPath();
            radarCtx.moveTo(cx, 6); radarCtx.lineTo(cx, h - 6);
            radarCtx.moveTo(6, cy); radarCtx.lineTo(w - 6, cy);
            radarCtx.stroke();

            // 玩家視錐扇形
            radarCtx.fillStyle = 'rgba(92, 225, 255, 0.14)';
            radarCtx.beginPath();
            radarCtx.moveTo(cx, cy);
            radarCtx.arc(cx, cy, cx * 0.85, -Math.PI * 0.72, -Math.PI * 0.28);
            radarCtx.closePath();
            radarCtx.fill();

            const cosY = Math.cos(playerYaw);
            const sinY = Math.sin(playerYaw);

            // 世界座標轉為「玩家面朝上方」之雷達平面座標
            const toRadar = (wx, wz) => {
                const dx = wx - playerPos.x;
                const dz = wz - playerPos.z;
                const rx = dx * cosY - dz * sinY;
                const ry = dx * sinY + dz * cosY;
                return { x: cx + rx * scale, y: cy + ry * scale };
            };

            // 繪製地圖掩體方塊
            radarCtx.fillStyle = 'rgba(130, 165, 190, 0.35)';
            for (let i = 0; i < obstacles.length; i++) {
                const ob = obstacles[i];
                const pt = toRadar(ob.x, ob.z);
                if (pt.x < -12 || pt.x > w + 12 || pt.y < -12 || pt.y > h + 12) continue;
                const sz = Math.max(3, (ob.radius || 2) * scale);
                radarCtx.fillRect(pt.x - sz * 0.5, pt.y - sz * 0.5, sz, sz);
            }

            // 繪製未爆油桶（橘色菱形）
            radarCtx.fillStyle = '#ff9838';
            for (let i = 0; i < barrels.length; i++) {
                const b = barrels[i];
                if (b.exploded) continue;
                const pt = toRadar(b.position.x, b.position.z);
                if (Math.hypot(pt.x - cx, pt.y - cy) > cx - 6) continue;
                radarCtx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
            }

            // 繪製敵軍（開火或警戒時高亮紅點，狙擊手帶外框）
            for (let i = 0; i < enemies.length; i++) {
                const e = enemies[i];
                if (e.state === 'DEAD') continue;
                const pt = toRadar(e.position.x, e.position.z);
                const distFromCenter = Math.hypot(pt.x - cx, pt.y - cy);
                const clampedR = Math.min(distFromCenter, cx - 7);
                const ang = Math.atan2(pt.y - cy, pt.x - cx);
                const drawX = cx + Math.cos(ang) * clampedR;
                const drawY = cy + Math.sin(ang) * clampedR;

                const recentlyFired = (nowSec - e.lastFiredTime) < 2.2;
                radarCtx.fillStyle = recentlyFired ? '#ff2a2a' : (e.alerted ? '#ff6a4d' : 'rgba(255, 140, 120, 0.55)');
                radarCtx.beginPath();
                radarCtx.arc(drawX, drawY, recentlyFired ? 4.2 : 3.2, 0, Math.PI * 2);
                radarCtx.fill();
            }

            // 繪製正北方向指針 N
            const northX = cx + Math.sin(playerYaw) * (cx - 10);
            const northY = cy - Math.cos(playerYaw) * (cy - 10);
            radarCtx.fillStyle = '#ffd166';
            radarCtx.font = 'bold 10px sans-serif';
            radarCtx.textAlign = 'center';
            radarCtx.textBaseline = 'middle';
            radarCtx.fillText('N', northX, northY);

            // 玩家自身箭頭
            radarCtx.fillStyle = '#6cf0ff';
            radarCtx.beginPath();
            radarCtx.moveTo(cx, cy - 5.5);
            radarCtx.lineTo(cx - 4.5, cy + 4.5);
            radarCtx.lineTo(cx, cy + 2.2);
            radarCtx.lineTo(cx + 4.5, cy + 4.5);
            radarCtx.closePath();
            radarCtx.fill();
        }

        function update(dt, player, camera, radarData, nowSec) {
            if (!rootEl) return;

            // 1. 動態準星開合動畫
            const gap = Math.round(fx.currentSpreadPx);
            el.chTop.style.bottom = `${gap}px`;
            el.chBottom.style.top = `${gap}px`;
            el.chLeft.style.right = `${gap}px`;
            el.chRight.style.left = `${gap}px`;

            // 2. Hitmarker 淡出
            if (fx.hitmarkerTimer > 0) {
                fx.hitmarkerTimer -= dt;
                if (fx.hitmarkerTimer <= 0) {
                    el.hitmarker.style.opacity = '0';
                }
            }

            // 3. 受擊血霧邊框與 3D 方向指示器角度實時更新
            const lowHpFloor = player.hp < 35 ? (1 - player.hp / 35) * 0.48 : 0;
            fx.vignetteAlpha = Math.max(lowHpFloor, fx.vignetteAlpha - dt * 1.35);
            el.vignette.style.opacity = fx.vignetteAlpha.toFixed(3);

            // 血條白色扣血尾跡
            const hpPct = THREE.MathUtils.clamp((player.hp / Math.max(1, player.maxHp)) * 100, 0, 100);
            fx.hpTrail += (hpPct - fx.hpTrail) * Math.min(1, dt * 4.5);
            el.hpTrail.style.width = `${fx.hpTrail}%`;

            for (let i = fx.damageIndicators.length - 1; i >= 0; i--) {
                const ind = fx.damageIndicators[i];
                ind.timer += dt;
                if (ind.timer >= ind.maxTimer) {
                    ind.domEl.remove();
                    fx.damageIndicators.splice(i, 1);
                    continue;
                }
                const dx = ind.worldPos.x - player.position.x;
                const dz = ind.worldPos.z - player.position.z;
                const worldAngle = Math.atan2(dx, -dz);
                const relAngle = worldAngle + player.yaw;
                ind.domEl.style.transform = `rotate(${relAngle}rad)`;
                ind.domEl.style.opacity = (1 - ind.timer / ind.maxTimer).toFixed(3);
            }

            // 4. 頂部戰術橫幅淡出
            if (fx.bannerTimer > 0) {
                fx.bannerTimer -= dt;
                if (fx.bannerTimer <= 0) {
                    el.banner.style.opacity = '0';
                }
            }

            // 5. 更新雷達小地圖
            if (radarData) {
                renderRadar(
                    player.position,
                    player.yaw,
                    radarData.obstacles || [],
                    radarData.barrels || [],
                    radarData.enemies || [],
                    nowSec
                );
            }
        }

        return {
            init,
            update,
            setOverlay,
            updateCombatState,
            updatePlayerVitals,
            updateScoreboard,
            showHitmarker,
            showDamageDirection,
            pushKillfeed,
            showBanner
        };
    })();


    // ========================================================================
    // 模組 17：主遊戲循環、場景初始化總管與各模組訊號串接入口 (GameMain)
    // ========================================================================
    const GameMain = (() => {
        const game = {
            initialized: false,
            running: false,
            paused: true,
            gameOver: false,

            scene: null,
            camera: null,
            renderer: null,
            clock: null,
            elapsedSec: 0,

            kills: 0,
            score: 0,
            waveClearDelay: 0,

            // 玩家物理與第一人稱鏡頭狀態
            player: {
                position: new THREE.Vector3(0, 0, 26),
                velocity: new THREE.Vector3(),
                yaw: 0,
                pitch: 0,
                eyeHeight: 1.68,
                currentEyeHeight: 1.68,
                hp: 100,
                maxHp: 100,
                isGrounded: true,
                isSprinting: false,
                isCrouching: false,
                isSliding: false,
                slideTimer: 0,
                slideCooldown: 0,
                slideDir: new THREE.Vector3(),
                isADS: false,
                footstepDist: 0,
                bobPhase: 0
            },

            // 第一人稱持槍模型與鏡頭震動狀態
            viewModel: {
                group: null,
                basePos: new THREE.Vector3(0.24, -0.22, -0.45),
                adsPos: new THREE.Vector3(0.0, -0.155, -0.34),
                kickZ: 0,
                kickPitch: 0,
                swayX: 0,

            },
