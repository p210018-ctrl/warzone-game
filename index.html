            let hpDamage = rawDamage;
            let armorBroken = false;

            if (a.current > 0 && !isHeadshot) {
                // 護甲吸收比例依穿甲值決定，最低吸收 35%，最高 72%
                const absorbRatio = THREE.MathUtils.clamp(1.0 - armorPen * 0.65, 0.35, 0.72);
                const absorbed = Math.min(a.current, rawDamage * absorbRatio);
                a.current = Math.max(0, a.current - absorbed);
                hpDamage = Math.max(2, rawDamage - absorbed * 0.85);

                if (a.current <= 0) {
                    armorBroken = true;
                    AudioEngine.playArmorBreak(p.position, true);
                    if (state.onCameraShake) state.onCameraShake(0.45, 0.25);
                } else {
                    AudioEngine.playHitmarker('armor_self');
                }
            }

            p.hp = Math.max(0, (p.hp ?? 100) - hpDamage);
            syncHUD();
            return { hpDamage, armorBroken, remainingArmor: a.current, remainingHp: p.hp };
        }

        // 計算當前動態精準度散布角（站姿 / 移動 / 跳躍 / 開鏡 / 連射膨脹）
        function computeCurrentSpread(spec) {
            const p = state.player;
            let base = p.isADS ? spec.adsSpread : spec.hipSpread;
            const horizSpeed = Math.hypot(p.velocity?.x || 0, p.velocity?.z || 0);

            if (horizSpeed > 0.6) {
                const moveFactor = THREE.MathUtils.clamp(horizSpeed / 6.5, 0, 1.4);
                base *= (1 + moveFactor * (spec.moveSpreadMult - 1));
            }
            if (p.isCrouching && !p.isADS) base *= 0.72;
            if (p.isGrounded === false) base *= 2.6;

            return base + state.bloomSpread;
        }

        // 計算槍口世界座標與拋殼口世界座標
        function computeMuzzleAndEject(outMuzzle, outEject) {
            const cam = state.camera;
            cam.updateMatrixWorld();
            _vDir.set(0, 0, -1).applyQuaternion(cam.quaternion).normalize();
            _vRight.set(1, 0, 0).applyQuaternion(cam.quaternion).normalize();
            _vUp.set(0, 1, 0).applyQuaternion(cam.quaternion).normalize();

            const isADS = !!state.player.isADS;
            const sideOffset = isADS ? 0.0 : 0.22;
            const downOffset = isADS ? -0.06 : -0.14;

            outMuzzle.copy(cam.position)
                .addScaledVector(_vDir, 0.78)
                .addScaledVector(_vRight, sideOffset)
                .addScaledVector(_vUp, downOffset);

            outEject.copy(cam.position)
                .addScaledVector(_vDir, 0.42)
                .addScaledVector(_vRight, sideOffset + 0.08)
                .addScaledVector(_vUp, downOffset + 0.03);
        }

        // 執行一次開火（生成物理彈道、後座力曲線、曳光彈、彈殼、槍聲）
        function fireOnce(nowSec) {
            const w = getActiveWeapon();
            if (!w) return;
            const spec = w.spec;

            // 霰彈槍逐發裝填時允許按開火即時打斷射擊
            if (state.reloading) {
                if (spec.shellByShell && w.ammoInMag > 0) {
                    cancelReload();
                } else {
                    return;
                }
            }
            if (state.armor.inserting) {
                cancelArmorPlate();
            }

            if (w.ammoInMag <= 0) {
                AudioEngine.playReloadStep('dry_fire', spec.soundProfile);
                state.fireCooldown = 0.22;
                startReload();
                return;
            }

            w.ammoInMag--;
            state.fireCooldown = 60 / spec.rpm;

            // 連射計數器（決定後座力 S 型曲線與散布膨脹）
            if (nowSec - state.lastShotTime > 0.35) {
                state.sustainedShots = 0;
            }
            state.sustainedShots++;
            state.lastShotTime = nowSec;

            // 1. 計算後座力曲線（首發較穩，第 3~12 發爬升最劇，左右呈阻尼正弦擺動）
            const shotIdx = state.sustainedShots;
            const adsMult = state.player.isADS ? 0.68 : 1.0;
            const crouchMult = state.player.isCrouching ? 0.78 : 1.0;
            const climbCurve = shotIdx === 1 ? 0.78 : (1.0 + Math.min(shotIdx, 10) * 0.045);

            const pitchImpulse = spec.recoilPitch * climbCurve * adsMult * crouchMult;
            const yawWave = Math.sin(shotIdx * spec.recoilPatternFreq) * 0.65 + (Math.random() - 0.5) * 0.7;
            const yawImpulse = spec.recoilYaw * yawWave * adsMult * crouchMult;

            state.recoilPitchTarget = Math.min(0.42, state.recoilPitchTarget + pitchImpulse);
            state.recoilYawTarget = THREE.MathUtils.clamp(state.recoilYawTarget + yawImpulse, -0.22, 0.22);
            state.visualKickZ = Math.min(0.22, state.visualKickZ + spec.recoilKickZ);
            state.bloomSpread = Math.min(0.085, state.bloomSpread + spec.recoilPitch * 0.45);

            // 通知第一人稱持槍模型與鏡頭震動
            if (state.onWeaponKick) {
                state.onWeaponKick(spec.recoilKickZ, pitchImpulse, yawImpulse);
            }
            if (state.onCameraShake) {
                state.onCameraShake(spec.soundProfile === 'sniper' ? 0.22 : 0.055, 0.09);
            }

            // 2. 計算槍口位置與拋殼位置
            computeMuzzleAndEject(_vMuzzle, _vEject);
            const spread = computeCurrentSpread(spec);

            // 3. 產生實體彈道子彈（支援霰彈多顆彈丸）
            for (let i = 0; i < spec.pellets; i++) {
                _vDir.set(0, 0, -1).applyQuaternion(state.camera.quaternion).normalize();

                // 高斯近似圓形散布
                const r = spread * Math.sqrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                _vDir.addScaledVector(_vRight, Math.cos(theta) * r);
                _vDir.addScaledVector(_vUp, Math.sin(theta) * r);
                _vDir.normalize();

                // 彈道起點自攝影機中心發出（保證準星所見即所得），曳光視覺由槍口連往彈道
                const proj = {
                    active: true,
                    origin: state.camera.position.clone(),
                    pos: state.camera.position.clone(),
                    visualStart: _vMuzzle.clone(),
                    vel: _vDir.clone().multiplyScalar(spec.muzzleVelocity),
                    spec: spec,
                    traveled: 0,
                    maxRange: spec.rangeDropEnd * 1.8,
                    life: 0,
                    maxLife: 2.5,
                    tracerSpawned: false
                };
                state.projectiles.push(proj);
            }

            // 4. 觸發次世代視覺特效（槍口火焰 + 旋轉黃銅彈殼）
            if (typeof VFX !== 'undefined') {
                VFX.spawnMuzzleFlash(_vMuzzle, _vDir, spec.suppressed);
                const shellType = spec.soundProfile === 'shotgun' ? 'shotgun'
                    : (spec.soundProfile === 'sniper' ? 'heavy' : 'brass');
                VFX.spawnShellCasing(_vEject, _vRight, _vUp, state.player.velocity, shellType);
            }

            // 5. 觸發程序化 3D 軍武槍聲
            if (typeof AudioEngine !== 'undefined') {
                AudioEngine.playGunshot(spec.soundProfile, _vMuzzle, spec.suppressed, true);
            }

            syncHUD();
        }

        // 推進所有飛行中子彈（重力下墜 + 空氣阻力 + 連續射線防穿牆檢測）
        function updateProjectiles(dt) {
            if (state.projectiles.length === 0) return;

            const worldMeshes = state.getWorldMeshes() || [];
            const enemyMeshes = state.getEnemyHitboxes() || [];
            const explosiveMeshes = state.getExplosives() || [];
            const targets = [...enemyMeshes, ...explosiveMeshes, ...worldMeshes];

            for (let i = state.projectiles.length - 1; i >= 0; i--) {
                const p = state.projectiles[i];
                p.life += dt;
                if (p.life >= p.maxLife || p.traveled >= p.maxRange) {
                    state.projectiles.splice(i, 1);
                    continue;
                }

                // 彈道物理積分（重力 + 空氣阻力）
                const speed = p.vel.length();
                const drag = Math.max(0.1, 1.0 - AIR_DRAG * speed * dt);
                p.vel.multiplyScalar(drag);
                p.vel.y -= GRAVITY * dt;

                _vStep.copy(p.vel).multiplyScalar(dt);
                const stepLen = _vStep.length();
                _vNext.copy(p.pos).add(_vStep);

                // 射線檢測本幀彈道線段
                state.raycaster.set(p.pos, _vStep.clone().normalize());
                state.raycaster.near = 0;
                state.raycaster.far = stepLen;

                const hits = targets.length > 0 ? state.raycaster.intersectObjects(targets, true) : [];

                if (hits.length > 0) {
                    const hit = hits[0];
                    const hitDist = p.traveled + hit.distance;

                    // 生成自槍口至命中點的曳光彈軌跡
                    if (typeof VFX !== 'undefined') {
                        const startPos = p.tracerSpawned ? p.pos : p.visualStart;
                        VFX.spawnTracer(startPos, hit.point, p.spec.suppressed);
                    }

                    resolveHit(p, hit, hitDist);
                    state.projectiles.splice(i, 1);
                    continue;
                }

                // 飛行首幀即發射可見曳光段
                if (!p.tracerSpawned && typeof VFX !== 'undefined') {
                    VFX.spawnTracer(p.visualStart, _vNext, p.spec.suppressed);
                    p.tracerSpawned = true;
                }

                p.pos.copy(_vNext);
                p.traveled += stepLen;
            }
        }

        // 解析命中目標（敵人部位 / 爆炸油桶 / 牆體材質）
        function resolveHit(proj, hit, distance) {
            const spec = proj.spec;
            const obj = hit.object;
            const ud = obj.userData || {};
            const normal = hit.face
                ? hit.face.normal.clone().transformDirection(obj.matrixWorld).normalize()
                : new THREE.Vector3(0, 1, 0);

            // 距離傷害衰減計算
            let falloff = 1.0;
            if (distance > spec.rangeDropStart) {
                const t = THREE.MathUtils.clamp(
                    (distance - spec.rangeDropStart) / Math.max(1, spec.rangeDropEnd - spec.rangeDropStart),
                    0, 1
                );
                falloff = THREE.MathUtils.lerp(1.0, spec.minDamageMult, t);
            }

            // 情況 A：命中敵人（區分 head / chest / limb 與護甲狀態）
            if (ud.isEnemy || ud.enemyRef) {
                const zone = ud.hitboxZone || 'chest';
                const isHead = zone === 'head';
                const zoneMult = isHead ? spec.headMult : (zone === 'limb' ? 0.75 : 1.0);
                const finalDamage = Math.round(spec.damage * falloff * zoneMult);

                let hitOutcome = { killed: false, armorBroken: false, armored: false };
                if (state.onHitEnemy) {
                    const res = state.onHitEnemy(ud.enemyRef || obj, {
                        damage: finalDamage,
                        armorPen: spec.armorPen,
                        zone,
                        isHeadshot: isHead,
                        point: hit.point,
                        normal,
                        direction: proj.vel.clone().normalize()
                    });
                    if (res) hitOutcome = res;
                }

                // 特效與清脆音效回饋
                if (typeof VFX !== 'undefined') {
                    VFX.spawnImpact(hit.point, normal, hitOutcome.armored ? 'armor' : 'flesh');
                }
                if (typeof AudioEngine !== 'undefined') {
                    if (hitOutcome.armorBroken) {
                        AudioEngine.playArmorBreak(hit.point, false);
                    }
                    if (isHead) {
                        AudioEngine.playHitmarker(hitOutcome.killed ? 'headshot_kill' : 'headshot');
                    } else if (hitOutcome.killed) {
                        AudioEngine.playHitmarker('kill');
                    } else if (hitOutcome.armored) {
                        AudioEngine.playHitmarker('armor');
                    } else {
                        AudioEngine.playHitmarker('body');
                    }
                }
                return;
            }

            // 情況 B：命中場景爆炸油桶 / 可引爆物件
            if (ud.isExplosive || ud.barrelRef) {
                if (typeof VFX !== 'undefined') {
                    VFX.spawnImpact(hit.point, normal, 'metal');
                }
                if (typeof AudioEngine !== 'undefined') {
                    AudioEngine.playImpact('metal', hit.point);
                }
                if (state.onHitExplosive) {
                    state.onHitExplosive(ud.barrelRef || obj, spec.damage * falloff, hit.point);
                }
                return;
            }

            // 情況 C：命中一般地圖建築 / 掩體 / 地面
            const matType = ud.surfaceType || 'concrete';
            if (typeof VFX !== 'undefined') {
                VFX.spawnImpact(hit.point, normal, matType);
                VFX.spawnBulletHole(hit.point, normal, matType, obj);
            }
            if (typeof AudioEngine !== 'undefined') {
                AudioEngine.playImpact(matType, hit.point);
            }
        }

        // 更新換彈與護甲插板進度條
        function updateReloadAndArmor(dt) {
            // 1. 換彈狀態推進
            if (state.reloading) {
                const w = getActiveWeapon();
                state.reloadTimer += dt;
                const progress = state.reloadTimer / state.reloadDuration;

                if (!w.spec.shellByShell) {
                    if (state.reloadStage === 1 && progress >= 0.48) {
                        state.reloadStage = 2;
                        AudioEngine.playReloadStep('mag_in', w.spec.soundProfile);
                    } else if (state.reloadStage === 2 && progress >= 0.80 && w.ammoInMag === 0) {
                        state.reloadStage = 3;
                        AudioEngine.playReloadStep('bolt_rack', w.spec.soundProfile);
                    }
                }

                if (state.reloadTimer >= state.reloadDuration) {
                    if (w.spec.shellByShell) {
                        // 霰彈槍逐發裝填
                        w.ammoInMag++;
                        w.ammoReserve--;
                        if (w.ammoInMag < w.spec.magSize && w.ammoReserve > 0) {
                            state.reloadTimer = 0;
                            AudioEngine.playReloadStep('shell_in', w.spec.soundProfile);
                        } else {
                            AudioEngine.playReloadStep('bolt_rack', w.spec.soundProfile);
                            cancelReload();
                        }
                    } else {
                        const needed = w.spec.magSize - w.ammoInMag;
                        const taken = Math.min(needed, w.ammoReserve);
                        w.ammoInMag += taken;
                        w.ammoReserve -= taken;
                        cancelReload();
                    }
                    syncHUD();
                }
            }

            // 2. 戰術護甲插板推進
            const a = state.armor;
            if (a.inserting) {
                a.insertTimer += dt;
                const prog = a.insertTimer / a.insertDuration;

                if (a.insertStage === 1 && prog >= 0.55) {
                    a.insertStage = 2;
                    AudioEngine.playArmorPlate('insert');
                }

                if (a.insertTimer >= a.insertDuration) {
                    // 補滿當前破損插板格（以 50 AP 為單位向上對齊，或直接補滿一片）
                    const nextSlotCap = Math.min(a.max, (Math.floor(a.current / a.plateValue) + 1) * a.plateValue);
                    a.current = nextSlotCap;
                    a.platesSpare = Math.max(0, a.platesSpare - 1);
                    AudioEngine.playArmorPlate('lock');

                    // 若護甲未滿且還有備用插板，自動續插下一片
                    if (a.current < a.max && a.platesSpare > 0) {
                        a.insertTimer = 0;
                        a.insertStage = 1;
                        AudioEngine.playArmorPlate('open');
                    } else {
                        a.inserting = false;
                        a.insertTimer = 0;
                        a.insertStage = 0;
                    }
                    syncHUD();
                }
            }
        }

        // 平滑套用後座力彈簧與回彈補償（每幀回傳應施加到攝影機的增量）
        function updateRecoil(dt) {
            const w = getActiveWeapon();
            const recSpeed = w ? w.spec.recoilRecovery : 9.0;
            const prevPitch = state.recoilPitchCurrent;
            const prevYaw = state.recoilYawCurrent;

            // 目標後座力自動向 0 衰減（回正）
            const decay = Math.exp(-recSpeed * dt);
            state.recoilPitchTarget *= decay;
            state.recoilYawTarget *= decay;

            // 當前角度高速追蹤目標角度（形成銳利上跳 + 順滑下壓）
            const snap = 1.0 - Math.exp(-28.0 * dt);
            state.recoilPitchCurrent += (state.recoilPitchTarget - state.recoilPitchCurrent) * snap;
            state.recoilYawCurrent += (state.recoilYawTarget - state.recoilYawCurrent) * snap;

            state.visualKickZ *= Math.exp(-16.0 * dt);
            state.bloomSpread = Math.max(0, state.bloomSpread - dt * 0.085);

            return {
                deltaPitch: state.recoilPitchCurrent - prevPitch,
                deltaYaw: state.recoilYawCurrent - prevYaw,
                kickZ: state.visualKickZ
            };
        }

        function syncHUD() {
            if (!state.onHUDUpdate) return;
            const w = getActiveWeapon();
            state.onHUDUpdate({
                weaponName: w ? w.spec.name : '',
                weaponId: state.activeSlot,
                ammoInMag: w ? w.ammoInMag : 0,
                magSize: w ? w.spec.magSize : 0,
                ammoReserve: w ? w.ammoReserve : 0,
                reloading: state.reloading,
                reloadProgress: state.reloading ? Math.min(1, state.reloadTimer / Math.max(0.01, state.reloadDuration)) : 0,
                armor: Math.round(state.armor.current),
                armorMax: state.armor.max,
                platesSpare: state.armor.platesSpare,
                insertingPlate: state.armor.inserting,
                plateProgress: state.armor.inserting ? Math.min(1, state.armor.insertTimer / state.armor.insertDuration) : 0,
                spread: w ? computeCurrentSpread(w.spec) : 0.02
            });
        }

        function update(dt, nowSec) {
            if (state.fireCooldown > 0) state.fireCooldown -= dt;

            const w = getActiveWeapon();
            if (w && state.fireCooldown <= 0) {
                const isAuto = w.spec.fireMode === 'auto';
                if ((isAuto && state.triggerHeld) || (!isAuto && state.triggerJustPressed)) {
                    fireOnce(nowSec);
                }
            }
            state.triggerJustPressed = false;

            updateReloadAndArmor(dt);
            updateProjectiles(dt);
            const recoilDelta = updateRecoil(dt);

            if (state.reloading || state.armor.inserting) {
                syncHUD();
            }
            return recoilDelta;
        }

        function addAmmoAndPlates(ammoRatio = 0.5, plates = 2) {
            for (const key of Object.keys(state.weapons)) {
                const w = state.weapons[key];
                w.ammoReserve = Math.min(w.spec.reserveMax, w.ammoReserve + Math.ceil(w.spec.magSize * 2 * ammoRatio));
            }
            state.armor.platesSpare = Math.min(state.armor.platesMaxCarry, state.armor.platesSpare + plates);
            syncHUD();
        }

        return {
            init,
            update,
            setTrigger,
            switchWeapon,
            startReload,
            cancelReload,
            startArmorPlate,
            cancelArmorPlate,
            applyPlayerDamage,
            addAmmoAndPlates,
            getActiveWeapon,
            getState: () => state
        };
    })();


    // ========================================================================
    // 模組 13：次世代戰場粒子特效系統 (VFX)
    //   - 曳光彈 / 旋轉黃銅彈殼 / 牆面彈孔 / 火花煙塵 / 槍口火焰 / 油桶爆炸衝擊波
    // ========================================================================
    const VFX = (() => {
        let scene = null;
        let onCameraShake = null;

        const MAX_DECALS = 90;
        const MAX_CASINGS = 48;
        const MAX_PARTICLES = 320;

        const tracers = [];
        const casings = [];
        const decals = [];
        const particles = [];
        const shockwaves = [];
        const flashLights = [];

        // 共用幾何體與程序化貼圖快取（大幅降低 Draw Call 負擔與記憶體抖動）
        const geo = {};
        const mat = {};
        let muzzleFlashMesh = null;
        let muzzleFlashLight = null;
        let muzzleFlashTimer = 0;

        const _up = new THREE.Vector3(0, 1, 0);
        const _tmpVec = new THREE.Vector3();
        const _tmpQuat = new THREE.Quaternion();

        // 程序化繪製高細節貼圖（彈孔焦痕 / 軟邊煙霧 / 星芒火光）
        function createRadialTexture(type) {
            const size = 128;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const half = size / 2;

            if (type === 'bullet_concrete' || type === 'bullet_metal') {
                // 外圈燒灼煙燻
                const grad = ctx.createRadialGradient(half, half, 4, half, half, half * 0.85);
                grad.addColorStop(0.0, 'rgba(8, 8, 8, 1.0)');
                grad.addColorStop(0.22, 'rgba(18, 16, 15, 0.96)');
                grad.addColorStop(0.45, type === 'bullet_metal' ? 'rgba(150, 160, 170, 0.55)' : 'rgba(65, 62, 58, 0.45)');
                grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);

                // 裂紋放射細節
                ctx.strokeStyle = type === 'bullet_metal' ? 'rgba(210,220,235,0.65)' : 'rgba(25,24,22,0.75)';
                ctx.lineWidth = 2;
                for (let i = 0; i < 9; i++) {
                    const ang = (i / 9) * Math.PI * 2 + (Math.random() - 0.5) * 0.4;
                    const len = 18 + Math.random() * 28;
                    ctx.beginPath();
                    ctx.moveTo(half + Math.cos(ang) * 8, half + Math.sin(ang) * 8);
                    ctx.lineTo(half + Math.cos(ang) * len, half + Math.sin(ang) * len);
                    ctx.stroke();
                }
            } else if (type === 'muzzle_star') {
                const grad = ctx.createRadialGradient(half, half, 2, half, half, half);
                grad.addColorStop(0.0, 'rgba(255, 255, 240, 1.0)');
                grad.addColorStop(0.25, 'rgba(255, 200, 85, 0.92)');
                grad.addColorStop(0.6, 'rgba(255, 95, 20, 0.35)');
                grad.addColorStop(1.0, 'rgba(255, 40, 0, 0.0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);

                // 四向十字星芒
                ctx.fillStyle = 'rgba(255, 240, 190, 0.85)';
                for (let i = 0; i < 4; i++) {
                    ctx.save();
                    ctx.translate(half, half);
                    ctx.rotate((i * Math.PI) / 4);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, half * 0.92, 5, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            } else {
                // 柔和煙霧 / 爆炸火球粒子
                const grad = ctx.createRadialGradient(half, half, 4, half, half, half);
                grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
                grad.addColorStop(0.45, 'rgba(255, 255, 255, 0.55)');
                grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, size, size);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.needsUpdate = true;
            return tex;
        }

        function init(config = {}) {
            scene = config.scene || window.scene;
            onCameraShake = config.onCameraShake || null;
            if (!scene) return;

            // 初始化共用幾何體
            geo.tracer = new THREE.CylinderGeometry(0.011, 0.005, 1, 5, 1, true);
            geo.tracer.rotateX(Math.PI / 2);

            geo.casingBrass = new THREE.CylinderGeometry(0.0065, 0.0065, 0.028, 6);
            geo.casingShotgun = new THREE.CylinderGeometry(0.011, 0.011, 0.052, 7);
            geo.decal = new THREE.PlaneGeometry(0.16, 0.16);
            geo.spark = new THREE.BoxGeometry(0.018, 0.018, 0.11);
            geo.debris = new THREE.DodecahedronGeometry(0.09, 0);
            geo.shockRing = new THREE.TorusGeometry(1.0, 0.085, 10, 40);
            geo.shockRing.rotateX(Math.PI / 2);
            geo.shockSphere = new THREE.SphereGeometry(1.0, 20, 14);
            geo.spritePlane = new THREE.PlaneGeometry(1, 1);

            // 初始化材質庫
            const texConcrete = createRadialTexture('bullet_concrete');
            const texMetal = createRadialTexture('bullet_metal');
            const texMuzzle = createRadialTexture('muzzle_star');
            const texSmoke = createRadialTexture('smoke');

            mat.decalConcrete = new THREE.MeshBasicMaterial({
                map: texConcrete, transparent: true, depthWrite: false,
                polygonOffset: true, polygonOffsetFactor: -2
            });
            mat.decalMetal = new THREE.MeshBasicMaterial({
                map: texMetal, transparent: true, depthWrite: false,
                polygonOffset: true, polygonOffsetFactor: -2
            });
            mat.brass = new THREE.MeshStandardMaterial({
                color: 0xd9a843, metalness: 0.92, roughness: 0.24
            });
            mat.shotgunShell = new THREE.MeshStandardMaterial({
                color: 0xb82222, metalness: 0.25, roughness: 0.45
            });
            mat.sparkOrange = new THREE.MeshBasicMaterial({
                color: 0xffc857, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
            });
            mat.sparkArmor = new THREE.MeshBasicMaterial({
                color: 0x38d9ff, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false
            });
            mat.blood = new THREE.MeshBasicMaterial({
                color: 0x9e1212, transparent: true, depthWrite: false
            });
            mat.smokeTex = texSmoke;

            // 槍口火焰組件（常駐複用，開火時瞬時激活）
            const flashMat = new THREE.MeshBasicMaterial({
                map: texMuzzle, transparent: true, blending: THREE.AdditiveBlending,
                depthWrite: false, side: THREE.DoubleSide
            });
            muzzleFlashMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.36), flashMat);
            muzzleFlashMesh.visible = false;
            scene.add(muzzleFlashMesh);

            muzzleFlashLight = new THREE.PointLight(0xffa447, 0, 7.5, 2.0);
            scene.add(muzzleFlashLight);
        }

        // 1. 槍口火焰與瞬時照明
        function spawnMuzzleFlash(position, direction, suppressed = false) {
            if (!muzzleFlashMesh) return;
            muzzleFlashMesh.position.copy(position);
            muzzleFlashMesh.lookAt(_tmpVec.copy(position).add(direction));
            muzzleFlashMesh.rotation.z = Math.random() * Math.PI * 2;
            const scale = suppressed ? (0.35 + Math.random() * 0.2) : (0.85 + Math.random() * 0.55);
            muzzleFlashMesh.scale.setScalar(scale);
            muzzleFlashMesh.visible = true;

            muzzleFlashLight.position.copy(position);
            muzzleFlashLight.intensity = suppressed ? 0.9 : 4.2;
            muzzleFlashTimer = suppressed ? 0.028 : 0.048;
        }

        // 2. 高速曳光彈 (Tracer Beam)
        function spawnTracer(startPos, endPos, suppressed = false) {
            if (!scene) return;
            const dist = startPos.distanceTo(endPos);
            if (dist < 0.25) return;

            const tracerMat = new THREE.MeshBasicMaterial({
                color: suppressed ? 0xaad4ff : 0xffe296,
                transparent: true,
                opacity: suppressed ? 0.42 : 0.88,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const mesh = new THREE.Mesh(geo.tracer, tracerMat);
            const segLen = Math.min(dist, suppressed ? 3.2 : 6.5);
            mesh.scale.set(1, 1, segLen);
            mesh.position.copy(startPos);
            mesh.lookAt(endPos);
            scene.add(mesh);

            const dir = endPos.clone().sub(startPos).normalize();
            tracers.push({
                mesh,
                dir,
                startPos: startPos.clone(),
                endPos: endPos.clone(),
                speed: 240,
                traveled: 0,
                totalDist: dist,
                life: 0,
                maxLife: Math.min(0.16, dist / 240 + 0.03)
            });
        }

        // 3. 旋轉黃銅彈殼 / 霰彈紅殼 (具備重力、旋轉與落地彈跳音效)
        function spawnShellCasing(origin, rightVec, upVec, inheritVel, type = 'brass') {
            if (!scene) return;
            if (casings.length >= MAX_CASINGS) {
                const oldest = casings.shift();
                scene.remove(oldest.mesh);
            }

            const isShotgun = type === 'shotgun';
            const mesh = new THREE.Mesh(
                isShotgun ? geo.casingShotgun : geo.casingBrass,
                isShotgun ? mat.shotgunShell : mat.brass
            );
            if (type === 'heavy') mesh.scale.set(1.35, 1.55, 1.35);

            mesh.position.copy(origin);
            scene.add(mesh);

            const vel = new THREE.Vector3()
                .addScaledVector(rightVec, 2.2 + Math.random() * 1.3)
                .addScaledVector(upVec, 1.4 + Math.random() * 0.9);
            if (inheritVel) vel.addScaledVector(inheritVel, 0.45);

            casings.push({
                mesh,
                vel,
                angVel: new THREE.Vector3(
                    (Math.random() - 0.5) * 28,
                    (Math.random() - 0.5) * 28,
                    (Math.random() - 0.5) * 28
                ),
                bounces: 0,
                life: 0,
                maxLife: 4.5,
                floorY: Math.max(0.015, origin.y - 1.55) // 簡易地面估算（可對接地形高度）
            });
        }

        // 4. 牆面彈孔貼花 (面向法線 + 環形隊列上限淘汰)
        function spawnBulletHole(point, normal, surfaceType = 'concrete') {
            if (!scene) return;
            if (decals.length >= MAX_DECALS) {
                const old = decals.shift();
                scene.remove(old.mesh);
            }

            const isMetal = surfaceType === 'metal';
            const mesh = new THREE.Mesh(geo.decal, isMetal ? mat.decalMetal : mat.decalConcrete);
            mesh.position.copy(point).addScaledVector(normal, 0.012);
            mesh.lookAt(_tmpVec.copy(point).add(normal));
            mesh.rotateZ(Math.random() * Math.PI * 2);
            const s = 0.75 + Math.random() * 0.55;
            mesh.scale.setScalar(s);
            scene.add(mesh);

            decals.push({ mesh, life: 0, maxLife: 28.0 });
        }

        // 5. 命中火花 / 護甲藍光碎片 / 水泥煙塵 / 血霧
        function spawnImpact(point, normal, surfaceType = 'concrete') {
            if (!scene) return;

            if (surfaceType === 'metal' || surfaceType === 'armor') {
                const count = surfaceType === 'armor' ? 14 : 10;
                const sparkMat = surfaceType === 'armor' ? mat.sparkArmor : mat.sparkOrange;
                for (let i = 0; i < count; i++) {
                    spawnParticle({
                        pos: point,
                        vel: randomHemisphereVel(normal, 4.5, 11.0),
                        mesh: new THREE.Mesh(geo.spark, sparkMat),
                        gravity: 14.0,
                        drag: 0.96,
                        life: 0.16 + Math.random() * 0.22,
                        orientToVelocity: true
                    });
                }
            } else if (surfaceType === 'flesh') {
                for (let i = 0; i < 8; i++) {
                    const pMat = new THREE.SpriteMaterial({
                        map: mat.smokeTex, color: 0xa81414, transparent: true, opacity: 0.85, depthWrite: false
                    });
                    const sp = new THREE.Sprite(pMat);
                    sp.scale.setScalar(0.18 + Math.random() * 0.22);
                    spawnParticle({
                        pos: point,
                        vel: randomHemisphereVel(normal, 1.5, 4.8),
                        mesh: sp,
                        gravity: 7.5,
                        drag: 0.92,
                        life: 0.28 + Math.random() * 0.22,
                        growRate: 1.6,
                        fadeOut: true
                    });
                }
            } else {
                // 水泥 / 牆面：碎石火花 + 灰白塵煙
                for (let i = 0; i < 5; i++) {
                    spawnParticle({
                        pos: point,
                        vel: randomHemisphereVel(normal, 2.5, 6.5),
                        mesh: new THREE.Mesh(geo.spark, mat.sparkOrange),
                        gravity: 15.0,
                        drag: 0.94,
                        life: 0.14 + Math.random() * 0.16,
                        orientToVelocity: true
                    });
                }
                for (let i = 0; i < 4; i++) {
                    const pMat = new THREE.SpriteMaterial({
                        map: mat.smokeTex, color: 0xbcb8ae, transparent: true, opacity: 0.55, depthWrite: false
                    });
                    const sp = new THREE.Sprite(pMat);
                    sp.scale.setScalar(0.24 + Math.random() * 0.25);
                    spawnParticle({
                        pos: point,
                        vel: randomHemisphereVel(normal, 0.8, 2.6),
                        mesh: sp,
                        gravity: -0.6,
                        drag: 0.92,
                        life: 0.45 + Math.random() * 0.35,
                        growRate: 2.2,
                        fadeOut: true
                    });
                }
            }
        }

        // 6. 油桶爆炸衝擊波（火球 + 升騰濃煙 + 水平衝擊波環 + 膨脹氣浪球 + 飛濺燃燒碎片 + 動態火光）
        function spawnExplosion(position, radius = 9.0) {
            if (!scene) return;

            // (A) 水平擴散衝擊波環
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xffd28a, transparent: true, opacity: 0.92,
                blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(geo.shockRing, ringMat);
            ring.position.copy(position).add(new THREE.Vector3(0, 0.25, 0));
            ring.scale.setScalar(0.4);
            scene.add(ring);
            shockwaves.push({ mesh: ring, targetScale: radius * 1.35, life: 0, maxLife: 0.42, isSphere: false });

            // (B) 球形熱浪氣壓罩
            const sphereMat = new THREE.MeshBasicMaterial({
                color: 0xff7b29, transparent: true, opacity: 0.48,
                blending: THREE.AdditiveBlending, depthWrite: false, wireframe: false
            });
            const sphere = new THREE.Mesh(geo.shockSphere, sphereMat);
            sphere.position.copy(position);
            sphere.scale.setScalar(0.6);
            scene.add(sphere);
            shockwaves.push({ mesh: sphere, targetScale: radius * 0.92, life: 0, maxLife: 0.34, isSphere: true });

            // (C) 核心爆裂火球群
            for (let i = 0; i < 18; i++) {
                const fireColor = i % 2 === 0 ? 0xff9f2e : 0xff4514;
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: mat.smokeTex, color: fireColor, transparent: true,
                    opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false
                }));
                sp.scale.setScalar(1.2 + Math.random() * 1.4);
                const dir = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.85, Math.random() - 0.5).normalize();
                spawnParticle({
                    pos: position.clone().addScaledVector(dir, 0.4),
                    vel: dir.multiplyScalar(3.5 + Math.random() * 6.5),
                    mesh: sp,
                    gravity: -2.4,
                    drag: 0.91,
                    life: 0.45 + Math.random() * 0.4,
                    growRate: 3.2,
                    fadeOut: true
                });
            }

            // (D) 滾滾上升黑煙柱
            for (let i = 0; i < 20; i++) {
                const shade = 0x1c1b1a + Math.floor(Math.random() * 0x18) * 0x010101;
                const sp = new THREE.Sprite(new THREE.SpriteMaterial({
                    map: mat.smokeTex, color: shade, transparent: true, opacity: 0.78, depthWrite: false
                }));
                sp.scale.setScalar(1.4 + Math.random() * 1.6);
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 5.2,
                    2.8 + Math.random() * 5.8,
                    (Math.random() - 0.5) * 5.2
                );
                spawnParticle({
                    pos: position.clone().add(new THREE.Vector3(0, 0.5, 0)),
                    vel,
                    mesh: sp,
                    gravity: -1.1,
                    drag: 0.94,
                    life: 1.4 + Math.random() * 1.5,
                    growRate: 2.6,
                    fadeOut: true
                });
            }

            // (E) 高速四濺火花與油桶金屬殘片
            for (let i = 0; i < 24; i++) {
                const isDebris = i < 8;
                const m = isDebris
                    ? new THREE.Mesh(geo.debris, new THREE.MeshStandardMaterial({ color: 0x331814, roughness: 0.7, metalness: 0.6 }))
                    : new THREE.Mesh(geo.spark, mat.sparkOrange);
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 18,
                    5 + Math.random() * 13,
                    (Math.random() - 0.5) * 18
                );
                spawnParticle({
                    pos: position.clone().add(new THREE.Vector3(0, 0.4, 0)),
                    vel,
                    mesh: m,
                    gravity: 18.0,
                    drag: 0.97,
                    life: isDebris ? (1.1 + Math.random() * 0.8) : (0.35 + Math.random() * 0.35),
                    orientToVelocity: !isDebris,
                    spin: isDebris
                });
            }

            // (F) 爆炸高強度動態橘光
            const light = new THREE.PointLight(0xff7722, 16.0, radius * 3.2, 1.8);
            light.position.copy(position).add(new THREE.Vector3(0, 1.2, 0));
            scene.add(light);
            flashLights.push({ light, life: 0, maxLife: 0.65, initialIntensity: 16.0 });

            // 觸發 3D 爆炸巨響與距離衰減鏡頭劇烈震動
            if (typeof AudioEngine !== 'undefined') {
                AudioEngine.playExplosion(position);
            }
            if (onCameraShake && window.camera) {
                const dist = window.camera.position.distanceTo(position);
                const strength = THREE.MathUtils.clamp(1.0 - dist / (radius * 4.0), 0.08, 1.0);
                onCameraShake(strength * 0.75, 0.48);
            }
        }

        function randomHemisphereVel(normal, minSpd, maxSpd) {
            const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
            if (v.dot(normal) < 0) v.negate();
            v.lerp(normal, 0.45).normalize();
            return v.multiplyScalar(minSpd + Math.random() * (maxSpd - minSpd));
        }

        function spawnParticle(opts) {
            if (particles.length >= MAX_PARTICLES) {
                const old = particles.shift();
                scene.remove(old.mesh);
                if (old.mesh.material && old.mesh.material !== mat.sparkOrange && old.mesh.material !== mat.sparkArmor) {
                    old.mesh.material.dispose();
                }
            }
            opts.mesh.position.copy(opts.pos);
            scene.add(opts.mesh);
            particles.push({
                mesh: opts.mesh,
                vel: opts.vel,
                gravity: opts.gravity ?? 9.8,
                drag: opts.drag ?? 0.96,
                life: 0,
                maxLife: opts.life ?? 0.5,
                growRate: opts.growRate ?? 0,
                fadeOut: !!opts.fadeOut,
                initialOpacity: opts.mesh.material?.opacity ?? 1,
                orientToVelocity: !!opts.orientToVelocity,
                spin: !!opts.spin
            });
        }

        function update(dt) {
            // 1. 槍口火焰計時關閉
            if (muzzleFlashTimer > 0) {
                muzzleFlashTimer -= dt;
                if (muzzleFlashTimer <= 0) {
                    muzzleFlashMesh.visible = false;
                    muzzleFlashLight.intensity = 0;
                }
            }

            // 2. 更新高速曳光彈
            for (let i = tracers.length - 1; i >= 0; i--) {
                const t = tracers[i];
                t.life += dt;
                t.traveled += t.speed * dt;
                t.mesh.position.copy(t.startPos).addScaledVector(t.dir, Math.min(t.traveled, t.totalDist));
                t.mesh.material.opacity = Math.max(0, 1.0 - t.life / t.maxLife) * 0.85;

                if (t.life >= t.maxLife || t.traveled >= t.totalDist) {
                    scene.remove(t.mesh);
                    t.mesh.material.dispose();
                    tracers.splice(i, 1);
                }
            }

            // 3. 更新旋轉黃銅彈殼與地面反彈
            for (let i = casings.length - 1; i >= 0; i--) {
                const c = casings[i];
                c.life += dt;
                if (c.life >= c.maxLife) {
                    scene.remove(c.mesh);
                    casings.splice(i, 1);
                    continue;
                }
                c.vel.y -= 13.5 * dt;
                c.mesh.position.addScaledVector(c.vel, dt);
                c.mesh.rotation.x += c.angVel.x * dt;
                c.mesh.rotation.y += c.angVel.y * dt;
                c.mesh.rotation.z += c.angVel.z * dt;

                if (c.mesh.position.y <= c.floorY) {
                    c.mesh.position.y = c.floorY;
                    if (Math.abs(c.vel.y) > 0.45 && c.bounces < 3) {
                        c.vel.y = -c.vel.y * 0.42;
                        c.vel.x *= 0.65;
                        c.vel.z *= 0.65;
                        c.angVel.multiplyScalar(0.6);
                        c.bounces++;
                        if (c.bounces === 1 && typeof AudioEngine !== 'undefined') {
                            AudioEngine.playShellClink(c.mesh.position);
                        }
                    } else {
                        c.vel.set(0, 0, 0);
                        c.angVel.set(0, 0, 0);
                    }
                }
            }

            // 4. 更新通用戰場粒子（火花 / 血霧 / 爆炸煙火 / 碎片）
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life += dt;
                if (p.life >= p.maxLife) {
                    scene.remove(p.mesh);
                    if (p.mesh.material && p.mesh.material !== mat.sparkOrange && p.mesh.material !== mat.sparkArmor) {
                        p.mesh.material.dispose();
                    }
                    particles.splice(i, 1);
                    continue;
                }
                p.vel.multiplyScalar(Math.pow(p.drag, dt * 60));
                p.vel.y -= p.gravity * dt;
                p.mesh.position.addScaledVector(p.vel, dt);

                if (p.orientToVelocity && p.vel.lengthSq() > 0.01) {
                    p.mesh.lookAt(_tmpVec.copy(p.mesh.position).add(p.vel));
                }
                if (p.spin) {
                    p.mesh.rotation.x += 9 * dt;
                    p.mesh.rotation.y += 12 * dt;
                }
                if (p.growRate > 0) {
                    const ds = 1 + p.growRate * dt;
                    p.mesh.scale.multiplyScalar(ds);
                }
                if (p.fadeOut && p.mesh.material) {
                    const ratio = 1 - (p.life / p.maxLife);
                    p.mesh.material.opacity = p.initialOpacity * ratio * ratio;
                }
            }

            // 5. 更新爆炸衝擊波環與熱浪球
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const sw = shockwaves[i];
                sw.life += dt;
                const t = Math.min(1, sw.life / sw.maxLife);
                const easeOut = 1 - Math.pow(1 - t, 3);
                const scale = THREE.MathUtils.lerp(0.5, sw.targetScale, easeOut);
                sw.mesh.scale.setScalar(scale);
                sw.mesh.material.opacity = (1 - t) * (sw.isSphere ? 0.5 : 0.92);

                if (sw.life >= sw.maxLife) {
                    scene.remove(sw.mesh);
                    sw.mesh.material.dispose();
                    shockwaves.splice(i, 1);
                }
            }

            // 6. 更新爆炸動態火光衰減
            for (let i = flashLights.length - 1; i >= 0; i--) {
                const fl = flashLights[i];
                fl.life += dt;
                const t = Math.min(1, fl.life / fl.maxLife);
                fl.light.intensity = fl.initialIntensity * Math.pow(1 - t, 2.2);
                if (fl.life >= fl.maxLife) {
                    scene.remove(fl.light);
                    flashLights.splice(i, 1);
                }
            }

            // 7. 彈孔超時淡出清理
            for (let i = decals.length - 1; i >= 0; i--) {
                decals[i].life += dt;
                if (decals[i].life >= decals[i].maxLife) {
                    scene.remove(decals[i].mesh);
                    decals.splice(i, 1);
                }
            }
        }

        return {
            init,
            update,
            spawnMuzzleFlash,
            spawnTracer,
            spawnShellCasing,
            spawnBulletHole,
            spawnImpact,
            spawnExplosion
        };
    })();


    // ========================================================================
    // 模組 14：程序化 WebAudio 3D 軍武音效合成器 (AudioEngine)
    //   - 零外部音檔依賴，純 WebAudio 實時 DSP 合成與 HRTF 3D 空間定位
    //   - 各槍獨立槍聲 / 破甲聲 / 爆頭清脆回饋 / 換彈插板機械聲 / 腳步與滑鏟
    // ========================================================================
    const AudioEngine = (() => {
        let ctx = null;
        let masterGain = null;
        let compressor = null;
        let reverbNode = null;
        let reverbSend = null;
        let whiteNoiseBuf = null;
        let pinkNoiseBuf = null;
        let muted = false;
        let masterVolume = 0.82;

        const _fwd = new THREE.Vector3();
        const _up = new THREE.Vector3();

        // 延遲啟動與瀏覽器自動播放解鎖
        function ensureContext() {
            if (!ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return null;
                ctx = new AudioCtx();

                // 動態壓縮器防止密集交火爆音，同時提升戰場衝擊力
                compressor = ctx.createDynamicsCompressor();
                compressor.threshold.setValueAtTime(-12, ctx.currentTime);
                compressor.knee.setValueAtTime(18, ctx.currentTime);
                compressor.ratio.setValueAtTime(6, ctx.currentTime);
                compressor.attack.setValueAtTime(0.003, ctx.currentTime);
                compressor.release.setValueAtTime(0.18, ctx.currentTime);

                masterGain = ctx.createGain();
                masterGain.gain.value = muted ? 0 : masterVolume;
                masterGain.connect(compressor);
                compressor.connect(ctx.destination);

                // 程序化戶外戰場回音卷積器 (Impulse Response)
                reverbNode = ctx.createConvolver();
                reverbNode.buffer = buildBattlefieldIR(1.65, 2.8);
                reverbSend = ctx.createGain();
                reverbSend.gain.value = 0.28;
                reverbSend.connect(reverbNode);
                reverbNode.connect(masterGain);

                whiteNoiseBuf = buildNoiseBuffer(2.0, false);
                pinkNoiseBuf = buildNoiseBuffer(2.0, true);
            }
            if (ctx.state === 'suspended') {
                ctx.resume().catch(() => {});
            }
            return ctx;
        }

        function init() {
            const unlock = () => {
                ensureContext();
                window.removeEventListener('pointerdown', unlock);
                window.removeEventListener('keydown', unlock);
            };
            window.addEventListener('pointerdown', unlock, { passive: true });
            window.addEventListener('keydown', unlock, { passive: true });
        }

        // 建立白噪聲 / 粉紅噪聲緩衝（模擬火藥爆燃與金屬摩擦）
        function buildNoiseBuffer(durationSec, isPink) {
            const len = Math.floor(ctx.sampleRate * durationSec);
            const buf = ctx.createBuffer(1, len, ctx.sampleRate);
            const data = buf.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

            for (let i = 0; i < len; i++) {
                const white = Math.random() * 2 - 1;
                if (!isPink) {
                    data[i] = white;
                } else {
                    b0 = 0.99886 * b0 + white * 0.0555179;
                    b1 = 0.99332 * b1 + white * 0.0750759;
                    b2 = 0.96900 * b2 + white * 0.1538520;
                    b3 = 0.86650 * b3 + white * 0.3104856;
                    b4 = 0.55000 * b4 + white * 0.5329522;
                    b5 = -0.7616 * b5 - white * 0.0168980;
                    data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                    b6 = white * 0.115926;
                }
            }
            return buf;
        }

        // 建立戰場街道 / 峽谷回音脈衝響應
        function buildBattlefieldIR(durationSec, decay) {
            const len = Math.floor(ctx.sampleRate * durationSec);
            const buf = ctx.createBuffer(2, len, ctx.sampleRate);
            for (let ch = 0; ch < 2; ch++) {
                const d = buf.getChannelData(ch);
                for (let i = 0; i < len; i++) {
                    const env = Math.pow(1 - i / len, decay);
                    d[i] = (Math.random() * 2 - 1) * env;
                }
            }
            return buf;
        }

        // 同步 3D 聽者位置與朝向至攝影機（每幀呼叫）
        function updateListener(camera) {
            if (!ctx || !camera) return;
            const l = ctx.listener;
            const now = ctx.currentTime;
            camera.getWorldDirection(_fwd);
            _up.set(0, 1, 0).applyQuaternion(camera.quaternion).normalize();

            if (l.positionX) {
                l.positionX.setValueAtTime(camera.position.x, now);
                l.positionY.setValueAtTime(camera.position.y, now);
                l.positionZ.setValueAtTime(camera.position.z, now);
                l.forwardX.setValueAtTime(_fwd.x, now);
                l.forwardY.setValueAtTime(_fwd.y, now);
                l.forwardZ.setValueAtTime(_fwd.z, now);
                l.upX.setValueAtTime(_up.x, now);
                l.upY.setValueAtTime(_up.y, now);
                l.upZ.setValueAtTime(_up.z, now);
            } else if (l.setPosition) {
                l.setPosition(camera.position.x, camera.position.y, camera.position.z);
                l.setOrientation(_fwd.x, _fwd.y, _fwd.z, _up.x, _up.y, _up.z);
            }
        }

        // 建立 3D 空間音場節點（遠處敵人槍聲與爆炸具方位感與距離衰減）
        function createOutputNode(worldPos, isLocalPlayer = false, refDist = 4, maxDist = 140) {
            if (isLocalPlayer || !worldPos) return masterGain;
            const panner = ctx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';
            panner.refDistance = refDist;
            panner.maxDistance = maxDist;
            panner.rolloffFactor = 1.25;
            panner.positionX.setValueAtTime(worldPos.x, ctx.currentTime);
            panner.positionY.setValueAtTime(worldPos.y, ctx.currentTime);
            panner.positionZ.setValueAtTime(worldPos.z, ctx.currentTime);
            panner.connect(masterGain);
            return panner;
        }

        // 1. 各槍獨立軍武槍聲合成（突擊步槍 / 衝鋒槍 / 狙擊槍 / 霰彈槍 / 手槍 / 消音器）
        function playGunshot(profile = 'rifle', worldPos = null, suppressed = false, isLocal = true) {
            const ac = ensureContext();
            if (!ac || muted) return;

            const now = ac.currentTime;
            const out = createOutputNode(worldPos, isLocal, 6, 160);
            const pitchJitter = 0.96 + Math.random() * 0.08;

            const presets = {
                rifle:   { punchFreq: 165, punchEnd: 42, punchDur: 0.11, crackFreq: 1950, crackQ: 1.1, noiseDur: 0.24, gain: 0.72, tailSend: 0.45 },
                smg:     { punchFreq: 220, punchEnd: 68, punchDur: 0.07, crackFreq: 2600, crackQ: 1.5, noiseDur: 0.14, gain: 0.56, tailSend: 0.22 },
                sniper:  { punchFreq: 120, punchEnd: 26, punchDur: 0.26, crackFreq: 1350, crackQ: 0.8, noiseDur: 0.52, gain: 0.95, tailSend: 0.85 },
                shotgun: { punchFreq: 135, punchEnd: 30, punchDur: 0.22, crackFreq: 980,  crackQ: 0.6, noiseDur: 0.40, gain: 0.92, tailSend: 0.62 },
                pistol:  { punchFreq: 245, punchEnd: 75, punchDur: 0.08, crackFreq: 2900, crackQ: 1.4, noiseDur: 0.16, gain: 0.58, tailSend: 0.25 }
            };
            const p = presets[profile] || presets.rifle;

            // 層 1：火藥爆轟低頻衝擊 (Punch Transient)
            const osc = ac.createOscillator();
            const oscGain = ac.createGain();
            osc.type = suppressed ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime((suppressed ? p.punchFreq * 1.4 : p.punchFreq) * pitchJitter, now);
            osc.frequency.exponentialRampToValueAtTime(p.punchEnd, now + p.punchDur);

            oscGain.gain.setValueAtTime((suppressed ? p.gain * 0.35 : p.gain) * 0.95, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + p.punchDur);
            osc.connect(oscGain);
            oscGain.connect(out);
            osc.start(now);
            osc.stop(now + p.punchDur + 0.02);

            // 層 2：超音速裂空高頻爆音 / 消音器氣流噴吐 (Crack / Puff)
            const noise = ac.createBufferSource();
            noise.buffer = profile === 'shotgun' ? pinkNoiseBuf : whiteNoiseBuf;
            const filter = ac.createBiquadFilter();
            filter.type = suppressed ? 'bandpass' : 'lowpass';
            const startFreq = suppressed ? 1450 : p.crackFreq * 2.2;
            const endFreq = suppressed ? 520 : 320;
            filter.frequency.setValueAtTime(startFreq * pitchJitter, now);
            filter.frequency.exponentialRampToValueAtTime(endFreq, now + (suppressed ? 0.08 : p.noiseDur));
            filter.Q.value = suppressed ? 2.8 : p.crackQ;

            const nGain = ac.createGain();
            nGain.gain.setValueAtTime(suppressed ? p.gain * 0.42 : p.gain, now);
            nGain.gain.exponentialRampToValueAtTime(0.001, now + (suppressed ? 0.095 : p.noiseDur));

            noise.connect(filter);
            filter.connect(nGain);
            nGain.connect(out);

            // 送入戶外回音尾韻（消音器大幅降低回音）
            if (!suppressed && reverbSend) {
                const tailGain = ac.createGain();
                tailGain.gain.value = p.tailSend * (isLocal ? 1.0 : 0.6);
                nGain.connect(tailGain);
                tailGain.connect(reverbSend);
            }
            noise.start(now);
            noise.stop(now + (suppressed ? 0.11 : p.noiseDur + 0.03));

            // 層 3：金屬槍機往復機械聲（狙擊與消音槍特別清晰）
            if (isLocal) {
                const mechDelay = profile === 'sniper' ? 0.24 : 0.032;
                playMetallicClick(now + mechDelay, suppressed ? 3400 : 2800, 0.035, 0.16, out);
            }
        }

        // 2. 護甲破碎聲 (陶瓷插板爆裂 + 金屬高頻共振碎響)
        function playArmorBreak(worldPos = null, isLocal = false) {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;
            const out = createOutputNode(worldPos, isLocal, 5, 80);

            // 高頻陶瓷玻璃碎裂掃頻
            const freqs = [2200, 3150, 4480, 5820];
            freqs.forEach((f, idx) => {
                const osc = ac.createOscillator();
                const g = ac.createGain();
                osc.type = 'sawtooth';
                const t0 = now + idx * 0.018;
                osc.frequency.setValueAtTime(f * (0.95 + Math.random() * 0.1), t0);
                osc.frequency.exponentialRampToValueAtTime(f * 0.42, t0 + 0.18);
                g.gain.setValueAtTime(0.22, t0);
                g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.20);
                osc.connect(g);
                g.connect(out);
                osc.start(t0);
                osc.stop(t0 + 0.22);
            });

            // 破甲爆裂噪聲瞬態
            const ns = ac.createBufferSource();
            ns.buffer = whiteNoiseBuf;
            const hp = ac.createBiquadFilter();
            hp.type = 'highpass';
            hp.frequency.setValueAtTime(1600, now);
            const ng = ac.createGain();
            ng.gain.setValueAtTime(0.55, now);
            ng.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
            ns.connect(hp);
            hp.connect(ng);
            ng.connect(out);
            ns.start(now);
            ns.stop(now + 0.28);
        }

        // 3. 命中與爆頭清脆回饋 (Headshot Ding / Armor Clink / Kill Confirm)
        function playHitmarker(type = 'body') {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;

            if (type === 'headshot' || type === 'headshot_kill') {
                // 招牌清脆爆頭雙音 + 頭盔貫穿脆響
                playTone(now, 1480, 2150, 0.055, 'triangle', 0.34, masterGain);
                playTone(now + 0.032, 2680, 2940, 0.12, 'sine', 0.38, masterGain);
                playMetallicClick(now, 4200, 0.04, 0.28, masterGain);
                if (type === 'headshot_kill') {
                    playTone(now + 0.075, 1960, 1420, 0.16, 'sine', 0.28, masterGain);
                }
            } else if (type === 'armor' || type === 'armor_self') {
                // 命中防彈板悶沉金屬敲擊
                playTone(now, 880, 520, 0.06, 'square', 0.16, masterGain);
                playMetallicClick(now, 2400, 0.03, 0.22, masterGain);
            } else if (type === 'kill') {
                // 擊殺確認雙脈衝
                playTone(now, 620, 280, 0.05, 'triangle', 0.26, masterGain);
                playTone(now + 0.05, 1180, 1320, 0.11, 'sine', 0.26, masterGain);
            } else {
                // 一般肉體命中悶脆 Tick
                playTone(now, 520, 190, 0.038, 'triangle', 0.24, masterGain);
            }
        }

        // 4. 換彈與切槍機械音效
        function playReloadStep(step, profile = 'rifle') {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;

            switch (step) {
                case 'mag_out':
                    playMetallicClick(now, 1850, 0.045, 0.24, masterGain);
                    playNoiseBurst(now + 0.04, 0.09, 'bandpass', 1200, 2.0, 0.14, masterGain);
                    break;
                case 'mag_in':
                    playTone(now, 240, 110, 0.07, 'triangle', 0.32, masterGain);
                    playMetallicClick(now + 0.02, 2400, 0.04, 0.28, masterGain);
                    break;
                case 'bolt_rack':
                    playNoiseBurst(now, 0.08, 'bandpass', 2600, 3.2, 0.22, masterGain);
                    playMetallicClick(now + 0.075, profile === 'sniper' ? 1600 : 3100, 0.055, 0.32, masterGain);
                    break;
                case 'shell_in':
                    playTone(now, 420, 260, 0.045, 'sine', 0.22, masterGain);
                    playMetallicClick(now + 0.03, 2900, 0.03, 0.22, masterGain);
                    break;
                case 'dry_fire':
                    playMetallicClick(now, 3600, 0.022, 0.28, masterGain);
                    break;
                case 'equip':
                    playNoiseBurst(now, 0.11, 'bandpass', 900, 1.4, 0.15, masterGain);
                    playMetallicClick(now + 0.06, 2100, 0.04, 0.18, masterGain);
                    break;
            }
        }

        // 5. 戰術護甲插板音效（魔鬼氈撕開 -> 陶瓷板滑入 -> 扣具鎖定）
        function playArmorPlate(stage = 'open') {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;

            if (stage === 'open') {
                // 戰術背心魔鬼氈撕裂感
                playNoiseBurst(now, 0.22, 'bandpass', 2800, 1.8, 0.24, masterGain);
            } else if (stage === 'insert') {
                // 陶瓷板摩擦滑入插槽
                playNoiseBurst(now, 0.18, 'lowpass', 950, 1.2, 0.28, masterGain);
                playTone(now + 0.05, 320, 480, 0.12, 'triangle', 0.18, masterGain);
            } else if (stage === 'lock') {
                // 紮實清脆插板歸位鎖定聲
                playTone(now, 210, 95, 0.09, 'triangle', 0.35, masterGain);
                playTone(now + 0.05, 1320, 1650, 0.11, 'sine', 0.22, masterGain);
                playMetallicClick(now + 0.02, 2600, 0.04, 0.22, masterGain);
            }
        }

        // 6. 腳步與戰術滑鏟音效
        function playFootstep(surface = 'concrete', isSprinting = false, worldPos = null, isLocal = true) {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;
            const out = createOutputNode(worldPos, isLocal, 3, 45);
            const vol = isSprinting ? 0.26 : 0.15;

            const freqMap = { concrete: 340, metal: 1250, dirt: 240 };
            const baseF = (freqMap[surface] || 340) * (0.9 + Math.random() * 0.2);

            playNoiseBurst(now, 0.065, 'lowpass', baseF * 2.4, 1.0, vol, out);
            playTone(now, baseF * 0.55, 65, 0.06, 'sine', vol * 0.9, out);
            if (surface === 'metal') {
                playMetallicClick(now, 1800, 0.045, vol * 0.8, out);
            }
        }

        function playSlide() {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;
            // 戰術滑鏟長段砂石摩擦滑行聲
            const ns = ac.createBufferSource();
            ns.buffer = pinkNoiseBuf;
            const bp = ac.createBiquadFilter();
            bp.type = 'bandpass';
            bp.frequency.setValueAtTime(1450, now);
            bp.frequency.exponentialRampToValueAtTime(420, now + 0.58);
            bp.Q.value = 1.3;

            const g = ac.createGain();
            g.gain.setValueAtTime(0.01, now);
            g.gain.linearRampToValueAtTime(0.36, now + 0.05);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.62);

            ns.connect(bp);
            bp.connect(g);
            g.connect(masterGain);
            ns.start(now);
            ns.stop(now + 0.65);
        }

        // 7. 彈殼落地清脆金屬響 / 子彈擊中物體 / 油桶巨型爆炸
        function playShellClink(worldPos) {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;
            const out = createOutputNode(worldPos, false, 2, 18);
            const f = 5200 + Math.random() * 1400;
            playTone(now, f, f * 0.92, 0.045, 'sine', 0.11, out);
        }

        function playImpact(surfaceType = 'concrete', worldPos = null) {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;
            const out = createOutputNode(worldPos, false, 4, 65);

            if (surfaceType === 'metal') {
                playTone(now, 2100 + Math.random() * 600, 1200, 0.11, 'triangle', 0.24, out);
                playMetallicClick(now, 3500, 0.05, 0.26, out);
            } else {
                playNoiseBurst(now, 0.08, 'bandpass', 950, 1.2, 0.22, out);
            }
        }

        function playExplosion(worldPos) {
            const ac = ensureContext();
            if (!ac || muted) return;
            const now = ac.currentTime;
            const out = createOutputNode(worldPos, false, 12, 240);

            // 超低頻震波轟鳴 (Sub-Bass Shockwave)
            const sub = ac.createOscillator();
            const subG = ac.createGain();
            sub.type = 'sine';
            sub.frequency.setValueAtTime(98, now);
            sub.frequency.exponentialRampToValueAtTime(22, now + 0.85);
            subG.gain.setValueAtTime(1.0, now);
            subG.gain.exponentialRampToValueAtTime(0.001, now + 1.15);
            sub.connect(subG);
            subG.connect(out);
            sub.start(now);
            sub.stop(now + 1.2);

            // 寬頻爆裂火浪與碎片滾落尾音
            const ns = ac.createBufferSource();
            ns.buffer = pinkNoiseBuf;
            const lp = ac.createBiquadFilter();
            lp.type = 'lowpass';
            lp.frequency.setValueAtTime(2800, now);
            lp.frequency.exponentialRampToValueAtTime(180, now + 1.65);

            const ng = ac.createGain();
            ng.gain.setValueAtTime(0.95, now);
            ng.gain.exponentialRampToValueAtTime(0.001, now + 1.75);
            ns.connect(lp);
            lp.connect(ng);
            ng.connect(out);
            if (reverbSend) ng.connect(reverbSend);
            ns.start(now);
            ns.stop(now + 1.8);
        }

        // 底層合成輔助函數
        function playTone(t, fStart, fEnd, dur, type, vol, dest) {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(fStart, t);
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            osc.connect(g);
            g.connect(dest);
            osc.start(t);
            osc.stop(t + dur + 0.015);
        }

        function playNoiseBurst(t, dur, filterType, freq, q, vol, dest) {
            const ns = ctx.createBufferSource();
            ns.buffer = whiteNoiseBuf;
            const flt = ctx.createBiquadFilter();
            flt.type = filterType;
            flt.frequency.setValueAtTime(freq, t);
            flt.Q.value = q;
            const g = ctx.createGain();
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + dur);
            ns.connect(flt);
            flt.connect(g);
            g.connect(dest);
            ns.start(t);
            ns.stop(t + dur + 0.02);
        }

        function playMetallicClick(t, freq, dur, vol, dest) {
            playNoiseBurst(t, dur, 'bandpass', freq, 6.0, vol, dest);
        }

        function setMasterVolume(v) {
            masterVolume = THREE.MathUtils.clamp(v, 0, 1);
            if (masterGain && !muted) masterGain.gain.setValueAtTime(masterVolume, ctx.currentTime);
        }

        function setMuted(isMuted) {
            muted = !!isMuted;
            if (masterGain) masterGain.gain.setValueAtTime(muted ? 0 : masterVolume, ctx.currentTime);
        }

        return {
            init,
            updateListener,
            playGunshot,
            playArmorBreak,
            playHitmarker,
            playReloadStep,
            playArmorPlate,
            playFootstep,
            playSlide,
            playShellClink,
            playImpact,
            playExplosion,
            setMasterVolume,
            setMuted
        };
    })();
