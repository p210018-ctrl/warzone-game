<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0e">
  <meta name="description" content="CODWZM 戰術行動 — 可操作的 Three.js FPS 示範。">
  <title>CODWZM 戰區手遊 - 戰術行動</title>
  <style>
    :root{color-scheme:dark;--gold:#d4af37;--panel:rgba(12,15,19,.82);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0b0e;color:#eee}body{touch-action:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:none}
    #game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;visibility:hidden;opacity:0}body[data-state=combat] #game-canvas{visibility:visible;opacity:1}
    #lobby-screen,#hud-screen{position:fixed;inset:0}#lobby-screen{z-index:3;display:flex;flex-direction:column;padding:calc(20px + var(--safe-t)) clamp(18px,5vw,56px) calc(20px + var(--safe-b));background:linear-gradient(115deg,rgba(8,10,13,.98),rgba(8,10,13,.72) 58%,rgba(8,10,13,.35))}body[data-state=combat] #lobby-screen{display:none}.lobby-header{display:flex;justify-content:space-between;align-items:center;gap:12px}.profile{display:flex;gap:12px;align-items:center}.avatar{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;font-weight:900;color:var(--gold)}.muted{color:#9ba0a7;font-size:.82rem}.currency{color:var(--gold);font:700 .9rem monospace}.lobby-main{display:flex;align-items:center;justify-content:space-between;gap:24px;flex:1;padding:2vw 4vw}.title{font-size:clamp(3rem,10vw,7.5rem);font-weight:950;letter-spacing:.1em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.35);line-height:.95}.tagline{margin-top:16px;color:var(--gold);letter-spacing:.16em}.menu{display:grid;gap:12px;width:min(340px,42vw)}.menu button{padding:16px 20px;text-align:left;border:1px solid #596069;background:rgba(255,255,255,.07);font-weight:750}.menu button:hover,.menu button:focus-visible{border-color:var(--gold);outline:2px solid var(--gold)}.menu .deploy{border:2px solid var(--gold);color:var(--gold);font-size:1.15rem;background:rgba(212,175,55,.14)}
    #hud-screen{z-index:2;display:none;pointer-events:none}body[data-state=combat] #hud-screen{display:block}.hud-top{position:absolute;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:center;padding:8px 22px;background:var(--panel);border-top:2px solid var(--gold);font:800 1.15rem monospace;white-space:nowrap}.blue{color:#55aaff}.red{color:#ff6158}.crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);filter:drop-shadow(0 0 2px #000)}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff}.crosshair:before{width:2px;height:20px;left:12px;top:3px}.crosshair:after{height:2px;width:20px;top:12px;left:3px}.bottom-left,.bottom-right{position:absolute;bottom:calc(20px + var(--safe-b));background:var(--panel);padding:10px 14px;min-width:170px}.bottom-left{left:18px}.bottom-right{right:18px;text-align:right}.bar{height:12px;margin-top:5px;background:#28302d;width:180px}.bar>i{display:block;height:100%;background:#32c979;width:100%;transition:width .15s}.ammo{font:900 2.5rem monospace}.controls{position:absolute;right:18px;bottom:calc(125px + var(--safe-b));display:grid;grid-template-columns:repeat(2,62px);gap:10px;pointer-events:auto}.ctrl{width:62px;height:62px;border:1px solid #ffffff80;border-radius:50%;background:#20252bdc;font-size:.72rem;font-weight:800;user-select:none;-webkit-user-select:none}.ctrl.fire{grid-column:span 2;justify-self:center;width:76px;height:76px;border-color:#e74c3c;background:#7c2d2ddd}.ctrl:active{transform:scale(.94);background:#ffffff55}.joystick{position:absolute;left:24px;bottom:calc(26px + var(--safe-b));width:124px;height:124px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:37px;top:37px;border:1px solid #fff9;border-radius:50%;background:#ffffff55;pointer-events:none}.status{position:fixed;z-index:10000;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(90vw,540px);padding:16px 20px;background:#16191fee;border:1px solid var(--gold);text-align:center;display:none;white-space:pre-wrap}.status.show{display:block}
    @media(max-width:700px){.lobby-main{flex-direction:column;justify-content:center;align-items:flex-start;padding:8vh 2vw 2vh}.menu{width:min(100%,360px)}.lobby-header{align-items:flex-start}.title{font-size:clamp(3rem,17vw,6rem)}.bottom-left{left:12px;min-width:130px;padding:8px}.bar{width:130px}.bottom-right{right:12px;min-width:100px;padding:8px}.controls{right:12px;bottom:calc(132px + var(--safe-b));grid-template-columns:repeat(2,54px);gap:8px}.ctrl{width:54px;height:54px}.ctrl.fire{width:68px;height:68px}.joystick{width:112px;height:112px;left:18px}.knob{left:31px;top:31px}}
    @media(max-height:430px) and (orientation:landscape){.controls{bottom:calc(76px + var(--safe-b));grid-template-columns:repeat(3,48px)}.ctrl{width:48px;height:48px}.ctrl.fire{width:58px;height:58px;grid-column:3;grid-row:1/3}.joystick{width:90px;height:90px}.knob{left:20px;top:20px}}
  </style>
</head>
<body data-state="lobby">
  <canvas id="game-canvas" aria-label="3D 戰鬥遊戲畫面"></canvas>
  <main id="lobby-screen" aria-label="遊戲大廳"><header class="lobby-header"><div class="profile"><div class="avatar" aria-hidden="true">G</div><div><strong>GHOST_Operator</strong><div class="muted">LVL. 55 · 上尉</div></div></div><div class="currency">◈ 12,450　◆ 850</div></header><section class="lobby-main"><div><div class="title">GHOST</div><div class="tagline">// SIMON “GHOST” RILEY</div></div><nav class="menu" aria-label="主選單"><button class="deploy" id="btn-deploy">進入戰區 / DEPLOY</button><button id="btn-loadout">武器配置 / LOADOUT</button><button id="btn-settings">系統設置 / SETTINGS</button></nav></section></main>
  <section id="hud-screen" aria-label="戰鬥資訊"><div class="hud-top"><span class="blue" id="score-blue">0</span><span id="match-time">10:00</span><span class="red" id="score-red">0</span></div><div class="crosshair" aria-hidden="true"></div><div class="bottom-left"><span>ARMOR <b id="armor-value">150</b>　HP <b id="health-value">150</b></span><div class="bar"><i id="health-fill"></i></div></div><div class="bottom-right"><div id="weapon-label">M4A1</div><div class="ammo"><span id="ammo-mag">30</span><small> / <span id="ammo-reserve">120</span></small></div></div><div class="joystick" id="joystick-area" aria-label="移動搖桿"><div class="knob" id="joystick-knob"></div></div><div class="controls"><button class="ctrl" id="btn-jump" aria-label="跳躍">JUMP</button><button class="ctrl" id="btn-crouch" aria-label="蹲下">CROUCH</button><button class="ctrl" id="btn-reload" aria-label="換彈">RELOAD</button><button class="ctrl fire" id="btn-fire" aria-label="開火">FIRE</button></div></section>
  <div class="status" id="status" role="alert" aria-live="assertive"></div>
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/three@0.149.0/build/three.min.js'"></script>
</body>
</html>
