
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>WZ 戰術 · 寫實曲面重製版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;position:fixed}
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:-apple-system,"SF Pro",sans-serif}
  #hud{position:fixed;top:calc(10px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;gap:10px;align-items:center;color:#8f8;font-size:12px;font-weight:700;text-shadow:0 0 6px #000}
  #reset{pointer-events:auto;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#ddd;border-radius:8px;padding:6px 10px;font-size:11px}
  #err{position:fixed;left:0;right:0;bottom:0;z-index:9999;background:rgba(120,0,0,.94);color:#fff;font:12px/1.5 monospace;padding:10px 14px;white-space:pre-wrap;display:none;max-height:40%;overflow:auto}
  #rotate{position:fixed;inset:0;z-index:999;background:#0b0b0d;color:#ddd;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:18px;text-align:center;padding:30px}
  @media (orientation:portrait){#rotate{display:flex}}
  #cross{position:fixed;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;opacity:.9;transition:transform .06s}
  #cross i{position:absolute;background:#eee;box-shadow:0 0 3px #000;border-radius:1px}
  #cross .h{width:8px;height:2px;top:14px}#cross .hl{left:0}#cross .hr{right:0}
  #cross .v{width:2px;height:8px;left:14px}#cross .vt{top:0}#cross .vb{bottom:0}
  #cross .d{position:absolute;left:13px;top:13px;width:4px;height:4px;border-radius:50%;background:#eee;box-shadow:0 0 4px #000}
  #cross.hit i{background:#ff3b3b}
  #stick{position:fixed;left:calc(24px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);pointer-events:auto;opacity:.75}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.45)}
  #btns{position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .row{display:flex;gap:8px;align-items:center}
  .b{pointer-events:auto;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.30);color:#eee;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .b.on{background:rgba(255,255,255,.32)}
  .b.fire{width:74px;height:74px;font-size:12px;border-color:rgba(255,70,70,.6);background:rgba(255,40,40,.14)}
  .b.fire.on{background:rgba(255,60,60,.42)}
  .b.ads.on{border-color:rgba(120,200,255,.8);background:rgba(80,160,255,.24)}
  .b.reload{border-color:rgba(255,200,80,.55);background:rgba(255,180,40,.12);font-size:11px}
  .b.reload.on{background:rgba(255,180,40,.30)}
  #ammo{pointer-events:none;color:#fff;font:700 16px/1 monospace;text-shadow:0 0 8px #000,0 0 3px #000;letter-spacing:.03em;background:rgba(0,0,0,.35);padding:7px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.15)}
  #ammo.low{color:#ff3b3b;animation:pulse .5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #sblack{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .1s;background:radial-gradient(circle at 50% 50%,transparent 26%,rgba(0,0,0,.92) 27%);z-index:9}
  #reloadTxt{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#ffc850;font:800 14px/1 -apple-system,sans-serif;text-shadow:0 0 8px #000;display:none;letter-spacing:.1em;z-index:11}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud"><span id="fps">FPS --</span><button id="reset">重置敵人</button></div>
  <div id="cross"><i class="h hl"></i><i class="h hr"></i><i class="v vt"></i><i class="v vb"></i><i class="d"></i></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="btns">
    <div class="row"><div id="ammo">30 / 120</div><button class="b reload" id="bReload">RELOAD</button></div>
    <div class="row"><button class="b" id="bJump">JUMP</button><button class="b" id="bCrouch">SLIDE</button></div>
    <div class="row"><button class="b ads" id="bAds">ADS</button><button class="b fire" id="bFire">FIRE</button></div>
  </div>
</div>
<div id="sblack"></div>
<div id="reloadTxt">RELOADING</div>
<div id="rotate"><div style="font-size:56px;transform:rotate(90deg)">📱</div><div style="font-weight:700">請橫置裝置遊玩</div></div>
<div id="err"></div>

<script>
(function(){
'use strict';

/* ============================================================
   錯誤顯示
   ============================================================ */
var errEl = document.getElementById('err');
function showErr(m){
  errEl.style.display = 'block';
  errEl.textContent += m + '\n';
}
window.onerror = function(msg, url, line){
  showErr('錯誤: ' + msg + ' (行 ' + line + ')');
  return false;
};

/* ============================================================
   數學工具
   ============================================================ */
function m4mul(o,a,b){
  for(var i=0;i<4;i++){
    for(var j=0;j<4;j++){
      var s=0;
      for(var k=0;k<4;k++) s+=a[i+k*4]*b[k+j*4];
      o[i+j*4]=s;
    }
  }
}
function setTRS(o,tx,ty,tz,rx,ry,rz,sx,sy,sz){
  var cx=Math.cos(rx),sX=Math.sin(rx);
  var cy=Math.cos(ry),sY=Math.sin(ry);
  var cz=Math.cos(rz),sZ=Math.sin(rz);
  var a00=cy,a01=sY*sX,a02=sY*cx;
  var a10=0,a11=cx,a12=-sX;
  var a20=-sY,a21=cy*sX,a22=cy*cx;
  var b00=a00*cz+a01*sZ,b10=a10*cz+a11*sZ,b20=a20*cz+a21*sZ;
  var b01=-a00*sZ+a01*cz,b11=-a10*sZ+a11*cz,b21=-a20*sZ+a21*cz;
  var b02=a02,b12=a12,b22=a22;
  o[0]=b00*sx;o[1]=b10*sx;o[2]=b20*sx;o[3]=0;
  o[4]=b01*sy;o[5]=b11*sy;o[6]=b21*sy;o[7]=0;
  o[8]=b02*sz;o[9]=b12*sz;o[10]=b22*sz;o[11]=0;
  o[12]=tx;o[13]=ty;o[14]=tz;o[15]=1;
}
function m4persp(o,fovy,aspect,near,far){
  var f=1/Math.tan(fovy/2);
  o[0]=f/aspect;o[1]=0;o[2]=0;o[3]=0;
  o[4]=0;o[5]=f;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=(far+near)/(near-far);o[11]=-1;
  o[12]=0;o[13]=0;o[14]=(2*far*near)/(near-far);o[15]=0;
}
function m4ortho(o,l,r,b,t,n,f){
  o[0]=2/(r-l);o[1]=0;o[2]=0;o[3]=0;
  o[4]=0;o[5]=2/(t-b);o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=-2/(f-n);o[11]=0;
  o[12]=-(r+l)/(r-l);o[13]=-(t+b)/(t-b);o[14]=-(f+n)/(f-n);o[15]=1;
}
function m4lookAt(o,ex,ey,ez,cx,cy,cz,ux,uy,uz){
  var fx=cx-ex,fy=cy-ey,fz=cz-ez;
  var fl=Math.sqrt(fx*fx+fy*fy+fz*fz)||1;
  fx/=fl;fy/=fl;fz/=fl;
  var sx=fy*uz-fz*uy, sy=fz*ux-fx*uz, sz=fx*uy-fy*ux;
  var sl=Math.sqrt(sx*sx+sy*sy+sz*sz)||1;
  sx/=sl;sy/=sl;sz/=sl;
  var ux2=sy*fz-sz*fy, uy2=sz*fx-sx*fz, uz2=sx*fy-sy*fx;
  o[0]=sx;o[1]=ux2;o[2]=-fx;o[3]=0;
  o[4]=sy;o[5]=uy2;o[6]=-fy;o[7]=0;
  o[8]=sz;o[9]=uz2;o[10]=-fz;o[11]=0;
  o[12]=-(sx*ex+sy*ey+sz*ez);
  o[13]=-(ux2*ex+uy2*ey+uz2*ez);
  o[14]=(fx*ex+fy*ey+fz*ez);
  o[15]=1;
}
function buildView(o,px,py,pz,yaw,pitch){
  var cx=Math.cos(pitch),sX=Math.sin(pitch);
  var cy=Math.cos(yaw),sY=Math.sin(yaw);
  var r00=cy,r01=0,r02=-sY;
  var r10=sX*sY,r11=cx,r12=sX*cy;
  var r20=cx*sY,r21=-sX,r22=cx*cy;
  var tx=-(r00*px+r01*py+r02*pz);
  var ty=-(r10*px+r11*py+r12*pz);
  var tz=-(r20*px+r21*py+r22*pz);
  o[0]=r00;o[1]=r10;o[2]=r20;o[3]=0;
  o[4]=r01;o[5]=r11;o[6]=r21;o[7]=0;
  o[8]=r02;o[9]=r12;o[10]=r22;o[11]=0;
  o[12]=tx;o[13]=ty;o[14]=tz;o[15]=1;
}

var MPOOL=[],MI=0;
function mp(){
  var m=MPOOL[MI];
  if(!m){ m=new Float32Array(16); MPOOL[MI]=m; }
  MI++;
  return m;
}
function mpReset(){ MI=0; }

function damp(a,b,rate,dt){ return a+(b-a)*(1-Math.pow(1-rate,dt*60)); }
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }

/* ============================================================
   WebGL 初始化
   ============================================================ */
var canvas = document.getElementById('c');
var gl = null;
try{
  var attrs = {antialias:true,alpha:false,depth:true,powerPreference:'default'};
  gl = canvas.getContext('webgl',attrs) || canvas.getContext('experimental-webgl',attrs);
}catch(e){}
if(!gl){ showErr('此環境不支援 WebGL。'); return; }

/* ---- 主頂點著色器 ---- */
var VS = [
'attribute vec3 aPos;',
'attribute vec3 aNrm;',
'attribute vec2 aUV;',
'uniform mat4 uModel;',
'uniform mat4 uVP;',
'uniform mat4 uLightVP;',
'varying vec3 vN;',
'varying vec3 vW;',
'varying vec2 vUV;',
'varying vec4 vSC;',
'void main(){',
'  vec4 wp = uModel * vec4(aPos,1.0);',
'  vW = wp.xyz;',
'  vN = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz) * aNrm;',
'  vUV = aUV;',
'  vSC = uLightVP * wp;',
'  gl_Position = uVP * wp;',
'}'
].join('\n');

/* ---- 主片元著色器：PBR + 陰影 + ACES ---- */
var FS = [
'precision highp float;',
'uniform vec3 uColor;',
'uniform float uMetal;',
'uniform float uRough;',
'uniform sampler2D uTex;',
'uniform float uUseTex;',
'uniform vec2 uTiling;',
'uniform vec3 uLightDir;',
'uniform vec3 uLightCol;',
'uniform vec3 uAmbient;',
'uniform vec3 uCam;',
'uniform vec3 uFogCol;',
'uniform float uFogNear;',
'uniform float uFogFar;',
'uniform float uToneExp;',
'uniform sampler2D uShadowMap;',
'uniform float uShadowOn;',
'varying vec3 vN;',
'varying vec3 vW;',
'varying vec2 vUV;',
'varying vec4 vSC;',
'vec3 aces(vec3 x){',
'  const float a=2.51, b=0.03, c=2.43, d=0.59, e=0.14;',
'  return clamp((x*(a*x+b))/(x*(c*x+d)+e), 0.0, 1.0);',
'}',
'float unpackD(vec4 rgba){',
'  return dot(rgba, vec4(1.0/16777216.0, 1.0/65536.0, 1.0/256.0, 1.0));',
'}',
'void main(){',
'  vec3 N = normalize(vN);',
'  vec3 V = normalize(uCam - vW);',
'  vec3 L = normalize(uLightDir);',
'  vec3 H = normalize(L + V);',
'  vec3 albedo = uColor;',
'  float metal = uMetal;',
'  float rough = uRough;',
'  if(uUseTex > 0.5){',
'    vec4 t = texture2D(uTex, vUV * uTiling);',
'    albedo = uColor * t.rgb * 1.65;',
'    rough = clamp(rough * (0.75 + 0.5*t.a), 0.06, 1.0);',
'  }',
'  float NdotL = max(dot(N,L), 0.0);',
'  float NdotV = max(dot(N,V), 0.0001);',
'  float NdotH = max(dot(N,H), 0.0);',
'  float VdotH = max(dot(V,H), 0.0);',
'  float shadow = 1.0;',
'  if(uShadowOn > 0.5 && NdotL > 0.001){',
'    vec3 sc = vSC.xyz / vSC.w;',
'    sc = sc * 0.5 + 0.5;',
'    if(sc.x > 0.002 && sc.x < 0.998 && sc.y > 0.002 && sc.y < 0.998 && sc.z < 1.0){',
'      float d = unpackD(texture2D(uShadowMap, sc.xy));',
'      float bias = max(0.0018 * (1.0 - NdotL), 0.0005);',
'      shadow = (sc.z - bias > d) ? 0.0 : 1.0;',
'    }',
'  }',
'  vec3 F0 = mix(vec3(0.04), albedo, metal);',
'  float a = rough*rough;',
'  float a2 = a*a;',
'  float dd = NdotH*NdotH*(a2-1.0)+1.0;',
'  float D = a2 / (3.14159*dd*dd + 0.0001);',
'  float k = (rough+1.0)*(rough+1.0)/8.0;',
'  float G = (NdotL/(NdotL*(1.0-k)+k)) * (NdotV/(NdotV*(1.0-k)+k));',
'  vec3 F = F0 + (1.0-F0)*pow(1.0-VdotH, 5.0);',
'  vec3 spec = D*G*F/(4.0*NdotV*NdotL+0.001) * NdotL * uLightCol * 2.4 * shadow;',
'  vec3 diff = albedo*(1.0-metal)*NdotL*uLightCol * shadow;',
'  vec3 skyA = vec3(0.40,0.50,0.66);',
'  vec3 gndA = vec3(0.20,0.19,0.17);',
'  vec3 amb = mix(gndA, skyA, 0.5+0.5*N.y) * albedo * (1.0-metal) * uAmbient;',
'  vec3 envCol = mix(vec3(0.20,0.22,0.26), vec3(0.62,0.68,0.76), 0.5+0.5*N.y);',
'  vec3 refl = envCol * (F0 + (1.0-F0)*pow(1.0-NdotV,5.0)) * (1.0-rough*0.85);',
'  vec3 col = diff + spec + amb + refl*mix(0.35,1.0,metal);',
'  float d = length(vW-uCam);',
'  float fog = clamp((d-uFogNear)/(uFogFar-uFogNear), 0.0, 1.0);',
'  fog = fog*fog*(3.0-2.0*fog);',
'  col = mix(col, uFogCol, fog*0.9);',
'  col = aces(col * uToneExp);',
'  col = pow(col, vec3(1.0/2.2));',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* ---- 陰影深度著色器 ---- */
var DVS = [
'attribute vec3 aPos;',
'uniform mat4 uModel;',
'uniform mat4 uLightVP;',
'void main(){',
'  gl_Position = uLightVP * uModel * vec4(aPos,1.0);',
'}'
].join('\n');

var DFS = [
'precision mediump float;',
'vec4 packD(float depth){',
'  const vec4 bs = vec4(256.0*256.0*256.0, 256.0*256.0, 256.0, 1.0);',
'  const vec4 bm = vec4(0.0, 1.0/256.0, 1.0/256.0, 1.0/256.0);',
'  vec4 res = fract(depth * bs);',
'  res -= res.xxyz * bm;',
'  return res;',
'}',
'void main(){',
'  gl_FragColor = packD(gl_FragCoord.z);',
'}'
].join('\n');

function compile(type,src){
  var s = gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
    showErr('Shader 編譯失敗: '+gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
function linkProg(vs,fs){
  var p = gl.createProgram();
  gl.attachShader(p,vs);
  gl.attachShader(p,fs);
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){
    showErr('Program 連結失敗: '+gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

var vsObj = compile(gl.VERTEX_SHADER,VS);
var fsObj = compile(gl.FRAGMENT_SHADER,FS);
if(!vsObj || !fsObj) return;
var prog = linkProg(vsObj,fsObj);
if(!prog) return;

var dvsObj = compile(gl.VERTEX_SHADER,DVS);
var dfsObj = compile(gl.FRAGMENT_SHADER,DFS);
var shadowProg = (dvsObj && dfsObj) ? linkProg(dvsObj,dfsObj) : null;

/* ---- 主程式 attribute / uniform ---- */
gl.useProgram(prog);
var aPos = gl.getAttribLocation(prog,'aPos');
var aNrm = gl.getAttribLocation(prog,'aNrm');
var aUV  = gl.getAttribLocation(prog,'aUV');
var uModel = gl.getUniformLocation(prog,'uModel');
var uVP = gl.getUniformLocation(prog,'uVP');
var uLightVPm = gl.getUniformLocation(prog,'uLightVP');
var uColor = gl.getUniformLocation(prog,'uColor');
var uMetal = gl.getUniformLocation(prog,'uMetal');
var uRough = gl.getUniformLocation(prog,'uRough');
var uTex = gl.getUniformLocation(prog,'uTex');
var uUseTex = gl.getUniformLocation(prog,'uUseTex');
var uTiling = gl.getUniformLocation(prog,'uTiling');
var uLightDir = gl.getUniformLocation(prog,'uLightDir');
var uLightCol = gl.getUniformLocation(prog,'uLightCol');
var uAmbient = gl.getUniformLocation(prog,'uAmbient');
var uCam = gl.getUniformLocation(prog,'uCam');
var uFogCol = gl.getUniformLocation(prog,'uFogCol');
var uFogNear = gl.getUniformLocation(prog,'uFogNear');
var uFogFar = gl.getUniformLocation(prog,'uFogFar');
var uToneExp = gl.getUniformLocation(prog,'uToneExp');
var uShadowMap = gl.getUniformLocation(prog,'uShadowMap');
var uShadowOn = gl.getUniformLocation(prog,'uShadowOn');

/* ---- 陰影程式 uniform ---- */
var sAPos = -1, sUModel = null, sULightVP = null;
if(shadowProg){
  gl.useProgram(shadowProg);
  sAPos = gl.getAttribLocation(shadowProg,'aPos');
  sUModel = gl.getUniformLocation(shadowProg,'uModel');
  sULightVP = gl.getUniformLocation(shadowProg,'uLightVP');
  gl.useProgram(prog);
}

gl.enable(gl.DEPTH_TEST);
gl.depthFunc(gl.LEQUAL);
gl.enable(gl.CULL_FACE);
gl.cullFace(gl.BACK);
gl.clearColor(0.68,0.72,0.78,1);

/* ============================================================
   幾何網格庫（交錯式：pos3 + nrm3 + uv2 = 8 floats）
   ============================================================ */
function newMeshData(){ return {v:[], i:[]}; }
function pushVert(d,px,py,pz,nx,ny,nz,u,v){
  d.v.push(px,py,pz,nx,ny,nz,u,v);
}
function buildMesh(d){
  var m = {};
  m.vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d.v), gl.STATIC_DRAW);
  m.ibo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(d.i), gl.STATIC_DRAW);
  m.count = d.i.length;
  return m;
}

/* ---- 立方體 ---- */
function makeBoxMesh(){
  var d = newMeshData();
  var faces = [
    {n:[0,0,1],  c:[[-0.5,-0.5,0.5],[0.5,-0.5,0.5],[0.5,0.5,0.5],[-0.5,0.5,0.5]]},
    {n:[0,0,-1], c:[[0.5,-0.5,-0.5],[-0.5,-0.5,-0.5],[-0.5,0.5,-0.5],[0.5,0.5,-0.5]]},
    {n:[0,1,0],  c:[[-0.5,0.5,0.5],[0.5,0.5,0.5],[0.5,0.5,-0.5],[-0.5,0.5,-0.5]]},
    {n:[0,-1,0], c:[[-0.5,-0.5,-0.5],[0.5,-0.5,-0.5],[0.5,-0.5,0.5],[-0.5,-0.5,0.5]]},
    {n:[1,0,0],  c:[[0.5,-0.5,0.5],[0.5,-0.5,-0.5],[0.5,0.5,-0.5],[0.5,0.5,0.5]]},
    {n:[-1,0,0], c:[[-0.5,-0.5,-0.5],[-0.5,-0.5,0.5],[-0.5,0.5,0.5],[-0.5,0.5,-0.5]]}
  ];
  var vi = 0;
  for(var f=0;f<6;f++){
    var fc = faces[f];
    for(var k=0;k<4;k++){
      var c = fc.c[k];
      pushVert(d, c[0],c[1],c[2], fc.n[0],fc.n[1],fc.n[2],
        (k===1||k===2)?1:0, (k>=2)?1:0);
    }
    d.i.push(vi,vi+1,vi+2, vi,vi+2,vi+3);
    vi += 4;
  }
  return buildMesh(d);
}

/* ---- 圓柱（半徑 1，高度 1，軸沿 Y） ---- */
function makeCylinderMesh(seg){
  var d = newMeshData();
  for(var i=0;i<=seg;i++){
    var a = i/seg*Math.PI*2;
    var sx = Math.sin(a), cz = Math.cos(a);
    pushVert(d, sx, 0.5, cz, sx,0,cz, i/seg, 1);
    pushVert(d, sx,-0.5, cz, sx,0,cz, i/seg, 0);
  }
  for(var i=0;i<seg;i++){
    var a0=i*2, b0=i*2+1, a1=(i+1)*2, b1=(i+1)*2+1;
    d.i.push(a0,b0,a1, a1,b0,b1);
  }
  var cTop = d.v.length/8;
  pushVert(d, 0,0.5,0, 0,1,0, 0.5,0.5);
  for(var i=0;i<=seg;i++){
    var a=i/seg*Math.PI*2, sx=Math.sin(a), cz=Math.cos(a);
    pushVert(d, sx,0.5,cz, 0,1,0, 0.5+sx*0.5, 0.5+cz*0.5);
  }
  for(var i=0;i<seg;i++) d.i.push(cTop, cTop+1+i, cTop+2+i);
  var cBot = d.v.length/8;
  pushVert(d, 0,-0.5,0, 0,-1,0, 0.5,0.5);
  for(var i=0;i<=seg;i++){
    var a=i/seg*Math.PI*2, sx=Math.sin(a), cz=Math.cos(a);
    pushVert(d, sx,-0.5,cz, 0,-1,0, 0.5+sx*0.5, 0.5+cz*0.5);
  }
  for(var i=0;i<seg;i++) d.i.push(cBot, cBot+2+i, cBot+1+i);
  return buildMesh(d);
}

/* ---- 球體 / 半球 ---- */
function makeSphereMesh(latSeg, lonSeg, latMax){
  latMax = latMax || Math.PI;
  var d = newMeshData();
  for(var la=0; la<=latSeg; la++){
    var phi = la/latSeg*latMax;
    var y = Math.cos(phi), r = Math.sin(phi);
    for(var lo=0; lo<=lonSeg; lo++){
      var th = lo/lonSeg*Math.PI*2;
      var x = r*Math.sin(th), z = r*Math.cos(th);
      pushVert(d, x,y,z, x,y,z, lo/lonSeg, 1-la/latSeg);
    }
  }
  for(var la=0; la<latSeg; la++){
    for(var lo=0; lo<lonSeg; lo++){
      var a = la*(lonSeg+1)+lo, b = a+lonSeg+1;
      d.i.push(a,b,a+1, a+1,b,b+1);
    }
  }
  return buildMesh(d);
}

function makeTexFromCanvas(cv){
  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  return tex;
}

(function initShadow(){
  try{
    shadowTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SHADOW_SIZE, SHADOW_SIZE, 0,
                  gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    var depthRB = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depthRB);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, SHADOW_SIZE, SHADOW_SIZE);

    shadowFB = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFB);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, shadowTex, 0);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depthRB);

    var st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    shadowsEnabled = (st === gl.FRAMEBUFFER_COMPLETE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }catch(e){
    shadowsEnabled = false;
  }
})();

function updateLightMatrices(){
  var lx=LIGHT_DIR[0], ly=LIGHT_DIR[1], lz=LIGHT_DIR[2];
  var ll = Math.sqrt(lx*lx+ly*ly+lz*lz) || 1;
  lx/=ll; ly/=ll; lz/=ll;
  LIGHT_DIR[0]=lx; LIGHT_DIR[1]=ly; LIGHT_DIR[2]=lz;

  var cx=0, cy=0, cz=0;
  var dist = 62;
  m4lookAt(lightView, cx + lx*dist, cy + ly*dist, cz + lz*dist, cx, cy, cz, 0,1,0);
  m4ortho(lightProj, -30, 30, -30, 30, 1, 130);
  m4mul(lightVP, lightProj, lightView);
}

function audioReady(){
  if(!actx) return false;
  if(actx.state === 'suspended'){ try{ actx.resume(); }catch(e){} }
  return actx.state !== 'closed';
}

function sGun(){
  if(!audioReady()) return;
  var t = actx.currentTime;
  var dur = 0.14;
  var sr = actx.sampleRate;
  var n = Math.floor(sr*dur);
  var buf = actx.createBuffer(1,n,sr);
  var d = buf.getChannelData(0);
  for(var i=0;i<n;i++){
    var env = Math.pow(1-i/n,3);
    d[i] = (Math.random()*2-1)*env;
  }
  var src = actx.createBufferSource(); src.buffer = buf;
  var bp = actx.createBiquadFilter();
  bp.type='bandpass'; bp.frequency.value=1400; bp.Q.value=0.7;
  var g = actx.createGain();
  g.gain.setValueAtTime(0.44,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(actx.destination);
  src.start(t);
  var o = actx.createOscillator();
  o.type='triangle';
  o.frequency.setValueAtTime(170,t);
  o.frequency.exponentialRampToValueAtTime(52,t+0.08);
  var og = actx.createGain();
  og.gain.setValueAtTime(0.24,t);
  og.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  o.connect(og); og.connect(actx.destination);
  o.start(t); o.stop(t+0.09);
}

var enemies = [];

function newAnim(){

    pelvisYaw:0, pelvisYawT:0,

    spineRoll:0, spineRollT:0,

    pelvisY:0.95, pelvisYT:0.95,
    hipR:0, hipRT:0, kneeR:0, kneeRT:0,
    hipL:0, hipLT:0, kneeL:0, kneeLT:0,
    armRX:1.25, armRXT:1.25,
    armREX:0.55, armREXT:0.55,
    armRZ:-0.10, armRZT:-0.10,
    armLX:1.20, armLXT:1.20,
    armLEX:0.45, armLEXT:0.45,
    armLZ:0.85, armLZT:0.85,
    bank:0, bankT:0,
    flinch:0, phase:0
  };
}

function initEnemies(){
  enemies.length = 0;
  var homes = [[-6,-7],[7,-11],[-11,1]];
  for(var i=0;i<3;i++){
    enemies.push({
      id:i,
      x:homes[i][0], z:homes[i][1],
      hx:homes[i][0], hz:homes[i][1],
      yaw:0,
      hp:100, alive:true, respawnT:0,
      mode:i,
      ai:{ state:0, timer:0.6+i*0.3, strafeDir:(i%2?1:-1), strafeTimer:0.6, fireCd:0.6 },
      anim:newAnim(),
      muzzle:[0,1.4,0],
      tracerT:0,
      tracerM:new Float32Array(16)
    });
  }
}
initEnemies();

function resolveEntity(e){
  var r = 0.36;
  for(var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if(o.flat) continue;
    var dx = e.x - o.x, dz = e.z - o.z;
    var ox = o.hw + r - Math.abs(dx);
    var oz = o.hd + r - Math.abs(dz);
    if(ox>0 && oz>0){
      if(ox<oz) e.x += (dx>=0?1:-1)*ox;
      else      e.z += (dz>=0?1:-1)*oz;
    }
  }
  if(e.x < -BOUND+r) e.x = -BOUND+r;
  if(e.x >  BOUND-r) e.x =  BOUND-r;
  if(e.z < -BOUND+r) e.z = -BOUND+r;
  if(e.z >  BOUND-r) e.z =  BOUND-r;
}

function angDiff(a,b){
  var d = a-b;
  while(d >  Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  return d;
}

function updateEnemy(e,dt,time){
  if(!e.alive){
    e.respawnT -= dt;
    if(e.respawnT <= 0){
      e.alive = true; e.hp = 100;
      e.x = e.hx + (Math.random()-0.5)*2;
      e.z = e.hz + (Math.random()-0.5)*2;
      e.anim = newAnim();
      e.ai.state = 0; e.ai.timer = 0.8;
      e.ai.strafeTimer = 0.6; e.ai.fireCd = 0.6;
    }
    return;
  }

  var a = e.anim;
  var dx = player.x - e.x;
  var dz = player.z - e.z;
  var dist = Math.sqrt(dx*dx+dz*dz) || 0.01;
  var nx = dx/dist, nz = dz/dist;

  var targetYaw = Math.atan2(-nx,-nz);
  e.yaw += angDiff(targetYaw, e.yaw) * Math.min(1, dt*8);

  var mvx=0, mvz=0, spd=0;
  var pose='normal';

  if(e.mode === 0){
    /* 螃蟹步（ADAD 鬼步扭腰） */
    e.ai.strafeTimer -= dt;
    if(e.ai.strafeTimer <= 0){
      e.ai.strafeDir *= -1;
      e.ai.strafeTimer = 0.42 + Math.random()*0.5;
    }
    mvx = nz * e.ai.strafeDir;
    mvz = -nx * e.ai.strafeDir;
    spd = 0.95;
    if(dist > 9){ mvx += nx*0.35; mvz += nz*0.35; }
    if(dist < 4){ mvx -= nx*0.55; mvz -= nz*0.55; }

    e.ai.fireCd -= dt;
    if(e.ai.fireCd <= 0 && dist < 22){
      e.ai.fireCd = 0.55 + Math.random()*0.5;
      fireTracer(e);
      sEnemyShot();
    }
  } else if(e.mode === 1){
    /* 戰術衝刺 → 滑鏟 → 起身 */
    e.ai.timer -= dt;
    if(e.ai.state === 0){
      mvx = nx; mvz = nz; spd = 1.5; pose = 'sprint';
      if(e.ai.timer <= 0){ e.ai.state=1; e.ai.timer=0.62; }
    } else if(e.ai.state === 1){
      mvx = nx; mvz = nz; spd = 1.15; pose = 'slide';
      if(e.ai.timer <= 0){ e.ai.state=2; e.ai.timer=0.28; }
    } else if(e.ai.state === 2){
      pose = 'slideEnd';
      if(e.ai.timer <= 0){ e.ai.state=3; e.ai.timer=2.0; e.ai.strafeTimer=0.5; }
    } else {
      e.ai.strafeTimer -= dt;
      if(e.ai.strafeTimer <= 0){ e.ai.strafeDir *= -1; e.ai.strafeTimer = 0.5; }
      mvx = nz * e.ai.strafeDir;
      mvz = -nx * e.ai.strafeDir;
      spd = 0.82;
      if(e.ai.timer <= 0){ e.ai.state=0; e.ai.timer=1.3; }
    }
  } else {
    e.ai.timer -= dt;
    if(e.ai.state === 0){
      var ang = time*0.32 + e.id*2.1;
      var tx = Math.cos(ang)*9;
      var tz = Math.sin(ang)*7;
      var tdx = tx-e.x, tdz = tz-e.z;
      var tl = Math.sqrt(tdx*tdx+tdz*tdz) || 1;
      mvx = tdx/tl; mvz = tdz/tl; spd = 1.15; pose = 'sprint';
      if(dist < 9 && e.ai.timer <= 0){ e.ai.state=1; e.ai.timer=0.85; }
    } else if(e.ai.state === 1){
      mvx = nx; mvz = nz; spd = 1.55; pose = 'dive';
      if(e.ai.timer <= 0){ e.ai.state=2; e.ai.timer=1.1; }
    } else {
      spd = 0; pose = 'prone';
      if(e.ai.timer <= 0){ e.ai.state=0; e.ai.timer=2.0; }
    }
  }

  var ml = Math.sqrt(mvx*mvx+mvz*mvz);
  if(ml > 1e-4){ mvx/=ml; mvz/=ml; } else { mvx=0; mvz=0; }

  if(spd > 0){
    e.x += mvx * 4.6 * spd * dt;
    e.z += mvz * 4.6 * spd * dt;
    resolveEntity(e);
  }

  var strafe = mvx*nz - mvz*nx;

  /* ---- 重置目標姿勢 ---- */
  a.pelvisYawT = 0;
  a.pelvisYT   = 0.95;
  a.spinePitchT= 0.04;
  a.spineRollT = 0;
  a.headPitchT = 0;
  a.headYawT   = 0;
  a.armRXT = 1.25; a.armREXT = 0.55; a.armRZT = -0.10;
  a.armLXT = 1.20; a.armLEXT = 0.45; a.armLZT = 0.85;
  a.bankT  = -strafe * 0.14;

  if(pose === 'slide'){
    a.pelvisYT = 0.44;
    a.hipRT = 1.25; a.kneeRT = -1.55;
    a.hipLT = 0.35; a.kneeLT = -0.90;
    a.spinePitchT = 0.16;
    a.armRXT = 1.45; a.armREXT = 0.35;
    a.armLXT = 1.40; a.armLEXT = 0.30;
  } else if(pose === 'slideEnd'){
    a.pelvisYT = 0.78;
    a.hipRT = 0.55; a.kneeRT = -1.15;
    a.hipLT = 0.25; a.kneeLT = -0.70;
    a.spinePitchT = 0.10;
  } else if(pose === 'dive'){
    a.pelvisYT = 0.62;
    a.spinePitchT = 1.28;
    a.hipRT = -0.45; a.kneeRT = -0.30;
    a.hipLT = -0.45; a.kneeLT = -0.30;
    a.armRXT = 0.75; a.armREXT = 0.55;
    a.armLXT = 0.70; a.armLEXT = 0.50;
  } else if(pose === 'prone'){
    a.pelvisYT = 0.34;
    a.spinePitchT = 1.42;
    a.hipRT = -0.22; a.kneeRT = -0.16;
    a.hipLT = -0.22; a.kneeLT = -0.16;
    a.armRXT = 0.55; a.armREXT = 0.45;
    a.armLXT = 0.50; a.armLEXT = 0.40;
  } else if(pose === 'sprint'){
    a.spinePitchT = -0.18;
    a.pelvisYT = 0.90;
    a.phase += dt * (8 + spd*6);
    var sw = Math.sin(a.phase) * 0.95;
    a.hipRT =  sw; a.hipLT = -sw;
    a.kneeRT = -Math.max(0,-sw)*1.25 - Math.abs(Math.cos(a.phase))*0.35;
    a.kneeLT = -Math.max(0, sw)*1.25 - Math.abs(Math.cos(a.phase))*0.35;
    a.armRXT = 1.10; a.armREXT = 0.70;
    a.armLXT = 1.05; a.armLEXT = 0.65;
  } else {
    a.phase += dt * (5 + spd*7);
    var sw2 = Math.sin(a.phase) * 0.66 * Math.min(1, spd + 0.25);
    a.hipRT =  sw2; a.hipLT = -sw2;
    a.kneeRT = -Math.max(0,-sw2)*1.15 - Math.abs(Math.cos(a.phase))*0.30*spd;
    a.kneeLT = -Math.max(0, sw2)*1.15 - Math.abs(Math.cos(a.phase))*0.30*spd;

    if(Math.abs(strafe) > 0.30 && spd > 0.25){
      a.pelvisYawT = strafe * 1.05;
      a.pelvisYT   = 0.84;
      a.kneeRT -= 0.26;
      a.kneeLT -= 0.26;
    }
  }

  if(a.flinch > 0){
    a.flinch -= dt * 5.5;
    if(a.flinch < 0) a.flinch = 0;
  }
  var fl = Math.sin(a.flinch * 26) * a.flinch;

  a.pelvisYaw = damp(a.pelvisYaw, a.pelvisYawT, 0.15, dt);
  a.pelvisY   = damp(a.pelvisY,   a.pelvisYT,   0.16, dt);
  a.spinePitch= damp(a.spinePitch,a.spinePitchT,0.16, dt) + fl*0.35;
  a.spineRoll = damp(a.spineRoll, a.spineRollT, 0.12, dt);
  a.headPitch = damp(a.headPitch, a.headPitchT, 0.20, dt) + fl*0.55;
  a.headYaw   = damp(a.headYaw,   a.headYawT,   0.20, dt);
  a.hipR = damp(a.hipR, a.hipRT, 0.22, dt);
  a.kneeR= damp(a.kneeR,a.kneeRT,0.22, dt);
  a.hipL = damp(a.hipL, a.hipLT, 0.22, dt);
  a.kneeL= damp(a.kneeL,a.kneeLT,0.22, dt);
  a.armRX= damp(a.armRX,a.armRXT,0.20, dt);
  a.armREX= damp(a.armREX,a.armREXT,0.20, dt);
  a.armRZ= damp(a.armRZ,a.armRZT,0.20, dt);
  a.armLX= damp(a.armLX,a.armLXT,0.20, dt);
  a.armLEX= damp(a.armLEX,a.armLEXT,0.20, dt);
  a.armLZ= damp(a.armLZ,a.armLZT,0.20, dt);
  a.bank = damp(a.bank, a.bankT, 0.11, dt);
}

function buildSoldier(e){
  var a = e.anim;

   曳光彈
   ============================================================ */
function fireTracer(e){
  var sx = e.muzzle[0], sy = e.muzzle[1], sz = e.muzzle[2];
  var ex = player.x + (Math.random()-0.5)*0.9;
  var ey = player.y + player.curH*0.75 + (Math.random()-0.5)*0.4;
  var ez = player.z + (Math.random()-0.5)*0.9;
  var dx = ex-sx, dy = ey-sy, dz = ez-sz;
  var len = Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(len < 0.01) return;
  var yaw = Math.atan2(dx,dz);
  var pitch = -Math.asin(dy/len);
  var mx = (sx+ex)/2, my = (sy+ey)/2, mz = (sz+ez)/2;
  setTRS(e.tracerM, mx, my, mz, pitch, yaw, 0, 0.020, 0.020, len);
  e.tracerT = 0.07;
}

/* ============================================================
   射擊
   ============================================================ */
function rayAABB(ox,oy,oz,dx,dy,dz,minx,miny,minz,maxx,maxy,maxz){
  var tmin = 0, tmax = 1e9;
  var O = [ox,oy,oz], D = [dx,dy,dz];
  var MN = [minx,miny,minz], MX = [maxx,maxy,maxz];
  for(var i=0;i<3;i++){
    if(Math.abs(D[i]) < 1e-7){
      if(O[i] < MN[i] || O[i] > MX[i]) return null;
    } else {
      var t1 = (MN[i]-O[i])/D[i];
      var t2 = (MX[i]-O[i])/D[i];
      if(t1>t2){ var tmp=t1; t1=t2; t2=tmp; }
      if(t1>tmin) tmin=t1;
      if(t2<tmax) tmax=t2;
      if(tmin>tmax) return null;
    }
  }
  return tmin;
}

function showHit(){
  crossEl.classList.add('hit');
  clearTimeout(showHit._t);
  showHit._t = setTimeout(function(){ crossEl.classList.remove('hit'); }, 90);
}

function playerShoot(){
  if(reload.active) return;
  if(gun.mag <= 0){
    sEmpty();
    startReload();
    return;
  }
  var now = performance.now()/1000;
  if(now - gun.lastFire < gun.fireInterval) return;
  gun.lastFire = now;
  gun.mag--;

  sGun();
  player.recoil = 1;
  player.recoilH = (Math.random()-0.5)*0.5;
  hitFlash = 0.055;

  var recScale = 1 - player.ads*0.42;
  player.pitch += (0.020 + Math.random()*0.014) * recScale;
  player.yaw   += (Math.random()-0.5)*0.009 * recScale;
  player.pitch = clamp(player.pitch,-1.25,1.25);
  player.shake = Math.min(0.05, player.shake + 0.021*recScale);

  var cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  var fx = -Math.sin(player.yaw)*cp;
  var fy =  sp;
  var fz = -Math.cos(player.yaw)*cp;

  var eyeY = player.y + player.curH;
  var ox = player.x, oy = eyeY, oz = player.z;

  var bestE = null, bestT = 1e9;
  for(var i=0;i<enemies.length;i++){
    var e = enemies[i];
    if(!e.alive) continue;
    var t = rayAABB(ox,oy,oz,fx,fy,fz,
      e.x-0.38, 0.0, e.z-0.38,
      e.x+0.38, 2.10, e.z+0.38);
    if(t !== null && t < bestT){ bestT = t; bestE = e; }
  }

  if(bestE){
    bestE.hp -= 34;
    bestE.anim.flinch = 1;
    sHit();
    showHit();
    if(bestE.hp <= 0){
      bestE.alive = false;
      bestE.respawnT = 3;
    }
  }
}

/* ============================================================
   三段式換彈
   ============================================================ */
function startReload(){
  if(reload.active) return;
  if(gun.mag >= gun.magSize) return;
  if(gun.reserve <= 0) return;
  reload.active = true;
  reload.t = 0;
  reload.phase = 0;
  firing = false;
  adsHold = false;
  player.ads = 0;
  reloadTxtEl.style.display = 'block';
  sMagOut();
}

function updateReload(dt){
  if(!reload.active){
    if(reloadTxtEl.style.display !== 'none') reloadTxtEl.style.display = 'none';
    return;
  }
  reload.t += dt;
  var p = reload.t / reload.dur;
  if(p >= 1){
    var need = gun.magSize - gun.mag;
    var take = Math.min(need, gun.reserve);
    gun.mag += take;
    gun.reserve -= take;
    reload.active = false;
    reload.t = 0;
    reload.phase = 0;
    reloadTxtEl.style.display = 'none';
    return;
  }
  if(reload.phase === 0 && p >= 0.30){
    reload.phase = 1;
    sMagIn();
  } else if(reload.phase === 1 && p >= 0.75){
    reload.phase = 2;
    sBolt();
  }
}

  var handOffsetY = 0, handOffsetZ = 0;
  var boltKick = 0;

  if(reload.active){
    var bell = Math.sin(Math.min(1,p*1.15) * Math.PI);
    rlTiltZ = bell * 0.55;
    rlTiltX = bell * 0.35;
    rlDownY = bell * 0.09;

    if(p < 0.30){
      var mp1 = p / 0.30;
      magDrop = mp1 * 0.42;
      magTilt = mp1 * 0.35;
    } else if(p < 0.50){
      var mp2 = 1 - (p - 0.30) / 0.20;
      magDrop = mp2 * 0.42;
      magTilt = mp2 * 0.35;
    }

    if(p < 0.55){
      var hp = Math.sin(Math.min(1,p/0.55) * Math.PI);
      handOffsetY = hp * 0.10;
      handOffsetZ = hp * 0.05;
    } else if(p < 0.85){
      var hp2 = Math.sin(Math.min(1,(p-0.55)/0.30) * Math.PI);
      handOffsetY = -hp2 * 0.04;
      handOffsetZ = -hp2 * 0.02;

  pushDraw(m, MESH_CYL, M_GUN_BLK, true);

  /* 鏡片（半透明玻璃感） */
  m = mp();
  setTRS(tL, 0, 0.126, -0.096, Math.PI/2, 0, 0, 0.038, 0.008, 0.038);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_CYL, M_GOGGLE, true);

  /* 發光紅色全息準星環 */
  m = mp();
  setTRS(tL, 0, 0.126, -0.101, Math.PI/2, 0, 0, 0.016, 0.004, 0.016);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_CYL, M_RED_DOT, true);

  /* ---- 彈匣（帶換彈動畫） ---- */
  m = mp();
  setTRS(tL, 0, -0.122 - magDrop, 0.06 - magDrop*0.4,
         magTilt, 0, 0,
         0.052, 0.155, 0.085);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_BOX, M_GUN_POLY, true);

  /* ---- 戰術握把 ---- */
  m = mp();
  setTRS(tL, 0, -0.112, -0.22, 0.16, 0, 0, 0.034, 0.125, 0.046);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_BOX, M_GUN_POLY, true);

  /* ---- 槍托緩衝管（圓柱） ---- */
  m = mp();
  setTRS(tL, 0, 0.012, 0.29, Math.PI/2, 0, 0, 0.026, 0.17, 0.026);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_CYL, M_GUN_BLK, true);

  /* 槍托底板 */
  m = mp();
  setTRS(tL, 0, -0.008, 0.38, 0,0,0, 0.048, 0.085, 0.045);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_BOX, M_GUN_POLY, true);

  /* ---- 扳機護圈 ---- */
  m = mp();
  setTRS(tL, 0, -0.066, 0.04, 0,0,0, 0.020, 0.032, 0.06);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_BOX, M_GUN_BLK, true);

  /* ---- 右手（握把） ---- */
  m = mp();
  setTRS(tL, 0.005, -0.108, 0.115, 0.22, -0.14, 0, 0.070, 0.095, 0.095);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_SPH, M_GLOVE, true);

  m = mp();
  setTRS(tL, 0.042, -0.092, 0.098, 0.5, 0, 0, 0.028, 0.055, 0.050);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_BOX, M_GLOVE, true);

  /* ---- 左手（護木 + 換彈動畫） ---- */
  m = mp();
  setTRS(tL,
        -0.008 + (reload.active ? -0.05*Math.sin(p*Math.PI) : 0),
        -0.086 + handOffsetY,
        -0.225 + handOffsetZ,
        0.16, 0.22, 0,
        0.068, 0.090, 0.095);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_SPH, M_GLOVE, true);

  m = mp();
  setTRS(tL, -0.052, -0.072 + handOffsetY, -0.225 + handOffsetZ,
        0.4, 0, 0,
        0.026, 0.052, 0.048);
  m4mul(m, mGunW, tL);
  pushDraw(m, MESH_BOX, M_GLOVE, true);

  /* ---- 槍口火光 ---- */
  if(hitFlash > 0){
    m = mp();
    var fsc = 0.11 + (1 - hitFlash/0.055) * 0.09;
    setTRS(tL, 0, 0.002, -0.72, Math.PI/2, 0, 0, fsc, fsc, fsc);
    m4mul(m, mGunW, tL);
    pushDraw(m, MESH_SPH, M_FLASH, true);

    m = mp();
    setTRS(tL, 0, 0.002, -0.80, Math.PI/2, 0, 0, fsc*0.55, fsc*1.5, fsc*0.55);
    m4mul(m, mGunW, tL);
    pushDraw(m, MESH_CYL, M_FLASH, true);
  }
}

/* ============================================================
   場景構建
   ============================================================ */
function buildScene(){
  /* 地面 */
  var m = mp();
  setTRS(m, 0, -0.10, 0, 0,0,0, GROUND, 0.20, GROUND);
  pushDraw(m, MESH_BOX, M_GROUND);

  /* 掩體 */
  for(var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if(o.type === 'flat'){
      var mf = mp();
      setTRS(mf, o.x, 0.016, o.z, 0,0,0, o.hw*2, 0.03, o.hd*2);
      pushDraw(mf, MESH_BOX, o.mat);
    } else if(o.type === 'barrel'){
      var mb = mp();
      setTRS(mb, o.x, o.h/2, o.z, 0,0,0, o.r, o.h, o.r);
      pushDraw(mb, MESH_CYL, M_BARREL);
      var mr = mp();
      setTRS(mr, o.x, o.h + 0.012, o.z, 0,0,0, o.r*0.92, 0.03, o.r*0.92);
      pushDraw(mr, MESH_CYL, M_METAL_GRY);
    } else if(o.type === 'sand'){
      /* 堆疊沙袋（圓潤造型） */
      var layers = o.layers;
      var perRow = 4;
      for(var L=0; L<layers; L++){
        var rowW = o.w * (1 - L*0.06);
        var rowD = o.d * (1 - L*0.05);
        var cnt = perRow - (L%2);
        for(var c=0; c<cnt; c++){
          var t = cnt===1 ? 0.5 : c/(cnt-1);
          var bx = o.x - rowW/2 + t*rowW;
          var by = L*0.215 + 0.11;
          var bz = o.z + (L%2 ? 0.06 : -0.06);
          var mm = mp();
          setTRS(mm, bx, by, bz, 0, (Math.random()-0.5)*0.1, 0,
                 0.20, 0.135, rowD*0.5);
          pushDraw(mm, MESH_SPH, M_SANDBAG);
        }
      }
    } else {
      var mm2 = mp();
      setTRS(mm2, o.x, o.h/2, o.z, 0,0,0, o.hw*2, o.h, o.hd*2);
      pushDraw(mm2, MESH_BOX, o.mat);
    }
  }

  /* 背景城市建築 */
  for(var b=0;b<buildings.length;b++){
    var bd = buildings[b];
    var mb2 = mp();
    setTRS(mb2, bd.x, bd.h/2, bd.z, 0,0,0, bd.w, bd.h, bd.d);
    pushDraw(mb2, MESH_BOX, (b%2) ? M_BUILDING : M_BUILDING2);

    /* 樓層線條 */
    var floors = Math.floor(bd.h / 3.2);
    for(var f=1; f<floors; f++){
      var mf2 = mp();
      setTRS(mf2, bd.x, f*3.2, bd.z, 0,0,0, bd.w*1.02, 0.16, bd.d*1.02);
      pushDraw(mf2, MESH_BOX, M_CONCRETE);
    }

    /* 玻璃窗反光 */
    var cols = Math.max(2, Math.floor(bd.w/2.4));
    for(var f2=0; f2<floors; f2++){
      for(var cc=0; cc<cols; cc++){
        var wx = bd.x - bd.w/2 + (cc+0.5)*(bd.w/cols);
        var wy = f2*3.2 + 1.9;
        var mw = mp();
        setTRS(mw, wx, wy, bd.z - bd.d/2 - 0.02, 0,0,0, bd.w/cols*0.62, 1.25, 0.06);
        pushDraw(mw, MESH_BOX, M_WINDOW);
      }
    }

    /* 屋頂天線 */
    var ma = mp();
    setTRS(ma, bd.x + bd.w*0.2, bd.h + 1.6, bd.z, 0,0,0, 0.07, 3.2, 0.07);
    pushDraw(ma, MESH_CYL8, M_METAL_GRY);
    var ma2 = mp();
    setTRS(ma2, bd.x + bd.w*0.2, bd.h + 2.6, bd.z, 0,0,0, 0.6, 0.05, 0.05);
    pushDraw(ma2, MESH_BOX, M_METAL_GRY);
  }

  /* 外圍圍牆 + 鐵絲網柱 */
  var wallPos = [
    {x:0, z:-BOUND-1.2, w:GROUND+4, d:0.6, h:2.6},
    {x:0, z: BOUND+1.2, w:GROUND+4, d:0.6, h:2.6},
    {x:-BOUND-1.2, z:0, w:0.6, d:GROUND+4, h:2.6},
    {x: BOUND+1.2, z:0, w:0.6, d:GROUND+4, h:2.6}
  ];
  for(var w2=0; w2<wallPos.length; w2++){
    var wp = wallPos[w2];
    var mw2 = mp();
    setTRS(mw2, wp.x, wp.h/2, wp.z, 0,0,0, wp.w, wp.h, wp.d);
    pushDraw(mw2, MESH_BOX, M_CONCRETE);
    /* 頂部鐵絲網柱 */
    var n = 10;
    for(var p2=0; p2<n; p2++){
      var t2 = (p2+0.5)/n - 0.5;
      var px = wp.x + (wp.w > wp.d ? t2*wp.w : 0);
      var pz = wp.z + (wp.w > wp.d ? 0 : t2*wp.d);
      var mPost = mp();
      setTRS(mPost, px, wp.h + 0.35, pz, 0,0,0, 0.05, 0.7, 0.05);
      pushDraw(mPost, MESH_CYL8, M_METAL_GRY);
    }
  }
}

/* ============================================================
   玩家更新
   ============================================================ */
function updatePlayer(dt){
  var adsTarget = (adsHold && !reload.active && !player.sliding) ? 1 : 0;
  player.ads = damp(player.ads, adsTarget, 0.20, dt);

  if(crouchQ){
    crouchQ = false;
    var speedNow = Math.sqrt(player.vx*player.vx + player.vz*player.vz);
    if(player.grounded && !player.sliding && speedNow > 3.0){
      player.sliding = true;
      player.slideT = 0.70;
    } else {
      player.crouching = !player.crouching;
    }
  }

  if(jumpQ){
    jumpQ = false;
    if(player.grounded){
      player.vy = JUMP_V;
      player.grounded = false;
      if(player.sliding){ player.sliding = false; player.slideT = 0; }
    }
  }

  if(player.sliding){
    player.slideT -= dt;
    if(player.slideT <= 0) player.sliding = false;
  }

  var targetH = EYE_BASE;
  if(player.sliding || player.crouching) targetH = CROUCH_H;
  player.curH = damp(player.curH, targetH, 0.18, dt);

  var ix = stickX, iy = stickY;
  var mag = Math.sqrt(ix*ix+iy*iy);
  if(mag > 1){ ix/=mag; iy/=mag; mag = 1; }

  var cy = Math.cos(player.yaw), sy = Math.sin(player.yaw);
  var fwdX = -sy, fwdZ = -cy;
  var rgtX =  cy, rgtZ = -sy;

  var moveF = -iy;
  var moveR =  ix;

  var wx = fwdX*moveF + rgtX*moveR;
  var wz = fwdZ*moveF + rgtZ*moveR;

  var sprint = (mag > 0.90) && player.ads < 0.2 && !player.sliding && !reload.active;
  player.sprinting = sprint;

  var sp = 4.6;
  if(sprint) sp *= 1.5;
  if(player.ads > 0.3) sp *= 0.58;
  if(player.sliding) sp = 8.4;
  if(reload.active) sp *= 0.6;

  player.vx = damp(player.vx, wx*sp, 0.18, dt);
  player.vz = damp(player.vz, wz*sp, 0.18, dt);

  if(player.sliding){
    player.vx *= (1 - 1.7*dt);
    player.vz *= (1 - 1.7*dt);
  }

  player.x += player.vx * dt;
  player.z += player.vz * dt;

  if(!player.grounded){
    player.vy -= GRAVITY * dt;
    player.y += player.vy * dt;
    if(player.y <= 0){ player.y = 0; player.vy = 0; player.grounded = true; }
  }

  var r = 0.36;
  for(var i=0;i<obstacles.length;i++){
    var o = obstacles[i];
    if(o.flat) continue;
    if(player.y + 0.1 > o.h) continue;
    var dx = player.x - o.x, dz = player.z - o.z;
    var ox = o.hw + r - Math.abs(dx);
    var oz = o.hd + r - Math.abs(dz);
    if(ox>0 && oz>0){
      if(ox<oz) player.x += (dx>=0?1:-1)*ox;
      else      player.z += (dz>=0?1:-1)*oz;
    }
  }
  if(player.x < -BOUND+r) player.x = -BOUND+r;
  if(player.x >  BOUND-r) player.x =  BOUND-r;
  if(player.z < -BOUND+r) player.z = -BOUND+r;
  if(player.z >  BOUND-r) player.z =  BOUND-r;

  player.shake = Math.max(0, player.shake - dt*2.6);
  player.recoil = Math.max(0, player.recoil - dt*9);
  player.recoilH = damp(player.recoilH, 0, 0.25, dt);
  hitFlash = Math.max(0, hitFlash - dt);

  var dYaw = player.yaw - prevYaw;
  var dPitch = player.pitch - prevPitch;
  prevYaw = player.yaw;
  prevPitch = player.pitch;
  var swayTx = clamp(-dYaw*28, -0.055, 0.055);
  var swayTy = clamp(-dPitch*18, -0.045, 0.045);
  var swayRate = player.ads > 0.5 ? 0.28 : 0.14;
  gunSwayX = damp(gunSwayX, swayTx, swayRate, dt);
  gunSwayY = damp(gunSwayY, swayTy, swayRate, dt);

  var cs = 1.0;
  if(player.ads > 0.5) cs = 0.55;
  else if(sprint) cs = 1.35;
  crossEl.style.transform = 'scale('+cs+')';
  crossEl.style.opacity = (player.ads > 0.9) ? 0 : 0.9;
  sblackEl.style.opacity =
    player.ads > 0.82 ? ((player.ads-0.82)/0.18).toFixed(2) : 0;

  if(firing && !reload.active) playerShoot();

  if(gun.mag === 0 && !reload.active && gun.reserve > 0){
    startReload();
  }
}

/* ============================================================
   HUD
   ============================================================ */
function updateHUD(){
  var txt = gun.mag + ' / ' + gun.reserve;
  if(ammoEl.textContent !== txt) ammoEl.textContent = txt;
  if(gun.mag < 8){
    if(!ammoEl.classList.contains('low')) ammoEl.classList.add('low');
  } else {
    if(ammoEl.classList.contains('low')) ammoEl.classList.remove('low');
  }
}

/* ============================================================
   渲染
   ============================================================ */
var projM = new Float32Array(16);
var viewM = new Float32Array(16);
var vpM   = new Float32Array(16);
var aspect = 1;
var curFov = 72;
var curTex = null;

function resize(){
  var w = window.innerWidth;
  var h = window.innerHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cw = Math.floor(w*dpr);
  var chh = Math.floor(h*dpr);
  if(canvas.width !== cw || canvas.height !== chh){
    canvas.width = cw;
    canvas.height = chh;
  }
  gl.viewport(0,0,cw,chh);
  aspect = w/h;
}
window.addEventListener('resize', resize);
resize();

function bindTex(tex){
  if(curTex === tex) return;
  curTex = tex;
  if(tex){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(uTex, 0);
    gl.uniform1f(uUseTex, 1.0);
  } else {
    gl.uniform1f(uUseTex, 0.0);
  }
}

function setupAttribs(progPos, posOnly){
  gl.bindBuffer(gl.ARRAY_BUFFER, null);
  if(posOnly){
    gl.enableVertexAttribArray(progPos);
    gl.disableVertexAttribArray(aNrm);
    gl.disableVertexAttribArray(aUV);
  }
}

function render(eyeY){
  /* ---------- 陰影 Pass ---------- */
  if(shadowsEnabled && shadowProg){
    gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFB);
    gl.viewport(0,0,SHADOW_SIZE,SHADOW_SIZE);
    gl.clearColor(1,1,1,1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.useProgram(shadowProg);
    gl.uniformMatrix4fv(sULightVP, false, lightVP);

    gl.enableVertexAttribArray(sAPos);
    gl.disableVertexAttribArray(aNrm);
    gl.disableVertexAttribArray(aUV);

    var lastMeshS = null;
    for(var i=0;i<drawCount;i++){
      var ds = drawList[i];
      if(ds.noShadow) continue;
      if(ds.mesh !== lastMeshS){
        gl.bindBuffer(gl.ARRAY_BUFFER, ds.mesh.vbo);
        gl.vertexAttribPointer(sAPos, 3, gl.FLOAT, false, 32, 0);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ds.mesh.ibo);
        lastMeshS = ds.mesh;
      }
      gl.uniformMatrix4fv(sUModel, false, ds.m);
      gl.drawElements(gl.TRIANGLES, ds.mesh.count, gl.UNSIGNED_SHORT, 0);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  /* ---------- 主 Pass ---------- */
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.68,0.72,0.78,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);

  var shakeX = (Math.random()-0.5) * player.shake;
  var shakeY = (Math.random()-0.5) * player.shake;
  var speed = Math.sqrt(player.vx*player.vx + player.vz*player.vz);
  var bob = Math.sin(player.bob) * 0.018 * Math.min(1, speed/3);

  buildView(viewM, player.x + shakeX, eyeY + bob + shakeY, player.z, player.yaw, player.pitch);

  var targetFov = 72;
  if(player.ads > 0.5) targetFov = 50;
  else if(speed > 6) targetFov = 80;
  curFov = damp(curFov, targetFov, 0.15, 1/60);

  m4persp(projM, curFov*Math.PI/180, aspect, 0.05, 190);
  m4mul(vpM, projM, viewM);

  gl.uniformMatrix4fv(uVP, false, vpM);
  gl.uniformMatrix4fv(uLightVPm, false, lightVP);
  gl.uniform3f(uLightDir, LIGHT_DIR[0], LIGHT_DIR[1], LIGHT_DIR[2]);
  gl.uniform3f(uLightCol, 1.0, 0.92, 0.80);
  gl.uniform3f(uAmbient, 0.55, 0.60, 0.70);
  gl.uniform3f(uCam, player.x, eyeY, player.z);
  gl.uniform3f(uFogCol, 0.72, 0.76, 0.82);
  gl.uniform1f(uFogNear, 48.0);
  gl.uniform1f(uFogFar, 140.0);
  gl.uniform1f(uToneExp, 1.28);

  if(shadowsEnabled){
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    gl.uniform1i(uShadowMap, 1);
    gl.uniform1f(uShadowOn, 1.0);
  } else {
    gl.uniform1f(uShadowOn, 0.0);
  }

  gl.enableVertexAttribArray(aPos);
  gl.enableVertexAttribArray(aNrm);
  gl.enableVertexAttribArray(aUV);

  curTex = undefined;
  var lastMesh = null;

  for(var i=0;i<drawCount;i++){
    var d = drawList[i];
    var mat = d.mat;
    if(d.mesh !== lastMesh){
      gl.bindBuffer(gl.ARRAY_BUFFER, d.mesh.vbo);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 32, 0);
      gl.vertexAttribPointer(aNrm, 3, gl.FLOAT, false, 32, 12);
      gl.vertexAttribPointer(aUV,  2, gl.FLOAT, false, 32, 24);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.mesh.ibo);
      lastMesh = d.mesh;
    }
    gl.uniformMatrix4fv(uModel, false, d.m);
    gl.uniform3f(uColor, mat.c[0], mat.c[1], mat.c[2]);
    gl.uniform1f(uMetal, mat.metal);
    gl.uniform1f(uRough, mat.rough);
    gl.uniform2f(uTiling, mat.tiling[0], mat.tiling[1]);
    bindTex(mat.tex);
    gl.drawElements(gl.TRIANGLES, d.mesh.count, gl.UNSIGNED_SHORT, 0);
  }

  /* 曳光彈 */
  for(var k=0;k<enemies.length;k++){
    var e = enemies[k];
    if(e.tracerT > 0 && e.alive){
      gl.bindBuffer(gl.ARRAY_BUFFER, MESH_CYL.vbo);
      gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 32, 0);
      gl.vertexAttribPointer(aNrm, 3, gl.FLOAT, false, 32, 12);
      gl.vertexAttribPointer(aUV,  2, gl.FLOAT, false, 32, 24);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, MESH_CYL.ibo);
      gl.uniformMatrix4fv(uModel, false, e.tracerM);
      gl.uniform3f(uColor, M_TRACER.c[0], M_TRACER.c[1], M_TRACER.c[2]);
      gl.uniform1f(uMetal, M_TRACER.metal);
      gl.uniform1f(uRough, M_TRACER.rough);
      gl.uniform2f(uTiling, 1, 1);
      bindTex(null);
      gl.drawElements(gl.TRIANGLES, MESH_CYL.count, gl.UNSIGNED_SHORT, 0);
    }
  }
}

/* ============================================================
   主循環
   ============================================================ */
var lastT = performance.now();
var fpsAcc = 0, fpsFrames = 0;

function loop(now){
  requestAnimationFrame(loop);

  var dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.05) dt = 0.05;
  if(dt <= 0) dt = 0.001;

  var time = now / 1000;

  updatePlayer(dt);
  updateReload(dt);
  updateHUD();

  player.bob += dt * (Math.sqrt(player.vx*player.vx+player.vz*player.vz) > 5 ? 13 : 8);

  for(var i=0;i<enemies.length;i++){
    updateEnemy(enemies[i], dt, time);
    if(enemies[i].tracerT > 0) enemies[i].tracerT -= dt;
  }

  drawCount = 0;
  mpReset();

  buildScene();
  for(var j=0;j<enemies.length;j++){
    if(enemies[j].alive) buildSoldier(enemies[j]);
  }

  var eyeY = player.y + player.curH;
  buildPlayerGun(eyeY);

  render(eyeY);

  fpsAcc += dt;
  fpsFrames++;
  if(fpsAcc >= 0.5){
    var f = Math.round(fpsFrames/fpsAcc);
    fpsEl.textContent = 'FPS ' + f;
    fpsAcc = 0;
    fpsFrames = 0;
  }
}

requestAnimationFrame(loop);

document.getElementById('reset').addEventListener('click', function(ev){
  ev.stopPropagation();
  initEnemies();
  gun.mag = 30;
  gun.reserve = 120;
  reload.active = false;
  reload.t = 0;
  reload.phase = 0;
  reloadTxtEl.style.display = 'none';
});

document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, {passive:false});

})();
</script>
