<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0e">
  <meta name="description" content="CODWZM 戰術行動 — Three.js 瀏覽器 FPS 示範。">
  <title>CODWZM 戰區手遊 - 戰術行動</title>
  <style>
    :root{color-scheme:dark;--gold:#d4af37;--panel:rgba(12,15,19,.82);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0a0b0e;color:#eee}body{touch-action:none}button{font:inherit;color:inherit;cursor:pointer;touch-action:none}#game-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;visibility:hidden;opacity:0;transition:opacity .25s}body[data-state=combat] #game-canvas{visibility:visible;opacity:1}
    #lobby-screen,#hud-screen{position:fixed;inset:0}#lobby-screen{z-index:3;display:flex;flex-direction:column;padding:calc(20px + var(--safe-t)) clamp(18px,5vw,56px) calc(20px + var(--safe-b));background:linear-gradient(115deg,rgba(8,10,13,.98),rgba(8,10,13,.72) 58%,rgba(8,10,13,.35))}body[data-state=combat] #lobby-screen{display:none}.lobby-header{display:flex;justify-content:space-between;align-items:center;gap:12px}.profile{display:flex;gap:12px;align-items:center}.avatar{display:grid;place-items:center;width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;font-weight:900;color:var(--gold)}.muted{color:#9ba0a7;font-size:.82rem}.currency{color:var(--gold);font:700 .9rem monospace}.lobby-main{display:flex;align-items:center;justify-content:space-between;gap:24px;flex:1;padding:2vw 4vw}.title{font-size:clamp(3rem,10vw,7.5rem);font-weight:950;letter-spacing:.1em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.35);line-height:.95}.tagline{margin-top:16px;color:var(--gold);letter-spacing:.16em}.menu{display:grid;gap:12px;width:min(340px,42vw)}.menu button{padding:16px 20px;text-align:left;border:1px solid #596069;background:rgba(255,255,255,.07);font-weight:750}.menu button:hover,.menu button:focus-visible{border-color:var(--gold);outline:2px solid var(--gold)}.menu .deploy{border:2px solid var(--gold);color:var(--gold);font-size:1.15rem;background:rgba(212,175,55,.14)}
    #hud-screen{z-index:2;display:none;pointer-events:none}body[data-state=combat] #hud-screen{display:block}.hud-top{position:absolute;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:center;padding:8px 22px;background:var(--panel);border-top:2px solid var(--gold);font:800 1.15rem monospace;white-space:nowrap}.blue{color:#55aaff}.red{color:#ff6158}.crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%)}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}.crosshair:before{width:2px;height:20px;left:12px;top:3px}.crosshair:after{height:2px;width:20px;top:12px;left:3px}.bottom-left,.bottom-right{position:absolute;bottom:calc(20px + var(--safe-b));background:var(--panel);padding:10px 14px;min-width:170px}.bottom-left{left:18px}.bottom-right{right:18px;text-align:right}.bar{height:12px;margin-top:5px;background:#28302d;width:180px}.bar>i{display:block;height:100%;background:#32c979;width:100%;transition:width .15s}.ammo{font:900 2.5rem monospace}.controls{position:absolute;right:18px;bottom:calc(125px + var(--safe-b));display:grid;grid-template-columns:repeat(2,62px);gap:10px;pointer-events:auto}.ctrl{width:62px;height:62px;border:1px solid #ffffff80;border-radius:50%;background:#20252bbd;font-size:.72rem;font-weight:800;user-select:none;-webkit-user-select:none}.ctrl.fire{grid-column:span 2;justify-self:center;width:76px;height:76px;border-color:#e74c3c;background:#7c2d2dbd}.ctrl:active{transform:scale(.94);background:#ffffff55}.joystick{position:absolute;left:24px;bottom:calc(26px + var(--safe-b));width:124px;height:124px;border:1px solid #ffffff55;border-radius:50%;background:#ffffff12;pointer-events:auto;touch-action:none}.knob{position:absolute;width:48px;height:48px;left:37px;top:37px;border:1px solid #fff9;border-radius:50%;background:#ffffff55;pointer-events:none}.status{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(90vw,540px);padding:16px 20px;background:#16191fee;border:1px solid var(--gold);text-align:center;display:none}.status.show{display:block}.status button{margin:12px 6px 0;padding:8px 14px;background:#272b30;border:1px solid #777}
    @media(max-width:700px){.lobby-main{flex-direction:column;justify-content:center;align-items:flex-start;padding:8vh 2vw 2vh}.menu{width:min(100%,360px)}.lobby-header{align-items:flex-start}.title{font-size:clamp(3rem,17vw,6rem)}.bottom-left{bottom:calc(18px + var(--safe-b));min-width:130px;padding:8px}.bar{width:130px}.bottom-right{right:12px;bottom:calc(18px + var(--safe-b));min-width:100px;padding:8px}.controls{right:12px;bottom:calc(132px + var(--safe-b));grid-template-columns:repeat(2,54px);gap:8px}.ctrl{width:54px;height:54px}.ctrl.fire{width:68px;height:68px}.joystick{width:112px;height:112px;left:18px}.knob{left:31px;top:31px}}
    @media(max-height:430px) and (orientation:landscape){.lobby-main{flex-direction:row;padding:0 3vw}.title{font-size:clamp(3rem,12vh,5rem)}.lobby-header{height:52px}.menu{gap:7px}.menu button{padding:10px 14px}.controls{bottom:calc(82px + var(--safe-b));grid-template-columns:repeat(3,48px)}.ctrl{width:48px;height:48px}.ctrl.fire{width:58px;height:58px;grid-column:3;grid-row:1/3}.joystick{width:90px;height:90px}.knob{left:20px;top:20px;width:46px;height:46px}}
  </style>
</head>
<body data-state="lobby">
  <canvas id="game-canvas" aria-label="3D 戰鬥遊戲畫面"></canvas>
  <main id="lobby-screen" aria-label="遊戲大廳">
    <header class="lobby-header"><div class="profile"><div class="avatar" aria-hidden="true">G</div><div><strong>GHOST_Operator</strong><div class="muted">LVL. 55 · 上尉</div></div></div><div class="currency" aria-label="貨幣">◈ 12,450　◆ 850</div></header>
    <section class="lobby-main"><div><div class="title">GHOST</div><div class="tagline">// SIMON “GHOST” RILEY</div></div><nav class="menu" aria-label="主選單"><button class="deploy" id="btn-deploy">進入戰區 / DEPLOY</button><button id="btn-loadout">武器配置 / LOADOUT</button><button id="btn-settings">系統設置 / SETTINGS</button></nav></section>
  </main>
  <section id="hud-screen" aria-label="戰鬥資訊"><div class="hud-top"><span class="blue" id="score-blue">0</span><span id="match-time">10:00</span><span class="red" id="score-red">0</span></div><div class="crosshair" aria-hidden="true"></div><div class="bottom-left"><span>ARMOR <b id="armor-value">150</b>　HP <b id="health-value">150</b></span><div class="bar"><i id="health-fill"></i></div></div><div class="bottom-right"><div>M4A1</div><div class="ammo"><span id="ammo-mag">30</span><small> / <span id="ammo-reserve">120</span></small></div></div><div class="joystick" id="joystick-area" aria-label="移動搖桿"><div class="knob" id="joystick-knob"></div></div><div class="controls"><button class="ctrl" id="btn-jump" aria-label="跳躍">JUMP</button><button class="ctrl" id="btn-crouch" aria-label="蹲下">CROUCH</button><button class="ctrl" id="btn-reload" aria-label="換彈">RELOAD</button><button class="ctrl fire" id="btn-fire" aria-label="開火">FIRE</button></div></section>
  <div class="status" id="status" role="alert" aria-live="assertive"></div>
  <script>
  (()=>{'use strict';
    const status=document.getElementById('status');
    function showError(message){status.textContent=message;status.classList.add('show');}
    function loadThree(){return new Promise((resolve,reject)=>{if(window.THREE)return resolve(window.THREE);const urls=['https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js','https://unpkg.com/three@0.128.0/build/three.min.js'];let i=0;const next=()=>{if(window.THREE)return resolve(window.THREE);if(i>=urls.length)return reject(new Error('Three.js 無法從備援 CDN 載入'));const s=document.createElement('script');s.src=urls[i++];s.async=true;s.onload=()=>window.THREE?resolve(window.THREE):next();s.onerror=next;document.head.appendChild(s)};next()})}
    const $=id=>document.getElementById(id);let THREE,scene,camera,renderer,clock,started=false,raf=0;let enemies=[],obstacles=[],keys=new Set(),move={x:0,y:0},health=150,armor=150,ammo=30,reserve=120,score=0,elapsed=0,fireTimer=0,jumpVelocity=0,onGround=true;const ray=new (class{constructor(){this.value=null}setFromCamera(p,c){this.value=new THREE.Raycaster();this.value.setFromCamera(p,c)}intersectObjects(o){return this.value.intersectObjects(o,true)}})();
    function addObstacle(x,z,w,h,d,color=0x465044){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.88}));mesh.position.set(x,h/2,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);obstacles.push({x,z,halfW:w/2,halfD:d/2,top:h,mesh});}
    function spawnEnemy(){const group=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0xb72d2d,roughness:.8});const torso=new THREE.Mesh(new THREE.CylinderGeometry(.28,.34,.95,8),mat);torso.position.y=1.05;group.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.22,8,6),mat);head.position.y=1.68;group.add(head);let x,z,tries=0;do{x=(Math.random()-.5)*34;z=(Math.random()-.5)*34;tries++}while(tries<30&&(Math.hypot(x-camera.position.x,z-camera.position.z)<7||obstacles.some(o=>Math.abs(x-o.x)<o.halfW+1&&Math.abs(z-o.z)<o.halfD+1)));group.position.set(x,0,z);group.userData={hp:100,alive:true,respawn:0,mat};scene.add(group);enemies.push(group)}
    function init(){const canvas=$('game-canvas');renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=false;scene=new THREE.Scene();scene.background=new THREE.Color(0x171b20);scene.fog=new THREE.Fog(0x171b20,35,100);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,150);camera.position.set(0,1.68,15);camera.rotation.order='YXZ';clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xdde8ff,0x35312b,2));const sun=new THREE.DirectionalLight(0xffe6bf,2);sun.position.set(-15,25,10);scene.add(sun);const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshStandardMaterial({color:0x303431,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);const grid=new THREE.GridHelper(120,60,0x55584f,0x30332f);grid.position.y=0;scene.add(grid);addObstacle(0,-5,9,3,1.4);addObstacle(-7,1,1.4,2.4,8);addObstacle(7,7,1.5,2.8,9);addObstacle(0,12,8,2,1.5);for(let i=0;i<14;i++)addObstacle((Math.random()-.5)*45,(Math.random()-.5)*45,1.2+Math.random()*1.5,1.2+Math.random()*2,1.2+Math.random()*1.5);for(let i=0;i<5;i++)spawnEnemy();clock.start();window.addEventListener('resize',resize,{passive:true});window.addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'){e.preventDefault();jump()}if(e.code==='KeyR')reload()});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('mousemove',e=>{if(document.pointerLockElement===canvas){look(e.movementX,e.movementY)} });canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&document.pointerLockElement!==canvas&&canvas.requestPointerLock)canvas.requestPointerLock();else if(e.pointerType!=='mouse'&&e.clientX>innerWidth*.42)canvas.dataset.lookId=String(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'&&canvas.dataset.lookId===String(e.pointerId)){look(e.movementX||0,e.movementY||0)}});for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,e=>{if(canvas.dataset.lookId===String(e.pointerId))delete canvas.dataset.lookId});}
    function resize(){if(!renderer||!camera)return;camera.aspect=innerWidth/Math.max(1,innerHeight);camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function look(dx,dy){camera.rotation.y-=dx*.003;camera.rotation.x=Math.max(-1.45,Math.min(1.45,camera.rotation.x-dy*.003))}
    function blocked(x,z){const r=.38;return obstacles.some(o=>Math.abs(x-o.x)<o.halfW+r&&Math.abs(z-o.z)<o.halfD+r)}function movePlayer(dt){let x=move.x,y=move.y;if(keys.has('KeyA'))x-=1;if(keys.has('KeyD'))x+=1;if(keys.has('KeyW'))y-=1;if(keys.has('KeyS'))y+=1;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}const speed=5*dt,sy=Math.sin(camera.rotation.y),cy=Math.cos(camera.rotation.y);const dx=(x*cy-y*sy)*speed,dz=(-x*sy-y*cy)*speed;const nx=Math.max(-56,Math.min(56,camera.position.x+dx)),nz=Math.max(-56,Math.min(56,camera.position.z+dz));if(!blocked(nx,camera.position.z))camera.position.x=nx;if(!blocked(camera.position.x,nz))camera.position.z=nz;if(!onGround){jumpVelocity-=18*dt;camera.position.y+=jumpVelocity*dt;if(camera.position.y<=1.68){camera.position.y=1.68;jumpVelocity=0;onGround=true}}}
    function jump(){if(started&&onGround){onGround=false;jumpVelocity=6.5}}function updateHUD(){ $('ammo-mag').textContent=ammo;$('ammo-reserve').textContent=reserve;$('health-value').textContent=health;$('armor-value').textContent=armor;$('health-fill').style.width=`${health/150*100}%`;$('score-blue').textContent=score }
    function shoot(){if(!started||ammo<=0)return;ammo--;ray.setFromCamera({x:0,y:0},camera);const hit=ray.intersectObjects(enemies.filter(e=>e.userData.alive));if(hit.length){let enemy=hit[0].object;while(enemy.parent&&!enemy.userData.alive)enemy=enemy.parent;while(enemy.parent&& !enemy.userData.hp)enemy=enemy.parent;if(enemy.userData.alive){enemy.userData.hp-=50;enemy.userData.mat.color.setHex(0xffffff);setTimeout(()=>{if(enemy.userData.alive)enemy.userData.mat.color.setHex(0xb72d2d)},90);if(enemy.userData.hp<=0){enemy.userData.alive=false;enemy.visible=false;enemy.userData.respawn=5;score++;$('score-blue').textContent=score}}}updateHUD()}
    function reload(){if(!started||ammo===30||reserve<=0)return;const n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;updateHUD()}function update(dt){if(!started)return;elapsed+=dt;fireTimer-=dt;movePlayer(dt);if($('btn-fire').dataset.down==='1'&&fireTimer<=0){shoot();fireTimer=.12}for(const e of enemies){if(!e.userData.alive){e.userData.respawn-=dt;if(e.userData.respawn<=0){e.userData.hp=100;e.userData.alive=true;e.visible=true;e.position.set((Math.random()-.5)*34,0,(Math.random()-.5)*34)}continue}e.rotation.y+=dt*.15}const remain=Math.max(0,600-elapsed);$('match-time').textContent=`${String(Math.floor(remain/60)).padStart(2,'0')}:${String(Math.floor(remain%60)).padStart(2,'0')}`}
    function loop(){if(!started)return;raf=requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}function start(){if(started)return;status.classList.remove('show');try{if(!renderer)init();started=true;document.body.dataset.state='combat';camera.position.set(0,1.68,15);camera.rotation.set(0,0,0);elapsed=0;clock.start();loop()}catch(e){console.error(e);showError(`遊戲初始化失敗：${e.message}`)}}
    $('btn-deploy').addEventListener('click',()=>{if(window.THREE){THREE=window.THREE;start()}else{loadThree().then(lib=>{THREE=lib;start()}).catch(e=>{console.error(e);showError('無法載入 Three.js。請檢查網路連線後重新整理頁面。')})}});
    $('btn-loadout').addEventListener('click',()=>alert('武器配置功能尚未完成。'));$('btn-settings').addEventListener('click',()=>alert('系統設置功能尚未完成。'));$('btn-jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('btn-reload').addEventListener('pointerdown',e=>{e.preventDefault();reload()});const fire=$('btn-fire');fire.addEventListener('pointerdown',e=>{e.preventDefault();fire.dataset.down='1';shoot()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])fire.addEventListener(ev,()=>fire.dataset.down='0');
    const area=$('joystick-area'),knob=$('joystick-knob');let stickId=null;area.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;area.setPointerCapture(e.pointerId);stick(e)});area.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stick(e)});function stick(e){const r=area.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=42,d=Math.hypot(dx,dy),scale=d>m?m/d:1,nx=dx*scale,ny=dy*scale;knob.style.transform=`translate(${nx}px,${ny}px)`;move={x:nx/m,y:ny/m}}function resetStick(e){if(e.pointerId!==stickId)return;stickId=null;move={x:0,y:0};knob.style.transform='translate(0,0)'}area.addEventListener('pointerup',resetStick);area.addEventListener('pointercancel',resetStick);window.addEventListener('blur',()=>{keys.clear();move={x:0,y:0};fire.dataset.down='0'});
  })();
  </script>
</body>
</html>
