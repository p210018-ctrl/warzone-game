<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- ============================================================
         Meta 標籤：全方位行動端與 iOS 防護設定
         ============================================================ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#0a0a0c">

    <title>CODWZM 戰區手遊 - 戰術行動</title>

    <!-- ============================================================
         🚨 全局防護與錯誤捕捉 (必須放在最前面)
         ============================================================ -->
    <script>
        // 1. 修復 Safari/iPad 找不到 global 變數的問題
        window.global = window;

        // 2. 預先定義 Logger，防止模組載入順序錯誤導致崩潰
        window.WZ = window.WZ || {};
        window.WZ.Utils = window.WZ.Utils || {
            Logger: {
                system: function() { console.log.apply(console, ["[SYSTEM]"].concat([].slice.call(arguments))); },
                info:   function() { console.log.apply(console, ["[INFO]"].concat([].slice.call(arguments))); },
                warn:   function() { console.warn.apply(console, ["[WARN]"].concat([].slice.call(arguments))); },
                error:  function() { console.error.apply(console, ["[ERROR]"].concat([].slice.call(arguments))); },
                debug:  function() { console.log.apply(console, ["[DEBUG]"].concat([].slice.call(arguments))); }
            }
        };

        // 3. 建立紅色報錯面板 (方便你在 iPad 上截圖)
        window.addEventListener('DOMContentLoaded', () => {
            const errPanel = document.createElement('div');
            errPanel.id = 'global-error-panel';
            errPanel.style.cssText = `
                position: fixed; top: 30px; left: 10px; right: 10px;
                background: rgba(200, 0, 0, 0.95); color: white;
                font-family: monospace; font-size: 14px; padding: 15px;
                border-radius: 8px; z-index: 9999999; display: none;
                box-shadow: 0 0 20px rgba(0,0,0,0.8); word-break: break-all;
                max-height: 50vh; overflow-y: auto;
            `;
            document.body.appendChild(errPanel);

            window.onerror = function(message, source, lineno, colno, error) {
                errPanel.style.display = 'block';
                const div = document.createElement('div');
                div.style.marginBottom = '10px';
                div.innerHTML = `<strong>[代碼報錯]</strong> ${message} (行: ${lineno})`;
                errPanel.appendChild(div);
                console.error(message);
                return false;
            };

            window.addEventListener('unhandledrejection', function(event) {
                errPanel.style.display = 'block';
                const div = document.createElement('div');
                div.style.marginBottom = '10px';
                div.innerHTML = `<strong>[Promise 異常]</strong> ${event.reason ? event.reason.toString() : '未知錯誤'}`;
                errPanel.appendChild(div);
            });
        });
    </script>

    <!-- ============================================================
         CSS 核心樣式
         ============================================================ -->
    <style>
        :root {
            --color-bg-dark: #0a0a0c;
            --color-bg-panel: rgba(18, 18, 22, 0.85);
            --color-bg-glass: rgba(30, 32, 38, 0.65);
            --color-primary: #d4af37;
            --color-primary-glow: rgba(212, 175, 55, 0.4);
            --color-text-main: #e0e0e0;
            --color-text-muted: #7a7d82;
            --color-danger: #e74c3c;
            --color-success: #2ecc71;
            --color-cyan: #00f3ff;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-mono: "SFMono-Regular", Consolas, monospace;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none; -webkit-user-select: none;
        }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden; background-color: var(--color-bg-dark);
            color: var(--color-text-main); font-family: var(--font-main);
            touch-action: none; overscroll-behavior: none;
            position: fixed; top: 0; left: 0;
        }

        canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: block; z-index: 1;
            visibility: hidden; /* 預設隱藏，由 JS 控制 */
            opacity: 0; transition: opacity 0.5s ease;
        }

        #app-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
        }

        /* 通用 UI 層設定 */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; flex-direction: column;
        }
        .ui-layer.active { display: flex; }

        /* ============================================================
           模組 A：橫屏鎖定提示
           ============================================================ */
        #orientation-lock {
            position: fixed; inset: 0; background-color: #0a0a0c;
            z-index: 9999; display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }
        @media (orientation: portrait) { #orientation-lock { display: flex; } }
        
        .rotate-icon { font-size: 56px; transform: rotate(90deg); margin-bottom: 20px; }
        .rotate-text { font-size: 18px; font-weight: 700; color: var(--color-primary); letter-spacing: 2px; }

        /* ============================================================
           模組 B：載入進度條
           ============================================================ */
        #loading-layer {
            position: fixed; inset: 0; background-color: #0a0a0c;
            background-image: radial-gradient(circle at 50% 50%, #1a1c22 0%, #0a0a0c 100%);
            z-index: 9998; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: auto;
            transition: opacity 0.5s ease;
        }
        #loading-layer.fade-out { opacity: 0; pointer-events: none; }
        
        .loading-logo { font-size: 36px; font-weight: 900; color: #fff; letter-spacing: 8px; margin-bottom: 5px; }
        .loading-logo .accent { color: var(--color-primary); }
        .loading-subtitle { font-size: 12px; color: var(--color-text-muted); letter-spacing: 4px; margin-bottom: 50px; }
        
        .progress-container { width: 300px; max-width: 80vw; height: 4px; background-color: rgba(255, 255, 255, 0.05); border-radius: 2px; position: relative; margin-bottom: 15px; }
        .progress-bar { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: linear-gradient(90deg, var(--color-primary) 0%, #fff 100%); border-radius: 2px; transition: width 0.2s ease-out; box-shadow: 0 0 10px var(--color-primary-glow); }
        .progress-glow-head { position: absolute; top: 50%; left: 0%; transform: translate(-50%, -50%); width: 8px; height: 8px; background-color: #fff; border-radius: 50%; box-shadow: 0 0 15px 5px var(--color-primary); transition: left 0.2s ease-out; }
        .progress-text { font-family: var(--font-mono); font-size: 14px; color: var(--color-primary); letter-spacing: 2px; }

        /* ============================================================
           模組 C：大廳層
           ============================================================ */
        #lobby-layer {
            background: linear-gradient(180deg, rgba(10,10,12,0.7) 0%, rgba(10,10,12,0.95) 100%);
            padding: 20px 40px; justify-content: space-between; pointer-events: auto;
            display: none; /* 預設隱藏，加載完成後顯示 */
        }
        #lobby-layer.active { display: flex; }

        .lobby-header { display: flex; justify-content: space-between; align-items: center; height: 60px; }
        .player-profile { display: flex; align-items: center; gap: 15px; background: var(--color-bg-glass); padding: 8px 20px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); }
        .player-avatar { width: 44px; height: 44px; border-radius: 50%; background: #333; border: 2px solid var(--color-primary); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--color-primary); font-size: 18px; }
        .player-name { font-size: 16px; font-weight: 700; color: #fff; }
        .player-level { font-size: 11px; color: var(--color-primary); }

        .lobby-resources { display: flex; gap: 15px; }
        .resource-item { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.5); padding: 6px 15px; border-radius: 6px; font-family: var(--font-mono); font-size: 14px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }

        .lobby-content { flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .operator-showcase { flex: 1; position: relative; }
        .operator-name-big { font-size: 48px; font-weight: 900; color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.3); letter-spacing: 10px; }
        .operator-tagline { font-size: 14px; color: var(--color-primary); letter-spacing: 3px; margin-top: 20px; }

        .main-menu-buttons { display: flex; flex-direction: column; gap: 15px; width: 280px; }
        .btn-primary { background: linear-gradient(90deg, rgba(212, 175, 55, 0.15) 0%, transparent 100%); border: 1px solid var(--color-primary); color: var(--color-primary); padding: 16px 24px; font-size: 16px; font-weight: 800; text-align: left; cursor: pointer; clip-path: polygon(0 0, 100% 0, 95% 100%, 0% 100%); transition: all 0.3s; }
        .btn-primary:hover { background: linear-gradient(90deg, rgba(212, 175, 55, 0.3) 0%, transparent 100%); box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
        .btn-secondary { background: rgba(30, 32, 38, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); color: #ddd; padding: 12px 24px; font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; clip-path: polygon(0 0, 100% 0, 97% 100%, 0% 100%); transition: all 0.2s; }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }

        /* ============================================================
           模組 D：戰鬥 HUD
           ============================================================ */
        #hud-layer { pointer-events: none; display: none; } /* 預設隱藏 */
        #hud-layer.active { display: block; }

        .hud-top { display: flex; justify-content: space-between; padding: 20px; width: 100%; }
        .hud-scoreboard { display: flex; gap: 20px; align-items: center; background: var(--color-bg-panel); padding: 8px 25px; border-radius: 4px; border-top: 2px solid var(--color-primary); }
        .score-team { font-size: 24px; font-weight: 800; font-family: var(--font-mono); }
        .score-team.blue { color: #3498db; }
        .score-team.red { color: #e74c3c; }
        
        /* 準心 */
        #cross { position: fixed; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; pointer-events: none; z-index: 100; }
        #cross i { position: absolute; background: #eee; box-shadow: 0 0 3px #000; }
        #cross .h { width: 8px; height: 2px; top: 14px; } #cross .hl { left: 0; } #cross .hr { right: 0; }
        #cross .v { width: 2px; height: 8px; left: 14px; } #cross .vt { top: 0; } #cross .vb { bottom: 0; }
        #cross .d { position: absolute; left: 13px; top: 13px; width: 4px; height: 4px; border-radius: 50%; background: #eee; }

        /* 搖桿與按鈕 */
        #stick { position: fixed; left: 30px; bottom: 30px; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.2); background: rgba(255,255,255,0.05); pointer-events: auto; z-index: 100; display: none; }
        #knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, 0.3); }
        
        #btns { position: fixed; right: 30px; bottom: 30px; display: flex; flex-direction: column; align-items: flex-end; gap: 15px; pointer-events: auto; z-index: 100; display: none; }
        .b { width: 60px; height: 60px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .b.fire { width: 80px; height: 80px; background: rgba(255, 40, 40, 0.2); border-color: rgba(255, 70, 70, 0.6); }

    </style>
</head>
<body>

    <!-- 橫屏鎖定 -->
    <div id="orientation-lock">
        <div class="rotate-icon">📱</div>
        <div class="rotate-text">請橫置手機以獲得最佳體驗</div>
    </div>

    <!-- 畫布 -->
    <canvas id="game-canvas"></canvas>

    <div id="app-container">
        <!-- 載入層 -->
        <div id="loading-layer">
            <div class="loading-logo">CODWZM <span class="accent">WARZONE</span></div>
            <div class="loading-subtitle">TACTICAL MOBILE PROTOCOL</div>
            <div class="progress-container">
                <div class="progress-bar" id="load-progress-bar"></div>
                <div class="progress-glow-head" id="load-glow-head"></div>
            </div>
            <div class="progress-text" id="load-percentage">0%</div>
        </div>

        <!-- 大廳層 -->
        <div id="lobby-layer" class="ui-layer">
            <div class="lobby-header">
                <div class="player-profile">
                    <div class="player-avatar">G</div>
                    <div>
                        <div class="player-name">GHOST_Operator</div>
                        <div class="player-level">LVL. 55 • 上尉</div>
                    </div>
                </div>
                <div class="lobby-resources">
                    <div class="resource-item">💰 12,450</div>
                    <div class="resource-item">💎 850</div>
                </div>
            </div>
            <div class="lobby-content">
                <div class="operator-showcase">
                    <div class="operator-name-big">GHOST</div>
                    <div class="operator-tagline">// SIMON "GHOST" RILEY</div>
                </div>
                <div class="main-menu-buttons">
                    <button class="btn-primary" id="btn-start-match">進入戰區 / DEPLOY</button>
                    <button class="btn-secondary" id="btn-loadout">武器配置 / LOADOUT</button>
                    <button class="btn-secondary" id="btn-customize-ui">自定義按鍵 / CUSTOMIZE UI</button>
                    <button class="btn-secondary" id="btn-settings">系統設置 / SETTINGS</button>
                </div>
            </div>
        </div>

        <!-- 戰鬥 HUD -->
        <div id="hud-layer" class="ui-layer">
            <div class="hud-top">
                <div class="hud-scoreboard">
                    <div class="score-team blue">75</div>
                    <div style="font-size:18px; color:#fff; font-family:monospace;">10:00</div>
                    <div class="score-team red">68</div>
                </div>
            </div>
            <div id="cross"><i class="h"></i><i class="v"></i><i class="d"></i></div>
            <div id="stick"><div id="knob"></div></div>
            <div id="btns">
                <button class="b" id="bJump">JUMP</button>
                <button class="b fire" id="bFire">FIRE</button>
            </div>
        </div>

        <!-- 設置與自定義 (簡化版，僅保留遮罩) -->
        <div id="customizer-layer" class="ui-layer" style="background:rgba(0,0,0,0.8); z-index:200; pointer-events:auto; display:none;">
            <h2 style="color:#d4af37; margin:20px;">UI 按鍵自定義</h2>
            <button id="btn-close-customizer" style="margin:20px; padding:10px;">關閉</button>
        </div>

        <div id="settings-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; display:none; justify-content:center; align-items:center; pointer-events:auto;">
            <div style="background:#111; border:1px solid #d4af37; padding:40px; border-radius:8px;">
                <h2 style="color:#d4af37; margin-bottom:20px;">系統設置</h2>
                <button id="btn-close-settings" style="padding:10px 20px; background:#333; color:#fff; border:none; cursor:pointer;">關閉</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
         腳本加載與 UI 控制
         ============================================================ -->
    <script>
        (function() {
            'use strict';

            // 1. 異步載入所有 37 個模組
            const scriptFiles = [
                '01_event_bus_state.js', '02_renderer_core.js', '03_multitouch_controller.js',
                '04_camera_rig_shake.js', '05_physics_collision.js', '06_player_health_armor.js',
                '07_pbr_texture_factory.js', '08_lighting_atmosphere.js', '09_map_terrain_ground.js',
                '10_map_buildings.js', '11_map_props_covers.js', '12_decals_bullet_holes.js',
                '13_fp_hands_anatomy.js', '14_weapon_m4_urgi.js', '15_weapon_smg_mp5.js',
                '16_weapon_sniper_ax50.js', '17_weapon_pistol_x16.js', '18_weapon_optics_laser.js',
                '19_fp_locomotion_anim.js', '20_fp_reload_inspect.js', '21_ballistics_recoil.js',
                '22_vfx_particle_engine.js', '23_audio_procedural.js', '24_audio_foley_env.js',
                '25_player_movement.js', '26_enemy_soldier_mesh.js', '27_enemy_upper_lower_ik.js',
                '28_enemy_warzone_locomotion.js', '29_ragdoll_physics.js', '30_enemy_tactical_ai.js',
                '31_ui_lobby_3d.js', '32_ui_hud_customizer.js', '33_ui_settings_modal.js',
                '34_ui_combat_hud.js', '35_ui_killfeed_score.js', '36_gamemode_manager.js',
                '37_main_bootstrap.js'
            ];

            let loadedCount = 0;
            const total = scriptFiles.length;
            
            const bar = document.getElementById('load-progress-bar');
            const glow = document.getElementById('load-glow-head');
            const txt = document.getElementById('load-percentage');
            const loadingLayer = document.getElementById('loading-layer');

            function updateProgress() {
                const p = Math.round((loadedCount / total) * 100);
                if (bar) bar.style.width = p + '%';
                if (glow) glow.style.left = p + '%';
                if (txt) txt.textContent = p + '%';
            }

            function loadNext(index) {
                if (index >= total) {
                    // 全部加載完畢
                    setTimeout(() => {
                        if (loadingLayer) loadingLayer.style.display = 'none';
                        document.getElementById('lobby-layer').classList.add('active');
                        window.dispatchEvent(new CustomEvent('WZM_SCRIPTS_LOADED'));
                        
                        // 如果 37 沒有自動啟動，這裡強制觸發
                        if (window.WZ && window.WZ.Bootstrap && window.WZ.Bootstrap.boot) {
                            window.WZ.Bootstrap.boot();
                        }
                    }, 500);
                    return;
                }

                const script = document.createElement('script');
                script.src = `js/${scriptFiles[index]}`;
                script.async = false; // 確保按順序執行

                script.onload = () => {
                    loadedCount++;
                    updateProgress();
                    loadNext(index + 1);
                };

                script.onerror = () => {
                    console.error(`[加載失敗] 找不到或無法執行: ${scriptFiles[index]}`);
                    loadedCount++;
                    updateProgress();
                    loadNext(index + 1);
                };

                document.body.appendChild(script);
            }

            // 開始加載
            loadNext(0);

            // ==========================================
            // UI 按鈕強制綁定 (不依賴其他模組)
            // ==========================================
            document.getElementById('btn-start-match').addEventListener('click', function() {
                console.log('玩家點擊了 DEPLOY');
                
                // 切換 UI
                document.getElementById('lobby-layer').classList.remove('active');
                document.getElementById('lobby-layer').style.display = 'none';
                
                document.getElementById('hud-layer').classList.add('active');
                document.getElementById('hud-layer').style.display = 'block';
                
                document.getElementById('stick').style.display = 'block';
                document.getElementById('btns').style.display = 'flex';
                
                const canvas = document.getElementById('game-canvas');
                canvas.style.visibility = 'visible';
                canvas.style.opacity = '1';

                // 觸發全局事件
                if (window.WZ && window.WZ.bus) {
                    window.WZ.bus.emit('GAME_START');
                }
                if (window.WZ && window.WZ.State) {
                    window.WZ.State.transitionTo('PLAYING');
                }
            });

            document.getElementById('btn-customize-ui').addEventListener('click', function() {
                document.getElementById('customizer-layer').style.display = 'flex';
            });
            document.getElementById('btn-close-customizer').addEventListener('click', function() {
                document.getElementById('customizer-layer').style.display = 'none';
            });

            document.getElementById('btn-settings').addEventListener('click', function() {
                document.getElementById('settings-modal').style.display = 'flex';
            });
            document.getElementById('btn-close-settings').addEventListener('click', function() {
                document.getElementById('settings-modal').style.display = 'none';
            });

        })();
    </script>
</body>
</html>
