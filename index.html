<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />

  <title>網頁遊戲</title>

  <!-- 1. 引入 Tailwind CSS（多數 React 遊戲的版面樣式都會用到） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. 設定套件對應表（讓瀏覽器看懂 import 'react' 與 'lucide-react'） -->
  <!-- 注意：這段 importmap 必須放在所有 module 腳本之前 -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "lucide-react": "https://esm.sh/lucide-react?deps=react@18"
    }
  }
  </script>

  <!-- 3. 引入 Babel（在瀏覽器中即時編譯 React 的 JSX 語法） -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 4. 基本全螢幕與黑底樣式 -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #root {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <!-- 5. 遊戲畫面的掛載點（編譯完成前會先顯示載入提示） -->
  <div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:18px;">
    遊戲編譯與載入中，請稍候幾秒...
  </div>

  <!-- 6. 預先掛載全域 React（避免遊戲代碼中漏寫 import React 時報錯） -->
  <script type="module">
    import React from 'react';
    window.React = React;
  </script>

  <!-- 7. 遊戲主程式區塊（必須保留 data-type="module" 與 data-presets="react"） -->
  <script type="text/babel" data-type="module" data-presets="react">
    import { createRoot as __createRoot } from 'react-dom/client';

    // 【請從這行下面開始，貼上你原本那九千多行的完整遊戲代碼】

    /* ========================================================================
     * 模組 02：全局事件匯流排與核心狀態機 (原 js/01_event_bus_state.js)
     * ======================================================================== */
    global.WZ.bus = (function () {
        const listeners = new Map();
        const activeEvents = new Set();
        const MAX_DEPTH = 6;
        let emitDepth = 0;

        function on(event, handler, priority = 0) {
            if (typeof handler !== 'function') return () => {};
            if (!listeners.has(event)) listeners.set(event, []);
            const list = listeners.get(event);
            const entry = { handler, priority, once: false };
            list.push(entry);
            list.sort((a, b) => b.priority - a.priority);
            return () => off(event, handler);
        }

        function once(event, handler, priority = 0) {
            if (typeof handler !== 'function') return () => {};
            if (!listeners.has(event)) listeners.set(event, []);
            const list = listeners.get(event);
            const entry = { handler, priority, once: true };
            list.push(entry);
            list.sort((a, b) => b.priority - a.priority);
            return () => off(event, handler);
        }

        function off(event, handler) {
            const list = listeners.get(event);
            if (!list) return;
            for (let i = list.length - 1; i >= 0; i--) {
                if (list[i].handler === handler) list.splice(i, 1);
            }
        }

        function emit(event, payload) {
            if (emitDepth >= MAX_DEPTH || activeEvents.has(event)) {
                return false;
            }
            const list = listeners.get(event);
            if (!list || list.length === 0) return false;

            emitDepth++;
            activeEvents.add(event);
            const snapshot = list.slice();
            for (let i = 0; i < snapshot.length; i++) {
                const entry = snapshot[i];
                try {
                    entry.handler(payload);
                } catch (err) {
                    console.error('[WZ.bus] Event error in "' + event + '":', err);
                }
                if (entry.once) off(event, entry.handler);
            }
            activeEvents.delete(event);
            emitDepth--;
            return true;
        }

        return { on, once, off, emit };
    })();

    /* ========================================================================
     * 模組 03：次世代 WebGL 渲染器與動態幀率管線
     * ======================================================================== */
    global.WZ.Renderer = (function () {
        let scene = null;
        let camera = null;
        let renderer = null;
        let sunLight = null;
        let hemiLight = null;
        let container = null;

        let fpsFrames = 0;
        let fpsTimer = 0;
        let currentFps = 60;
        let lastQuality = 'medium';

        const QUALITY_PRESETS = {
            high: { pixelRatio: Math.min(window.devicePixelRatio || 1, 2.0), shadowSize: 2048, shadows: true, fogDensity: 0.0042 },
            medium: { pixelRatio: Math.min(window.devicePixelRatio || 1, 1.5), shadowSize: 1024, shadows: true, fogDensity: 0.0050 },
            low: { pixelRatio: 1.0, shadowSize: 512, shadows: false, fogDensity: 0.0062 }
        };

        function init() {
            if (typeof THREE === 'undefined') {
                throw new Error('Three.js 尚未載入，請確認於 37_main_bootstrap.js 之前引入 Three.js');
            }

            container = document.getElementById('wz-canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x8ea6bd);
            scene.fog = new THREE.FogExp2(0x8ea6bd, 0.005);

            camera = new THREE.PerspectiveCamera(
                78,
                window.innerWidth / Math.max(1, window.innerHeight),
                0.05,
                420
            );

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                stencil: false
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.08;

            if ('outputColorSpace' in renderer && THREE.SRGBColorSpace) {
                renderer.outputColorSpace = THREE.SRGBColorSpace;
            } else if ('outputEncoding' in renderer && THREE.sRGBEncoding) {
                renderer.outputEncoding = THREE.sRGBEncoding;
            }

            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // 戰術日照與環境光
            hemiLight = new THREE.HemisphereLight(0xcbe0f5, 0x3b352e, 0.78);
            hemiLight.position.set(0, 60, 0);
            scene.add(hemiLight);

            sunLight = new THREE.DirectionalLight(0xfff1d6, 1.45);
            sunLight.position.set(65, 95, 45);
            sunLight.castShadow = true;
            sunLight.shadow.camera.near = 10;
            sunLight.shadow.camera.far = 260;
            const d = 95;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            sunLight.shadow.bias = -0.0005;
            scene.add(sunLight);

            // 天空穹頂（漸層戰區天空）
            const skyGeo = new THREE.SphereGeometry(320, 24, 16);
            const skyMat = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                uniforms: {
                    topColor: { value: new THREE.Color(0x28527a) },
                    horizonColor: { value: new THREE.Color(0xb8c9d9) },
                    bottomColor: { value: new THREE.Color(0x5c5852) }
                },
                vertexShader: `
                    varying vec3 vWorldPos;
                    void main() {
                        vec4 wp = modelMatrix * vec4(position, 1.0);
                        vWorldPos = wp.xyz;
                        gl_Position = projectionMatrix * viewMatrix * wp;
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 horizonColor;
                    uniform vec3 bottomColor;
                    varying vec3 vWorldPos;
                    void main() {
                        float h = normalize(vWorldPos).y;
                        vec3 col = h >= 0.0
                            ? mix(horizonColor, topColor, pow(h, 0.55))
                            : mix(horizonColor, bottomColor, clamp(-h * 3.0, 0.0, 1.0));
                        gl_FragColor = vec4(col, 1.0);
                    }
                `
            });
            scene.add(new THREE.Mesh(skyGeo, skyMat));

            applyQuality(global.WZ.State.data.settings.quality || 'medium');

            window.addEventListener('resize', onResize, { passive: true });
            global.WZ.bus.on('settings:change', (s) => {
                if (s && s.quality && s.quality !== lastQuality) {
                    applyQuality(s.quality);
                }
            });
        }

        function applyQuality(level) {
            const preset = QUALITY_PRESETS[level] || QUALITY_PRESETS.medium;
            lastQuality = level;
            if (!renderer) return;

            renderer.setPixelRatio(preset.pixelRatio);
            renderer.shadowMap.enabled = preset.shadows;
            if (sunLight) {
                sunLight.castShadow = preset.shadows;
                if (sunLight.shadow.mapSize.width !== preset.shadowSize) {
                    sunLight.shadow.mapSize.set(preset.shadowSize, preset.shadowSize);
                    if (sunLight.shadow.map) {
                        sunLight.shadow.map.dispose();
                        sunLight.shadow.map = null;
                    }
                }
            }
            if (scene && scene.fog) {
                scene.fog.density = preset.fogDensity;
            }
        }

        function onResize() {
            if (!camera || !renderer) return;
            const w = window.innerWidth;
            const h = Math.max(1, window.innerHeight);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        function render(dt) {
            if (!renderer || !scene || !camera) return;
            renderer.render(scene, camera);

            fpsFrames++;
            fpsTimer += dt;
            if (fpsTimer >= 0.5) {
                currentFps = Math.round(fpsFrames / fpsTimer);
                fpsFrames = 0;
                fpsTimer = 0;
                const el = document.getElementById('hud-fps-label');
                if (el) el.textContent = currentFps + ' FPS';
            }
        }

        return {
            init,
            render,
            applyQuality,
            getScene: () => scene,
            getCamera: () => camera,
            getRenderer: () => renderer,
            getSunLight: () => sunLight,
            getFPS: () => currentFps
        };
    })();

    /* ========================================================================
     * 模組 04：真・多點觸控與按鍵同步拖動視角引擎 (支援 PC 鍵鼠無縫雙模)
     * ======================================================================== */
    global.WZ.Touch = (function () {
        const input = {
            moveX: 0,      // -1 (左) ~ 1 (右)
            moveY: 0,      // -1 (後) ~ 1 (前)
            moveMag: 0,    // 0 ~ 1
            lookDeltaX: 0, // 單幀累計像素差
            lookDeltaY: 0,
            actions: {
                FIRE: false,
                ADS: false,
                JUMP: false,
                SLIDE: false,
                DIVE: false,
                RELOAD: false,
                SWITCH: false,
                PLATE: false,
                INSPECT: false,
                SPRINT: false
            }
        };

        // 觸控追蹤表
        let joyTouchId = null;
        let joyOriginX = 0;
        let joyOriginY = 0;
        const JOY_MAX_RADIUS = 52;

        // 支援多指同時滑動視角（包含按鈕上的 Touch-Through 拖動）
        const lookTouches = new Map(); // touchId -> { lastX, lastY, actionBtn, actionName }
        const keyMap = Object.create(null);

        let joyZone = null;
        let joyBase = null;
        let joyKnob = null;
        let initialized = false;

        function getActiveSensitivity() {
            const st = global.WZ.State.data;
            const cfg = global.WZ.State.getActiveWeaponConfig();
            if (st.player.isADS) {
                return cfg.type === 'SNIPER' ? st.settings.sensSniper : st.settings.sensAds;
            }
            return st.settings.sensHip;
        }

        function setAction(name, pressed, emitEdge = true) {
            const prev = !!input.actions[name];
            input.actions[name] = !!pressed;
            if (emitEdge && prev !== !!pressed) {
                global.WZ.bus.emit('input:action', { action: name, pressed: !!pressed });
            }
        }

        function handleTouchStart(e) {
            if (global.WZ.State.data.gameState !== 'PLAYING') return;

            const touches = e.changedTouches;
            for (let i = 0; i < touches.length; i++) {
                const t = touches[i];
                const target = document.elementFromPoint(t.clientX, t.clientY);

                // 忽略暫停按鈕等 UI
                if (target && target.id === 'hud-pause-btn') continue;

                // 1. 觸控功能鍵檢測（支援按住同步滑動轉向 Touch-Through）
                const btn = target && target.closest ? target.closest('.touch-btn') : null;
                if (btn) {
                    e.preventDefault();
                    const action = btn.dataset.action;
                    btn.classList.add('pressed');

                    if (action === 'ADS') {
                        // ADS 採用切換制，方便雙指/三指手遊玩家
                        setAction('ADS', !input.actions.ADS, true);
                    } else {
                        setAction(action, true, true);
                    }

                    lookTouches.set(t.identifier, {
                        lastX: t.clientX,
                        lastY: t.clientY,
                        actionBtn: btn,
                        actionName: action,
                        allowDrag: global.WZ.State.data.settings.touchThroughDrag
                    });
                    continue;
                }

                // 2. 左半區浮動搖桿
                if (t.clientX < window.innerWidth * 0.45 && joyTouchId === null) {
                    e.preventDefault();
                    joyTouchId = t.identifier;
                    joyOriginX = t.clientX;
                    joyOriginY = t.clientY;
                    if (joyBase) {
                        joyBase.style.display = 'block';
                        joyBase.style.left = joyOriginX + 'px';
                        joyBase.style.top = joyOriginY + 'px';
                    }
                    if (joyKnob) {
                        joyKnob.style.transform = 'translate(-50%, -50%)';
                    }
                    continue;
                }

                // 3. 右半區自由視角滑動
                e.preventDefault();
                lookTouches.set(t.identifier, {
                    lastX: t.clientX,
                    lastY: t.clientY,
                    actionBtn: null,
                    actionName: null,
                    allowDrag: true
                });
            }
        }

        function handleTouchMove(e) {
            if (global.WZ.State.data.gameState !== 'PLAYING') return;

            const touches = e.changedTouches;
            let handled = false;

            for (let i = 0; i < touches.length; i++) {
                const t = touches[i];

                if (t.identifier === joyTouchId) {
                    handled = true;
                    const dx = t.clientX - joyOriginX;
                    const dy = t.clientY - joyOriginY;
                    const dist = Math.hypot(dx, dy);
                    const clamped = Math.min(dist, JOY_MAX_RADIUS);
                    const angle = Math.atan2(dy, dx);
                    const nx = dist > 2 ? (Math.cos(angle) * clamped) / JOY_MAX_RADIUS : 0;
                    const ny = dist > 2 ? (Math.sin(angle) * clamped) / JOY_MAX_RADIUS : 0;

                    input.moveX = nx;
                    input.moveY = -ny; // 向上推為前進 (+1)
                    input.moveMag = Math.min(1, dist / JOY_MAX_RADIUS);

                    if (joyKnob) {
                        joyKnob.style.transform = `translate(calc(-50% + ${nx * JOY_MAX_RADIUS}px), calc(-50% + ${ny * JOY_MAX_RADIUS}px))`;
                    }
                    continue;
                }

                const rec = lookTouches.get(t.identifier);
                if (rec) {
                    handled = true;
                    const dx = t.clientX - rec.lastX;
                    const dy = t.clientY - rec.lastY;
                    rec.lastX = t.clientX;
                    rec.lastY = t.clientY;

                    if (rec.allowDrag) {
                        const sens = getActiveSensitivity();
                        input.lookDeltaX += dx * sens * 0.0038;
                        input.lookDeltaY += dy * sens * 0.0038;
                    }
                }
            }

            if (handled) e.preventDefault();
        }

        function handleTouchEnd(e) {
            const touches = e.changedTouches;
            for (let i = 0; i < touches.length; i++) {
                const t = touches[i];

                if (t.identifier === joyTouchId) {
                    joyTouchId = null;
                    input.moveX = 0;
                    input.moveY = 0;
                    input.moveMag = 0;
                    if (joyBase) joyBase.style.display = 'none';
                    continue;
                }

                const rec = lookTouches.get(t.identifier);
                if (rec) {
                    if (rec.actionBtn) rec.actionBtn.classList.remove('pressed');
                    if (rec.actionName && rec.actionName !== 'ADS') {
                        setAction(rec.actionName, false, true);
                    }
                    lookTouches.delete(t.identifier);
                }
            }
        }

        // PC 鍵盤與滑鼠 PointerLock 支援
        function bindDesktopControls() {
            const canvasWrap = document.getElementById('wz-canvas-container');

            canvasWrap.addEventListener('mousedown', (e) => {
                if (global.WZ.State.data.gameState !== 'PLAYING') return;
                if (document.pointerLockElement !== canvasWrap && canvasWrap.requestPointerLock) {
                    canvasWrap.requestPointerLock();
                }
                if (e.button === 0) setAction('FIRE', true, true);
                if (e.button === 2) setAction('ADS', !input.actions.ADS, true);
            });

            window.addEventListener('mouseup', (e) => {
                if (e.button === 0) setAction('FIRE', false, true);
            });

            window.addEventListener('contextmenu', (e) => {
                if (global.WZ.State.data.gameState === 'PLAYING') e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (global.WZ.State.data.gameState !== 'PLAYING') return;
                if (document.pointerLockElement === canvasWrap) {
                    const sens = getActiveSensitivity();
                    input.lookDeltaX += (e.movementX || 0) * sens * 0.0022;
                    input.lookDeltaY += (e.movementY || 0) * sens * 0.0022;
                }
            });

            window.addEventListener('keydown', (e) => {
                if (global.WZ.State.data.gameState !== 'PLAYING') return;
                if (keyMap[e.code]) return;
                keyMap[e.code] = true;

                switch (e.code) {
                    case 'Space': setAction('JUMP', true, true); break;
                    case 'KeyC': setAction('SLIDE', true, true); break;
                    case 'KeyZ': setAction('DIVE', true, true); break;
                    case 'KeyR': setAction('RELOAD', true, true); break;
                    case 'KeyQ': case 'Digit1': case 'Digit2': setAction('SWITCH', true, true); break;
                    case 'Digit4': case 'KeyG': setAction('PLATE', true, true); break;
                    case 'KeyI': setAction('INSPECT', true, true); break;
                    case 'ShiftLeft': setAction('SPRINT', true, true); break;
                }
            });

            window.addEventListener('keyup', (e) => {
                keyMap[e.code] = false;
                switch (e.code) {
                    case 'Space': setAction('JUMP', false, true); break;
                    case 'KeyC': setAction('SLIDE', false, true); break;
                    case 'KeyZ': setAction('DIVE', false, true); break;
                    case 'KeyR': setAction('RELOAD', false, true); break;
                    case 'KeyQ': case 'Digit1': case 'Digit2': setAction('SWITCH', false, true); break;
                    case 'Digit4': case 'KeyG': setAction('PLATE', false, true); break;
                    case 'KeyI': setAction('INSPECT', false, true); break;
                    case 'ShiftLeft': setAction('SPRINT', false, true); break;
                }
            });
        }

        function syncKeyboardMove() {
            if (joyTouchId !== null) return; // 觸控優先
            let x = 0;
            let y = 0;
            if (keyMap['KeyW']) y += 1;
            if (keyMap['KeyS']) y -= 1;
            if (keyMap['KeyD']) x += 1;
            if (keyMap['KeyA']) x -= 1;
            const len = Math.hypot(x, y);
            if (len > 0) {
                input.moveX = x / len;
                input.moveY = y / len;
                input.moveMag = keyMap['ShiftLeft'] ? 1.0 : 0.78;
            } else {
                input.moveX = 0;
                input.moveY = 0;
                input.moveMag = 0;
            }
        }

        function init() {
            if (initialized) return;
            initialized = true;

            joyZone = document.getElementById('joystick-zone');
            joyBase = document.getElementById('joystick-base');
            joyKnob = document.getElementById('joystick-knob');

            const hud = document.getElementById('hud-layer');
            hud.addEventListener('touchstart', handleTouchStart, { passive: false });
            hud.addEventListener('touchmove', handleTouchMove, { passive: false });
            hud.addEventListener('touchend', handleTouchEnd, { passive: false });
            hud.addEventListener('touchcancel', handleTouchEnd, { passive: false });

            bindDesktopControls();

            global.WZ.bus.on('state:change', ({ next }) => {
                if (next !== 'PLAYING') {
                    resetAll();
                    if (document.pointerLockElement && document.exitPointerLock) {
                        document.exitPointerLock();
                    }
                }
            });
        }

        function resetAll() {
            joyTouchId = null;
            lookTouches.clear();
            input.moveX = 0;
            input.moveY = 0;
            input.moveMag = 0;
            input.lookDeltaX = 0;
            input.lookDeltaY = 0;
            Object.keys(input.actions).forEach((k) => { input.actions[k] = false; });
            Object.keys(keyMap).forEach((k) => { keyMap[k] = false; });
            if (joyBase) joyBase.style.display = 'none';
            document.querySelectorAll('.touch-btn.pressed').forEach((el) => el.classList.remove('pressed'));
        }

        function consumeLookDelta() {
            const dx = input.lookDeltaX;
            const dy = input.lookDeltaY;
            input.lookDeltaX = 0;
            input.lookDeltaY = 0;
            return { dx, dy };
        }

        return {
            init,
            resetAll,
            syncKeyboardMove,
            consumeLookDelta,
            setAction,
            state: input
        };
    })();

    /* ========================================================================
     * 模組 05：電影級鏡頭支架與創傷值屏幕震動引擎
     * ======================================================================== */
    global.WZ.CameraRig = (function () {
        let yawObject = null;
        let pitchObject = null;
        let shakeObject = null;
        let camera = null;

        let yaw = 0;
        let pitch = 0;
        let currentEyeHeight = 1.7;
        let targetEyeHeight = 1.7;

        let trauma = 0;
        let bobPhase = 0;
        let currentFov = 78;
        let adsAlpha = 0;

        // 後座力彈簧狀態
        let recoilPitch = 0;
        let recoilYaw = 0;
        let recoilVelPitch = 0;
        let recoilVelYaw = 0;

        // 鏡頭傾斜（滑鏟/橫移/飛撲）
        let currentRoll = 0;
        let targetRoll = 0;
        let lobbyOrbitAngle = 0;

        const STANCE_HEIGHT = {
            STAND: 1.72,
            CROUCH: 1.15,
            SLIDE: 0.78,
            DIVE: 0.68,
            PRONE: 0.52
        };

        function init() {
            const scene = global.WZ.Renderer.getScene();
            camera = global.WZ.Renderer.getCamera();

            yawObject = new THREE.Object3D();
            yawObject.name = 'PlayerYawRig';
            yawObject.position.set(0, 1.72, 24);

            pitchObject = new THREE.Object3D();
            pitchObject.name = 'PlayerPitchRig';

            shakeObject = new THREE.Object3D();
            shakeObject.name = 'PlayerShakeRig';

            yawObject.add(pitchObject);
            pitchObject.add(shakeObject);
            shakeObject.add(camera);
            scene.add(yawObject);

            global.WZ.bus.on('combat:hit_player', ({ damage }) => {
                addTrauma(Math.min(0.65, 0.22 + damage * 0.008));
            });

            global.WZ.bus.on('fx:explosion', ({ distance }) => {
                if (distance < 24) {
                    const strength = Math.max(0.15, 1.0 - distance / 24);
                    addTrauma(strength * 0.95);
                }
            });
        }

        function addTrauma(amount) {
            trauma = Math.min(1.0, trauma + amount);
        }

        function addRecoil(pitchKick, yawKick) {
            recoilVelPitch += pitchKick * 18;
            recoilVelYaw += yawKick * 16;
            addTrauma(Math.min(0.28, pitchKick * 2.2));
        }

        function setPosition(x, y, z) {
            if (!yawObject) return;
            yawObject.position.set(x, y + currentEyeHeight, z);
        }

        function getWorldPosition(outVec) {
            const v = outVec || new THREE.Vector3();
            if (camera) camera.getWorldPosition(v);
            return v;
        }

        function getAimDirection(outVec) {
            const v = outVec || new THREE.Vector3();
            if (camera) camera.getWorldDirection(v);
            return v;
        }

        function update(dt, playerBody) {
            if (!yawObject || !camera) return;

            const st = global.WZ.State.data;

            // 大廳模式：電影感緩慢環繞戰場
            if (st.gameState === 'LOBBY') {
                lobbyOrbitAngle += dt * 0.14;
                const radius = 34;
                yawObject.position.set(
                    Math.sin(lobbyOrbitAngle) * radius,
                    11.5 + Math.sin(lobbyOrbitAngle * 1.7) * 1.5,
                    Math.cos(lobbyOrbitAngle) * radius
                );
                yawObject.rotation.set(0, 0, 0);
                pitchObject.rotation.set(0, 0, 0);
                shakeObject.position.set(0, 0, 0);
                shakeObject.rotation.set(0, 0, 0);
                camera.lookAt(0, 2.5, 0);
                camera.fov = 62;
                camera.updateProjectionMatrix();
                return;
            }

            // 1. 套用視角滑動輸入
            const delta = global.WZ.Touch.consumeLookDelta();
            yaw -= delta.dx;
            pitch -= delta.dy;
            pitch = Math.max(-1.46, Math.min(1.46, pitch));

            // 2. 後座力彈簧演算與自動回彈
            const springK = 140;
            const damping = 18;
            recoilVelPitch += (-springK * recoilPitch - damping * recoilVelPitch) * dt;
            recoilVelYaw += (-springK * recoilYaw - damping * recoilVelYaw) * dt;
            recoilPitch += recoilVelPitch * dt;
            recoilYaw += recoilVelYaw * dt;

            // 3. 姿勢眼高平滑過渡
            const stance = st.player.stance || 'STAND';
            targetEyeHeight = STANCE_HEIGHT[stance] || 1.72;
            currentEyeHeight += (targetEyeHeight - currentEyeHeight) * Math.min(1, dt * 13);

            // 4. 同步玩家物理座標
            if (playerBody) {
                yawObject.position.set(
                    playerBody.position.x,
                    playerBody.position.y + currentEyeHeight,
                    playerBody.position.z
                );
            }

            // 5. 奔跑與步行 Head-bob 及橫移/滑鏟 Roll 傾角
            const speed = playerBody ? Math.hypot(playerBody.velocity.x, playerBody.velocity.z) : 0;
            const grounded = playerBody ? playerBody.isGrounded : true;
            let bobX = 0;
            let bobY = 0;

            if (grounded && speed > 0.6 && stance !== 'SLIDE' && stance !== 'DIVE') {
                const freq = st.player.moveMode === 'TACSPRINT' ? 13.5 : (st.player.moveMode === 'SPRINT' ? 11.2 : 8.0);
                const amp = (st.player.isADS ? 0.012 : 0.042) * Math.min(1.2, speed / 6.0);
                bobPhase += dt * freq;
                bobX = Math.cos(bobPhase * 0.5) * amp * 0.7;
                bobY = Math.sin(bobPhase) * amp;
            } else {
                bobPhase = 0;
            }

            if (stance === 'SLIDE') {
                targetRoll = -0.14;
            } else if (stance === 'DIVE') {
                targetRoll = 0.08;
            } else {
                targetRoll = -global.WZ.Touch.state.moveX * (st.player.isADS ? 0.012 : 0.036);
            }
            currentRoll += (targetRoll - currentRoll) * Math.min(1, dt * 10);

            // 6. 創傷值 (Trauma) 屏幕震動
            trauma = Math.max(0, trauma - dt * 1.85);
            const shakeAmt = trauma * trauma;
            const now = performance.now() * 0.038;
            const shakePitch = Math.sin(now * 1.7) * shakeAmt * 0.065;
            const shakeYaw = Math.cos(now * 2.1) * shakeAmt * 0.055;
            const shakeRoll = Math.sin(now * 2.9) * shakeAmt * 0.09;

            yawObject.rotation.y = yaw + recoilYaw;
            pitchObject.rotation.x = Math.max(-1.48, Math.min(1.48, pitch + recoilPitch));
            shakeObject.position.set(bobX, bobY, 0);
            shakeObject.rotation.set(shakePitch, shakeYaw, currentRoll + shakeRoll);

            // 7. 動態 FOV 與狙擊鏡遮罩
            const wCfg = global.WZ.State.getActiveWeaponConfig();
            const adsTarget = st.player.isADS ? 1 : 0;
            adsAlpha += (adsTarget - adsAlpha) * Math.min(1, dt * wCfg.adsSpeed);

            let baseFov = 78;
            if (stance === 'SLIDE') baseFov = 86;
            else if (stance === 'DIVE') baseFov = 88;
            else if (st.player.moveMode === 'TACSPRINT') baseFov = 85;
            else if (st.player.moveMode === 'SPRINT') baseFov = 81;

            const desiredFov = baseFov + (wCfg.adsFov - baseFov) * adsAlpha;
            currentFov += (desiredFov - currentFov) * Math.min(1, dt * 14);
            if (Math.abs(camera.fov - currentFov) > 0.02) {
                camera.fov = currentFov;
                camera.updateProjectionMatrix();
            }

            // 狙擊鏡 UI 遮罩聯動
            const scopeEl = document.getElementById('sniper-scope-overlay');
            if (scopeEl) {
                const showScope = wCfg.type === 'SNIPER' && adsAlpha > 0.78 && st.gameState === 'PLAYING';
                scopeEl.classList.toggle('active', showScope);
            }
        }

        function resetLook(newYaw = 0, newPitch = 0) {
            yaw = newYaw;
            pitch = newPitch;
            recoilPitch = 0;
            recoilYaw = 0;
            recoilVelPitch = 0;
            recoilVelYaw = 0;
            trauma = 0;
            adsAlpha = 0;
        }

        return {
            init,
            update,
            addTrauma,
            addRecoil,
            setPosition,
            resetLook,
            getWorldPosition,
            getAimDirection,
            getYaw: () => yaw,
            getPitch: () => pitch,
            getAdsAlpha: () => adsAlpha,
            getYawObject: () => yawObject,
            getPitchObject: () => pitchObject,
            getShakeObject: () => shakeObject
        };
    })();

 /* ========================================================================
     * [進度：PART 3] 包含：

    /* ========================================================================
     * 模組 06：程序化高精 PBR 材質與法線貼圖合成器
     * ======================================================================== */
    global.WZ.Textures = (function () {
        const cache = Object.create(null);

        function createCanvas(size) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            return c;
        }

        function configureTex(canvas, repeatX = 1, repeatY = 1, isColor = true) {
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(repeatX, repeatY);
            tex.anisotropy = 4;
            if (isColor) {
                if ('colorSpace' in tex && THREE.SRGBColorSpace) {
                    tex.colorSpace = THREE.SRGBColorSpace;
                } else if ('encoding' in tex && THREE.sRGBEncoding) {
                    tex.encoding = THREE.sRGBEncoding;
                }
            }
            tex.needsUpdate = true;
            return tex;
        }

        // 由灰階高度圖 Canvas 轉出切線空間法線貼圖
        function heightToNormalCanvas(heightCanvas, strength = 2.2) {
            const w = heightCanvas.width;
            const h = heightCanvas.height;
            const srcCtx = heightCanvas.getContext('2d');
            const srcData = srcCtx.getImageData(0, 0, w, h).data;

            const outCanvas = createCanvas(w);
            const outCtx = outCanvas.getContext('2d');
            const outImg = outCtx.createImageData(w, h);
            const dst = outImg.data;

            const sample = (x, y) => {
                const wx = (x + w) % w;
                const wy = (y + h) % h;
                return srcData[(wy * w + wx) * 4] / 255;
            };

            for (let y = 0; y < h; y++) {
                for (let x = 0; x < w; x++) {
                    const tl = sample(x - 1, y - 1);
                    const t  = sample(x,     y - 1);
                    const tr = sample(x + 1, y - 1);
                    const l  = sample(x - 1, y);
                    const r  = sample(x + 1, y);
                    const bl = sample(x - 1, y + 1);
                    const b  = sample(x,     y + 1);
                    const br = sample(x + 1, y + 1);

                    const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
                    const dy = (bl + 2 * b + br) - (tl + 2 * t + tr);
                    let nx = -dx * strength;
                    let ny = -dy * strength;
                    let nz = 1.0;
                    const invLen = 1 / Math.hypot(nx, ny, nz);
                    nx *= invLen;
                    ny *= invLen;
                    nz *= invLen;

                    const idx = (y * w + x) * 4;
                    dst[idx]     = Math.round((nx * 0.5 + 0.5) * 255);
                    dst[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
                    dst[idx + 2] = Math.round((nz * 0.5 + 0.5) * 255);
                    dst[idx + 3] = 255;
                }
            }
            outCtx.putImageData(outImg, 0, 0);
            return outCanvas;
        }

        function buildAsphalt(repeat = 18) {
            const size = 256;
            const c = createCanvas(size);
            const ctx = c.getContext('2d');
            const hCanvas = createCanvas(size);
            const hCtx = hCanvas.getContext('2d');

            ctx.fillStyle = '#32363b';
            ctx.fillRect(0, 0, size, size);
            hCtx.fillStyle = '#808080';
            hCtx.fillRect(0, 0, size, size);

            for (let i = 0; i < 6500; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const v = 35 + Math.floor(Math.random() * 48);
                const s = Math.random() < 0.8 ? 1 : 2;
                ctx.fillStyle = `rgb(${v},${v + 2},${v + 5})`;
                ctx.fillRect(x, y, s, s);
                const hv = 90 + Math.floor(Math.random() * 85);
                hCtx.fillStyle = `rgb(${hv},${hv},${hv})`;
                hCtx.fillRect(x, y, s, s);
            }

            // 戰術標線與裂縫
            ctx.strokeStyle = 'rgba(20,22,25,0.55)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, 128);
            ctx.lineTo(size, 128);
            ctx.stroke();

            ctx.fillStyle = 'rgba(232, 182, 46, 0.25)';
            ctx.fillRect(0, 0, size, 4);

            const map = configureTex(c, repeat, repeat, true);
            const normalMap = configureTex(heightToNormalCanvas(hCanvas, 2.0), repeat, repeat, false);
            return new THREE.MeshStandardMaterial({
                map,
                normalMap,
                roughness: 0.9,
                metalness: 0.08
            });
        }

        function buildConcrete(repeatX = 2, repeatY = 2) {
            const size = 256;
            const c = createCanvas(size);
            const ctx = c.getContext('2d');
            const hCanvas = createCanvas(size);
            const hCtx = hCanvas.getContext('2d');

            ctx.fillStyle = '#8d8c86';
            ctx.fillRect(0, 0, size, size);
            hCtx.fillStyle = '#858585';
            hCtx.fillRect(0, 0, size, size);

            for (let i = 0; i < 4200; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const v = 115 + Math.floor(Math.random() * 46);
                ctx.fillStyle = `rgba(${v},${v - 2},${v - 6},0.65)`;
                ctx.fillRect(x, y, 2, 2);
                hCtx.fillStyle = `rgb(${v},${v},${v})`;
                hCtx.fillRect(x, y, 2, 2);
            }

            // 預鑄水泥縫隙與螺栓孔
            ctx.strokeStyle = 'rgba(42,42,40,0.45)';
            ctx.lineWidth = 2;
            ctx.strokeRect(2, 2, size - 4, size - 4);
            hCtx.strokeStyle = '#252525';
            hCtx.lineWidth = 3;
            hCtx.strokeRect(2, 2, size - 4, size - 4);

            const bolts = [[24, 24], [size - 24, 24], [24, size - 24], [size - 24, size - 24]];
            bolts.forEach(([bx, by]) => {
                ctx.fillStyle = '#4e4d48';
                ctx.beginPath();
                ctx.arc(bx, by, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            return new THREE.MeshStandardMaterial({
                map: configureTex(c, repeatX, repeatY, true),
                normalMap: configureTex(heightToNormalCanvas(hCanvas, 2.6), repeatX, repeatY, false),
                roughness: 0.86,
                metalness: 0.06
            });
        }

        function buildContainer(baseHex, stripeHex) {
            const size = 256;
            const c = createCanvas(size);
            const ctx = c.getContext('2d');
            const hCanvas = createCanvas(size);
            const hCtx = hCanvas.getContext('2d');

            ctx.fillStyle = baseHex;
            ctx.fillRect(0, 0, size, size);

            // 浪板凹凸條紋
            for (let x = 0; x < size; x += 16) {
                const grad = ctx.createLinearGradient(x, 0, x + 16, 0);
                grad.addColorStop(0, 'rgba(0,0,0,0.28)');
                grad.addColorStop(0.45, 'rgba(255,255,255,0.12)');
                grad.addColorStop(1, 'rgba(0,0,0,0.22)');
                ctx.fillStyle = grad;
                ctx.fillRect(x, 0, 16, size);

                const hGrad = hCtx.createLinearGradient(x, 0, x + 16, 0);
                hGrad.addColorStop(0, '#303030');
                hGrad.addColorStop(0.5, '#e8e8e8');
                hGrad.addColorStop(1, '#303030');
                hCtx.fillStyle = hGrad;
                hCtx.fillRect(x, 0, 16, size);
            }

            // 戰術警示條與磨損鏽跡
            ctx.fillStyle = stripeHex || 'rgba(245,184,46,0.75)';
            ctx.fillRect(0, size - 36, size, 14);
            for (let i = 0; i < 600; i++) {
                ctx.fillStyle = Math.random() < 0.5 ? 'rgba(92,48,22,0.18)' : 'rgba(20,20,20,0.15)';
                ctx.fillRect(Math.random() * size, Math.random() * size, 4, 2);
            }

            // 邊框鋼樑
            ctx.strokeStyle = 'rgba(15,18,22,0.7)';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, size - 10, size - 10);

            return new THREE.MeshStandardMaterial({
                map: configureTex(c, 2, 1, true),
                normalMap: configureTex(heightToNormalCanvas(hCanvas, 3.2), 2, 1, false),
                roughness: 0.54,
                metalness: 0.58
            });
        }

        function buildGunmetal(tint = '#252930', roughness = 0.34, metalness = 0.85) {
            const size = 128;
            const c = createCanvas(size);
            const ctx = c.getContext('2d');
            ctx.fillStyle = tint;
            ctx.fillRect(0, 0, size, size);

            // 拉絲金屬質感
            for (let y = 0; y < size; y++) {
                const alpha = 0.04 + Math.random() * 0.08;
                ctx.fillStyle = Math.random() < 0.5 ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha})`;
                ctx.fillRect(0, y, size, 1);
            }

            return new THREE.MeshStandardMaterial({
                map: configureTex(c, 1, 1, true),
                roughness,
                metalness
            });
        }

        function buildCrate() {
            const size = 128;
            const c = createCanvas(size);
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#6f5536';
            ctx.fillRect(0, 0, size, size);
            ctx.strokeStyle = '#3f2e1b';
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, size - 8, size - 8);
            ctx.beginPath();
            ctx.moveTo(8, 8); ctx.lineTo(size - 8, size - 8);
            ctx.moveTo(size - 8, 8); ctx.lineTo(8, size - 8);
            ctx.stroke();

            return new THREE.MeshStandardMaterial({
                map: configureTex(c, 1, 1, true),
                roughness: 0.85,
                metalness: 0.05
            });
        }

        function getMaterial(key) {
            if (cache[key]) return cache[key];
            switch (key) {
                case 'asphalt': cache[key] = buildAsphalt(22); break;
                case 'concrete': cache[key] = buildConcrete(2, 2); break;
                case 'concrete_wall': cache[key] = buildConcrete(6, 2); break;
                case 'container_red': cache[key] = buildContainer('#7e2722', '#f5b82e'); break;
                case 'container_blue': cache[key] = buildContainer('#23456b', '#d9e3ec'); break;
                case 'container_olive': cache[key] = buildContainer('#3f4d34', '#d4a63a'); break;
                case 'container_sand': cache[key] = buildContainer('#8f7a58', '#222222'); break;
                case 'crate': cache[key] = buildCrate(); break;
                case 'gunmetal': cache[key] = buildGunmetal('#252a30', 0.32, 0.86); break;
                case 'gunmetal_tan': cache[key] = buildGunmetal('#8c7858', 0.48, 0.45); break;
                case 'gunmetal_dark': cache[key] = buildGunmetal('#15171b', 0.42, 0.72); break;
                case 'polymer': cache[key] = buildGunmetal('#1e2126', 0.72, 0.12); break;
                case 'hazard_barrel':
                    cache[key] = new THREE.MeshStandardMaterial({
                        color: 0xc92820,
                        roughness: 0.42,
                        metalness: 0.48
                    });
                    break;
                default:
                    cache[key] = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.7 });
            }
            return cache[key];
        }

        function init() {
            // 預熱核心材質
            ['asphalt', 'concrete', 'container_red', 'container_blue', 'container_olive', 'gunmetal', 'polymer'].forEach(getMaterial);
        }

        return { init, getMaterial };
    })();

    /* ========================================================================
     * 模組 07：現代戰術基地、貨櫃城與 3D 碰撞世界 (Shipment / Shoot House 融合)
     * ======================================================================== */
    global.WZ.World = (function () {
        let worldGroup = null;
        const ARENA_HALF = 56;
        const colliders = [];
        const explosives = [];
        const spawnPoints = [];
        const shootableMeshes = [];

        function registerBox(mesh, minX, minY, minZ, maxX, maxY, maxZ, tag = 'cover') {
            const box = { minX, minY, minZ, maxX, maxY, maxZ, tag, mesh };
            colliders.push(box);
            if (mesh) {
                mesh.userData.hitSurface = tag;
                shootableMeshes.push(mesh);
            }
            return box;
        }

        function addBlock(x, y, z, w, h, d, matKey, tag = 'concrete', rotY = 0) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = global.WZ.Textures.getMaterial(matKey);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y + h * 0.5, z);
            mesh.rotation.y = rotY;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            worldGroup.add(mesh);

            // 若無旋轉則精確註冊 AABB，若有旋轉取外包盒
            if (Math.abs(rotY) < 0.001) {
                registerBox(mesh, x - w * 0.5, y, z - d * 0.5, x + w * 0.5, y + h, z + d * 0.5, tag);
            } else {
                mesh.updateMatrixWorld(true);
                const b3 = new THREE.Box3().setFromObject(mesh);
                registerBox(mesh, b3.min.x, b3.min.y, b3.min.z, b3.max.x, b3.max.y, b3.max.z, tag);
            }
            return mesh;
        }

        function addBarrel(x, z) {
            const group = new THREE.Group();
            group.position.set(x, 0, z);

            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.42, 0.42, 1.28, 14),
                global.WZ.Textures.getMaterial('hazard_barrel')
            );
            body.position.y = 0.64;
            body.castShadow = true;
            body.receiveShadow = true;

            const stripe = new THREE.Mesh(
                new THREE.CylinderGeometry(0.43, 0.43, 0.22, 14),
                new THREE.MeshStandardMaterial({ color: 0xf5b82e, roughness: 0.4 })
            );
            stripe.position.y = 0.66;

            group.add(body, stripe);
            worldGroup.add(group);

            const barrelObj = {
                id: 'barrel_' + explosives.length,
                mesh: group,
                hitMesh: body,
                position: new THREE.Vector3(x, 0.64, z),
                hp: 45,
                alive: true,
                radius: 8.5,
                damage: 165
            };
            body.userData.explosive = barrelObj;
            body.userData.hitSurface = 'metal';
            shootableMeshes.push(body);
            explosives.push(barrelObj);

            registerBox(null, x - 0.48, 0, z - 0.48, x + 0.48, 1.3, z + 0.48, 'barrel');
            return barrelObj;
        }

        function buildArena() {
            const scene = global.WZ.Renderer.getScene();
            if (worldGroup) scene.remove(worldGroup);

            worldGroup = new THREE.Group();
            worldGroup.name = 'TacticalWorld';
            colliders.length = 0;
            explosives.length = 0;
            shootableMeshes.length = 0;
            spawnPoints.length = 0;

            // 1. 戰場柏油地面
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(ARENA_HALF * 2 + 12, ARENA_HALF * 2 + 12),
                global.WZ.Textures.getMaterial('asphalt')
            );
            ground.rotation.x = -Math.PI * 0.5;
            ground.receiveShadow = true;
            ground.userData.hitSurface = 'concrete';
            worldGroup.add(ground);
            shootableMeshes.push(ground);

            // 2. 四周高牆圍欄
            const wallH = 7.5;
            const wallT = 2.0;
            const span = ARENA_HALF * 2;
            addBlock(0, 0, -ARENA_HALF, span, wallH, wallT, 'concrete_wall', 'concrete');
            addBlock(0, 0, ARENA_HALF, span, wallH, wallT, 'concrete_wall', 'concrete');
            addBlock(-ARENA_HALF, 0, 0, wallT, wallH, span, 'concrete_wall', 'concrete');
            addBlock(ARENA_HALF, 0, 0, wallT, wallH, span, 'concrete_wall', 'concrete');

            // 3. 中央交火區（Shoot House 雙向貨櫃與低矮掩體）
            addBlock(-10, 0, -6, 3.4, 3.2, 10.5, 'container_red', 'metal');
            addBlock(10, 0, 6, 3.4, 3.2, 10.5, 'container_blue', 'metal');
            addBlock(0, 0, 0, 7.5, 1.35, 1.6, 'concrete', 'concrete'); // 中路對槍胸牆
            addBlock(-18, 0, 12, 10.2, 3.2, 3.4, 'container_olive', 'metal');
            addBlock(18, 0, -14, 10.2, 3.2, 3.4, 'container_sand', 'metal');

            // 雙層疊加貨櫃（狙擊視覺地標）
            addBlock(-28, 0, -24, 10.5, 3.2, 3.4, 'container_blue', 'metal');
            addBlock(-28, 3.2, -24, 10.5, 3.2, 3.4, 'container_red', 'metal');
            addBlock(28, 0, 22, 3.4, 3.2, 10.5, 'container_olive', 'metal');
            addBlock(28, 3.2, 22, 3.4, 3.2, 10.5, 'container_sand', 'metal');

            // 4. 靶場射擊線與戰術掩體陣列
            addBlock(-5, 0, 18, 3.6, 1.25, 1.2, 'concrete', 'concrete');
            addBlock(5, 0, 18, 3.6, 1.25, 1.2, 'concrete', 'concrete');
            addBlock(-22, 0, -4, 2.2, 2.2, 2.2, 'crate', 'wood');
            addBlock(22, 0, 4, 2.2, 2.2, 2.2, 'crate', 'wood');
            addBlock(0, 0, -24, 12, 2.8, 2.2, 'concrete', 'concrete');
            addBlock(-15, 0, -30, 4.5, 1.4, 1.4, 'concrete', 'concrete');
            addBlock(15, 0, -30, 4.5, 1.4, 1.4, 'concrete', 'concrete');

            // 角落哨塔（裝飾與掩護支柱）
            addBlock(-40, 0, -40, 5, 9, 5, 'concrete', 'concrete');
            addBlock(40, 0, -40, 5, 9, 5, 'concrete', 'concrete');
            addBlock(-40, 0, 38, 5, 9, 5, 'concrete', 'concrete');
            addBlock(40, 0, 38, 5, 9, 5, 'concrete', 'concrete');

            // 5. 可引爆紅色油桶
            const barrelCoords = [
                [-6.5, -2.5], [6.5, 2.5], [-14, 16], [14, -18],
                [0, -14], [-25, -10], [25, 10]
            ];
            barrelCoords.forEach(([bx, bz]) => addBarrel(bx, bz));

            // 6. 敵軍與靶位重生點
            const rawSpawns = [
                [-16, 0, -20], [16, 0, -20], [0, 0, -32],
                [-32, 0, -8], [32, 0, -8], [-24, 0, 26],
                [24, 0, 26], [0, 0, -10], [-14, 0, 4], [14, 0, -4]
            ];
            rawSpawns.forEach(([sx, sy, sz]) => spawnPoints.push(new THREE.Vector3(sx, sy, sz)));

            scene.add(worldGroup);

            global.WZ.State.data.colliders = colliders;
            global.WZ.State.data.explosives = explosives;
        }

        function damageExplosive(barrelObj, dmg) {
            if (!barrelObj || !barrelObj.alive) return;
            barrelObj.hp -= dmg;
            if (barrelObj.hp <= 0) {
                barrelObj.alive = false;
                if (barrelObj.mesh) barrelObj.mesh.visible = false;
                const pos = barrelObj.position.clone();
                const playerPos = global.WZ.Movement ? global.WZ.Movement.body.position : new THREE.Vector3();
                const dist = pos.distanceTo(playerPos);

                global.WZ.bus.emit('fx:explosion', {
                    position: pos,
                    radius: barrelObj.radius,
                    damage: barrelObj.damage,
                    distance: dist
                });
            }
        }

        function resetExplosives() {
            explosives.forEach((b) => {
                b.hp = 45;
                b.alive = true;
                if (b.mesh) b.mesh.visible = true;
            });
        }

        function init() {
            buildArena();
            global.WZ.bus.on('match:reset', resetExplosives);
        }

        return {
            init,
            damageExplosive,
            resetExplosives,
            getColliders: () => colliders,
            getShootableMeshes: () => shootableMeshes,
            getSpawnPoints: () => spawnPoints,
            getArenaHalf: () => ARENA_HALF
        };
    })();

    /* ========================================================================
     * 模組 08：戰區級身法物理核心 (戰術衝刺、滑鏟取消、飛撲與跳射)
     * ======================================================================== */
    global.WZ.Movement = (function () {
        const body = {
            position: new THREE.Vector3(0, 0, 30),
            velocity: new THREE.Vector3(0, 0, 0),
            radius: 0.42,
            height: 1.8,
            isGrounded: true
        };

        // 戰區級身法參數
        const PHYS = {
            gravity: -25.5,
            jumpVel: 8.6,
            walkSpeed: 4.9,
            sprintSpeed: 7.4,
            tacSprintSpeed: 9.2,
            crouchSpeed: 2.9,
            proneSpeed: 1.5,
            adsMult: 0.62,
            slideInitSpeed: 12.6,
            slideDuration: 0.68,
            diveHorizSpeed: 11.2,
            diveVertVel: 4.8,
            diveDuration: 0.72,
            groundAccel: 38.0,
            airAccel: 11.0,
            friction: 11.5
        };

        let slideTimer = 0;
        let diveTimer = 0;
        let slideDir = new THREE.Vector3();
        let diveDir = new THREE.Vector3();
        let footstepAccum = 0;

        function resetPosition() {
            body.position.set(0, 0, 32);
            body.velocity.set(0, 0, 0);
            body.isGrounded = true;
            slideTimer = 0;
            diveTimer = 0;
            global.WZ.State.data.player.stance = 'STAND';
            global.WZ.State.data.player.moveMode = 'IDLE';
            global.WZ.State.data.player.tacSprintEnergy = 100;
            if (global.WZ.CameraRig) {
                global.WZ.CameraRig.resetLook(0, 0);
            }
        }

        function getForwardRight() {
            const yaw = global.WZ.CameraRig ? global.WZ.CameraRig.getYaw() : 0;
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();
            return { forward, right };
        }

        function triggerJump() {
            const p = global.WZ.State.data.player;

            // 滑鏟取消 (Slide Cancel)：滑鏟期間按跳躍立刻中斷滑鏟並獲得動量彈起或站起
            if (p.stance === 'SLIDE') {
                slideTimer = 0;
                p.stance = 'STAND';
                p.tacSprintEnergy = Math.min(100, p.tacSprintEnergy + 22);
                if (body.isGrounded) {
                    body.velocity.y = PHYS.jumpVel * 0.92;
                    body.isGrounded = false;
                }
                global.WZ.bus.emit('player:slide_cancel', { position: body.position });
                return;
            }

            if (p.stance === 'PRONE' || p.stance === 'CROUCH') {
                p.stance = 'STAND';
                return;
            }

            if (body.isGrounded && p.stance !== 'DIVE') {
                body.velocity.y = PHYS.jumpVel;
                body.isGrounded = false;
                global.WZ.bus.emit('player:jump', { position: body.position });
            }
        }

        function triggerSlideOrCrouch() {
            const p = global.WZ.State.data.player;
            if (p.stance === 'DIVE') return;

            const horizSpeed = Math.hypot(body.velocity.x, body.velocity.z);
            if (body.isGrounded && horizSpeed > 5.4 && p.stance === 'STAND') {
                // 觸發戰區高速滑鏟
                p.stance = 'SLIDE';
                p.isADS = false;
                slideTimer = PHYS.slideDuration;
                slideDir.set(body.velocity.x, 0, body.velocity.z).normalize();
                body.velocity.x = slideDir.x * PHYS.slideInitSpeed;
                body.velocity.z = slideDir.z * PHYS.slideInitSpeed;
                global.WZ.bus.emit('player:slide', { position: body.position });
            } else if (p.stance === 'SLIDE') {
                // 二次點擊滑鏟鍵快速取消起身
                slideTimer = 0;
                p.stance = 'STAND';
            } else if (p.stance === 'CROUCH') {
                p.stance = 'STAND';
            } else {
                p.stance = 'CROUCH';
            }
        }

        function triggerDive() {
            const p = global.WZ.State.data.player;
            if (!body.isGrounded || p.stance === 'DIVE') return;

            const { forward, right } = getForwardRight();
            const inp = global.WZ.Touch.state;
            diveDir.set(0, 0, 0)
                .addScaledVector(forward, inp.moveY !== 0 ? inp.moveY : 1)
                .addScaledVector(right, inp.moveX);

            if (diveDir.lengthSq() < 0.01) diveDir.copy(forward);
            diveDir.normalize();

            p.stance = 'DIVE';
            p.isADS = false;
            diveTimer = PHYS.diveDuration;
            body.velocity.x = diveDir.x * PHYS.diveHorizSpeed;
            body.velocity.z = diveDir.z * PHYS.diveHorizSpeed;
            body.velocity.y = PHYS.diveVertVel;
            body.isGrounded = false;

            global.WZ.bus.emit('player:dive', { position: body.position });
        }

        function resolveWorldCollision() {
            const half = global.WZ.World ? global.WZ.World.getArenaHalf() - 1.4 : 54;
            body.position.x = Math.max(-half, Math.min(half, body.position.x));
            body.position.z = Math.max(-half, Math.min(half, body.position.z));

            const colliders = global.WZ.World ? global.WZ.World.getColliders() : [];
            const r = body.radius;
            const pBottom = body.position.y;
            const pTop = body.position.y + body.height;

            for (let i = 0; i < colliders.length; i++) {
                const b = colliders[i];
                if (pTop <= b.minY + 0.05 || pBottom >= b.maxY - 0.05) continue;

                // 找最近點並推出（支援沿牆壁平滑滑行）
                const closestX = Math.max(b.minX, Math.min(body.position.x, b.maxX));
                const closestZ = Math.max(b.minZ, Math.min(body.position.z, b.maxZ));
                const dx = body.position.x - closestX;
                const dz = body.position.z - closestZ;
                const distSq = dx * dx + dz * dz;

                if (distSq < r * r) {
                    if (distSq > 0.00001) {
                        const dist = Math.sqrt(distSq);
                        const overlap = r - dist;
                        const nx = dx / dist;
                        const nz = dz / dist;
                        body.position.x += nx * overlap;
                        body.position.z += nz * overlap;

                        const vn = body.velocity.x * nx + body.velocity.z * nz;
                        if (vn < 0) {
                            body.velocity.x -= vn * nx;
                            body.velocity.z -= vn * nz;
                        }
                    } else {
                        // 圓心落入盒內時依最短軸彈出
                        const penLeft = Math.abs(body.position.x - b.minX);
                        const penRight = Math.abs(b.maxX - body.position.x);
                        const penBack = Math.abs(body.position.z - b.minZ);
                        const penFront = Math.abs(b.maxZ - body.position.z);
                        const minPen = Math.min(penLeft, penRight, penBack, penFront);
                        if (minPen === penLeft) body.position.x = b.minX - r;
                        else if (minPen === penRight) body.position.x = b.maxX + r;
                        else if (minPen === penBack) body.position.z = b.minZ - r;
                        else body.position.z = b.maxZ + r;
                    }
                }
            }

            // 地面落地
            if (body.position.y <= 0) {
                if (!body.isGrounded && body.velocity.y < -6) {
                    global.WZ.bus.emit('player:land', { impact: -body.velocity.y });
                }
                body.position.y = 0;
                body.velocity.y = 0;
                body.isGrounded = true;
            }
        }

        function update(dt) {
            const st = global.WZ.State.data;
            if (st.gameState !== 'PLAYING' || !st.player.isAlive) return;

            global.WZ.Touch.syncKeyboardMove();
            const inp = global.WZ.Touch.state;
            const p = st.player;
            const wCfg = global.WZ.State.getActiveWeaponConfig();

            // 同步 ADS 狀態（滑鏟或飛撲期間強制取消開鏡）
            if (p.stance === 'SLIDE' || p.stance === 'DIVE') {
                p.isADS = false;
            } else {
                p.isADS = !!inp.actions.ADS;
            }

            const { forward, right } = getForwardRight();
            const wishDir = new THREE.Vector3()
                .addScaledVector(forward, inp.moveY)
                .addScaledVector(right, inp.moveX);
            const wishLen = wishDir.length();
            if (wishLen > 0.01) wishDir.divideScalar(wishLen);

            // 1. 滑鏟物理階段
            if (p.stance === 'SLIDE') {
                slideTimer -= dt;
                const t = Math.max(0, slideTimer / PHYS.slideDuration);
                const curSlideSpeed = 3.2 + (PHYS.slideInitSpeed - 3.2) * (t * t);
                body.velocity.x = slideDir.x * curSlideSpeed;
                body.velocity.z = slideDir.z * curSlideSpeed;
                p.moveMode = 'SPRINT';

                if (slideTimer <= 0) {
                    p.stance = 'CROUCH';
                }
            }
            // 2. 戰術飛撲階段
            else if (p.stance === 'DIVE') {
                diveTimer -= dt;
                body.velocity.x *= Math.max(0, 1 - dt * 1.9);
                body.velocity.z *= Math.max(0, 1 - dt * 1.9);
                p.moveMode = 'SPRINT';

                if (diveTimer <= 0 && body.isGrounded) {
                    p.stance = 'PRONE';
                }
            }
            // 3. 一般地面/空中移動與戰術衝刺
            else {
                const wantsSprint =
                    p.stance === 'STAND' &&
                    !p.isADS &&
                    !p.isFiring &&
                    inp.moveY > 0.55 &&
                    ((st.settings.autoSprint && inp.moveMag > 0.85) || inp.actions.SPRINT);

                let targetSpeed = PHYS.walkSpeed;
                if (p.stance === 'PRONE') {
                    targetSpeed = PHYS.proneSpeed;
                    p.moveMode = wishLen > 0.1 ? 'WALK' : 'IDLE';
                } else if (p.stance === 'CROUCH') {
                    targetSpeed = PHYS.crouchSpeed;
                    p.moveMode = wishLen > 0.1 ? 'WALK' : 'IDLE';
                } else if (wantsSprint) {
                    if (p.tacSprintEnergy > 6) {
                        targetSpeed = PHYS.tacSprintSpeed;
                        p.moveMode = 'TACSPRINT';
                        p.tacSprintEnergy = Math.max(0, p.tacSprintEnergy - dt * 26);
                    } else {
                        targetSpeed = PHYS.sprintSpeed;
                        p.moveMode = 'SPRINT';
                    }
                } else {
                    p.moveMode = wishLen > 0.1 ? 'WALK' : 'IDLE';
                    p.tacSprintEnergy = Math.min(100, p.tacSprintEnergy + dt * 18);
                }

                targetSpeed *= (wCfg.moveMult || 1.0);
                if (p.isADS) targetSpeed *= PHYS.adsMult;
                if (p.isPlating) targetSpeed *= 0.72;

                const accel = body.isGrounded ? PHYS.groundAccel : PHYS.airAccel;
                const desiredVx = wishDir.x * targetSpeed * Math.min(1, wishLen);
                const desiredVz = wishDir.z * targetSpeed * Math.min(1, wishLen);

                const lerpFactor = Math.min(1, accel * dt * 0.22);
                if (wishLen > 0.05) {
                    body.velocity.x += (desiredVx - body.velocity.x) * lerpFactor;
                    body.velocity.z += (desiredVz - body.velocity.z) * lerpFactor;
                } else if (body.isGrounded) {
                    const damp = Math.max(0, 1 - PHYS.friction * dt);
                    body.velocity.x *= damp;
                    body.velocity.z *= damp;
                }
            }

            // 重力積分
            body.velocity.y += PHYS.gravity * dt;
            body.position.addScaledVector(body.velocity, dt);
            resolveWorldCollision();

            // 腳步聲節奏事件
            const hSpeed = Math.hypot(body.velocity.x, body.velocity.z);
            if (body.isGrounded && hSpeed > 1.2 && p.stance !== 'SLIDE' && p.stance !== 'DIVE') {
                footstepAccum += hSpeed * dt;
                const stride = p.moveMode === 'TACSPRINT' ? 2.5 : 2.1;
                if (footstepAccum >= stride) {
                    footstepAccum = 0;
                    global.WZ.bus.emit('player:footstep', { mode: p.moveMode });
                }
            }

            // 更新姿勢文字顯示
            const stanceEl = document.getElementById('hud-stance-text');
            if (stanceEl) {
                stanceEl.textContent = p.moveMode === 'TACSPRINT' ? 'TAC-SPRINT' : p.stance;
            }
        }

        function init() {
            global.WZ.bus.on('input:action', ({ action, pressed }) => {
                if (!pressed || global.WZ.State.data.gameState !== 'PLAYING') return;
                if (action === 'JUMP') triggerJump();
                else if (action === 'SLIDE') triggerSlideOrCrouch();
                else if (action === 'DIVE') triggerDive();
            });

            global.WZ.bus.on('match:reset', resetPosition);
        }

        return {
            init,
            update,
            resetPosition,
            body
        };
    })();

    /* ========================================================================
     * 模組 09：雙手戰術護腕與 3D 第一人稱骨架 (ViewModelRig)
     * ======================================================================== */
    global.WZ.ViewModelRig = (function () {
        let isInitialized = false;

        // 第一人稱階層式骨架節點
        let viewModelRootGroup = null;
        let locomotionAndSwayGroup = null;

        let rightArmPivotGroup = null;

        // 左手與右手細部關節引用，供動畫控制器微調
        let leftArmComponents = null;
        let rightArmComponents = null;

        // 材質快取表
        const materialRegistry = Object.create(null);

        // 建立輔助用繪圖畫布
        function createDrawingCanvas(canvasWidth, canvasHeight) {
            const canvasElement = document.createElement('canvas');
            canvasElement.width = canvasWidth;
            canvasElement.height = canvasHeight;
            return canvasElement;
        }

        // 建立程序化 Canvas 紋理
        function createConfiguredCanvasTexture(canvasElement, repeatHorizontal, repeatVertical) {
            const canvasTexture = new THREE.CanvasTexture(canvasElement);
            canvasTexture.wrapS = THREE.RepeatWrapping;
            canvasTexture.wrapT = THREE.RepeatWrapping;
            canvasTexture.repeat.set(repeatHorizontal, repeatVertical);
            canvasTexture.anisotropy = 4;
            if ('colorSpace' in canvasTexture && THREE.SRGBColorSpace) {
                canvasTexture.colorSpace = THREE.SRGBColorSpace;
            } else if ('encoding' in canvasTexture && THREE.sRGBEncoding) {
                canvasTexture.encoding = THREE.sRGBEncoding;
            }
            canvasTexture.needsUpdate = true;
            return canvasTexture;
        }

        // 建立特戰多地形迷彩防撕裂戰鬥服材質
        function buildTacticalSleeveMaterial() {
            const canvasSize = 256;
            const canvasElement = createDrawingCanvas(canvasSize, canvasSize);
            const canvasContext = canvasElement.getContext('2d');

            canvasContext.fillStyle = '#3b4234';
            canvasContext.fillRect(0, 0, canvasSize, canvasSize);

            const camouflagePalette = ['#4b523d', '#2b3025', '#685f49', '#32372c', '#534c3a'];
            for (let patchIndex = 0; patchIndex < 110; patchIndex = patchIndex + 1) {
                const colorIndex = patchIndex % camouflagePalette.length;
                canvasContext.fillStyle = camouflagePalette[colorIndex];
                const centerX = Math.random() * canvasSize;
                const centerY = Math.random() * canvasSize;
                const radiusX = 12 + Math.random() * 28;
                const radiusY = 8 + Math.random() * 20;
                const rotationAngle = Math.random() * Math.PI;
                canvasContext.beginPath();
                canvasContext.ellipse(centerX, centerY, radiusX, radiusY, rotationAngle, 0, Math.PI * 2);
                canvasContext.fill();
            }

            // 防撕裂格紋布料紋理 (Ripstop Grid)
            canvasContext.strokeStyle = 'rgba(12, 14, 10, 0.24)';
            canvasContext.lineWidth = 1;
            for (let gridOffset = 0; gridOffset < canvasSize; gridOffset = gridOffset + 8) {
                canvasContext.beginPath();
                canvasContext.moveTo(gridOffset, 0);
                canvasContext.lineTo(gridOffset, canvasSize);
                canvasContext.stroke();

                canvasContext.beginPath();
                canvasContext.moveTo(0, gridOffset);
                canvasContext.lineTo(canvasSize, gridOffset);
                canvasContext.stroke();
            }

            const sleeveTexture = createConfiguredCanvasTexture(canvasElement, 2, 2);
            return new THREE.MeshStandardMaterial({
                map: sleeveTexture,
                roughness: 0.92,
                metalness: 0.04
            });
        }

        // 建立戰術皮革手套材質 (狼棕色與防滑顆粒)
        function buildTacticalGloveMaterial() {
            const canvasSize = 128;
            const canvasElement = createDrawingCanvas(canvasSize, canvasSize);
            const canvasContext = canvasElement.getContext('2d');

            canvasContext.fillStyle = '#474137';
            canvasContext.fillRect(0, 0, canvasSize, canvasSize);

            for (let grainIndex = 0; grainIndex < 2200; grainIndex = grainIndex + 1) {
                const pixelX = Math.random() * canvasSize;
                const pixelY = Math.random() * canvasSize;
                const brightness = 48 + Math.floor(Math.random() * 34);
                canvasContext.fillStyle = 'rgb(' + brightness + ',' + (brightness - 4) + ',' + (brightness - 10) + ')';
                canvasContext.fillRect(pixelX, pixelY, 2, 2);
            }

            canvasContext.strokeStyle = 'rgba(22, 20, 18, 0.45)';
            canvasContext.lineWidth = 2;
            canvasContext.strokeRect(4, 4, canvasSize - 8, canvasSize - 8);

            const gloveTexture = createConfiguredCanvasTexture(canvasElement, 1, 1);
            return new THREE.MeshStandardMaterial({
                map: gloveTexture,
                roughness: 0.78,
                metalness: 0.08
            });
        }

        // 建立碳纖維指關節護甲材質
        function buildCarbonFiberMaterial() {
            const canvasSize = 64;
            const canvasElement = createDrawingCanvas(canvasSize, canvasSize);
            const canvasContext = canvasElement.getContext('2d');

            canvasContext.fillStyle = '#181b1f';
            canvasContext.fillRect(0, 0, canvasSize, canvasSize);

            for (let rowIndex = 0; rowIndex < canvasSize; rowIndex = rowIndex + 8) {
                for (let columnIndex = 0; columnIndex < canvasSize; columnIndex = columnIndex + 8) {
                    const isOffsetCell = ((rowIndex + columnIndex) / 8) % 2 === 0;
                    canvasContext.fillStyle = isOffsetCell ? '#282d35' : '#111317';
                    canvasContext.fillRect(columnIndex, rowIndex, 7, 7);
                }
            }

            const carbonTexture = createConfiguredCanvasTexture(canvasElement, 2, 2);
            return new THREE.MeshStandardMaterial({
                map: carbonTexture,
                roughness: 0.34,
                metalness: 0.62
            });
        }

        // 建立左手腕戰術智慧手錶顯示螢幕材質 (附發光心跳波與方位數據)
        function buildTacticalWatchScreenMaterial() {
            const canvasSize = 128;
            const canvasElement = createDrawingCanvas(canvasSize, canvasSize);
            const canvasContext = canvasElement.getContext('2d');

            canvasContext.fillStyle = '#06131a';
            canvasContext.fillRect(0, 0, canvasSize, canvasSize);

            // 外框刻度
            canvasContext.strokeStyle = '#18c2d6';
            canvasContext.lineWidth = 4;
            canvasContext.strokeRect(6, 6, canvasSize - 12, canvasSize - 12);

            // 戰術數位時間與狀態字樣
            canvasContext.fillStyle = '#38f0ff';
            canvasContext.font = 'bold 26px monospace';
            canvasContext.textAlign = 'center';
            canvasContext.fillText('14:08', 64, 42);

            canvasContext.fillStyle = '#8ef7a4';
            canvasContext.font = 'bold 14px monospace';
            canvasContext.fillText('HR 92 | N 042', 64, 66);

            // 戰術心率波形圖
            canvasContext.strokeStyle = '#38f0ff';
            canvasContext.lineWidth = 3;
            canvasContext.beginPath();
            canvasContext.moveTo(14, 96);
            canvasContext.lineTo(36, 96);
            canvasContext.lineTo(46, 78);
            canvasContext.lineTo(56, 110);
            canvasContext.lineTo(68, 86);
            canvasContext.lineTo(80, 96);
            canvasContext.lineTo(114, 96);
            canvasContext.stroke();

            const watchTexture = createConfiguredCanvasTexture(canvasElement, 1, 1);
            return new THREE.MeshStandardMaterial({
                map: watchTexture,
                emissiveMap: watchTexture,
                emissive: new THREE.Color(0x28d8f0),
                emissiveIntensity: 0.85,
                roughness: 0.18,
                metalness: 0.25
            });
        }

        // 建立四級陶瓷防彈插板 (SAPI Armor Plate) 表面材質
        function buildBallisticArmorPlateMaterial() {
            const canvasWidth = 256;
            const canvasHeight = 256;
            const canvasElement = createDrawingCanvas(canvasWidth, canvasHeight);
            const canvasContext = canvasElement.getContext('2d');

            // 深藍灰戰術防彈纖維外層
            canvasContext.fillStyle = '#1f2833';
            canvasContext.fillRect(0, 0, canvasWidth, canvasHeight);

            // 編織防彈布顆粒感
            for (let verticalIndex = 0; verticalIndex < canvasHeight; verticalIndex = verticalIndex + 4) {
                for (let horizontalIndex = 0; horizontalIndex < canvasWidth; horizontalIndex = horizontalIndex + 4) {
                    const shade = ((verticalIndex + horizontalIndex) % 8 === 0) ? 38 : 26;
                    canvasContext.fillStyle = 'rgb(' + shade + ',' + (shade + 8) + ',' + (shade + 16) + ')';
                    canvasContext.fillRect(horizontalIndex, verticalIndex, 3, 3);
                }
            }

            // 強化邊框與戰術藍色識別條
            canvasContext.strokeStyle = '#3898ff';
            canvasContext.lineWidth = 10;
            canvasContext.strokeRect(12, 12, canvasWidth - 24, canvasHeight - 24);

            canvasContext.fillStyle = '#2979d9';
            canvasContext.fillRect(28, 42, canvasWidth - 56, 22);

            // 軍規印字
            canvasContext.fillStyle = '#e6f1ff';
            canvasContext.font = 'bold 20px monospace';
            canvasContext.textAlign = 'center';
            canvasContext.fillText('STRIKE FACE', canvasWidth / 2, 118);

            canvasContext.fillStyle = '#8ec5ff';
            canvasContext.font = 'bold 16px monospace';
            canvasContext.fillText('NIJ LEVEL IV', canvasWidth / 2, 148);
            canvasContext.fillText('CERAMIC SAPI', canvasWidth / 2, 174);

            // 底部防滑肋條
            canvasContext.fillStyle = '#11161c';
            canvasContext.fillRect(42, 200, canvasWidth - 84, 16);

            const plateTexture = createConfiguredCanvasTexture(canvasElement, 1, 1);
            return new THREE.MeshStandardMaterial({
                map: plateTexture,

        // 建立輔助用方塊元件並停用不必要陰影投射

            const boxGeometry = new THREE.BoxGeometry(width, height, depth);
            const boxMesh = new THREE.Mesh(boxGeometry, material);
            boxMesh.position.set(positionX, positionY, positionZ);
            boxMesh.rotation.set(rotationX, rotationY, rotationZ);
            boxMesh.castShadow = false;
            boxMesh.receiveShadow = true;
            return boxMesh;

            initializeMaterials();

            mainCamera.add(viewModelRootGroup);

        // 切換掛載於骨架上的 3D 武器群組
        function mountWeaponGroup(weaponRootGroup) {
            if (!weaponMountGroup) {
                return;
            }
            while (weaponMountGroup.children.length > 0) {
                weaponMountGroup.remove(weaponMountGroup.children[0]);
            }
            if (weaponRootGroup) {
                weaponMountGroup.add(weaponRootGroup);
            }
        }

        // 設定第一人稱骨架整體顯示狀態 (大廳或狙擊開鏡時隱藏)
        function setVisible(isVisible) {
            if (viewModelRootGroup) {
                viewModelRootGroup.visible = Boolean(isVisible);
            }
        }

        // 設定防彈插板顯示狀態
        function setArmorPlateVisible(isVisible) {
            if (armorPlatePropGroup) {
                armorPlatePropGroup.visible = Boolean(isVisible);
            }
        }

        return {
            initialize: initialize,
            init: initialize,
            mountWeaponGroup: mountWeaponGroup,
            setVisible: setVisible,
            setArmorPlateVisible: setArmorPlateVisible,
            getViewModelRootGroup: function () { return viewModelRootGroup; },
            getLocomotionAndSwayGroup: function () { return locomotionAndSwayGroup; },
