<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TACTICAL WARFARE // 3D 現代戰術第一人稱射擊</title>

    <!-- 引入 Three.js 核心渲染引擎（全域版本） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* ====================================================================
           基礎版面與全螢幕畫布樣式
           ==================================================================== */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1016;
            color: #ebf3fa;
            font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
        }

        #game-canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #0b1016;
        }

        #game-canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 狙擊鏡高倍率開鏡遮罩（由各模組依狀態切換 .active） */
        #sniper-scope-overlay {
            position: fixed;
            inset: 0;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.12s ease;
            background: radial-gradient(circle at center, transparent 31%, rgba(0, 0, 0, 0.96) 33%, #000000 100%);
        }

        #sniper-scope-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sniper-scope-horizontal-line {
            position: absolute;
            top: 50%;
            left: 18%;
            width: 64%;
            height: 1px;
            background-color: rgba(20, 20, 20, 0.92);
            transform: translateY(-50%);
        }

        .sniper-scope-vertical-line {
            position: absolute;
            left: 50%;
            top: 10%;
            width: 1px;
            height: 80%;
            background-color: rgba(20, 20, 20, 0.92);
            transform: translateX(-50%);
        }

        .sniper-scope-center-dot {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #ff2e38;
            box-shadow: 0 0 8px #ff2e38;
            transform: translate(-50%, -50%);
        }

        /* ====================================================================
           開始 / 暫停 / 陣亡覆蓋選單
           ==================================================================== */
        #game-menu-overlay {
            position: fixed;
            inset: 0;
            z-index: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 24px;
            text-align: center;
            background-color: rgba(6, 10, 15, 0.84);
            backdrop-filter: blur(7px);
            pointer-events: auto;
        }

        #game-menu-overlay.hidden {
            display: none;
            pointer-events: none;
        }

        #menu-overlay-title {
            margin: 0;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 0.14em;
            color: #f4f9fd;
        }

        #menu-overlay-subtitle {
            margin: 0;
            max-width: 620px;
            font-size: 14px;
            line-height: 1.8;
            color: #b8cde0;
        }

        .controls-guide-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(210px, 1fr));
            gap: 10px 24px;
            padding: 16px 22px;
            border-radius: 8px;
            background-color: rgba(16, 25, 36, 0.78);
            border: 1px solid rgba(110, 200, 255, 0.24);
            font-size: 13px;
            text-align: left;
            color: #d6e6f4;
        }

        .control-key-badge {
            display: inline-block;
            min-width: 58px;
            margin-right: 8px;
            padding: 2px 6px;
            text-align: center;
            font-weight: 700;
            font-size: 12px;
            border-radius: 4px;
            background-color: rgba(75, 216, 255, 0.18);
            border: 1px solid rgba(75, 216, 255, 0.45);
            color: #79e5ff;
        }

        #start-game-button {
            margin-top: 6px;
            padding: 13px 38px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.14em;
            color: #071017;
            background-color: #4bd8ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(75, 216, 255, 0.45);
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        #start-game-button:hover {
            background-color: #7ee6ff;
            transform: translateY(-1px);
        }

        #start-game-button:disabled {
            background-color: #455666;
            color: #a6b7c7;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #module-diagnostic-panel {
            max-width: 640px;
            width: 100%;
            padding: 10px 14px;
            border-radius: 6px;
            background-color: rgba(14, 22, 31, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.16);
            font-size: 12px;
            line-height: 1.6;
            color: #9ec0d8;
            text-align: left;
            word-break: break-word;
        }

        #module-diagnostic-panel.has-error {
            border-color: rgba(255, 86, 86, 0.72);
            color: #ff9c9c;
        }

        @media (max-width: 600px) {
            #menu-overlay-title {
                font-size: 26px;
            }
            .controls-guide-grid {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 12px 16px;
            }
        }
    </style>

<body>
    <!-- 3D 遊戲畫面容器 -->
    <div id="game-canvas-container"></div>

    <!-- 狙擊鏡高倍率瞄準覆蓋層 -->
    <div id="sniper-scope-overlay">
        <div class="sniper-scope-horizontal-line"></div>
        <div class="sniper-scope-vertical-line"></div>
        <div class="sniper-scope-center-dot"></div>
    </div>

    <!-- 戰術部署覆蓋選單 -->
    <div id="game-menu-overlay">
        <h1 id="menu-overlay-title">TACTICAL WARFARE // 戰術部署</h1>
        <p id="menu-overlay-subtitle">
            全模組 3D 現代戰術第一人稱射擊引擎。射擊紅色高爆油桶可引發範圍衝擊波與連鎖爆破，擊倒敵軍有機率掉落彈藥與護甲插板補給。
        </p>

        <div class="controls-guide-grid">
            <div><span class="control-key-badge">W A S D</span>移動與橫向閃避</div>
            <div><span class="control-key-badge">左鍵 / 右鍵</span>射擊 / 開鏡瞄準</div>
            <div><span class="control-key-badge">Shift</span>戰術衝刺</div>
            <div><span class="control-key-badge">R</span>更換彈匣</div>
            <div><span class="control-key-badge">C</span>蹲下 / 衝刺中觸發滑鏟</div>
            <div><span class="control-key-badge">V</span>插入陶瓷護甲板</div>
            <div><span class="control-key-badge">Space</span>跳躍</div>
            <div><span class="control-key-badge">1 ~ 4</span>切換主副武器</div>
        </div>

        <button id="start-game-button" type="button" disabled>正在檢查模組載入狀態...</button>
        <div id="module-diagnostic-panel">正在初始化引擎與載入 38 個模組檔案...</div>
    </div>

    <!-- 模組診斷與啟動橋接 -->
    <script>
        (function () {
            const TOTAL_MODULES = 38;
            window.__TW_LOADED_COUNT__ = 0;
            window.__TW_LAST_SCRIPT__ = '尚未開始';
            window.__TW_ERRORS__ = [];

            window.markModuleLoaded = function (fileName) {
                window.__TW_LOADED_COUNT__ = (window.__TW_LOADED_COUNT__ || 0) + 1;
                window.__TW_LAST_SCRIPT__ = fileName;
                refreshDiagnostic();
            };

            window.markModuleError = function (fileName) {
                window.__TW_ERRORS__.push('找不到或無法載入檔案：' + fileName);
                refreshDiagnostic();
            };

            window.addEventListener('error', function (errEvent) {
                const target = errEvent.target;
                if (target && target.tagName === 'SCRIPT' && target.src) {
                    const fName = target.src.split('/').pop();
                    window.__TW_ERRORS__.push('腳本載入失敗：' + fName);
                } else {
                    const msg = errEvent.message || '未知腳本錯誤';
                    const file = errEvent.filename ? errEvent.filename.split('/').pop() : window.__TW_LAST_SCRIPT__;
                    const line = errEvent.lineno || 0;
                    window.__TW_ERRORS__.push(file + (line ? ' 第 ' + line + ' 行' : '') + '：' + msg);
                }
                refreshDiagnostic();
            }, true);

            window.addEventListener('unhandledrejection', function (ev) {
                const reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : '未處理的 Promise 錯誤';
                window.__TW_ERRORS__.push('非同步錯誤：' + reason);
                refreshDiagnostic();
            });

            function adjustQuickBarPosition() {
                const quickBar = document.getElementById('tw-combat-quickbar');
                if (quickBar) {
                    quickBar.style.top = '16px';
                    quickBar.style.left = 'auto';
                    quickBar.style.right = '185px';
                    quickBar.style.transform = 'none';
                }
            }

            function refreshDiagnostic() {
                const panel = document.getElementById('module-diagnostic-panel');
                const btn = document.getElementById('start-game-button');
                if (!panel || !btn) return;

                if (typeof window.THREE === 'undefined') {
                    panel.className = 'has-error';
                    panel.textContent = '錯誤：無法載入 Three.js 引擎，請確認網路連線正常後重新整理頁面。';
                    btn.disabled = true;
                    btn.textContent = '引擎載入失敗';
                    return;
                }

                if (window.__TW_ERRORS__.length > 0) {
                    panel.className = 'has-error';
                    panel.textContent = window.__TW_ERRORS__[0];
                    btn.disabled = true;
                    btn.textContent = '請修正腳本錯誤';
                    return;
                }

                const tw = window.TacticalWarfare;
                const registered = tw && tw.modules ? Object.keys(tw.modules).length : 0;
                const count = Math.max(window.__TW_LOADED_COUNT__ || 0, registered);

                if (count < TOTAL_MODULES) {
                    panel.className = '';
                    panel.textContent =
                        '已載入 ' + count + ' / ' + TOTAL_MODULES +
                        ' 個模組（最新完成：' + window.__TW_LAST_SCRIPT__ + '），正在完成啟動...';
                    btn.disabled = true;
                    btn.textContent = '正在載入模組...';
                    return;
                }

                panel.className = '';
                panel.textContent = '全部 ' + TOTAL_MODULES + ' 個模組載入完成，系統就緒。';
                btn.disabled = false;
                btn.textContent = '點擊投入戰場';
            }

            function bindStartAction() {
                const btn = document.getElementById('start-game-button');
                const menu = document.getElementById('game-menu-overlay');
                if (!btn) return;

                btn.addEventListener('click', function () {
                    const tw = window.TacticalWarfare;
                    if (tw && tw.GameRuntime && typeof tw.GameRuntime.startCombat === 'function') {
                        tw.GameRuntime.startCombat(1);
                    } else if (tw && tw.MainBootstrap && typeof tw.MainBootstrap.startCombat === 'function') {
                        tw.MainBootstrap.startCombat(1);
                    }
                    if (menu) {
                        menu.classList.add('hidden');
                    }
                    adjustQuickBarPosition();
                });

                const bus = window.TacticalWarfare && window.TacticalWarfare.EventBus;
                const evts = window.TacticalWarfare && window.TacticalWarfare.Events;
                if (bus && evts && evts.GAME_START) {
                    bus.on(evts.GAME_START, function () {
                        if (menu) menu.classList.add('hidden');
                        adjustQuickBarPosition();
                    });
                }
                if (bus && evts && evts.GAME_RESET) {
                    bus.on(evts.GAME_RESET, function (payload) {
                        if (menu && (!payload || payload.phase === 'lobby')) {
                            menu.classList.remove('hidden');
                        }
                    });
                }
            }

            window.addEventListener('load', function () {
                bindStartAction();
                adjustQuickBarPosition();
                refreshDiagnostic();
            });
        })();
    </script>
