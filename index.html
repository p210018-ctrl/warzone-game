        // 建立高清晰發光光學瞄準鏡準心材質
        function createReticleMaterial(reticleStyle) {
            const canvasSize = 128;
            const canvasElement = document.createElement('canvas');
            canvasElement.width = canvasSize;
            canvasElement.height = canvasSize;
            const canvasContext = canvasElement.getContext('2d');

            canvasContext.clearRect(0, 0, canvasSize, canvasSize);
            const centerCoordinate = canvasSize * 0.5;

            if (reticleStyle === 'HOLOGRAPHIC_RING_DOT') {
                // EOTech 風格全像紅圈加四向短刻度與中心亮點
                canvasContext.strokeStyle = 'rgba(255, 42, 42, 0.92)';
                canvasContext.lineWidth = 4;
                canvasContext.beginPath();
                canvasContext.arc(centerCoordinate, centerCoordinate, 34, 0, Math.PI * 2);
                canvasContext.stroke();

                canvasContext.beginPath();
                canvasContext.moveTo(centerCoordinate, centerCoordinate - 46);
                canvasContext.lineTo(centerCoordinate, centerCoordinate - 28);
                canvasContext.moveTo(centerCoordinate, centerCoordinate + 28);
                canvasContext.lineTo(centerCoordinate, centerCoordinate + 46);
                canvasContext.moveTo(centerCoordinate - 46, centerCoordinate);
                canvasContext.lineTo(centerCoordinate - 28, centerCoordinate);
                canvasContext.moveTo(centerCoordinate + 28, centerCoordinate);
                canvasContext.lineTo(centerCoordinate + 46, centerCoordinate);
                canvasContext.stroke();

                canvasContext.fillStyle = '#ff5959';
                canvasContext.beginPath();
                canvasContext.arc(centerCoordinate, centerCoordinate, 4.5, 0, Math.PI * 2);
                canvasContext.fill();
            } else {
                // 反射式綠點瞄具
                const radialGradient = canvasContext.createRadialGradient(
                    centerCoordinate,
                    centerCoordinate,
                    2,
                    centerCoordinate,
                    centerCoordinate,
                    18
                );
                radialGradient.addColorStop(0, 'rgba(180, 255, 200, 1.0)');
                radialGradient.addColorStop(0.35, 'rgba(46, 255, 110, 0.92)');
                radialGradient.addColorStop(1, 'rgba(46, 255, 110, 0.0)');
                canvasContext.fillStyle = radialGradient;
                canvasContext.beginPath();
                canvasContext.arc(centerCoordinate, centerCoordinate, 18, 0, Math.PI * 2);
                canvasContext.fill();
            }

            const reticleTexture = new THREE.CanvasTexture(canvasElement);
            reticleTexture.needsUpdate = true;

            return new THREE.MeshBasicMaterial({
                map: reticleTexture,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
        }

        // 建立放射狀槍口火光材質
        function createMuzzleFlashMaterial() {
            const canvasSize = 128;
            const canvasElement = document.createElement('canvas');
            canvasElement.width = canvasSize;
            canvasElement.height = canvasSize;
            const canvasContext = canvasElement.getContext('2d');

            const centerCoordinate = canvasSize * 0.5;
            const flashGradient = canvasContext.createRadialGradient(
                centerCoordinate,
                centerCoordinate,
                3,
                centerCoordinate,
                centerCoordinate,
                58
            );
            flashGradient.addColorStop(0.0, 'rgba(255, 255, 235, 1.0)');
            flashGradient.addColorStop(0.25, 'rgba(255, 210, 96, 0.95)');
            flashGradient.addColorStop(0.6, 'rgba(255, 115, 24, 0.55)');
            flashGradient.addColorStop(1.0, 'rgba(255, 60, 0, 0.0)');

            canvasContext.fillStyle = flashGradient;
            canvasContext.beginPath();
            for (let spikeIndex = 0; spikeIndex < 16; spikeIndex = spikeIndex + 1) {
                const angle = (spikeIndex / 16) * Math.PI * 2;
                const radius = (spikeIndex % 2 === 0) ? 58 : 19;
                const pointX = centerCoordinate + Math.cos(angle) * radius;
                const pointY = centerCoordinate + Math.sin(angle) * radius;
                if (spikeIndex === 0) {
                    canvasContext.moveTo(pointX, pointY);
                } else {
                    canvasContext.lineTo(pointX, pointY);
                }
            }
            canvasContext.closePath();
            canvasContext.fill();

            const flashTexture = new THREE.CanvasTexture(canvasElement);
            flashTexture.needsUpdate = true;

            return new THREE.MeshBasicMaterial({
                map: flashTexture,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
        }

        // 輔助函式：建立精密方塊零件
        function createWeaponBoxPart(width, height, depth, material, positionX, positionY, positionZ, rotationX, rotationY, rotationZ) {
            const boxGeometry = new THREE.BoxGeometry(width, height, depth);
            const boxMesh = new THREE.Mesh(boxGeometry, material);
            boxMesh.position.set(positionX, positionY, positionZ);
            boxMesh.rotation.set(rotationX || 0, rotationY || 0, rotationZ || 0);
            boxMesh.castShadow = false;
            boxMesh.receiveShadow = true;
            return boxMesh;
        }

        // 輔助函式：建立圓柱形槍管、滅音器或緩衝管
        function createWeaponCylinderPart(radiusTop, radiusBottom, length, radialSegments, material, positionX, positionY, positionZ, rotationX, rotationY, rotationZ) {
            const cylinderGeometry = new THREE.CylinderGeometry(radiusTop, radiusBottom, length, radialSegments);
            const cylinderMesh = new THREE.Mesh(cylinderGeometry, material);
            cylinderMesh.position.set(positionX, positionY, positionZ);
            cylinderMesh.rotation.set(rotationX || 0, rotationY || 0, rotationZ || 0);
            cylinderMesh.castShadow = false;
            cylinderMesh.receiveShadow = true;
            return cylinderMesh;
        }

        // 輔助函式：沿 Z 軸建立真實立體戰術皮卡汀尼導軌 (Picatinny Rail)
        function createPicatinnyRailStrip(railWidth, totalLength, toothCount, material, positionX, positionY, centerZ) {
            const railGroup = new THREE.Group();
            railGroup.position.set(positionX, positionY, centerZ);

            const basePlateMesh = createWeaponBoxPart(
                railWidth * 0.85,
                0.005,
                totalLength,
                material,
                0,
                0,
                0,
                0,
                0,
                0
            );
            railGroup.add(basePlateMesh);

            const stepDistance = totalLength / Math.max(1, toothCount);
            const startZ = -totalLength * 0.5 + stepDistance * 0.5;
            for (let toothIndex = 0; toothIndex < toothCount; toothIndex = toothIndex + 1) {
                const toothZ = startZ + toothIndex * stepDistance;
                const toothMesh = createWeaponBoxPart(
                    railWidth,
                    0.006,
                    stepDistance * 0.54,
                    material,
                    0,
                    0.004,
                    toothZ,
                    0,
                    0,
                    0
                );
                railGroup.add(toothMesh);
            }

            return railGroup;
        }

        // 輔助函式：建立掛載於槍口錨點的 3D 火焰與動態光源
        function createMuzzleFlashAssembly(flashScale) {

            verticalFlamePlane.rotation.y = Math.PI * 0.5;

            const horizontalFlamePlane = new THREE.Mesh(

            );
            horizontalFlamePlane.rotation.x = Math.PI * 0.5;

        // 正規化軍武代號以兼容各種命名格式
        function normalizeWeaponIdentifier(rawIdentifier) {
            if (!rawIdentifier) {
                return 'M4A1';
            }
            const upperIdentifier = String(rawIdentifier).toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (upperIdentifier.indexOf('MP5') !== -1) {
                return 'MP5';
            }
            if (upperIdentifier.indexOf('AX50') !== -1 || upperIdentifier.indexOf('SNIPER') !== -1) {
                return 'AX50';
            }
            if (upperIdentifier.indexOf('X16') !== -1 || upperIdentifier.indexOf('PISTOL') !== -1) {
                return 'X16';
            }
            return 'M4A1';
        }

        // 取得或建構指定軍武的完整 3D 模型組件 (帶快取複用)
        function getOrCreateWeaponAssembly(rawIdentifier) {
            ensureSpecializedMaterials();
            const normalizedKey = normalizeWeaponIdentifier(rawIdentifier);

            if (weaponAssemblyCache[normalizedKey]) {
                return weaponAssemblyCache[normalizedKey];
            }

            let createdAssembly = null;
            if (normalizedKey === 'M4A1') {
                createdAssembly = buildM4A1CarbineAssembly();
            } else if (normalizedKey === 'MP5') {
                createdAssembly = buildMP5SuppressedSMGAssembly();
            } else if (normalizedKey === 'AX50') {
                createdAssembly = buildAX50SniperRifleAssembly();
            } else if (normalizedKey === 'X16') {
                createdAssembly = buildX16TacticalPistolAssembly();
            } else {
                createdAssembly = buildM4A1CarbineAssembly();
            }

            weaponAssemblyCache[normalizedKey] = createdAssembly;
            return createdAssembly;
        }

        function initialize() {
            ensureSpecializedMaterials();
            // 預先快取四把主副武器，切換武器時零卡頓
            getOrCreateWeaponAssembly('M4A1');
            getOrCreateWeaponAssembly('MP5');
            getOrCreateWeaponAssembly('AX50');
            getOrCreateWeaponAssembly('X16');
        }

        return {
            initialize: initialize,
            init: initialize,
            normalizeWeaponIdentifier: normalizeWeaponIdentifier,
            getOrCreateWeaponAssembly: getOrCreateWeaponAssembly
        };
    })();

    /* ========================================================================
     * 模組 11：全狀態武器動畫控制器 (WeaponAnimator)
     * 涵蓋：換彈、檢視、插甲、切槍、戰術衝刺舉槍、滑鏟側傾、ADS 鎖定、狙擊拉栓與後座力彈簧
     * ======================================================================== */
    global.WZ.WeaponAnimator = (function () {
        let isInitialized = false;
        let activeWeaponAssembly = null;
        let currentMountedIdentifier = '';

        // 動作覆寫狀態機 (NONE | RELOADING | INSPECTING | PLATING | SWITCHING | BOLT_CYCLING)
        const actionState = {
            currentMode: 'NONE',
            elapsedTime: 0,
            totalDuration: 0,
            pendingWeaponIdentifier: '',
            hasSwappedDuringSwitch: false,
            stageFlags: {
                magazineOutEmitted: false,
                magazineInEmitted: false,
                boltRackEmitted: false,
                plateInsertedEmitted: false
            }
        };

        // 第一人稱動態物理與慣性狀態
        const motionState = {
            previousCameraYaw: 0,
            previousCameraPitch: 0,
            swayOffsetX: 0,
            swayOffsetY: 0,
            swayRoll: 0,
            locomotionBobPhase: 0,
            landingDipOffset: 0,
            landingDipVelocity: 0,
            tacSprintBlendAlpha: 0,
            slideStanceBlendAlpha: 0,
            diveStanceBlendAlpha: 0
        };

        // 射擊機械後座力彈簧與槍口火光計時器
        const recoilState = {
            kickPositionZ: 0,
            kickVelocityZ: 0,
            kickPitchX: 0,
            kickVelocityPitchX: 0,
            kickRollZ: 0,
            kickVelocityRollZ: 0,
            boltBlowbackProgress: 0,
            muzzleFlashTimer: 0
        };

        // 預配置向量與尤拉角物件以維持高幀率零 GC 抖動
        const workingBasePosition = new THREE.Vector3();
        const workingBaseRotation = new THREE.Euler();
        const workingActionPosition = new THREE.Vector3();
        const workingActionRotation = new THREE.Euler();
        const workingLeftHandPosition = new THREE.Vector3();
        const workingLeftHandRotation = new THREE.Euler();
        const workingRightHandPosition = new THREE.Vector3();
        const workingRightHandRotation = new THREE.Euler();
        const workingMagazineOffset = new THREE.Vector3();
        const workingMagazineRotation = new THREE.Euler();

        // 數學緩動工具函式
        function clampNormalized(value) {
            if (value < 0) {
                return 0;
            }
            if (value > 1) {
                return 1;
            }
            return value;
        }

        function smoothStep(edgeStart, edgeEnd, inputValue) {
            const normalized = clampNormalized((inputValue - edgeStart) / Math.max(0.0001, edgeEnd - edgeStart));
            return normalized * normalized * (3.0 - 2.0 * normalized);
        }

        function easeInOutCubic(normalizedValue) {
            const clamped = clampNormalized(normalizedValue);
            if (clamped < 0.5) {
                return 4.0 * clamped * clamped * clamped;
            }
            const inverted = -2.0 * clamped + 2.0;
            return 1.0 - (inverted * inverted * inverted) * 0.5;
        }

        function interpolateNumber(startValue, endValue, factor) {
            return startValue + (endValue - startValue) * factor;
        }

        function resetActionStageFlags() {
            actionState.stageFlags.magazineOutEmitted = false;
            actionState.stageFlags.magazineInEmitted = false;
            actionState.stageFlags.boltRackEmitted = false;
            actionState.stageFlags.plateInsertedEmitted = false;
        }

        // 同步 State 中當前裝備的武器 3D 模型
        function equipWeaponByIdentifier(rawWeaponIdentifier) {
            const normalizedIdentifier = global.WZ.WeaponFactory.normalizeWeaponIdentifier(rawWeaponIdentifier);
            if (currentMountedIdentifier === normalizedIdentifier && activeWeaponAssembly) {
                return activeWeaponAssembly;
            }

            activeWeaponAssembly = global.WZ.WeaponFactory.getOrCreateWeaponAssembly(normalizedIdentifier);
            currentMountedIdentifier = normalizedIdentifier;
            global.WZ.ViewModelRig.mountWeaponGroup(activeWeaponAssembly.rootGroup);
            resetWeaponSubPartTransforms();
            return activeWeaponAssembly;
        }

        // 還原當前武器所有可動零件（彈匣、槍機、滑套、拉機柄、火光）回靜止狀態
        function resetWeaponSubPartTransforms() {
            if (!activeWeaponAssembly) {
                return;
            }
            const animatedParts = activeWeaponAssembly.animatedParts;
            const handAnchors = activeWeaponAssembly.handAnchors;

            if (animatedParts.magazineGroup) {
                animatedParts.magazineGroup.position.copy(handAnchors.magazineRestPosition);
                animatedParts.magazineGroup.rotation.set(0, 0, 0);
                animatedParts.magazineGroup.visible = true;
            }
            if (animatedParts.boltOrSlideGroup) {
                if (activeWeaponAssembly.weaponIdentifier === 'AX50') {
                    animatedParts.boltOrSlideGroup.position.set(0, 0.028, 0.040);
                    animatedParts.boltOrSlideGroup.rotation.set(0, 0, 0);
                } else if (activeWeaponAssembly.weaponIdentifier === 'X16') {
                    animatedParts.boltOrSlideGroup.position.set(0, 0.016, -0.052);
                } else if (activeWeaponAssembly.weaponIdentifier === 'M4A1') {
                    animatedParts.boltOrSlideGroup.position.set(0.022, 0.014, -0.028);
                } else if (activeWeaponAssembly.weaponIdentifier === 'MP5') {
                    animatedParts.boltOrSlideGroup.position.set(0.020, 0.012, -0.040);
                }
            }
            if (animatedParts.chargingHandleGroup && animatedParts.chargingHandleGroup !== animatedParts.boltOrSlideGroup) {
                if (activeWeaponAssembly.weaponIdentifier === 'M4A1') {
                    animatedParts.chargingHandleGroup.position.set(0, 0.030, 0.098);
                } else if (activeWeaponAssembly.weaponIdentifier === 'MP5') {
                    animatedParts.chargingHandleGroup.position.set(-0.026, 0.036, -0.245);
                    animatedParts.chargingHandleGroup.rotation.set(0, 0, 0);
                }
            }
            if (animatedParts.muzzleFlashGroup) {
                animatedParts.muzzleFlashGroup.visible = false;
            }
        }

        // 讀取目前啟用武器代號
        function resolveActiveWeaponIdentifierFromState() {
            if (!global.WZ.State || typeof global.WZ.State.getActiveWeaponConfig !== 'function') {
                return 'M4A1';
            }
            const weaponConfiguration = global.WZ.State.getActiveWeaponConfig();
            if (!weaponConfiguration) {
                return 'M4A1';
            }
            return weaponConfiguration.id || weaponConfiguration.code || weaponConfiguration.name || 'M4A1';
        }

        // ====================================================================
        // 外部與事件觸發之核心動作入口
        // ====================================================================

        // 啟動換彈動畫
        function startReloadAnimation(durationSeconds) {
            if (actionState.currentMode === 'RELOADING' || actionState.currentMode === 'SWITCHING') {
                return;
            }
            const weaponConfiguration = global.WZ.State.getActiveWeaponConfig();
            const fallbackDuration = (weaponConfiguration && weaponConfiguration.reloadTime) ? weaponConfiguration.reloadTime : 2.15;

            actionState.currentMode = 'RELOADING';
            actionState.elapsedTime = 0;
            actionState.totalDuration = durationSeconds || fallbackDuration;
            resetActionStageFlags();

            global.WZ.ViewModelRig.setArmorPlateVisible(false);
            global.WZ.State.data.player.isReloading = true;
            global.WZ.State.data.player.isPlating = false;
            global.WZ.State.data.player.isADS = false;
            if (global.WZ.Touch) {
                global.WZ.Touch.setAction('ADS', false, false);
            }
        }

        // 啟動武器檢視動畫
        function startInspectAnimation() {
            if (actionState.currentMode !== 'NONE') {
                return;
            }
            const playerState = global.WZ.State.data.player;
            if (playerState.isADS || playerState.isFiring || playerState.stance === 'SLIDE' || playerState.stance === 'DIVE') {
                return;
            }

            actionState.currentMode = 'INSPECTING';
            actionState.elapsedTime = 0;
            actionState.totalDuration = 3.45;
            resetActionStageFlags();
            global.WZ.bus.emit('anim:inspect_start', { weaponIdentifier: currentMountedIdentifier });
        }

        // 啟動戰區防彈插甲動畫
        function startArmorPlateAnimation(durationSeconds) {
            if (actionState.currentMode === 'PLATING' || actionState.currentMode === 'SWITCHING') {
                return;
            }
            const playerState = global.WZ.State.data.player;
            if (playerState.armor >= 150 || playerState.plates <= 0) {
                return;
            }

            actionState.currentMode = 'PLATING';
            actionState.elapsedTime = 0;
            actionState.totalDuration = durationSeconds || 1.55;
            resetActionStageFlags();

            playerState.isPlating = true;
            playerState.isReloading = false;
            playerState.isADS = false;
            if (global.WZ.Touch) {
                global.WZ.Touch.setAction('ADS', false, false);
            }
            resetWeaponSubPartTransforms();
            global.WZ.bus.emit('anim:plate_start', {});
        }

        // 啟動武器切換動畫 (收槍 -> 切換 3D 模型 -> 拔槍)
        function startWeaponSwitchAnimation(targetWeaponIdentifier, durationSeconds) {
            const normalizedTarget = global.WZ.WeaponFactory.normalizeWeaponIdentifier(targetWeaponIdentifier);
            actionState.currentMode = 'SWITCHING';
            actionState.elapsedTime = 0;
            actionState.totalDuration = durationSeconds || 0.54;
            actionState.pendingWeaponIdentifier = normalizedTarget;
            actionState.hasSwappedDuringSwitch = false;
            resetActionStageFlags();

            global.WZ.ViewModelRig.setArmorPlateVisible(false);
            global.WZ.State.data.player.isReloading = false;
            global.WZ.State.data.player.isPlating = false;
            global.WZ.State.data.player.isADS = false;
            if (global.WZ.Touch) {
                global.WZ.Touch.setAction('ADS', false, false);
            }
            global.WZ.bus.emit('anim:switch_start', { targetWeapon: normalizedTarget });
        }

        // 啟動射擊機械後座力、火光與（若為 AX-50 則銜接）狙擊手動拉栓動畫
        function triggerFireRecoil(weaponConfiguration) {
            if (!activeWeaponAssembly) {
                return;
            }

            // 射擊立即中斷檢視或插甲動作
            if (actionState.currentMode === 'INSPECTING' || actionState.currentMode === 'PLATING') {
                cancelInterruptibleAction();
            }

            const recoilKickFactor = (weaponConfiguration && weaponConfiguration.recoilPitch) ? weaponConfiguration.recoilPitch : 0.025;
            const isAimingDownSights = global.WZ.State.data.player.isADS;
            const adsSuppressionMultiplier = isAimingDownSights ? 0.52 : 1.0;

            recoilState.kickVelocityZ = recoilState.kickVelocityZ + (0.68 + recoilKickFactor * 8.5) * adsSuppressionMultiplier;
            recoilState.kickVelocityPitchX = recoilState.kickVelocityPitchX + (1.45 + recoilKickFactor * 22.0) * adsSuppressionMultiplier;
            const randomRollSign = Math.random() < 0.5 ? -1 : 1;
            recoilState.kickVelocityRollZ = recoilState.kickVelocityRollZ + randomRollSign * (0.55 + Math.random() * 0.65) * adsSuppressionMultiplier;

            // 槍機/滑套即時後衝
            recoilState.boltBlowbackProgress = 1.0;

            // 觸發 3D 槍口火光與隨機旋轉角度
            recoilState.muzzleFlashTimer = 0.048;
            if (activeWeaponAssembly.animatedParts.muzzleFlashGroup) {
                activeWeaponAssembly.animatedParts.muzzleFlashGroup.visible = true;
                activeWeaponAssembly.animatedParts.muzzleFlashGroup.rotation.z = Math.random() * Math.PI * 2;
                const randomScale = 0.85 + Math.random() * 0.40;
                activeWeaponAssembly.animatedParts.muzzleFlashGroup.scale.set(randomScale, randomScale, randomScale);
            }

            // AX-50 重型栓動狙擊步槍：射擊後自動啟動手動拉栓上膛動畫
            if (activeWeaponAssembly.isBoltAction) {
                actionState.currentMode = 'BOLT_CYCLING';
                actionState.elapsedTime = 0;
                actionState.totalDuration = 1.12;
                resetActionStageFlags();
            }
        }

        // 中斷可取消的動作 (檢視 / 插甲)
        function cancelInterruptibleAction() {
            if (actionState.currentMode === 'INSPECTING' || actionState.currentMode === 'PLATING') {
                actionState.currentMode = 'NONE';
                actionState.elapsedTime = 0;
                global.WZ.ViewModelRig.setArmorPlateVisible(false);
                global.WZ.State.data.player.isPlating = false;
                resetWeaponSubPartTransforms();
            }
        }

        // 查詢目前動畫狀態是否允許開火
        function canFireNow() {
            if (actionState.currentMode === 'RELOADING') {
                return false;
            }
            if (actionState.currentMode === 'SWITCHING') {
                return false;
            }
            if (actionState.currentMode === 'BOLT_CYCLING') {
                return false;
            }
            if (actionState.currentMode === 'PLATING') {
                return false;
            }
            return true;
        }

        // ====================================================================
        // 分層動畫演算函式
        // ====================================================================

        // 更新射擊機械後座力彈簧與槍口火光
        function updateRecoilAndMuzzleFlash(deltaTime) {
            const springStiffnessZ = 210.0;
            const springDampingZ = 21.0;
            recoilState.kickVelocityZ = recoilState.kickVelocityZ + (-springStiffnessZ * recoilState.kickPositionZ - springDampingZ * recoilState.kickVelocityZ) * deltaTime;
            recoilState.kickPositionZ = recoilState.kickPositionZ + recoilState.kickVelocityZ * deltaTime;

            const springStiffnessPitch = 195.0;
            const springDampingPitch = 19.0;
            recoilState.kickVelocityPitchX = recoilState.kickVelocityPitchX + (-springStiffnessPitch * recoilState.kickPitchX - springDampingPitch * recoilState.kickVelocityPitchX) * deltaTime;
            recoilState.kickPitchX = recoilState.kickPitchX + recoilState.kickVelocityPitchX * deltaTime;

            const springStiffnessRoll = 175.0;
            const springDampingRoll = 17.0;
            recoilState.kickVelocityRollZ = recoilState.kickVelocityRollZ + (-springStiffnessRoll * recoilState.kickRollZ - springDampingRoll * recoilState.kickVelocityRollZ) * deltaTime;
            recoilState.kickRollZ = recoilState.kickRollZ + recoilState.kickVelocityRollZ * deltaTime;

            // 槍口火光計時關閉
            if (recoilState.muzzleFlashTimer > 0) {
                recoilState.muzzleFlashTimer = recoilState.muzzleFlashTimer - deltaTime;
                if (recoilState.muzzleFlashTimer <= 0 && activeWeaponAssembly && activeWeaponAssembly.animatedParts.muzzleFlashGroup) {
                    activeWeaponAssembly.animatedParts.muzzleFlashGroup.visible = false;
                }
            }

            // 非栓動步槍的自動滑套 / 槍機往復運動
            if (recoilState.boltBlowbackProgress > 0) {
                recoilState.boltBlowbackProgress = Math.max(0, recoilState.boltBlowbackProgress - deltaTime * 15.0);
                if (activeWeaponAssembly && !activeWeaponAssembly.isBoltAction && actionState.currentMode !== 'RELOADING') {
                    const boltGroup = activeWeaponAssembly.animatedParts.boltOrSlideGroup;
                    if (boltGroup) {
                        const travelDistance = activeWeaponAssembly.weaponIdentifier === 'X16' ? 0.044 : 0.056;
                        const baseZ = activeWeaponAssembly.weaponIdentifier === 'X16'
                            ? -0.052
                            : (activeWeaponAssembly.weaponIdentifier === 'M4A1' ? -0.028 : -0.040);
                        boltGroup.position.z = baseZ + recoilState.boltBlowbackProgress * travelDistance;
                    }
                }
            }
        }

        // 更新視角轉動慣性拖曳 (Sway)、移動晃動 (Bob) 與落地緩衝下沉
        function updateLocomotionAndSwayLayer(deltaTime, adsAlpha) {
            const locomotionGroup = global.WZ.ViewModelRig.getLocomotionAndSwayGroup();
            if (!locomotionGroup) {
                return;
            }

            const playerState = global.WZ.State.data.player;
            const movementBody = global.WZ.Movement ? global.WZ.Movement.body : null;
            const horizontalSpeed = movementBody ? Math.hypot(movementBody.velocity.x, movementBody.velocity.z) : 0;
            const isGrounded = movementBody ? movementBody.isGrounded : true;

            // 1. 計算鏡頭轉向差值以產生真實重量慣性
            const currentCameraYaw = global.WZ.CameraRig ? global.WZ.CameraRig.getYaw() : 0;
            const currentCameraPitch = global.WZ.CameraRig ? global.WZ.CameraRig.getPitch() : 0;
            let yawVelocity = currentCameraYaw - motionState.previousCameraYaw;
            let pitchVelocity = currentCameraPitch - motionState.previousCameraPitch;
            motionState.previousCameraYaw = currentCameraYaw;
            motionState.previousCameraPitch = currentCameraPitch;

            yawVelocity = Math.max(-0.18, Math.min(0.18, yawVelocity));
            pitchVelocity = Math.max(-0.18, Math.min(0.18, pitchVelocity));

            const adsSwayReduction = interpolateNumber(1.0, 0.16, adsAlpha);
            const targetSwayX = -yawVelocity * 0.24 * adsSwayReduction;
            const targetSwayY = pitchVelocity * 0.20 * adsSwayReduction;
            const targetSwayRoll = -yawVelocity * 0.65 * adsSwayReduction;

            const swaySmoothFactor = Math.min(1.0, deltaTime * 12.0);
            motionState.swayOffsetX = interpolateNumber(motionState.swayOffsetX, targetSwayX, swaySmoothFactor);
            motionState.swayOffsetY = interpolateNumber(motionState.swayOffsetY, targetSwayY, swaySmoothFactor);
            motionState.swayRoll = interpolateNumber(motionState.swayRoll, targetSwayRoll, swaySmoothFactor);

            // 2. 落地慣性下壓彈簧
            motionState.landingDipVelocity = motionState.landingDipVelocity + (-140.0 * motionState.landingDipOffset - 16.0 * motionState.landingDipVelocity) * deltaTime;
            motionState.landingDipOffset = motionState.landingDipOffset + motionState.landingDipVelocity * deltaTime;

            // 3. 呼吸與奔跑 8 字形晃動
            let bobOffsetX = 0;
            let bobOffsetY = 0;
            let bobRollZ = 0;
            const breathingTime = performance.now() * 0.0018;

            if (isGrounded && horizontalSpeed > 0.45 && playerState.stance !== 'SLIDE' && playerState.stance !== 'DIVE') {
                let bobFrequency = 7.8;
                let bobAmplitudeX = 0.011;
                let bobAmplitudeY = 0.010;
                if (playerState.moveMode === 'TACSPRINT') {
                    bobFrequency = 13.8;
                    bobAmplitudeX = 0.032;
                    bobAmplitudeY = 0.026;
                } else if (playerState.moveMode === 'SPRINT') {
                    bobFrequency = 11.4;
                    bobAmplitudeX = 0.021;
                    bobAmplitudeY = 0.017;
                }
                const speedRatio = Math.min(1.25, horizontalSpeed / 5.5);
                motionState.locomotionBobPhase = motionState.locomotionBobPhase + deltaTime * bobFrequency;
                bobOffsetX = Math.cos(motionState.locomotionBobPhase * 0.5) * bobAmplitudeX * speedRatio * adsSwayReduction;
                bobOffsetY = Math.abs(Math.sin(motionState.locomotionBobPhase * 0.5)) * -bobAmplitudeY * speedRatio * adsSwayReduction;
                bobRollZ = Math.cos(motionState.locomotionBobPhase * 0.5) * 0.045 * speedRatio * adsSwayReduction;
            } else {
                // 待機微幅呼吸晃動
                bobOffsetX = Math.sin(breathingTime * 0.85) * 0.0022 * adsSwayReduction;
                bobOffsetY = Math.sin(breathingTime * 1.7) * 0.0032 * adsSwayReduction;
            }

            // 跳躍滯空微幅下沉
            const verticalAirOffset = (!isGrounded && movementBody)
                ? Math.max(-0.04, Math.min(0.035, -movementBody.velocity.y * 0.0045))
                : 0;

            // 橫移戰術傾斜
            const strafeInputX = global.WZ.Touch ? global.WZ.Touch.state.moveX : 0;
            const strafeTiltRoll = -strafeInputX * 0.048 * adsSwayReduction;

            locomotionGroup.position.set(
                motionState.swayOffsetX + bobOffsetX,
                motionState.swayOffsetY + bobOffsetY + motionState.landingDipOffset + verticalAirOffset,
                0
            );
            locomotionGroup.rotation.set(
                motionState.swayOffsetY * 0.65,
                motionState.swayOffsetX * 0.85,
                motionState.swayRoll + bobRollZ + strafeTiltRoll
            );
        }

        // 計算武器動作覆寫層 (換彈 / 檢視 / 插甲 / 切槍 / 狙擊拉栓)
        function evaluateActionOverrideLayer(deltaTime) {
            workingActionPosition.set(0, 0, 0);
            workingActionRotation.set(0, 0, 0);

            const handAnchors = activeWeaponAssembly.handAnchors;
            workingLeftHandPosition.copy(handAnchors.leftHandRestPosition);
            workingLeftHandRotation.copy(handAnchors.leftHandRestRotation);
            workingRightHandPosition.copy(handAnchors.rightHandRestPosition);
            workingRightHandRotation.copy(handAnchors.rightHandRestRotation);

            if (actionState.currentMode === 'NONE') {
                return;
            }

            actionState.elapsedTime = actionState.elapsedTime + deltaTime;
            const normalizedProgress = clampNormalized(actionState.elapsedTime / Math.max(0.05, actionState.totalDuration));
            const animatedParts = activeWeaponAssembly.animatedParts;

            // ----------------------------------------------------------------
            // 動作 1：五階段精密換彈動畫 (RELOADING)
            // ----------------------------------------------------------------
            if (actionState.currentMode === 'RELOADING') {
                const tiltInFactor = smoothStep(0.0, 0.16, normalizedProgress);
                const tiltOutFactor = 1.0 - smoothStep(0.84, 1.0, normalizedProgress);
                const reloadPostureEnvelope = tiltInFactor * tiltOutFactor;

                // 槍身向右傾轉以露出左側彈匣井與拉機柄
                workingActionPosition.set(
                    -0.035 * reloadPostureEnvelope,
                    -0.028 * reloadPostureEnvelope,
                    0.045 * reloadPostureEnvelope
                );
                workingActionRotation.set(
                    0.26 * reloadPostureEnvelope,
                    0.18 * reloadPostureEnvelope,
                    -0.58 * reloadPostureEnvelope
                );

                // 彈匣卸除、取新彈匣與插入拍擊流程
                const restMagPos = handAnchors.magazineRestPosition;
                if (normalizedProgress < 0.22) {
                    // 階段 A：左手離開護木移向彈匣
                    const reachFactor = easeInOutCubic(normalizedProgress / 0.22);
                    workingLeftHandPosition.lerpVectors(handAnchors.leftHandRestPosition, restMagPos, reachFactor);
                    workingLeftHandPosition.y = workingLeftHandPosition.y - 0.025 * reachFactor;
                } else if (normalizedProgress < 0.48) {
                    // 階段 B：抽出舊彈匣向下移除至畫面外
                    if (!actionState.stageFlags.magazineOutEmitted) {
                        actionState.stageFlags.magazineOutEmitted = true;
                        global.WZ.bus.emit('anim:mag_out', { weaponIdentifier: currentMountedIdentifier });
                    }
                    const pullFactor = easeInOutCubic((normalizedProgress - 0.22) / 0.26);
                    workingMagazineOffset.set(0, -0.34 * pullFactor, 0.05 * pullFactor);
                    workingMagazineRotation.set(0.32 * pullFactor, 0, 0.15 * pullFactor);

                    if (animatedParts.magazineGroup) {
                        animatedParts.magazineGroup.position.copy(restMagPos).add(workingMagazineOffset);
                        animatedParts.magazineGroup.rotation.copy(workingMagazineRotation);
                        animatedParts.magazineGroup.visible = pullFactor < 0.85;
                    }

                    workingLeftHandPosition.copy(restMagPos).add(workingMagazineOffset);
                    workingLeftHandPosition.x = workingLeftHandPosition.x - 0.028;
                } else if (normalizedProgress < 0.72) {
                    // 階段 C：舉起全新彈匣精準插入彈匣井並給予拍擊微震
                    const insertFactor = easeInOutCubic((normalizedProgress - 0.48) / 0.24);
                    const inverseInsert = 1.0 - insertFactor;
                    workingMagazineOffset.set(0, -0.32 * inverseInsert, 0.04 * inverseInsert);

                    if (animatedParts.magazineGroup) {
                        animatedParts.magazineGroup.visible = true;
                        animatedParts.magazineGroup.position.copy(restMagPos).add(workingMagazineOffset);
                        animatedParts.magazineGroup.rotation.set(0.18 * inverseInsert, 0, 0);
                    }

                    workingLeftHandPosition.copy(restMagPos).add(workingMagazineOffset);
                    workingLeftHandPosition.x = workingLeftHandPosition.x - 0.028;

                    if (insertFactor > 0.90 && !actionState.stageFlags.magazineInEmitted) {
                        actionState.stageFlags.magazineInEmitted = true;
                        global.WZ.bus.emit('anim:mag_in', { weaponIdentifier: currentMountedIdentifier });
                        recoilState.kickVelocityPitchX = recoilState.kickVelocityPitchX + 0.65;
                    }
                } else if (normalizedProgress < 0.90) {
                    // 階段 D：拉動拉機柄 / 滑套 / MP5 HK Slap 上膛
                    if (animatedParts.magazineGroup) {
                        animatedParts.magazineGroup.visible = true;
                        animatedParts.magazineGroup.position.copy(restMagPos);
                        animatedParts.magazineGroup.rotation.set(0, 0, 0);
                    }

                    const rackPhase = (normalizedProgress - 0.72) / 0.18;
                    const pullCurve = Math.sin(rackPhase * Math.PI);

                    if (rackPhase > 0.35 && !actionState.stageFlags.boltRackEmitted) {
                        actionState.stageFlags.boltRackEmitted = true;
                        global.WZ.bus.emit('anim:bolt_rack', { weaponIdentifier: currentMountedIdentifier });
                        recoilState.kickVelocityZ = recoilState.kickVelocityZ + 0.35;
                    }

                    workingLeftHandPosition.copy(handAnchors.leftHandBoltPosition);
                    workingLeftHandPosition.z = workingLeftHandPosition.z + pullCurve * 0.068;

                    if (animatedParts.chargingHandleGroup) {
                        if (activeWeaponAssembly.weaponIdentifier === 'M4A1') {
                            animatedParts.chargingHandleGroup.position.z = 0.098 + pullCurve * 0.062;
                        } else if (activeWeaponAssembly.weaponIdentifier === 'MP5') {
                            animatedParts.chargingHandleGroup.position.z = -0.245 + pullCurve * 0.068;
                            animatedParts.chargingHandleGroup.rotation.z = pullCurve * 0.45;
                        } else if (activeWeaponAssembly.weaponIdentifier === 'X16') {
                            animatedParts.boltOrSlideGroup.position.z = -0.052 + pullCurve * 0.046;
                        } else if (activeWeaponAssembly.weaponIdentifier === 'AX50') {
                            animatedParts.boltOrSlideGroup.rotation.z = pullCurve * 0.95;
                            animatedParts.boltOrSlideGroup.position.z = 0.040 + pullCurve * 0.078;
                        }
                    }
                } else {
                    // 階段 E：左手回位至護木戰鬥姿態
                    const returnFactor = easeInOutCubic((normalizedProgress - 0.90) / 0.10);
                    workingLeftHandPosition.lerpVectors(handAnchors.leftHandBoltPosition, handAnchors.leftHandRestPosition, returnFactor);
                    resetWeaponSubPartTransforms();
                }

                if (normalizedProgress >= 1.0) {
                    actionState.currentMode = 'NONE';
                    global.WZ.State.data.player.isReloading = false;
                    resetWeaponSubPartTransforms();
                    global.WZ.bus.emit('anim:reload_complete', { weaponIdentifier: currentMountedIdentifier });
                }
                return;
            }

            // ----------------------------------------------------------------
            // 動作 2：電影感全方位武器檢視動畫 (INSPECTING)
            // ----------------------------------------------------------------
            if (actionState.currentMode === 'INSPECTING') {
                const enterEnvelope = smoothStep(0.0, 0.14, normalizedProgress);
                const exitEnvelope = 1.0 - smoothStep(0.86, 1.0, normalizedProgress);
                const inspectEnvelope = enterEnvelope * exitEnvelope;

                let inspectYaw = 0;
                let inspectRoll = 0;
                let inspectPitch = 0;
                let inspectShiftX = -0.075 * inspectEnvelope;
                let inspectShiftY = 0.032 * inspectEnvelope;
                let inspectShiftZ = 0.095 * inspectEnvelope;

                if (normalizedProgress < 0.45) {
                    // 左側機匣與戰術導軌細部鑑賞
                    const leftShowcase = smoothStep(0.06, 0.25, normalizedProgress);
                    inspectYaw = 0.58 * leftShowcase;
                    inspectRoll = -0.74 * leftShowcase;
                    inspectPitch = 0.18 * leftShowcase;
                } else if (normalizedProgress < 0.85) {
                    // 流暢翻轉至右側檢視拋殼口、雷射模組與槍栓細節
                    const flipProgress = smoothStep(0.45, 0.64, normalizedProgress);
                    inspectYaw = interpolateNumber(0.58, -0.52, flipProgress);
                    inspectRoll = interpolateNumber(-0.74, 0.78, flipProgress);
                    inspectPitch = interpolateNumber(0.18, 0.12, flipProgress);
                    inspectShiftX = interpolateNumber(-0.075, -0.025, flipProgress);
                } else {
                    const returnProgress = smoothStep(0.85, 1.0, normalizedProgress);
                    inspectYaw = interpolateNumber(-0.52, 0.0, returnProgress);
                    inspectRoll = interpolateNumber(0.78, 0.0, returnProgress);
                    inspectPitch = interpolateNumber(0.12, 0.0, returnProgress);
                    inspectShiftX = interpolateNumber(-0.025, 0.0, returnProgress);
                }

                // 鑑賞時的細微漂浮呼吸感
                const floatWave = Math.sin(normalizedProgress * Math.PI * 4.0) * 0.008 * inspectEnvelope;
                workingActionPosition.set(inspectShiftX, inspectShiftY + floatWave, inspectShiftZ);
                workingActionRotation.set(inspectPitch, inspectYaw, inspectRoll);

                if (normalizedProgress >= 1.0) {
                    actionState.currentMode = 'NONE';
                    global.WZ.bus.emit('anim:inspect_complete', { weaponIdentifier: currentMountedIdentifier });
                }
                return;
            }

            // ----------------------------------------------------------------
            // 動作 3：戰區級 3D 防彈陶瓷插甲動畫 (PLATING)
            // ----------------------------------------------------------------
            if (actionState.currentMode === 'PLATING') {
                const armorPlateGroup = global.WZ.ViewModelRig.getArmorPlatePropGroup();

                // 收下武器至左下視野外
                const holsterIn = smoothStep(0.0, 0.20, normalizedProgress);
                const holsterOut = 1.0 - smoothStep(0.82, 1.0, normalizedProgress);
                const weaponDropFactor = holsterIn * holsterOut;

                workingActionPosition.set(-0.22 * weaponDropFactor, -0.46 * weaponDropFactor, 0.14 * weaponDropFactor);
                workingActionRotation.set(-0.92 * weaponDropFactor, 0.45 * weaponDropFactor, 0.35 * weaponDropFactor);

                if (armorPlateGroup) {
                    if (normalizedProgress >= 0.14 && normalizedProgress <= 0.86) {
                        armorPlateGroup.visible = true;
                        const plateSubProgress = (normalizedProgress - 0.14) / 0.72;

                        if (plateSubProgress < 0.38) {
                            // 舉起防彈陶瓷板至胸前視野中展示
                            const raiseAlpha = easeInOutCubic(plateSubProgress / 0.38);
                            armorPlateGroup.position.set(
                                interpolateNumber(0.24, 0.01, raiseAlpha),
                                interpolateNumber(-0.44, -0.05, raiseAlpha),
                                interpolateNumber(-0.26, -0.34, raiseAlpha)
                            );
                            armorPlateGroup.rotation.set(
                                interpolateNumber(-0.65, -0.18, raiseAlpha),
                                interpolateNumber(-0.55, 0.06, raiseAlpha),
                                interpolateNumber(-0.22, 0.02, raiseAlpha)
                            );
                        } else if (plateSubProgress < 0.78) {
                            // 俐落向下滑入戰術胸掛防彈背心插槽
                            const slideAlpha = easeInOutCubic((plateSubProgress - 0.38) / 0.40);
                            armorPlateGroup.position.set(
                                interpolateNumber(0.01, 0.0, slideAlpha),
                                interpolateNumber(-0.05, -0.38, slideAlpha),
                                interpolateNumber(-0.34, -0.22, slideAlpha)
                            );
                            armorPlateGroup.rotation.set(
                                interpolateNumber(-0.18, 0.28, slideAlpha),
                                0.04,
                                0.0
                            );

                            if (slideAlpha > 0.72 && !actionState.stageFlags.plateInsertedEmitted) {
                                actionState.stageFlags.plateInsertedEmitted = true;
                                global.WZ.bus.emit('anim:plate_inserted', {});
                                motionState.landingDipVelocity = motionState.landingDipVelocity - 0.55;
                            }
                        } else {
                            // 插板完全就位並隱藏道具
                            armorPlateGroup.visible = false;
                        }
                    } else {
                        armorPlateGroup.visible = false;
                    }
                }

                if (normalizedProgress >= 1.0) {
                    actionState.currentMode = 'NONE';
                    global.WZ.ViewModelRig.setArmorPlateVisible(false);
                    global.WZ.State.data.player.isPlating = false;
                    global.WZ.bus.emit('anim:plate_complete', {});
                }
                return;
            }

            // ----------------------------------------------------------------
            // 動作 4：收槍與拔槍切換動畫 (SWITCHING)
            // ----------------------------------------------------------------
            if (actionState.currentMode === 'SWITCHING') {
                if (normalizedProgress < 0.5) {
                    const holsterAlpha = easeInOutCubic(normalizedProgress / 0.5);
                    workingActionPosition.set(0.06 * holsterAlpha, -0.44 * holsterAlpha, 0.08 * holsterAlpha);
                    workingActionRotation.set(-0.85 * holsterAlpha, -0.22 * holsterAlpha, -0.25 * holsterAlpha);
                } else {
                    if (!actionState.hasSwappedDuringSwitch) {
                        actionState.hasSwappedDuringSwitch = true;
                        equipWeaponByIdentifier(actionState.pendingWeaponIdentifier);
                        global.WZ.bus.emit('anim:switch_swapped', { weaponIdentifier: currentMountedIdentifier });
                    }
                    const drawAlpha = easeInOutCubic((normalizedProgress - 0.5) / 0.5);
                    const remainingDrop = 1.0 - drawAlpha;
                    workingActionPosition.set(-0.05 * remainingDrop, -0.42 * remainingDrop, 0.06 * remainingDrop);
                    workingActionRotation.set(-0.78 * remainingDrop, 0.18 * remainingDrop, 0.22 * remainingDrop);
                }

                if (normalizedProgress >= 1.0) {
                    actionState.currentMode = 'NONE';
                    global.WZ.bus.emit('anim:switch_complete', { weaponIdentifier: currentMountedIdentifier });
                }
                return;
            }

            // ----------------------------------------------------------------
            // 動作 5：AX-50 重型狙擊步槍手動拉栓退殼上膛動畫 (BOLT_CYCLING)
            // ----------------------------------------------------------------
            if (actionState.currentMode === 'BOLT_CYCLING') {
                const boltGroup = animatedParts.boltOrSlideGroup;
                const tiltEnvelope = smoothStep(0.0, 0.18, normalizedProgress) * (1.0 - smoothStep(0.84, 1.0, normalizedProgress));

                // 槍身向左微傾方便右手旋轉並後拉重型槍栓
                workingActionPosition.set(-0.024 * tiltEnvelope, -0.014 * tiltEnvelope, 0.022 * tiltEnvelope);
                workingActionRotation.set(0.12 * tiltEnvelope, 0.08 * tiltEnvelope, 0.24 * tiltEnvelope);

                let boltLiftAngle = 0;
                let boltPullDistance = 0;

                if (normalizedProgress < 0.22) {
                    // 右手離握把抓取槍栓拉柄並向上旋轉解鎖 60 度
                    const liftFactor = easeInOutCubic(normalizedProgress / 0.22);
                    boltLiftAngle = liftFactor * 1.05;
                    workingRightHandPosition.lerpVectors(handAnchors.rightHandRestPosition, handAnchors.leftHandBoltPosition, liftFactor);
                } else if (normalizedProgress < 0.54) {
                    // 向後拉開槍機拋出 .50 BMG 彈殼
                    const pullFactor = easeInOutCubic((normalizedProgress - 0.22) / 0.32);
                    boltLiftAngle = 1.05;
                    boltPullDistance = pullFactor * 0.095;
                    workingRightHandPosition.copy(handAnchors.leftHandBoltPosition);
                    workingRightHandPosition.y = workingRightHandPosition.y + 0.032;
                    workingRightHandPosition.z = workingRightHandPosition.z + boltPullDistance;

                    if (pullFactor > 0.72 && !actionState.stageFlags.boltRackEmitted) {
                        actionState.stageFlags.boltRackEmitted = true;
                        global.WZ.bus.emit('anim:bolt_cycle_eject', { weaponIdentifier: 'AX50' });
                    }
                } else if (normalizedProgress < 0.82) {
                    // 向前推彈上膛並向下壓緊閉鎖
                    const pushFactor = easeInOutCubic((normalizedProgress - 0.54) / 0.28);
                    boltLiftAngle = interpolateNumber(1.05, 0.0, smoothStep(0.65, 1.0, pushFactor));
                    boltPullDistance = interpolateNumber(0.095, 0.0, smoothStep(0.0, 0.75, pushFactor));
                    workingRightHandPosition.copy(handAnchors.leftHandBoltPosition);
                    workingRightHandPosition.y = workingRightHandPosition.y + 0.032 * (boltLiftAngle / 1.05);
                    workingRightHandPosition.z = workingRightHandPosition.z + boltPullDistance;
                } else {
                    // 右手回到握把就位
                    const returnFactor = easeInOutCubic((normalizedProgress - 0.82) / 0.18);
                    workingRightHandPosition.lerpVectors(handAnchors.leftHandBoltPosition, handAnchors.rightHandRestPosition, returnFactor);
                }

                if (boltGroup) {
                    boltGroup.rotation.z = boltLiftAngle;
                    boltGroup.position.z = 0.040 + boltPullDistance;
                }

                if (normalizedProgress >= 1.0) {
                    actionState.currentMode = 'NONE';
                    resetWeaponSubPartTransforms();
                }
            }
        }

        // 每幀主更新迴圈
        function update(deltaTime) {
            if (!isInitialized) {
                return;
            }

            const gameStateData = global.WZ.State.data;
            const isPlaying = gameStateData.gameState === 'PLAYING' && gameStateData.player.isAlive;

            if (!isPlaying) {
                global.WZ.ViewModelRig.setVisible(false);
                return;
            }

            // 確保已掛載目前裝備武器模型
            if (!activeWeaponAssembly) {
                equipWeaponByIdentifier(resolveActiveWeaponIdentifierFromState());
            }

            const adsAlpha = global.WZ.CameraRig ? global.WZ.CameraRig.getAdsAlpha() : 0;

            // 狙擊鏡全螢幕 2D 遮罩啟動時隱藏 3D 第一人稱模型以免穿模遮擋視野
            const shouldHideForSniperScope = activeWeaponAssembly.weaponCategory === 'SNIPER' && adsAlpha > 0.78 && actionState.currentMode !== 'BOLT_CYCLING';
            global.WZ.ViewModelRig.setVisible(!shouldHideForSniperScope);

            const playerState = gameStateData.player;

            // 若玩家在檢視時開始衝刺、開鏡或滑鏟，立即平滑中止檢視
            if (actionState.currentMode === 'INSPECTING') {
                if (playerState.isADS || playerState.moveMode === 'TACSPRINT' || playerState.stance === 'SLIDE' || playerState.stance === 'DIVE') {
                    cancelInterruptibleAction();
                }
            }

            // 1. 更新射擊彈簧、槍口火光與晃動慣性
            updateRecoilAndMuzzleFlash(deltaTime);
            updateLocomotionAndSwayLayer(deltaTime, adsAlpha);

            // 2. 更新動作狀態機 (換彈 / 檢視 / 插甲 / 切槍 / 拉栓)
            evaluateActionOverrideLayer(deltaTime);

            // 3. 混合待機腰射、開鏡 ADS、戰術衝刺舉槍與滑鏟側傾基礎姿勢
            const poseOffsets = activeWeaponAssembly.poseOffsets;
            const isInCombatReadyAction = actionState.currentMode === 'NONE';
            const wantsTacSprintPose = isInCombatReadyAction && playerState.moveMode === 'TACSPRINT' && adsAlpha < 0.08;
            const wantsSlidePose = isInCombatReadyAction && playerState.stance === 'SLIDE';
            const wantsDivePose = isInCombatReadyAction && playerState.stance === 'DIVE';

            motionState.tacSprintBlendAlpha = interpolateNumber(motionState.tacSprintBlendAlpha, wantsTacSprintPose ? 1.0 : 0.0, Math.min(1.0, deltaTime * 11.0));
            motionState.slideStanceBlendAlpha = interpolateNumber(motionState.slideStanceBlendAlpha, wantsSlidePose ? 1.0 : 0.0, Math.min(1.0, deltaTime * 12.0));
            motionState.diveStanceBlendAlpha = interpolateNumber(motionState.diveStanceBlendAlpha, wantsDivePose ? 1.0 : 0.0, Math.min(1.0, deltaTime * 12.0));

            // 先混合腰射 (Hip) 與開鏡 (ADS)
            workingBasePosition.lerpVectors(poseOffsets.hipPosition, poseOffsets.adsPosition, adsAlpha);
            workingBaseRotation.set(
                interpolateNumber(poseOffsets.hipRotation.x, poseOffsets.adsRotation.x, adsAlpha),
                interpolateNumber(poseOffsets.hipRotation.y, poseOffsets.adsRotation.y, adsAlpha),
                interpolateNumber(poseOffsets.hipRotation.z, poseOffsets.adsRotation.z, adsAlpha)
            );

            // 疊加戰區招牌戰術衝刺高舉姿態 (Tac-Sprint Vertical High-Ready)
            if (motionState.tacSprintBlendAlpha > 0.001) {
                workingBasePosition.lerp(poseOffsets.tacSprintPosition, motionState.tacSprintBlendAlpha);
                workingBaseRotation.x = interpolateNumber(workingBaseRotation.x, poseOffsets.tacSprintRotation.x, motionState.tacSprintBlendAlpha);
                workingBaseRotation.y = interpolateNumber(workingBaseRotation.y, poseOffsets.tacSprintRotation.y, motionState.tacSprintBlendAlpha);
                workingBaseRotation.z = interpolateNumber(workingBaseRotation.z, poseOffsets.tacSprintRotation.z, motionState.tacSprintBlendAlpha);
            }

            // 疊加戰術滑鏟側傾瞄射姿態 (Tac-Stance Slide Cant)
            if (motionState.slideStanceBlendAlpha > 0.001) {
                workingBasePosition.x = workingBasePosition.x - 0.055 * motionState.slideStanceBlendAlpha;
                workingBasePosition.y = workingBasePosition.y - 0.032 * motionState.slideStanceBlendAlpha;
                workingBaseRotation.z = workingBaseRotation.z + 0.56 * motionState.slideStanceBlendAlpha;
                workingBaseRotation.x = workingBaseRotation.x + 0.06 * motionState.slideStanceBlendAlpha;
            }

            // 疊加戰術飛撲護槍姿態
            if (motionState.diveStanceBlendAlpha > 0.001) {
                workingBasePosition.y = workingBasePosition.y - 0.075 * motionState.diveStanceBlendAlpha;
                workingBasePosition.z = workingBasePosition.z + 0.055 * motionState.diveStanceBlendAlpha;
                workingBaseRotation.x = workingBaseRotation.x - 0.34 * motionState.diveStanceBlendAlpha;
                workingBaseRotation.y = workingBaseRotation.y + 0.38 * motionState.diveStanceBlendAlpha;
            }

            // 4. 寫入最終變換至 RecoilAndActionGroup 與雙手關節骨架
            const recoilAndActionGroup = global.WZ.ViewModelRig.getRecoilAndActionGroup();
            if (recoilAndActionGroup) {
                recoilAndActionGroup.position.set(
                    workingBasePosition.x + workingActionPosition.x,
                    workingBasePosition.y + workingActionPosition.y,
                    workingBasePosition.z + workingActionPosition.z + recoilState.kickPositionZ
                );
                recoilAndActionGroup.rotation.set(
                    workingBaseRotation.x + workingActionRotation.x + recoilState.kickPitchX,
                    workingBaseRotation.y + workingActionRotation.y,
                    workingBaseRotation.z + workingActionRotation.z + recoilState.kickRollZ
                );
            }

            const leftArmPivotGroup = global.WZ.ViewModelRig.getLeftArmPivotGroup();
            if (leftArmPivotGroup) {
                leftArmPivotGroup.position.copy(workingLeftHandPosition);
                leftArmPivotGroup.rotation.copy(workingLeftHandRotation);
            }

            const rightArmPivotGroup = global.WZ.ViewModelRig.getRightArmPivotGroup();
            if (rightArmPivotGroup) {
                rightArmPivotGroup.position.copy(workingRightHandPosition);
                rightArmPivotGroup.rotation.copy(workingRightHandRotation);
            }
        }

        // 取得當前 3D 槍口世界座標 (供彈道與曳光彈系統使用)
        function getMuzzleWorldPosition(outputVector) {
            const targetVector = outputVector || new THREE.Vector3();
            if (activeWeaponAssembly && activeWeaponAssembly.animatedParts.muzzleAnchor) {
                activeWeaponAssembly.animatedParts.muzzleAnchor.getWorldPosition(targetVector);
                return targetVector;
            }
            if (global.WZ.CameraRig) {
                return global.WZ.CameraRig.getWorldPosition(targetVector);
            }
            return targetVector;
        }

        // 取得當前 3D 拋殼口世界座標 (供旋轉拋出彈殼系統使用)
        function getEjectionPortWorldPosition(outputVector) {
            const targetVector = outputVector || new THREE.Vector3();
            if (activeWeaponAssembly && activeWeaponAssembly.animatedParts.ejectionPortAnchor) {
                activeWeaponAssembly.animatedParts.ejectionPortAnchor.getWorldPosition(targetVector);
                return targetVector;
            }
            return getMuzzleWorldPosition(targetVector);
        }

        // 綁定事件匯流排與初始化
        function initialize() {
            if (isInitialized) {
                return;
            }
            isInitialized = true;

            equipWeaponByIdentifier(resolveActiveWeaponIdentifierFromState());

            global.WZ.bus.on('weapon:fired', function (payload) {
                const weaponConfiguration = (payload && payload.weaponConfig)
                    ? payload.weaponConfig
                    : global.WZ.State.getActiveWeaponConfig();
                triggerFireRecoil(weaponConfiguration);
            });

            global.WZ.bus.on('weapon:reload_start', function (payload) {
                const durationSeconds = payload && payload.duration ? payload.duration : 0;
                startReloadAnimation(durationSeconds);
            });

            global.WZ.bus.on('weapon:switch_start', function (payload) {
                const targetIdentifier = payload && payload.weaponId ? payload.weaponId : resolveActiveWeaponIdentifierFromState();
                startWeaponSwitchAnimation(targetIdentifier, 0.54);
            });

            global.WZ.bus.on('player:plate_start', function (payload) {
                const durationSeconds = payload && payload.duration ? payload.duration : 1.55;
                startArmorPlateAnimation(durationSeconds);
            });

            global.WZ.bus.on('input:action', function (payload) {
                if (!payload || !payload.pressed) {
                    return;
                }
                if (global.WZ.State.data.gameState !== 'PLAYING') {
                    return;
                }
                if (payload.action === 'INSPECT') {
                    startInspectAnimation();
                }
            });

            global.WZ.bus.on('player:land', function (payload) {
                const impactStrength = payload && payload.impact ? Math.min(18.0, payload.impact) : 8.0;
                motionState.landingDipVelocity = motionState.landingDipVelocity - impactStrength * 0.042;
            });

            global.WZ.bus.on('match:reset', function () {
                actionState.currentMode = 'NONE';
                actionState.elapsedTime = 0;
                global.WZ.ViewModelRig.setArmorPlateVisible(false);
                equipWeaponByIdentifier(resolveActiveWeaponIdentifierFromState());
                resetWeaponSubPartTransforms();
            });
        }

        return {
            initialize: initialize,
            init: initialize,
            update: update,
            equipWeaponByIdentifier: equipWeaponByIdentifier,
            startReloadAnimation: startReloadAnimation,
            startInspectAnimation: startInspectAnimation,
            startArmorPlateAnimation: startArmorPlateAnimation,
            startWeaponSwitchAnimation: startWeaponSwitchAnimation,
            triggerFireRecoil: triggerFireRecoil,
            cancelInterruptibleAction: cancelInterruptibleAction,
            canFireNow: canFireNow,
            getMuzzleWorldPosition: getMuzzleWorldPosition,
            getEjectionPortWorldPosition: getEjectionPortWorldPosition,
            getCurrentActionMode: function () { return actionState.currentMode; },
            getActiveWeaponAssembly: function () { return activeWeaponAssembly; }
        };
    })();
