            },

            // 輸入狀態
            keys: {},

            // 場景實體集合
            worldMeshes: [],
            colliders: [],
            coverPoints: [],
            spawnPoints: [],
            barrels: [],
            supplies: []
        };

        // 啟動並自動串接前序模組或建構完整 3D 戰術場地
        function boot() {
            if (game.initialized) return;
            game.initialized = true;
            game.clock = new THREE.Clock();

            // 1. 優先複用前序 PART 1-4 已建立的渲染環境，否則自動建構完整戰術場景
            setupSceneAndRenderer();
            buildTacticalArenaIfNeeded();
            buildViewModel();

            // 2. 初始化五大核心引擎並串接彼此訊號
            AudioEngine.init();
            VFX.init({
                scene: game.scene,
                onCameraShake: triggerCameraShake
            });

            TacticalHUD.init({
                onStartClick: () => {
                    if (game.gameOver) {
                        restart();
                    }
                    lockPointerAndResume();
                }
            });

            EnemyAI.init({
                scene: game.scene,
                player: game.player,
                camera: game.camera,
                getWorldMeshes: () => game.worldMeshes,
                getCoverPoints: () => game.coverPoints,
                getSpawnPoints: () => game.spawnPoints,
                onPlayerDamaged: handlePlayerDamaged,
                onEnemyKilled: handleEnemyKilled,
                onDropSupply: spawnSupplyCrate
            });

            WeaponCombat.init({
                scene: game.scene,
                camera: game.camera,
                player: game.player,
                getWorldMeshes: () => game.worldMeshes,
                getEnemyHitboxes: () => EnemyAI.getHitboxes(),
                getExplosives: () => game.barrels.filter(b => !b.exploded).map(b => b.mesh),
                onHitEnemy: handleWeaponHitEnemy,
                onHitExplosive: handleWeaponHitBarrel,
                onHUDUpdate: (hudData) => TacticalHUD.updateCombatState(hudData),
                onCameraShake: triggerCameraShake,
                onWeaponKick: (kickZ, pitchImp) => {
                    game.viewModel.kickZ = Math.min(0.16, game.viewModel.kickZ + kickZ);
                    game.viewModel.kickPitch = Math.min(0.28, game.viewModel.kickPitch + pitchImp * 2.2);
                }
            });

            bindInputs();
            EnemyAI.startWave(1);
            TacticalHUD.showBanner('第 1 波敵軍來襲 // 清除威脅', 2.8);

            game.running = true;
            requestAnimationFrame(mainLoop);
        }

        function setupSceneAndRenderer() {
            game.scene = window.scene || new THREE.Scene();
            if (!window.scene) {
                game.scene.background = new THREE.Color(0x18212c);
                game.scene.fog = new THREE.FogExp2(0x18212c, 0.013);
                window.scene = game.scene;
            }

            game.camera = window.camera || new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.08, 320);
            window.camera = game.camera;
            if (!game.camera.parent) game.scene.add(game.camera);

            if (window.renderer) {
                game.renderer = window.renderer;
            } else {
                game.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
                game.renderer.setSize(window.innerWidth, window.innerHeight);
                game.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                game.renderer.shadowMap.enabled = true;
                game.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.style.margin = '0';
                document.body.style.overflow = 'hidden';
                document.body.appendChild(game.renderer.domElement);
                window.renderer = game.renderer;
            }

            window.addEventListener('resize', () => {
                game.camera.aspect = window.innerWidth / window.innerHeight;
                game.camera.updateProjectionMatrix();
                game.renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // 若前序模組尚未注入場景幾何，則建構完整工業倉儲戰術對戰地圖與爆炸油桶
        function buildTacticalArenaIfNeeded() {
            if (window.WorldMap && Array.isArray(window.WorldMap.worldMeshes) && window.WorldMap.worldMeshes.length > 0) {
                game.worldMeshes = window.WorldMap.worldMeshes;
                game.colliders = window.WorldMap.colliders || [];
                game.coverPoints = window.WorldMap.coverPoints || [];
                game.spawnPoints = window.WorldMap.spawnPoints || [];
                game.barrels = window.WorldMap.barrels || [];
                return;
            }

            // 戰場環境光 + 太陽斜射陰影光
            const hemi = new THREE.HemisphereLight(0x9ec5e8, 0x2b3036, 0.65);
            game.scene.add(hemi);

            const dirLight = new THREE.DirectionalLight(0xffe6c7, 1.15);
            dirLight.position.set(35, 58, 28);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.set(2048, 2048);
            dirLight.shadow.camera.near = 5;
            dirLight.shadow.camera.far = 160;
            const d = 58;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            game.scene.add(dirLight);

            // 戰術水泥地面
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x353b42, roughness: 0.92, metalness: 0.08 });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(110, 110), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            floor.userData = { surfaceType: 'concrete' };
            game.scene.add(floor);
            game.worldMeshes.push(floor);

            // 圍牆邊界
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x464e57, roughness: 0.86, metalness: 0.14 });
            const crateMat = new THREE.MeshStandardMaterial({ color: 0x5c6858, roughness: 0.78, metalness: 0.22 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x3a4a5a, roughness: 0.45, metalness: 0.72 });

            const addBox = (x, y, z, w, h, dep, mat, surfaceType = 'concrete', registerCover = true) => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, dep), mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = { surfaceType };
                game.scene.add(mesh);
                game.worldMeshes.push(mesh);

                game.colliders.push({
                    x, z, halfW: w * 0.5, halfD: dep * 0.5, radius: Math.max(w, dep) * 0.5
                });

                if (registerCover) {
                    const pad = 1.45;
                    game.coverPoints.push(
                        new THREE.Vector3(x + w * 0.5 + pad, 0, z),
                        new THREE.Vector3(x - w * 0.5 - pad, 0, z),
                        new THREE.Vector3(x, 0, z + dep * 0.5 + pad),
                        new THREE.Vector3(x, 0, z - dep * 0.5 - pad)
                    );
                }
            };

            // 四周外牆
            addBox(0, 3.5, -50, 100, 7, 2, wallMat, 'concrete', false);
            addBox(0, 3.5, 50, 100, 7, 2, wallMat, 'concrete', false);
            addBox(-50, 3.5, 0, 2, 7, 100, wallMat, 'concrete', false);
            addBox(50, 3.5, 0, 2, 7, 100, wallMat, 'concrete', false);

            // 戰場中樞貨櫃、掩體牆與高塔結構
            addBox(0, 1.8, 0, 7.5, 3.6, 3.2, metalMat, 'metal', true);
            addBox(-16, 1.6, -12, 3.2, 3.2, 9.5, metalMat, 'metal', true);
            addBox(17, 1.6, -10, 9.0, 3.2, 3.2, metalMat, 'metal', true);
            addBox(-18, 1.2, 14, 6.5, 2.4, 2.2, wallMat, 'concrete', true);
            addBox(16, 1.2, 15, 2.4, 2.4, 7.0, wallMat, 'concrete', true);
            addBox(-6, 0.85, 11, 3.6, 1.7, 1.4, crateMat, 'concrete', true);
            addBox(8, 0.85, 7, 3.6, 1.7, 1.4, crateMat, 'concrete', true);
            addBox(-28, 2.2, -26, 8.0, 4.4, 4.0, wallMat, 'concrete', true);
            addBox(27, 2.2, -24, 5.0, 4.4, 8.5, metalMat, 'metal', true);
            addBox(0, 1.1, -24, 11.0, 2.2, 1.8, wallMat, 'concrete', true);
            addBox(-30, 1.2, 4, 4.0, 2.4, 6.0, crateMat, 'concrete', true);
            addBox(30, 1.2, 2, 4.0, 2.4, 6.0, crateMat, 'concrete', true);

            // 設置 8 個戰術敵軍出生點
            game.spawnPoints = [
                new THREE.Vector3(-38, 0, -38),
                new THREE.Vector3(0, 0, -40),
                new THREE.Vector3(38, 0, -38),
                new THREE.Vector3(-40, 0, 0),
                new THREE.Vector3(40, 0, 0),
                new THREE.Vector3(-36, 0, 32),
                new THREE.Vector3(36, 0, 32),
                new THREE.Vector3(14, 0, -34)
            ];

            // 部署紅色高爆工業油桶（支援射擊起火與連鎖引爆）
            const barrelCoords = [
                [-6, -4], [6.5, -2], [-12, -16], [13, -14],
                [-14, 10], [12, 12], [0, -18], [-24, -4], [24, -8]
            ];
            barrelCoords.forEach(([bx, bz]) => spawnExplosiveBarrel(bx, bz));
        }

        function spawnExplosiveBarrel(x, z) {
            const barrelGeo = new THREE.CylinderGeometry(0.46, 0.46, 1.28, 14);
            const barrelMat = new THREE.MeshStandardMaterial({
                color: 0xc92a2a, roughness: 0.42, metalness: 0.62
            });
            const mesh = new THREE.Mesh(barrelGeo, barrelMat);
            mesh.position.set(x, 0.64, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // 黃色警示條紋環
            const stripe = new THREE.Mesh(
                new THREE.CylinderGeometry(0.47, 0.47, 0.16, 14),
                new THREE.MeshBasicMaterial({ color: 0xffc42e })
            );
            mesh.add(stripe);

            const barrel = {
                mesh,
                position: new THREE.Vector3(x, 0.64, z),
                hp: 45,
                exploded: false,
                fuseTimer: -1
            };
            mesh.userData = {
                isExplosive: true,
                barrelRef: barrel,
                surfaceType: 'metal'
            };

            game.scene.add(mesh);
            game.barrels.push(barrel);
        }

        // 建構第一人稱視角戰術持槍模型（支援開鏡中心對齊、後座力後坐與步態晃動）
        function buildViewModel() {
            const grp = new THREE.Group();
            const receiverMat = new THREE.MeshStandardMaterial({ color: 0x1e2228, roughness: 0.42, metalness: 0.78 });
            const accentMat = new THREE.MeshStandardMaterial({ color: 0x3b424d, roughness: 0.55, metalness: 0.5 });
            const opticMat = new THREE.MeshBasicMaterial({ color: 0x35ff9e });

            const receiver = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.105, 0.48), receiverMat);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.34, 8), receiverMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.018, -0.36);

            const handguard = new THREE.Mesh(new THREE.BoxGeometry(0.068, 0.078, 0.28), accentMat);
            handguard.position.set(0, 0.01, -0.24);

            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.16, 0.075), accentMat);
            mag.position.set(0, -0.11, -0.05);
            mag.rotation.x = 0.16;

            // 全像紅點瞄具框與發光準星點
            const sightFrame = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.046, 0.06), receiverMat);
            sightFrame.position.set(0, 0.074, 0.02);
            const sightDot = new THREE.Mesh(new THREE.SphereGeometry(0.004, 6, 6), opticMat);
            sightDot.position.set(0, 0.078, 0.01);

            grp.add(receiver, barrel, handguard, mag, sightFrame, sightDot);
            grp.position.copy(game.viewModel.basePos);
            game.camera.add(grp);
            game.viewModel.group = grp;
        }

        // 戰場彈藥與陶瓷護甲插板補給箱
        function spawnSupplyCrate(worldPos) {
            const box = new THREE.Mesh(
                new THREE.BoxGeometry(0.56, 0.32, 0.42),
                new THREE.MeshStandardMaterial({
                    color: 0x1d7a9c, emissive: 0x0a384c, roughness: 0.38, metalness: 0.45
                })
            );
            box.position.set(worldPos.x, 0.24, worldPos.z);
            box.castShadow = true;
            game.scene.add(box);
            game.supplies.push({ mesh: box, life: 24.0 });
        }

        // 處理武器命中敵軍
        function handleWeaponHitEnemy(enemyRef, hitInfo) {
            const activeW = WeaponCombat.getActiveWeapon();
            hitInfo.weaponName = activeW ? activeW.spec.name : '武器';

            const result = EnemyAI.receiveHit(enemyRef, hitInfo);
            if (result.armorBroken) {
                TacticalHUD.showHitmarker('armor_break');
            } else if (hitInfo.isHeadshot) {
                TacticalHUD.showHitmarker(result.killed ? 'headshot_kill' : 'headshot');
            } else if (result.killed) {
                TacticalHUD.showHitmarker('kill');
            } else if (result.armored) {
                TacticalHUD.showHitmarker('armor');
            } else {
                TacticalHUD.showHitmarker('body');
            }
            return result;
        }

        // 處理武器射擊紅色油桶 -> 觸發爆炸與鄰近油桶連鎖延遲引爆
        function handleWeaponHitBarrel(barrel, damage) {
            if (!barrel || barrel.exploded) return;
            barrel.hp -= damage;
            if (barrel.hp <= 0) {
                detonateBarrel(barrel);
            }
        }

        function detonateBarrel(barrel) {
            if (barrel.exploded) return;
            barrel.exploded = true;
            game.scene.remove(barrel.mesh);

            const blastRadius = 9.5;
            VFX.spawnExplosion(barrel.position, blastRadius);
            EnemyAI.applyExplosionDamage(barrel.position, blastRadius, 240);

            // 檢查玩家是否在爆炸半徑內
            const distPlayer = game.player.position.distanceTo(barrel.position);
            if (distPlayer < blastRadius) {
                const dmg = Math.round(75 * (1 - distPlayer / blastRadius));
                handlePlayerDamaged({
                    damage: dmg,
                    armorPen: 0.78,
                    attackerPos: barrel.position.clone(),
                    attackerLabel: '油桶爆破'
                });
            }

            // 連鎖引爆鄰近 8.5 公尺內其他油桶（0.18 秒短暫延遲形成震撼連爆）
            for (let i = 0; i < game.barrels.length; i++) {
                const other = game.barrels[i];
                if (other.exploded || other === barrel) continue;
                if (other.position.distanceTo(barrel.position) < 8.5 && other.fuseTimer < 0) {
                    other.fuseTimer = 0.16 + Math.random() * 0.14;
                }
            }
        }

        function handlePlayerDamaged(info) {
            if (game.gameOver) return;
            const res = WeaponCombat.applyPlayerDamage(info.damage, info.armorPen, false);
            TacticalHUD.showDamageDirection(info.attackerPos, res.armorBroken ? 0.85 : 0.45);
            triggerCameraShake(res.armorBroken ? 0.38 : 0.16, 0.2);

            if (res.armorBroken) {
                TacticalHUD.showBanner('護甲已破碎！按 [V] 插入新插板', 2.0);
            }

            if (game.player.hp <= 0) {
                triggerGameOver();
            }
        }

        function handleEnemyKilled(info) {
            game.kills++;
            game.score += info.score;
            TacticalHUD.pushKillfeed(info.weaponName, info.label, info.isHeadshot, info.score);
        }

        function triggerCameraShake(intensity, duration = 0.18) {
            game.shake.trauma = Math.min(1.0, Math.max(game.shake.trauma, intensity));
            game.shake.duration = Math.max(game.shake.duration, duration);
            game.shake.timer = game.shake.duration;
        }

        function triggerGameOver() {
            game.gameOver = true;
            game.paused = true;
            WeaponCombat.setTrigger(false);
            if (document.pointerLockElement) document.exitPointerLock();

            const waveInfo = EnemyAI.getWaveInfo();
            TacticalHUD.setOverlay(
                true,
                '任務失敗 // 陣亡',
                `止步於第 <strong>${waveInfo.wave}</strong> 波 ｜ 總擊殺 <strong>${game.kills}</strong> ｜ 戰術評分 <strong>${game.score}</strong>`,
                '重新部署'
            );
        }

        function lockPointerAndResume() {
            const canvas = game.renderer.domElement;
            if (canvas.requestPointerLock) {
                canvas.requestPointerLock();
            }
            game.paused = false;
            TacticalHUD.setOverlay(false);
        }

        function restart() {
            game.gameOver = false;
            game.kills = 0;
            game.score = 0;
            game.waveClearDelay = 0;

            game.player.position.set(0, 0, 26);
            game.player.velocity.set(0, 0, 0);
            game.player.yaw = 0;
            game.player.pitch = 0;
            game.player.hp = game.player.maxHp;

            // 重置護甲與彈藥
            const wcState = WeaponCombat.getState();
            wcState.armor.current = wcState.armor.max;
            wcState.armor.platesSpare = 4;
            WeaponCombat.addAmmoAndPlates(1.0, 2);

            // 重建油桶與敵軍
            game.barrels.forEach(b => { if (!b.exploded) game.scene.remove(b.mesh); });
            game.barrels.length = 0;
            [
                [-6, -4], [6.5, -2], [-12, -16], [13, -14],
                [-14, 10], [12, 12], [0, -18], [-24, -4], [24, -8]
            ].forEach(([bx, bz]) => spawnExplosiveBarrel(bx, bz));

            game.supplies.forEach(s => game.scene.remove(s.mesh));
            game.supplies.length = 0;

            EnemyAI.clearAll();
            EnemyAI.startWave(1);
            TacticalHUD.showBanner('重新部署完成 // 第 1 波開始', 2.4);
        }

        function bindInputs() {
            window.addEventListener('keydown', (e) => {
                game.keys[e.code] = true;
                if (game.paused || game.gameOver) return;

                if (e.code === 'KeyR') WeaponCombat.startReload();
                if (e.code === 'KeyV') WeaponCombat.startArmorPlate();
                if (e.code === 'Digit1') WeaponCombat.switchWeapon('rifle');
                if (e.code === 'Digit2') WeaponCombat.switchWeapon('smg');
                if (e.code === 'Digit3') WeaponCombat.switchWeapon('sniper');
                if (e.code === 'Digit4') WeaponCombat.switchWeapon('shotgun');
                if (e.code === 'Digit5') WeaponCombat.switchWeapon('pistol');

                // 衝刺中按 C 觸發戰術滑鏟
                if (e.code === 'KeyC' && game.player.isGrounded && !game.player.isSliding) {
                    const horizSpd = Math.hypot(game.player.velocity.x, game.player.velocity.z);
                    if (game.player.isSprinting && horizSpd > 5.0 && game.player.slideCooldown <= 0) {
                        game.player.isSliding = true;
                        game.player.slideTimer = 0.58;
                        game.player.slideCooldown = 1.15;
                        game.player.slideDir.set(game.player.velocity.x, 0, game.player.velocity.z).normalize();
                        AudioEngine.playSlide();
                    } else {
                        game.player.isCrouching = !game.player.isCrouching;
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                game.keys[e.code] = false;
            });

            window.addEventListener('mousedown', (e) => {
                if (game.paused || game.gameOver) return;
                if (e.button === 0) WeaponCombat.setTrigger(true);
                if (e.button === 2) game.player.isADS = true;
            });

            window.addEventListener('mouseup', (e) => {
                if (e.button === 0) WeaponCombat.setTrigger(false);
                if (e.button === 2) game.player.isADS = false;
            });

            window.addEventListener('contextmenu', (e) => e.preventDefault());

            window.addEventListener('mousemove', (e) => {
                if (game.paused || game.gameOver) return;
                if (document.pointerLockElement !== game.renderer.domElement) return;

                const sens = game.player.isADS ? 0.0011 : 0.0021;
                game.player.yaw -= e.movementX * sens;
                game.player.pitch = THREE.MathUtils.clamp(
                    game.player.pitch - e.movementY * sens,
                    -Math.PI * 0.47,
                    Math.PI * 0.47
                );

                // 輕微持槍慣性擺動
                game.viewModel.swayX = THREE.MathUtils.clamp(game.viewModel.swayX - e.movementX * 0.00018, -0.025, 0.025);
                game.viewModel.swayY = THREE.MathUtils.clamp(game.viewModel.swayY + e.movementY * 0.00018, -0.02, 0.02);
            });

            document.addEventListener('pointerlockchange', () => {
                const locked = document.pointerLockElement === game.renderer.domElement;
                if (!locked && !game.gameOver) {
                    game.paused = true;
                    WeaponCombat.setTrigger(false);
                    game.player.isADS = false;
                    TacticalHUD.setOverlay(true, '戰術暫停', '按下方按鈕或點擊畫面返回戰場', '繼續戰鬥');
                }
            });
        }

        // 更新第一人稱玩家移動、跳躍、滑鏟、障礙碰撞與腳步聲
        function updatePlayerPhysics(dt) {
            const p = game.player;
            if (p.slideCooldown > 0) p.slideCooldown -= dt;

            const fwdInput = (game.keys['KeyW'] ? 1 : 0) - (game.keys['KeyS'] ? 1 : 0);
            const sideInput = (game.keys['KeyD'] ? 1 : 0) - (game.keys['KeyA'] ? 1 : 0);

            const forward = new THREE.Vector3(-Math.sin(p.yaw), 0, -Math.cos(p.yaw));
            const right = new THREE.Vector3(Math.cos(p.yaw), 0, -Math.sin(p.yaw));

            if (p.isSliding) {
                p.slideTimer -= dt;
                const slideSpd = 10.6 * (0.45 + 0.55 * (p.slideTimer / 0.58));
                p.velocity.x = p.slideDir.x * slideSpd;
                p.velocity.z = p.slideDir.z * slideSpd;
                if (p.slideTimer <= 0) {
                    p.isSliding = false;
                    p.isCrouching = true;
                }
            } else {
                const wantsSprint = !!game.keys['ShiftLeft'] && fwdInput > 0 && !p.isADS && !p.isCrouching;
                p.isSprinting = wantsSprint;
                const moveSpeed = p.isCrouching ? 3.2 : (p.isADS ? 3.6 : (wantsSprint ? 8.2 : 5.6));

                const wishDir = new THREE.Vector3()
                    .addScaledVector(forward, fwdInput)
                    .addScaledVector(right, sideInput);
                if (wishDir.lengthSq() > 0.001) wishDir.normalize();

                const accel = p.isGrounded ? 14.0 : 4.0;
                p.velocity.x += (wishDir.x * moveSpeed - p.velocity.x) * Math.min(1, accel * dt);
                p.velocity.z += (wishDir.z * moveSpeed - p.velocity.z) * Math.min(1, accel * dt);
            }

            // 跳躍與重力
            if (game.keys['Space'] && p.isGrounded) {
                p.velocity.y = 6.4;
                p.isGrounded = false;
                p.isCrouching = false;
                p.isSliding = false;
            }
            p.velocity.y -= 18.5 * dt;

            // 位移積分與簡易圓柱-AABB 掩體碰撞推出
            p.position.x += p.velocity.x * dt;
            p.position.z += p.velocity.z * dt;
            p.position.y += p.velocity.y * dt;

            if (p.position.y <= 0) {
                p.position.y = 0;
                p.velocity.y = 0;
                p.isGrounded = true;
            }

            const playerRadius = 0.55;
            for (let i = 0; i < game.colliders.length; i++) {
                const c = game.colliders[i];
                const closestX = THREE.MathUtils.clamp(p.position.x, c.x - c.halfW, c.x + c.halfW);
                const closestZ = THREE.MathUtils.clamp(p.position.z, c.z - c.halfD, c.z + c.halfD);
                const dx = p.position.x - closestX;
                const dz = p.position.z - closestZ;
                const distSq = dx * dx + dz * dz;
                if (distSq < playerRadius * playerRadius) {
                    const dist = Math.sqrt(distSq) || 0.0001;
                    const push = playerRadius - dist;
                    p.position.x += (dx / dist) * push;
                    p.position.z += (dz / dist) * push;
                }
            }
            p.position.x = THREE.MathUtils.clamp(p.position.x, -48, 48);
            p.position.z = THREE.MathUtils.clamp(p.position.z, -48, 48);

            // 視角高度（站立 / 蹲下 / 滑鏟）
            const targetEye = p.isSliding ? 0.85 : (p.isCrouching ? 1.12 : p.eyeHeight);
            p.currentEyeHeight += (targetEye - p.currentEyeHeight) * Math.min(1, dt * 12);

            // 腳步聲節拍計算
            const horizSpeed = Math.hypot(p.velocity.x, p.velocity.z);
            if (p.isGrounded && !p.isSliding && horizSpeed > 1.0) {
                p.footstepDist += horizSpeed * dt;
                p.bobPhase += horizSpeed * dt * 1.9;
                const stride = p.isSprinting ? 2.45 : 1.95;
                if (p.footstepDist >= stride) {
                    p.footstepDist = 0;
                    AudioEngine.playFootstep('concrete', p.isSprinting, null, true);
                }
            }
        }

        // 更新攝影機姿態、開鏡 FOV 變焦、震動與持槍模型動畫
        function updateCameraAndViewModel(dt, recoilDelta) {
            const p = game.player;

            // 將後座力增量直接回饋至玩家視角
            if (recoilDelta) {
                p.pitch = THREE.MathUtils.clamp(p.pitch + recoilDelta.deltaPitch, -Math.PI * 0.47, Math.PI * 0.47);
                p.yaw -= recoilDelta.deltaYaw;
            }

            // 鏡頭爆炸/中彈震動衰減
            let shakeX = 0, shakeY = 0, shakeRoll = 0;
            if (game.shake.timer > 0) {
                game.shake.timer -= dt;
                const decay = Math.max(0, game.shake.timer / Math.max(0.01, game.shake.duration));
                const amp = game.shake.trauma * decay;
                shakeX = (Math.random() - 0.5) * amp * 0.12;
                shakeY = (Math.random() - 0.5) * amp * 0.12;
                shakeRoll = (Math.random() - 0.5) * amp * 0.08;
                if (game.shake.timer <= 0) game.shake.trauma = 0;
            }

            // 步態輕微起伏與滑鏟傾斜角
            const bobY = p.isGrounded && !p.isSliding ? Math.sin(p.bobPhase) * 0.032 * (p.isADS ? 0.25 : 1.0) : 0;
            const slideRoll = p.isSliding ? -0.14 : 0;

            game.camera.position.set(
                p.position.x + shakeX,
                p.position.y + p.currentEyeHeight + bobY + shakeY,
                p.position.z
            );
            game.camera.rotation.order = 'YXZ';
            game.camera.rotation.set(p.pitch, p.yaw, shakeRoll + slideRoll);

            // 開鏡 FOV 平滑縮放（狙擊鏡倍率更深）
            const activeW = WeaponCombat.getActiveWeapon();
            const adsFov = activeW && activeW.spec.id === 'sniper' ? 28 : 54;
            const targetFov = p.isADS ? adsFov : (p.isSprinting ? 82 : 75);
            if (Math.abs(game.camera.fov - targetFov) > 0.05) {
                game.camera.fov += (targetFov - game.camera.fov) * Math.min(1, dt * 13);
                game.camera.updateProjectionMatrix();
            }

            // 持槍模型平滑定位與後座力回彈
            const vm = game.viewModel;
            if (vm.group) {
                vm.kickZ *= Math.exp(-15 * dt);
                vm.kickPitch *= Math.exp(-14 * dt);
                vm.swayX *= Math.exp(-10 * dt);
                vm.swayY *= Math.exp(-10 * dt);

                const targetPos = p.isADS ? vm.adsPos : vm.basePos;
                vm.group.position.x += (targetPos.x + vm.swayX - vm.group.position.x) * Math.min(1, dt * 14);
                vm.group.position.y += (targetPos.y + vm.swayY + bobY * 0.5 - vm.group.position.y) * Math.min(1, dt * 14);
                vm.group.position.z += (targetPos.z + vm.kickZ - vm.group.position.z) * Math.min(1, dt * 18);
                vm.group.rotation.x = vm.kickPitch;
            }
        }

        // 更新連鎖引爆倒數、補給箱拾取與波次推進
        function updateWorldEntities(dt) {
            // 1. 連鎖引爆油桶引信
            for (let i = 0; i < game.barrels.length; i++) {
                const b = game.barrels[i];
                if (!b.exploded && b.fuseTimer >= 0) {
                    b.fuseTimer -= dt;
                    if (b.fuseTimer <= 0) detonateBarrel(b);
                }
            }

            // 2. 戰場補給箱自動拾取（回復彈藥、護甲插板與少量生命）
            for (let i = game.supplies.length - 1; i >= 0; i--) {
                const s = game.supplies[i];
                s.life -= dt;
                s.mesh.rotation.y += dt * 1.8;
                s.mesh.position.y = 0.24 + Math.sin(game.elapsedSec * 3.5) * 0.06;

                const dist = Math.hypot(
                    s.mesh.position.x - game.player.position.x,
                    s.mesh.position.z - game.player.position.z
                );
                if (dist < 1.8) {
                    WeaponCombat.addAmmoAndPlates(0.55, 2);
                    game.player.hp = Math.min(game.player.maxHp, game.player.hp + 25);
                    AudioEngine.playArmorPlate('lock');
                    TacticalHUD.showBanner('拾取戰術補給：+2 護甲插板 / 彈藥 / +25 HP', 1.8);
                    game.scene.remove(s.mesh);
                    game.supplies.splice(i, 1);
                    continue;
                }

                if (s.life <= 0) {
                    game.scene.remove(s.mesh);
                    game.supplies.splice(i, 1);
                }
            }

            // 3. 波次清空檢查與下一波自動啟動
            const waveInfo = EnemyAI.getWaveInfo();
            const totalRemaining = waveInfo.alive + waveInfo.remainingToSpawn;
            TacticalHUD.updateScoreboard(waveInfo.wave, totalRemaining, game.kills, game.score);

            if (totalRemaining === 0 && !game.gameOver) {
                if (game.waveClearDelay <= 0) {
                    game.waveClearDelay = 3.5;
                    WeaponCombat.addAmmoAndPlates(0.4, 1);
                    TacticalHUD.showBanner(`第 ${waveInfo.wave} 波全數殲滅！準備迎戰下一波`, 2.8);
                } else {
                    game.waveClearDelay -= dt;
                    if (game.waveClearDelay <= 0) {
                        const nextWave = waveInfo.wave + 1;
                        EnemyAI.startWave(nextWave);
                        TacticalHUD.showBanner(`第 ${nextWave} 波敵軍增援抵達！`, 2.6);
                    }
                }
            }
        }

        // 主遊戲循環 (Fixed-Clamped Delta Time)
        function mainLoop() {
            if (!game.running) return;
            requestAnimationFrame(mainLoop);

            const dt = Math.min(0.05, game.clock.getDelta());

            if (!game.paused && !game.gameOver) {
                game.elapsedSec += dt;

                updatePlayerPhysics(dt);
                const recoilDelta = WeaponCombat.update(dt, game.elapsedSec);
                updateCameraAndViewModel(dt, recoilDelta);

                EnemyAI.update(dt, game.elapsedSec);
                VFX.update(dt);
                AudioEngine.updateListener(game.camera);
                updateWorldEntities(dt);

                TacticalHUD.updatePlayerVitals(game.player.hp, game.player.maxHp, game.player.isADS);
                TacticalHUD.update(
                    dt,
                    game.player,
                    game.camera,
                    {
                        obstacles: game.colliders,
                        barrels: game.barrels,
                        enemies: EnemyAI.getEnemies()
                    },
                    game.elapsedSec
                );
            }

            game.renderer.render(game.scene, game.camera);
        }

        return {
            boot,
            restart,
            getGameState: () => game
        };
    })();

    // 自動於頁面載入完成後啟動總管引擎
    if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', () => GameMain.boot());
    } else {
        GameMain.boot();
    }



    // =========================================================================
    // 【遊戲代碼貼上結束】以下為啟動畫面的程式碼，請確認元件名稱
    // =========================================================================
    const __rootElement = document.getElementById('root');
    const __root = __createRoot(__rootElement);

    // ⚠️ 如果你遊戲最底下的主元件不是叫 App（例如叫 Game），
    // 請把下面這行的 <App /> 改成對應的名稱，例如 <Game />
    __root.render(<Game/>);
  </script>
